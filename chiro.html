    // =========================================================================
    // 1. SAFE LOCALSTORAGE & THEME SYNC (key: 'mchiro_theme')
    // =========================================================================
    function loadStore(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveStore(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {
        // Ignore storage quota or private-mode restrictions safely
      }
    }

    function initTheme() {
      let saved = null;
      try {
        saved = localStorage.getItem('mchiro_theme');
      } catch (e) {}
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? (saved === 'dark' || saved === '"dark"') : prefersDark;
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      try {
        localStorage.setItem('mchiro_theme', isDark ? 'dark' : 'light');
      } catch (e) {}
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) {
        btn.innerHTML = isDark
          ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>`
          : `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>`;
      }
    }

    function toggleTheme() {
      applyTheme(!document.documentElement.classList.contains('dark'));
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const styles = {
        info: 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900',
        success: 'bg-emerald-600 text-white',
        warn: 'bg-amber-600 text-white',
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-semibold transition-all duration-300 ${styles[type] || styles.info}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 2200);
    }

    // =========================================================================
    // 3. VIEW 2 DATA: 13 YEAR 2 PRACTICAL MECHANICS CUES (SPACED REPETITION)
    // =========================================================================
    const Y2_CUES = [
      // High Priority
      { id: 'cue_1st_rib', priority: 'high', title: '1st Rib & Posterior Ribs', score: '3/5', stepRef: 'Steps 49–50', cue: 'Keep nail hand crisp and flat (avoid curling before adjustment). Keep posterior rib palpations slightly more medial along the rugby-ball curve.' },
      { id: 'cue_cervical', priority: 'high', title: 'Cervical Spine Strikes', score: '7/10', stepRef: 'Steps 3 & 9', cue: 'Place outer foot directly under the nail hand; deliver a crisper strike especially with patient on their R side. Watch anterior head posture during seated Cx palpation.' },
      { id: 'cue_shoulder', priority: 'high', title: 'Shoulder Mobilisations', score: '4/5', stepRef: 'Step 52', cue: 'Start slightly more MEDIAL on the 1st accordion squeeze and move further LATERAL on the 2nd squeeze.' },
      { id: 'cue_spine', priority: 'high', title: 'Prone Spine Palpation & Double Transfer', score: '16/20', stepRef: 'Steps 46–47', cue: 'Keep palpating fingers strictly EVEN (L finger tended slightly superior on SPs). Roll on/off double transfers—never come off! Stay in fencing stance (don’t slip into horse stance before R lumbar).' },

      // Refine to 9-10/10
      { id: 'cue_atlas', priority: 'refine', title: 'Atlas Adjustment', score: '8/10', stepRef: 'Step 7', cue: 'Do NOT shift or adjust your elbows after hand placement—lock your angle first so accuracy stays sharp alongside your good speed.' },
      { id: 'cue_rotation', priority: 'refine', title: 'Pelvic Rotation Palpation & Adjustment', score: '8/10', stepRef: 'Steps 14–15', cue: 'Call out "POSTERIOR" (never "inferior") for rotation reading. Relax shoulders slightly more for a crisper 3rd rotation adjustment.' },
      { id: 'cue_tilt', priority: 'refine', title: 'Inferior Pelvic Tilt Adjustment', score: '8/10', stepRef: 'Step 17', cue: 'Ask patient to tuck their chin! Drop your body lower into the adjustment so your sternum is aligned with—not superior to—the ischium.' },
      { id: 'cue_torsion1', priority: 'refine', title: 'Superior Torsion I Adjustment', score: '8/10', stepRef: 'Step 19', cue: 'Female variation: ensure patient’s foot is completely flat on the bench. Male variation: don’t let the bent leg sit too inferior on the bench.' },
      { id: 'cue_torsion2', priority: 'refine', title: 'Superior Torsion II Adjustment', score: '8/10', stepRef: 'Step 20', cue: 'Keep your adjusting arm elbow slightly lower so you maintain full mechanical leverage for the squeeze movement.' },
      { id: 'cue_psis', priority: 'refine', title: 'SIJ / PSIS Adjustment', score: '8/10', stepRef: 'Step 48', cue: 'Drop body lower and align sternum squarely with the line of adjustment; take up more tissue slack before the block thrust.' },
      { id: 'cue_clavicle', priority: 'refine', title: 'Clavicle Block Thrust', score: 'P/F', stepRef: 'Step 43', cue: 'Deliver a pure block thrust and hold contact—avoid adding a slight follow-through after the adjustment.' },
      { id: 'cue_ul_mobs', priority: 'refine', title: 'Upper Limb Mobilisations Posture', score: 'P/F', stepRef: 'Steps 35–40', cue: 'Maintain neutral practitioner head and neck posture throughout upper limb mobilisations (don’t crane forward).' },
      { id: 'cue_facials', priority: 'refine', title: 'Facial Palpations (Lacrimals)', score: 'P/F', stepRef: 'Step 42', cue: 'Slow down and explain the lacrimal palpation clearly while demonstrating on yourself first (no palpation finger / no cross-contamination).' },
    ];

    // =========================================================================
    // 4. APPLICATION STATE
    // =========================================================================
    const state = {
      activeTab: 'routine', // 'routine' | 'cues' | 'practical' | 'y3'

      // View 1: Full Routine
      layers: { blue: true, red: true, green: true, pink: true },
      blurPink: false,
      search: '',
      phase: 'all',
      expanded: { 1: true, 7: true, 49: true },
      allExpanded: false,
      checkedSteps: loadStore('mchiro_chiro_checked', {}),

      // View 2: Y2 Cues & Leitner Spaced Repetition
      srs: loadStore('mchiro_chiro_srs', {}),
      cuesDueOnly: false,

      // View 3: 40-Min Practical Simulator
      timerDuration: 2400, // 40:00 default
      timerRemaining: 2400,
      timerRunning: false,
      drillPhase: 'all',
      drillStepNum: 49,
      drillRevealed: false,
      drillChecks: { blue: false, red: false, green: false, pink: false, cue: false },
      drillPassCount: 0,
      drillAgainCount: 0,
    };

    let timerInterval = null;

    // =========================================================================
    // 5. SPACED REPETITION ENGINE (key: 'mchiro_chiro_srs')
    // =========================================================================
    function isCueDue(id) {
      const rec = state.srs[id];
      if (!rec) return true;
      return Date.now() >= rec.dueAt;
    }

    function setCueLeitner(id, box) {
      const DAY = 86400000;
      const offset = box === 'again' ? 0 : box === 'shaky' ? 2 * DAY : 7 * DAY;
      state.srs[id] = { box, dueAt: Date.now() + offset };
      saveStore('mchiro_chiro_srs', state.srs);
      updateDueHeader();
      const msg = box === 'again' ? 'Queued for Today' : box === 'shaky' ? 'Scheduled in 2 Days' : 'Scheduled in 7 Days';
      showToast(msg, box === 'solid' ? 'success' : box === 'shaky' ? 'info' : 'warn');
      renderApp();
    }

    function getCueStats() {
      const total = Y2_CUES.length;
      const due = Y2_CUES.filter((c) => isCueDue(c.id)).length;
      const shaky = Y2_CUES.filter((c) => state.srs[c.id] && state.srs[c.id].box === 'shaky' && !isCueDue(c.id)).length;
      const solid = Y2_CUES.filter((c) => state.srs[c.id] && state.srs[c.id].box === 'solid' && !isCueDue(c.id)).length;
      return { total, due, shaky, solid };
    }

    function updateDueHeader() {
      const { due } = getCueStats();
      const lbl = document.getElementById('header-due-label');
      const dot = document.getElementById('header-due-dot');
      if (lbl) lbl.textContent = `Cues Due: ${due}`;
      if (dot) dot.className = `w-2 h-2 rounded-full ${due > 0 ? 'bg-amber-500' : 'bg-emerald-500'}`;
    }

    // =========================================================================
    // 6. TAB NAVIGATION & RENDER ROUTER
    // =========================================================================
    function setActiveTab(tab) {
      state.activeTab = tab;
      renderTabBar();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderTabBar() {
      const { due } = getCueStats();
      const tabs = [
        { id: 'routine', label: '1. Full Routine' },
        { id: 'cues', label: '2. Y2 Cues & Focus', badge: due > 0 ? String(due) : null },
        { id: 'practical', label: '3. 40-Min Practical' },
        { id: 'y3', label: '4. Y3 Slots' },
      ];
      document.getElementById('tab-bar').innerHTML = tabs.map((t) => {
        const active = state.activeTab === t.id;
        return `
          <button
            type="button"
            onclick="setActiveTab('${t.id}')"
            class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition whitespace-nowrap flex items-center gap-1.5 ${
              active
                ? 'bg-teal-600 text-white shadow-xs'
                : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'
            }"
          >
            <span>${t.label}</span>
            ${t.badge ? `<span class="px-1.5 py-0.5 rounded-md text-[10px] font-extrabold ${active ? 'bg-white/25 text-white' : 'bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300'}">${t.badge}</span>` : ''}
          </button>
        `;
      }).join('');
    }

    function renderApp() {
      const root = document.getElementById('app-root');
      if (state.activeTab === 'routine') root.innerHTML = renderRoutineView();
      else if (state.activeTab === 'cues') root.innerHTML = renderCuesView();
      else if (state.activeTab === 'practical') root.innerHTML = renderPracticalView();
      else root.innerHTML = renderY3SlotsView();
    }

    // =========================================================================
    // 7. VIEW 1: FULL ROUTINE (54 STEPS + 4-COLOUR KEY + BLUR PINK + PROGRESS)
    // =========================================================================
    function toggleLayer(layer) {
      state.layers[layer] = !state.layers[layer];
      renderApp();
    }

    function toggleExpandAll() {
      state.allExpanded = !state.allExpanded;
      ROUTINE_STEPS.forEach((s) => {
        state.expanded[s.num] = state.allExpanded;
      });
      renderApp();
    }

    function toggleStepCheck(num) {
      state.checkedSteps[num] = !state.checkedSteps[num];
      saveStore('mchiro_chiro_checked', state.checkedSteps);
      renderApp();
    }

    function resetRoutineChecks() {
      state.checkedSteps = {};
      saveStore('mchiro_chiro_checked', {});
      showToast('Routine checklist reset', 'info');
      renderApp();
    }

    function renderRoutineView() {
      const checkedCount = ROUTINE_STEPS.filter((s) => state.checkedSteps[s.num]).length;
      const pct = Math.round((checkedCount / ROUTINE_STEPS.length) * 100);
      const q = state.search.trim().toLowerCase();

      const filtered = ROUTINE_STEPS.filter((s) => {
        const matchPhase = state.phase === 'all' || s.phase === state.phase;
        const matchQ = !q ||
          s.title.toLowerCase().includes(q) ||
          s.blue.toLowerCase().includes(q) ||
          s.red.toLowerCase().includes(q) ||
          s.green.toLowerCase().includes(q) ||
          s.pink.toLowerCase().includes(q) ||
          (s.cue && s.cue.text.toLowerCase().includes(q));
        return matchPhase && matchQ;
      });

      const activePhaseObj = PHASES.find((p) => p.id === state.phase);

      return `
        <div class="space-y-4">
          <!-- 4-Colour Key & Active Recall Controls -->
          <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400">4-Colour Key (Tap to Show / Hide Layer)</span>
              <button
                type="button"
                onclick="state.blurPink=!state.blurPink; renderApp();"
                class="px-3 py-1.5 rounded-xl text-xs font-extrabold border transition flex items-center gap-1.5 ${
                  state.blurPink
                    ? 'bg-pink-600 text-white border-pink-600 shadow-xs'
                    : 'bg-pink-50 dark:bg-pink-950/40 text-pink-700 dark:text-pink-300 border-pink-200 dark:border-pink-800/70 hover:border-pink-400'
                }"
              >
                <span>${state.blurPink ? '👁 Pink Blurred (Tap to Reveal)' : '🧠 Blur Pink (Test Action)'}</span>
              </button>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
              <button type="button" onclick="toggleLayer('blue')" class="px-3 py-2 rounded-xl text-xs font-bold border-2 text-left transition flex items-center justify-between ${state.layers.blue ? 'bg-blue-50 dark:bg-blue-950/40 border-blue-400 dark:border-blue-700 text-blue-800 dark:text-blue-200' : 'bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-800 text-slate-400 line-through'}">
                <span>Bench Set Up</span>
                <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
              </button>
              <button type="button" onclick="toggleLayer('red')" class="px-3 py-2 rounded-xl text-xs font-bold border-2 text-left transition flex items-center justify-between ${state.layers.red ? 'bg-red-50 dark:bg-red-950/40 border-red-400 dark:border-red-700 text-red-800 dark:text-red-200' : 'bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-800 text-slate-400 line-through'}">
                <span>Patient Position</span>
                <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
              </button>
              <button type="button" onclick="toggleLayer('green')" class="px-3 py-2 rounded-xl text-xs font-bold border-2 text-left transition flex items-center justify-between ${state.layers.green ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-400 dark:border-emerald-700 text-emerald-800 dark:text-emerald-200' : 'bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-800 text-slate-400 line-through'}">
                <span>Practitioner Pos.</span>
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
              </button>
              <button type="button" onclick="toggleLayer('pink')" class="px-3 py-2 rounded-xl text-xs font-bold border-2 text-left transition flex items-center justify-between ${state.layers.pink ? 'bg-pink-50 dark:bg-pink-950/40 border-pink-400 dark:border-pink-700 text-pink-800 dark:text-pink-200' : 'bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-800 text-slate-400 line-through'}">
                <span>Hand / Action</span>
                <span class="w-2.5 h-2.5 rounded-full bg-pink-500"></span>
              </button>
            </div>
          </div>

          <!-- Progress Bar + Search + Expand/Collapse -->
          <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="text-xs sm:text-sm font-extrabold text-slate-900 dark:text-white">
                Practice Progress: <span class="text-teal-600 dark:text-teal-400">${checkedCount} / 54</span> steps checked (${pct}%)
              </div>
              <div class="flex items-center gap-2">
                <button type="button" onclick="toggleExpandAll()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 transition">
                  ${state.allExpanded ? 'Collapse All' : 'Expand All'}
                </button>
                <button type="button" onclick="resetRoutineChecks()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-rose-100 dark:hover:bg-rose-950/50 text-xs font-bold text-slate-600 dark:text-slate-300 transition">
                  Reset
                </button>
              </div>
            </div>
            <div class="w-full h-2 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
              <div class="h-full bg-gradient-to-r from-teal-500 to-emerald-500 transition-all duration-300" style="width:${pct}%"></div>
            </div>

            <!-- Instant Search -->
            <input
              type="search"
              value="${state.search.replace(/"/g, '&quot;')}"
              oninput="state.search=this.value; renderApp();"
              placeholder="Search any step, landmark, stance, or cue (e.g. Atlas, Torsion, 1st rib, Nail 3)..."
              class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500"
            />

            <!-- Horizontal Phase Filter Pills -->
            <div class="overflow-x-auto no-scrollbar -mx-1 px-1">
              <div class="flex items-center gap-1.5 min-w-max">
                ${PHASES.map((p) => `
                  <button
                    type="button"
                    onclick="state.phase='${p.id}'; renderApp();"
                    class="px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                      state.phase === p.id
                        ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900'
                        : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'
                    }"
                  >${p.label}</button>
                `).join('')}
              </div>
            </div>
          </div>

          ${activePhaseObj && activePhaseObj.phaseCue ? `
            <div class="p-3.5 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-800 text-xs sm:text-sm font-bold text-amber-900 dark:text-amber-200">
              ⚠ ${activePhaseObj.phaseCue}
            </div>
          ` : ''}

          <!-- 54-Step Accordion List -->
          <div class="space-y-2.5">
            ${filtered.length ? filtered.map((s) => renderRoutineCard(s)).join('') : `
              <div class="p-8 text-center rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm text-slate-500">
                No routine steps match "${state.search}".
              </div>
            `}
          </div>
        </div>
      `;

    function renderRoutineCard(s) {
      const isOpen = !!state.expanded[s.num] || state.search.trim().length > 0;
      const isChecked = !!state.checkedSteps[s.num];
      const phaseName = (PHASES.find((p) => p.id === s.phase) || {}).label || '';
      const hasCue = !!s.cue;

      return `
        <article class="rounded-2xl bg-white dark:bg-slate-900 border ${isChecked ? 'border-emerald-300 dark:border-emerald-800/70' : 'border-slate-200 dark:border-slate-800'} overflow-hidden transition">
          <!-- Card Header Row -->
          <div class="flex items-center gap-2.5 px-3.5 py-3">
            <input
              type="checkbox"
              aria-label="Mark step ${s.num} complete"
              ${isChecked ? 'checked' : ''}
              onchange="toggleStepCheck(${s.num})"
              class="w-5 h-5 accent-teal-600 rounded cursor-pointer shrink-0"
            />
            <button
              type="button"
              onclick="state.expanded[${s.num}]=!state.expanded[${s.num}]; renderApp();"
              class="flex-1 min-w-0 flex items-center justify-between gap-2 text-left py-0.5"
            >

                <div class="flex flex-wrap items-center gap-1.5">

                  <h3 class="text-xs sm:text-sm font-extrabold ${isChecked ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-900 dark:text-white'} truncate">${s.title}</h3>
                  ${hasCue ? `<span class="px-1.5 py-0.5 rounded-md text-[10px] font-extrabold ${s.cue.severity === 'red' ? 'bg-rose-100 dark:bg-rose-950/70 text-rose-700 dark:text-rose-300' : 'bg-amber-100 dark:bg-amber-950/70 text-amber-800 dark:text-amber-300'}">★ Cue</span>` : ''}
                </div>
                <span class="text-[10px] font-semibold text-slate-400">${phaseName}</span>
              </div>
              <span class="text-xs font-bold text-slate-400 shrink-0">${isOpen ? '▲' : '▼'}</span>
            </button>
          </div>

          <!-- Expanded 4-Colour Rows -->
          ${isOpen ? `
            <div class="px-3.5 pb-3.5 pt-1 border-t border-slate-100 dark:border-slate-800/80 space-y-2 text-xs sm:text-sm">
              ${state.layers.blue ? `
                <div class="p-2.5 rounded-xl bg-blue-50/70 dark:bg-blue-950/25 border-l-4 border-blue-500">
                  <span class="block text-[10px] font-extrabold uppercase tracking-wider text-blue-700 dark:text-blue-400">Bench Set Up</span>
                  <p class="text-slate-800 dark:text-slate-200 mt-0.5">${s.blue}</p>
                </div>
              ` : ''}
              ${state.layers.red ? `
                <div class="p-2.5 rounded-xl bg-red-50/70 dark:bg-red-950/25 border-l-4 border-red-500">
                  <span class="block text-[10px] font-extrabold uppercase tracking-wider text-red-700 dark:text-red-400">Patient Position</span>
                  <p class="text-slate-800 dark:text-slate-200 mt-0.5">${s.red}</p>
                </div>
              ` : ''}
              ${state.layers.green ? `
                <div class="p-2.5 rounded-xl bg-emerald-50/70 dark:bg-emerald-950/25 border-l-4 border-emerald-500">
                  <span class="block text-[10px] font-extrabold uppercase tracking-wider text-emerald-700 dark:text-emerald-400">Practitioner Position</span>
                  <p class="text-slate-800 dark:text-slate-200 mt-0.5">${s.green}</p>
                </div>
              ` : ''}
              ${state.layers.pink ? `
                <div class="p-2.5 rounded-xl bg-pink-50/80 dark:bg-pink-950/25 border-l-4 border-pink-500">
                  <span class="block text-[10px] font-extrabold uppercase tracking-wider text-pink-700 dark:text-pink-400">Hand Placement / Action</span>
                  <p onclick="if(this.classList.contains('pink-blurred')) this.classList.remove('pink-blurred');" class="text-slate-900 dark:text-slate-100 font-medium mt-0.5 ${state.blurPink ? 'pink-blurred' : ''}">${s.pink}</p>
                </div>
              ` : ''}
              ${hasCue ? `
                <div class="p-2.5 rounded-xl border ${s.cue.severity === 'red' ? 'bg-rose-50 dark:bg-rose-950/40 border-rose-300 dark:border-rose-800 text-rose-900 dark:text-rose-200' : 'bg-amber-50 dark:bg-amber-950/40 border-amber-300 dark:border-amber-800 text-amber-900 dark:text-amber-200'} font-semibold text-xs">
                  ⚠ ${s.cue.text}
                </div>
              ` : ''}
            </div>
          ` : ''}
        </article>
      `;
    }

    // =========================================================================
    // 8. VIEW 2: Y2 CUES & FOCUS (LEITNER SPACED REPETITION)
    // =========================================================================
    function renderCuesView() {
      const { total, due, shaky, solid } = getCueStats();
      const visible = Y2_CUES.filter((c) => !state.cuesDueOnly || isCueDue(c.id));
      const highList = visible.filter((c) => c.priority === 'high');
      const refineList = visible.filter((c) => c.priority === 'refine');

      return `
        <div class="space-y-5">
          <!-- Spaced Repetition Summary Bar -->
          <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <span class="px-2.5 py-0.5 rounded-lg text-[10px] font-extrabold uppercase bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300">Y2 Practical Feedback &bull; 78% Baseline</span>
                <h2 class="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white mt-1.5">Mechanics Cues Due Today: ${due} / ${total}</h2>
              </div>
              <button
                type="button"
                onclick="state.cuesDueOnly=!state.cuesDueOnly; renderApp();"
                class="px-3.5 py-2 rounded-xl text-xs font-bold border transition ${
                  state.cuesDueOnly
                    ? 'bg-amber-500 text-white border-amber-500'
                    : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700'
                }"
              >
                ${state.cuesDueOnly ? 'Showing Due Only ✓' : 'Filter: Due Only'}
              </button>
            </div>

            <div class="grid grid-cols-3 gap-2 text-center text-xs">
              <div class="p-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/30 border border-rose-100 dark:border-rose-900/50">
                <span class="block text-lg font-extrabold text-rose-600 dark:text-rose-400">${due}</span>
                <span class="font-bold text-slate-600 dark:text-slate-300">Due Today</span>
              </div>
              <div class="p-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/30 border border-amber-100 dark:border-amber-900/50">
                <span class="block text-lg font-extrabold text-amber-600 dark:text-amber-400">${shaky}</span>
                <span class="font-bold text-slate-600 dark:text-slate-300">Shaky (2d)</span>
              </div>
              <div class="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-100 dark:border-emerald-900/50">
                <span class="block text-lg font-extrabold text-emerald-600 dark:text-emerald-400">${solid}</span>
                <span class="font-bold text-slate-600 dark:text-slate-300">Solid (7d)</span>
              </div>
            </div>
          </div>

          ${!visible.length ? `
            <div class="p-8 text-center rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-2">
              <p class="text-base font-extrabold text-emerald-600 dark:text-emerald-400">All 13 Cues Scheduled!</p>
              <p class="text-xs text-slate-500">No practical mechanics cues are due today. Tap "Showing Due Only" above to view all.</p>
            </div>
          ` : `
            ${highList.length ? `
              <section class="space-y-3">
                <h3 class="text-xs font-extrabold uppercase tracking-wider text-rose-600 dark:text-rose-400 px-1">
                  🔥 High Priority Fixes (Biggest Mark Gains)
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                  ${highList.map((c) => renderCueCard(c)).join('')}
                </div>
              </section>
            ` : ''}

            ${refineList.length ? `
              <section class="space-y-3">
                <h3 class="text-xs font-extrabold uppercase tracking-wider text-amber-600 dark:text-amber-400 px-1">
                  🎯 Refine to 9–10/10 Consistency
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                  ${refineList.map((c) => renderCueCard(c)).join('')}
                </div>
              </section>
            ` : ''}
          `}
        </div>
      `;
    }

    function renderCueCard(c) {
      const rec = state.srs[c.id];
      const box = rec ? rec.box : null;
      const isHigh = c.priority === 'high';

      return `
        <article class="rounded-2xl bg-white dark:bg-slate-900 border-2 ${isHigh ? 'border-rose-200 dark:border-rose-900/60' : 'border-slate-200 dark:border-slate-800'} p-4 flex flex-col justify-between gap-3">
          <div class="space-y-2">
            <div class="flex items-start justify-between gap-2">
              <div>
                <span class="text-[10px] font-bold uppercase text-slate-400">${c.stepRef}</span>
                <h4 class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white">${c.title}</h4>
              </div>
              <span class="px-2.5 py-0.5 rounded-lg text-xs font-extrabold shrink-0 ${isHigh ? 'bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300' : 'bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300'}">${c.score}</span>
            </div>
            <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed">${c.cue}</p>
          </div>

          <div class="flex flex-wrap items-center gap-1.5 pt-2 border-t border-slate-100 dark:border-slate-800">
            <button type="button" onclick="setCueLeitner('${c.id}','again')" class="flex-1 px-2.5 py-1.5 rounded-xl text-[11px] font-bold border transition ${box==='again' ? 'bg-rose-600 text-white border-rose-600' : 'bg-rose-50/70 dark:bg-rose-950/30 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-800/60 hover:bg-rose-100'}">Again (Today)</button>
            <button type="button" onclick="setCueLeitner('${c.id}','shaky')" class="flex-1 px-2.5 py-1.5 rounded-xl text-[11px] font-bold border transition ${box==='shaky' ? 'bg-amber-500 text-white border-amber-500' : 'bg-amber-50/70 dark:bg-amber-950/30 text-amber-800 dark:text-amber-300 border-amber-200 dark:border-amber-800/60 hover:bg-amber-100'}">Shaky (2d)</button>
            <button type="button" onclick="setCueLeitner('${c.id}','solid')" class="flex-1 px-2.5 py-1.5 rounded-xl text-[11px] font-bold border transition ${box==='solid' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-emerald-50/70 dark:bg-emerald-950/30 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800/60 hover:bg-emerald-100'}">Solid (7d)</button>
          </div>
        </article>
      `;
    }

    // =========================================================================
    // 9. VIEW 3: 40-MINUTE PRACTICAL SIMULATOR
    // =========================================================================
    function formatClock(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function setTimerPreset(secs) {
      clearInterval(timerInterval);
      state.timerRunning = false;
      state.timerDuration = secs;
      state.timerRemaining = secs;
      renderApp();
    }

    function togglePracticalTimer() {
      if (state.timerRunning) {
        clearInterval(timerInterval);
        state.timerRunning = false;
      } else {
        state.timerRunning = true;
        timerInterval = setInterval(() => {
          if (state.timerRemaining > 0) {
            state.timerRemaining--;
            const el = document.getElementById('practical-clock');
            if (el) el.textContent = formatClock(state.timerRemaining);
          } else {
            clearInterval(timerInterval);
            state.timerRunning = false;
            showToast('Time up! Practical station complete.', 'warn');
            renderApp();
          }
        }, 1000);
      }
      renderApp();
    }

    function drawRandomTechnique() {
      const pool = ROUTINE_STEPS.filter((s) => state.drillPhase === 'all' || s.phase === state.drillPhase);
      if (!pool.length) return;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      state.drillStepNum = pick.num;
      state.drillRevealed = false;
      state.drillChecks = { blue: false, red: false, green: false, pink: false, cue: false };
      renderApp();
    }

    function renderPracticalView() {
      const step = ROUTINE_STEPS.find((s) => s.num === state.drillStepNum) || ROUTINE_STEPS[0];
      const phaseName = (PHASES.find((p) => p.id === step.phase) || {}).label || '';
      const scoreKeys = step.cue ? ['blue', 'red', 'green', 'pink', 'cue'] : ['blue', 'red', 'green', 'pink'];
      const ticked = scoreKeys.filter((k) => state.drillChecks[k]).length;

      return `
        <div class="max-w-3xl mx-auto space-y-4">
          <!-- Countdown Timer Card -->
          <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 flex flex-wrap items-center justify-between gap-4">
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-teal-600 dark:text-teal-400">Practical Assessment Timer</span>
              <div id="practical-clock" class="text-4xl font-extrabold tabular-nums text-slate-900 dark:text-white mt-0.5">${formatClock(state.timerRemaining)}</div>
              <div class="mt-2 flex flex-wrap gap-1.5">
                <button type="button" onclick="setTimerPreset(2400)" class="px-3 py-1.5 rounded-xl text-xs font-bold ${state.timerDuration === 2400 ? 'bg-teal-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">40:00 Full Assessment</button>
                <button type="button" onclick="setTimerPreset(120)" class="px-3 py-1.5 rounded-xl text-xs font-bold ${state.timerDuration === 120 ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">02:00 Single Drill</button>
              </div>
            </div>

            <div class="flex flex-col items-start sm:items-end gap-2">
              <div class="flex gap-2">
                <button type="button" onclick="togglePracticalTimer()" class="px-5 py-2.5 rounded-xl text-xs font-extrabold text-white transition ${state.timerRunning ? 'bg-amber-600 hover:bg-amber-700' : 'bg-teal-600 hover:bg-teal-700'}">
                  ${state.timerRunning ? 'Pause' : 'Start'}
                </button>
                <button type="button" onclick="setTimerPreset(state.timerDuration)" class="px-4 py-2.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200">
                  Reset
                </button>
              </div>
              <span class="text-xs font-bold text-slate-500">
                Session: <span class="text-emerald-600 dark:text-emerald-400">${state.drillPassCount} Pass</span> &bull; <span class="text-rose-600 dark:text-rose-400">${state.drillAgainCount} Drill</span>
              </span>
            </div>
          </div>

          <!-- Random Technique Drawer -->
          <div class="flex flex-wrap items-center justify-between gap-2 p-3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
            <select
              onchange="state.drillPhase=this.value; drawRandomTechnique();"
              aria-label="Filter drill phase"
              class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700"
            >
              ${PHASES.map((p) => `<option value="${p.id}" ${state.drillPhase === p.id ? 'selected' : ''}>${p.label}</option>`).join('')}
            </select>
            <button
              type="button"
              onclick="drawRandomTechnique()"
              class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-extrabold shadow-xs transition"
            >
              🎲 Draw Random Technique
            </button>
          </div>

          <!-- Active Technique Prompt Card -->
          <div class="rounded-3xl bg-white dark:bg-slate-900 border-2 border-teal-200 dark:border-teal-900/70 p-5 space-y-4">
            <div class="flex items-center justify-between gap-2">
              <span class="px-2.5 py-0.5 rounded-lg text-[11px] font-extrabold bg-teal-100 dark:bg-teal-950 text-teal-800 dark:text-teal-300">Step #${step.num} &bull; ${phaseName}</span>
              ${state.drillRevealed ? `<span class="text-xs font-extrabold text-emerald-600 dark:text-emerald-400">Self-Score: ${ticked}/${scoreKeys.length}</span>` : ''}
            </div>

            <div>
              <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Examiner Prompt:</p>
              <h3 class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white mt-0.5">${step.title}</h3>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">
                Walk through Bench Set Up, Patient Position, Practitioner Stance, and Hand Placement/Action out loud before revealing.
              </p>
            </div>

            ${!state.drillRevealed ? `
              <button
                type="button"
                onclick="state.drillRevealed=true; renderApp();"
                class="w-full py-3.5 rounded-2xl bg-teal-600 hover:bg-teal-700 text-white text-sm font-extrabold shadow-xs transition"
              >
                Reveal &amp; Self-Score
              </button>
            ` : `
              <div class="space-y-2.5 pt-2 border-t border-slate-100 dark:border-slate-800">
                ${renderDrillCheckRow('blue', 'Bench Set Up', step.blue, 'blue')}
                ${renderDrillCheckRow('red', 'Patient Position', step.red, 'red')}
                ${renderDrillCheckRow('green', 'Practitioner Stance', step.green, 'emerald')}
                ${renderDrillCheckRow('pink', 'Hand Placement / Action', step.pink, 'pink')}
                ${step.cue ? renderDrillCheckRow('cue', 'Assessor Cue Checked', step.cue.text, 'amber') : ''}

                <div class="grid grid-cols-2 gap-3 pt-2">
                  <button type="button" onclick="state.drillPassCount++; drawRandomTechnique(); showToast('Marked Pass ✓', 'success');" class="py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold transition">
                    ✓ Pass &amp; Draw Next
                  </button>
                  <button type="button" onclick="state.drillAgainCount++; drawRandomTechnique(); showToast('Flagged to Drill Again ↺', 'warn');" class="py-3 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-extrabold transition">
                    ↺ Drill Again &amp; Next
                  </button>
                </div>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderDrillCheckRow(key, label, text, twColor) {
      const checked = !!state.drillChecks[key];
      return `
        <label class="flex items-start gap-3 p-3 rounded-2xl bg-${twColor}-50/70 dark:bg-${twColor}-950/25 border-l-4 border-${twColor}-500 cursor-pointer">
          <input
            type="checkbox"
            ${checked ? 'checked' : ''}
            onchange="state.drillChecks['${key}']=!state.drillChecks['${key}']; renderApp();"
            class="mt-0.5 w-5 h-5 accent-teal-600 rounded shrink-0"
          />
          <div class="text-xs sm:text-sm">
            <span class="block text-[10px] font-extrabold uppercase tracking-wider text-${twColor}-700 dark:text-${twColor}-400">${label}</span>
            <span class="${checked ? 'line-through text-slate-400' : 'text-slate-800 dark:text-slate-200 font-medium'}">${text}</span>
          </div>
        </label>
      `;
    }

    // =========================================================================
    // 10. VIEW 4: YEAR 3 TEMPLATE SLOTS (READY FOR JANUARY 2027)
    // =========================================================================
    function renderY3SlotsView() {
      const slots = [
        {
          num: '01',
          title: 'Advanced McTimoney Adjustments (Year 3 Additions)',
          tag: 'McTimoney Y3',
          desc: 'Template slot ready for new Year 3 toggle-recoil refinements, additional extremity/spinal checks, and clinical modifications.',
          fields: ['Bench Set Up (Blue)', 'Patient Position (Red)', 'Practitioner Position (Green)', 'Hand Placement / Action (Pink)'],
        },
        {
          num: '02',
          title: 'Diversified Techniques',
          tag: 'Diversified',
          desc: 'Structured technique cards ready for Year 3 high-velocity low-amplitude (HVLA) adjustments.',
          fields: ['Patient & Bench Setup', 'Contact Point & Segmental Contact', 'Line of Drive (LOD)', 'Pre-Load & Thrust Mechanics'],
        },
        {
          num: '03',
          title: 'Clinical Reasoning & Biomechanics Integration',
          tag: 'Biomechanics',
          desc: 'Decision pathways linking palpatory findings, motion palpation, and orthopaedic/neurological exam results to technique selection.',
          fields: ['Motion Palpation Findings', 'Joint Coupling & Kinematics', 'Technique Selection Rationale', 'Re-Assessment Outcome Markers'],
        },
        {
          num: '04',
          title: 'Contraindications & Red Flag Pre-Adjustment Screening',
          tag: 'Patient Safety',
          desc: 'Quick-check safety guardrails before any cervical, thoracic, lumbar, or extremity adjustment.',
          fields: ['Absolute Contraindications (HVT)', 'Relative Contraindications & Modifications', 'CAD / Vascular Screening', 'Osteoporosis & Renal Osteodystrophy Flags'],
        },
      ];

      return `
        <div class="space-y-5">
          <!-- Helpful Workflow Banner -->
          <div class="rounded-3xl bg-gradient-to-br from-teal-600 to-indigo-600 text-white p-5 sm:p-6 space-y-2 shadow-sm">
            <span class="inline-block px-2.5 py-0.5 rounded-lg text-[10px] font-extrabold uppercase tracking-wider bg-white/20">Year 3 Ready &bull; Late Jan 2027</span>
            <h2 class="text-lg sm:text-xl font-extrabold">How to Populate These Slots</h2>
            <p class="text-xs sm:text-sm text-white/90 leading-relaxed">
              Once your Year 3 Chiropractic Studies handbooks and technique sheets are released, simply upload them to your notebook and ask me to update <strong>chiro.html</strong>. Because this module lives in its own dedicated file, we can drop new techniques straight into these 4 slots in seconds without touching the rest of your website.
            </p>
          </div>

          <!-- 4 Structured Template Cards -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${slots.map((slot) => `
              <article class="rounded-3xl bg-white dark:bg-slate-900 border-2 border-dashed border-slate-300 dark:border-slate-700 p-5 flex flex-col justify-between gap-4">
                <div class="space-y-2">
                  <div class="flex items-center justify-between gap-2">
                    <span class="px-2.5 py-0.5 rounded-lg text-[10px] font-extrabold uppercase bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">${slot.tag}</span>
                    <span class="text-xs font-extrabold text-slate-400">Slot ${slot.num}</span>
                  </div>
                  <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${slot.title}</h3>
                  <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 leading-relaxed">${slot.desc}</p>
                </div>
                <div class="space-y-1.5 pt-2 border-t border-slate-100 dark:border-slate-800">
                  <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Ready-Made Fields</span>
                  <div class="flex flex-wrap gap-1.5">
                    ${slot.fields.map((f) => `<span class="px-2.5 py-1 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-[11px] font-semibold text-slate-700 dark:text-slate-300">${f}</span>`).join('')}
                  </div>
                </div>
              </article>
            `).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 11. INITIALISE APP
    // =========================================================================
    initTheme();
    updateDueHeader();
    renderTabBar();
    renderApp();
  </script>
</body>
</html>
