<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chiropractic Studies 3 – MChiro Year 3 Hub</title>

  <style>
    /* =========================================================================
       1. DESIGN TOKENS: APPLE HEALTH MINIMALIST × DUOLINGO TACTILE 3D
       Zero external CDNs — pure system typography & self-contained styling.
       ========================================================================= */
    :root {
      --bg-page: #F2F2F7;
      --bg-card: #FFFFFF;
      --bg-subtle: #EAEAF0;
      --bg-input: #F8FAFC;
      --bg-glass: rgba(242, 242, 247, 0.90);
      --border-card: #E2E8F0;
      --border-strong: #CBD5E1;
      --text-main: #0F172A;
      --text-muted: #475569;
      --shadow-card: 0 2px 12px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);

      /* Semantic & 4-Colour McTimoney Protocol Key */
      --blue: #2563EB;
      --blue-dark: #1D4ED8;
      --blue-soft: rgba(37, 99, 235, 0.10);
      --blue-border: rgba(37, 99, 235, 0.30);

      --red: #DC2626;
      --red-dark: #991B1B;
      --red-soft: rgba(220, 38, 38, 0.10);
      --red-border: rgba(220, 38, 38, 0.32);

      --emerald: #059669;
      --emerald-dark: #047857;
      --emerald-soft: rgba(5, 150, 105, 0.11);
      --emerald-border: rgba(5, 150, 105, 0.32);

      --pink: #DB2777;
      --pink-dark: #9D174D;
      --pink-soft: rgba(219, 39, 119, 0.10);
      --pink-border: rgba(219, 39, 119, 0.32);

      --amber: #D97706;
      --amber-dark: #92400E;
      --amber-soft: rgba(217, 119, 6, 0.12);
      --amber-border: rgba(217, 119, 6, 0.36);

      --purple: #7C3AED;
      --purple-dark: #5B21B6;
      --purple-soft: rgba(124, 58, 237, 0.10);
      --purple-border: rgba(124, 58, 237, 0.30);
    }

    .dark {
      --bg-page: #090D16;
      --bg-card: #131B2E;
      --bg-subtle: #1E293B;
      --bg-input: #0F172A;
      --bg-glass: rgba(9, 13, 22, 0.90);
      --border-card: #26344F;
      --border-strong: #3D5073;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --shadow-card: 0 4px 18px rgba(0, 0, 0, 0.46);

      --blue-soft: rgba(37, 99, 235, 0.22);
      --blue-border: rgba(96, 165, 250, 0.42);
      --red-soft: rgba(220, 38, 38, 0.22);
      --red-border: rgba(248, 113, 113, 0.44);
      --emerald-soft: rgba(5, 150, 105, 0.22);
      --emerald-border: rgba(52, 211, 153, 0.42);
      --pink-soft: rgba(219, 39, 119, 0.22);
      --pink-border: rgba(244, 114, 182, 0.44);
      --amber-soft: rgba(217, 119, 6, 0.22);
      --amber-border: rgba(251, 191, 36, 0.44);
      --purple-soft: rgba(124, 58, 237, 0.22);
      --purple-border: rgba(167, 139, 250, 0.44);
    }

    /* =========================================================================
       2. BASE RESET & SYSTEM TYPOGRAPHY
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.48;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    h1, h2, h3, h4, p { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font-family: inherit; }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 0 12px;
    }
    @media (min-width: 640px) {
      .container { padding: 0 22px; }
    }

    .main-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-top: 16px;
      padding-bottom: 108px;
    }
    @media (min-width: 769px) {
      .main-stack { padding-bottom: 54px; }
    }

    /* =========================================================================
       3. STICKY FROSTED-GLASS HEADER & 4-TAB SEGMENTED BAR
       ========================================================================= */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-card);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 36px;
      padding: 6px 10px;
      border-radius: 12px;
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 12.5px;
      font-weight: 800;
      flex-shrink: 0;
      transition: background-color 0.14s ease;
    }
    .back-btn:hover { background: var(--border-strong); }

    .title-wrap { min-width: 0; }
    .page-title {
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      display: none;
    }
    @media (min-width: 560px) {
      .page-sub { display: block; }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .baseline-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 34px;
      padding: 5px 9px;
      border-radius: 11px;
      background: var(--emerald-soft);
      border: 1.5px solid var(--emerald-border);
      color: var(--emerald-dark);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    .dark .baseline-pill { color: #6EE7B7; }

    .theme-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--border-card);
      background: var(--bg-card);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.14s ease;
    }
    .theme-btn:hover { border-color: var(--emerald); }

    .tabs-scroll {
      padding-bottom: 10px;
      overflow-x: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }

    .seg-track {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 14px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      min-width: max-content;
    }
    @media (min-width: 680px) {
      .seg-track {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        min-width: 0;
      }
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      min-height: 38px;
      padding: 7px 12px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      text-align: center;
    }
    .seg-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.09);
    }

    /* =========================================================================
       4. SHARED SURFACES, BADGES, SEMANTIC BOXES & TACTILE 3D BUTTONS
       ========================================================================= */
    .ah-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      box-shadow: var(--shadow-card);
    }
    .ah-card-alt {
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      border-radius: 14px;
    }
    .pad-card { padding: 15px; }
    @media (min-width: 640px) {
      .pad-card { padding: 20px; }
    }

    .stack { display: flex; flex-direction: column; gap: 14px; }
    .stack-sm { display: flex; flex-direction: column; gap: 10px; }

    .flex-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 640px) {
      .grid-2 { grid-template-columns: 1fr 1fr; }
    }

    .grid-3-compact {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    @media (min-width: 680px) {
      .grid-4 { grid-template-columns: repeat(4, 1fr); }
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.015em;
      white-space: nowrap;
    }
    .badge-blue { background: var(--blue-soft); color: var(--blue-dark); border: 1px solid var(--blue-border); }
    .dark .badge-blue { color: #93C5FD; }
    .badge-red { background: var(--red-soft); color: var(--red-dark); border: 1px solid var(--red-border); }
    .dark .badge-red { color: #FCA5A5; }
    .badge-emerald { background: var(--emerald-soft); color: var(--emerald-dark); border: 1px solid var(--emerald-border); }
    .dark .badge-emerald { color: #6EE7B7; }
    .badge-pink { background: var(--pink-soft); color: var(--pink-dark); border: 1px solid var(--pink-border); }
    .dark .badge-pink { color: #F9A8D4; }
    .badge-amber { background: var(--amber-soft); color: var(--amber-dark); border: 1px solid var(--amber-border); }
    .dark .badge-amber { color: #FDE68A; }
    .badge-purple { background: var(--purple-soft); color: var(--purple-dark); border: 1px solid var(--purple-border); }
    .dark .badge-purple { color: #DDD6FE; }
    .badge-muted { background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border-card); }

    /* Semantic Info Boxes */
    .sem-box {
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      border: 1.5px solid transparent;
    }
    .sem-label {
      display: block;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .sem-blue { background: var(--blue-soft); border-color: var(--blue-border); }
    .sem-blue .sem-label { color: var(--blue-dark); }
    .dark .sem-blue .sem-label { color: #93C5FD; }

    .sem-red { background: var(--red-soft); border-color: var(--red-border); }
    .sem-red .sem-label { color: var(--red-dark); }
    .dark .sem-red .sem-label { color: #FCA5A5; }

    .sem-emerald { background: var(--emerald-soft); border-color: var(--emerald-border); }
    .sem-emerald .sem-label { color: var(--emerald-dark); }
    .dark .sem-emerald .sem-label { color: #6EE7B7; }

    .sem-pink { background: var(--pink-soft); border-color: var(--pink-border); }
    .sem-pink .sem-label { color: var(--pink-dark); }
    .dark .sem-pink .sem-label { color: #F9A8D4; }

    .sem-amber { background: var(--amber-soft); border-color: var(--amber-border); }
    .sem-amber .sem-label { color: var(--amber-dark); }
    .dark .sem-amber .sem-label { color: #FDE68A; }

    .sem-purple { background: var(--purple-soft); border-color: var(--purple-border); }
    .sem-purple .sem-label { color: var(--purple-dark); }
    .dark .sem-purple .sem-label { color: #DDD6FE; }

    /* Duolingo Tactile 3D Buttons */
    .btn-3d {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
      padding: 10px 15px;
      border-radius: 15px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      text-align: center;
      transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.14s ease, opacity 0.14s ease;
    }
    .btn-3d:hover:not(:disabled) { filter: brightness(1.06); }
    .btn-3d:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px !important;
    }
    .btn-3d:disabled { opacity: 0.42; cursor: not-allowed; }
    .btn-3d.sm {
      min-height: 36px;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 12px;
    }
    .btn-full { width: 100%; }

    .btn-emerald { background: var(--emerald); color: #FFFFFF; border: 2px solid var(--emerald); border-bottom: 4px solid var(--emerald-dark); }
    .btn-blue { background: var(--blue); color: #FFFFFF; border: 2px solid var(--blue); border-bottom: 4px solid var(--blue-dark); }
    .btn-red { background: var(--red); color: #FFFFFF; border: 2px solid var(--red); border-bottom: 4px solid var(--red-dark); }
    .btn-amber { background: var(--amber); color: #FFFFFF; border: 2px solid var(--amber); border-bottom: 4px solid var(--amber-dark); }
    .btn-purple { background: var(--purple); color: #FFFFFF; border: 2px solid var(--purple); border-bottom: 4px solid var(--purple-dark); }
    .btn-neutral {
      background: var(--bg-card);
      color: var(--text-main);
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-strong);
    }

    /* Tactile Filter & Confidence Pills */
    .pill-btn {
      min-height: 38px;
      padding: 7px 11px;
      border-radius: 12px;
      border: 2px solid var(--border-card);
      border-bottom: 3.5px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.07s ease, border-color 0.14s ease, background-color 0.14s ease;
      text-align: center;
    }
    .pill-btn:hover:not(:disabled) { border-color: var(--emerald); }
    .pill-btn:active:not(:disabled) { transform: translateY(1.5px); border-bottom-width: 2px; }
    .pill-btn.active-emerald { background: var(--emerald); border-color: var(--emerald); border-bottom-color: var(--emerald-dark); color: #FFFFFF; }
    .pill-btn.active-blue { background: var(--blue); border-color: var(--blue); border-bottom-color: var(--blue-dark); color: #FFFFFF; }
    .pill-btn.active-red { background: var(--red); border-color: var(--red); border-bottom-color: var(--red-dark); color: #FFFFFF; }
    .pill-btn.active-amber { background: var(--amber); border-color: var(--amber); border-bottom-color: var(--amber-dark); color: #FFFFFF; }
    .pill-btn.active-pink { background: var(--pink); border-color: var(--pink); border-bottom-color: var(--pink-dark); color: #FFFFFF; }

    /* Form Controls */
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .input, .select, .textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 13px;
      border: 1.5px solid var(--border-card);
      background: var(--bg-input);
      color: var(--text-main);
      font-size: 13.5px;
      transition: border-color 0.14s ease, box-shadow 0.14s ease;
    }
    .input, .select { min-height: 42px; }
    .textarea { resize: vertical; line-height: 1.45; }
    .input:focus, .select:focus, .textarea:focus {
      outline: none;
      border-color: var(--emerald);
      box-shadow: 0 0 0 3px var(--emerald-soft);
    }

    /* =========================================================================
       5. TAB-SPECIFIC COMPONENTS (INTERRUPTER, 4-COLOUR FLOW, MOCK, VAULT)
       ========================================================================= */
    .stat-tile {
      padding: 12px 10px;
      border-radius: 16px;
      border: 1.5px solid var(--border-card);
      background: var(--bg-card);
      box-shadow: var(--shadow-card);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-tile.ok { background: var(--emerald-soft); border-color: var(--emerald-border); }
    .stat-tile.warn { background: var(--amber-soft); border-color: var(--amber-border); }
    .stat-tile.risk { background: var(--red-soft); border-color: var(--red-border); }
    .stat-num {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .stat-lbl {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Reading Terminology Table & Blur Cells */
    .trap-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .trap-table th {
      text-align: left;
      padding: 9px 10px;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      border-bottom: 1.5px solid var(--border-card);
    }
    .trap-table td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border-card);
      vertical-align: middle;
    }
    .trap-table tr:last-child td { border-bottom: none; }

    .blur-cell {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 8px;
      transition: filter 0.18s ease, opacity 0.18s ease;
    }
    .blur-cell.is-blurred {
      filter: blur(7px);
      opacity: 0.48;
      cursor: pointer;
      user-select: none;
    }
    .blur-cell.is-blurred:hover {
      filter: blur(3px);
    }

    /* 4-Colour McTimoney Protocol Step Card */
    .flow-step {
      padding: 14px;
      border-radius: 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .flow-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
    }
    @media (min-width: 680px) {
      .flow-grid { grid-template-columns: 1fr 1fr; }
    }
    .flow-cell {
      padding: 9px 11px;
      border-radius: 12px;
      border-left-width: 4px;
      border-left-style: solid;
      font-size: 12.5px;
      line-height: 1.42;
    }
    .fc-blue { background: var(--blue-soft); border-left-color: var(--blue); }
    .fc-red { background: var(--red-soft); border-left-color: var(--red); }
    .fc-green { background: var(--emerald-soft); border-left-color: var(--emerald); }
    .fc-pink { background: var(--pink-soft); border-left-color: var(--pink); }

    .fc-tag {
      display: block;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }
    .fc-blue .fc-tag { color: var(--blue-dark); }
    .dark .fc-blue .fc-tag { color: #93C5FD; }
    .fc-red .fc-tag { color: var(--red-dark); }
    .dark .fc-red .fc-tag { color: #FCA5A5; }
    .fc-green .fc-tag { color: var(--emerald-dark); }
    .dark .fc-green .fc-tag { color: #6EE7B7; }
    .fc-pink .fc-tag { color: var(--pink-dark); }
    .dark .fc-pink .fc-tag { color: #F9A8D4; }

    .pink-hidden {
      filter: blur(7px);
      opacity: 0.45;
      cursor: pointer;
      user-select: none;
      transition: filter 0.16s ease, opacity 0.16s ease;
    }

    /* Mock Grader Controls */
    .pf-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 13px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
    }
    .score-row {
      padding: 12px 13px;
      border-radius: 14px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stepper-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stepper-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1.5px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .stepper-btn:hover { border-color: var(--emerald); }
    .score-slider {
      flex: 1;
      accent-color: var(--emerald);
      cursor: pointer;
    }

    .chk-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.12s ease;
    }
    .chk-row:hover { background: var(--bg-subtle); }
    .chk-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--red);
      flex-shrink: 0;
      cursor: pointer;
    }

    .acc-btn {
      width: 100%;
      padding: 14px 16px;
      border: none;
      background: transparent;
      color: var(--text-main);

    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return parsed !== null && parsed !== undefined ? parsed : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveJSON(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    }

    function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem('mchiro_theme'); } catch (e) {}
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? (saved === 'dark' || saved === '"dark"') : prefersDark;
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      try { localStorage.setItem('mchiro_theme', isDark ? 'dark' : 'light'); } catch (e) {}
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) btn.innerHTML = isDark ? SUN_SVG : MOON_SVG;

    function toggleTheme() {
      applyTheme(!document.documentElement.classList.contains('dark'));

    // =========================================================================
    // 6. APPLICATION STATE
    // =========================================================================
    function buildInitialSec1() {
      const o = {};
      MOCK_SEC1.forEach((s) => { o[s.id] = 'pass'; });
      return o;
    }
    function buildInitialSec2() {
      const o = {};
      MOCK_SEC2.forEach((s) => { o[s.id] = s.y2; });
      return o;
    }

    const state = {
      activeTab: 'interrupter', // 'interrupter' | 'flow' | 'mock' | 'vault'

      // Tab 1: 22-Mark Setup Interrupter
      trapFilter: 'all', // 'all' | 'scored' | 'pf' | 'slips'
      trapIdx: 0,
      slippedIds: {},
      trapConf: null, // 'guess' | 'unsure' | 'certain'
      trapRevealed: false,
      spokenSecs: 15,
      spokenRunning: false,
      blurReadings: false,
      revealedReadings: {},

      // Tab 2: 4-Colour Full-Body Flow
      flowPhase: 'all',
      hidePink: false,
      revealedPink: {},

      // Tab 3: 40-Min Live Mock Grader
      mockSecs: 2400,
      mockRunning: false,
      sec1: buildInitialSec1(),
      sec2: buildInitialSec2(),
      recurredHabits: {},
      mockHistory: loadJSON('mchiro_chiro_mocks_v1', []),

      // Tab 4: Vault & Technique SRS

      srsIdx: 0,
      srsConf: null,

      openVault: { adv_mctimoney: true, contraindications: true },
      vaultNotes: loadJSON('mchiro_chiro_vault_v1', DEFAULT_VAULT_NOTES),
      showAddVault: false,
    };

    if (!Array.isArray(state.mockHistory)) state.mockHistory = [];
    if (!Array.isArray(state.vaultNotes)) state.vaultNotes = DEFAULT_VAULT_NOTES.slice();

    let spokenTimerId = null;
    let mockTimerId = null;

    // =========================================================================
    // 7. TAB 1 HANDLERS (INTERRUPTER, 15s TIMER & TELEMETRY)
    // =========================================================================
    function getFilteredTraps() {
      if (state.trapFilter === 'scored') return INTERRUPTER_TRAPS.filter((t) => t.category === 'scored');
      if (state.trapFilter === 'pf') return INTERRUPTER_TRAPS.filter((t) => t.category === 'pf');
      if (state.trapFilter === 'slips') {
        const list = INTERRUPTER_TRAPS.filter((t) => state.slippedIds[t.id]);
        return list.length ? list : INTERRUPTER_TRAPS;
      }
      return INTERRUPTER_TRAPS;
    }

    function stopSpokenTimer() {
      if (spokenTimerId) clearInterval(spokenTimerId);
      spokenTimerId = null;
      state.spokenRunning = false;
    }

    function toggleSpokenTimer() {
      if (state.spokenRunning) {
        stopSpokenTimer();
        renderApp();
        return;
      }
      if (state.spokenSecs <= 0) state.spokenSecs = 15;
      state.spokenRunning = true;
      spokenTimerId = setInterval(() => {
        if (state.spokenSecs > 0) {
          state.spokenSecs--;
          const el = document.getElementById('spoken-clock');
          if (el) {
            el.textContent = `${state.spokenSecs}s`;
            el.style.color = state.spokenSecs <= 5 ? 'var(--red)' : 'var(--text-main)';
          }
        } else {
          stopSpokenTimer();
          showToast('15s up — rate confidence & reveal!', 'amber');
          renderApp();
        }
      }, 1000);
      renderApp();
    }

    function resetSpokenTimer() {
      stopSpokenTimer();
      state.spokenSecs = 15;
      renderApp();
    }

    function setTrapFilter(f) {
      if (f === 'slips' && Object.keys(state.slippedIds).length === 0) {
        showToast('No slips queued yet — nice work!', 'emerald');
        return;
      }
      stopSpokenTimer();
      state.trapFilter = f;
      state.trapIdx = 0;
      state.trapConf = null;
      state.trapRevealed = false;
      state.spokenSecs = 15;
      renderApp();
    }

    function stepTrap(delta) {
      stopSpokenTimer();
      const list = getFilteredTraps();
      state.trapIdx = (state.trapIdx + delta + list.length) % list.length;
      state.trapConf = null;
      state.trapRevealed = false;
      state.spokenSecs = 15;
      renderApp();
    }

    function gradeInterrupter(trapId, nailed) {
      const trap = INTERRUPTER_TRAPS.find((t) => t.id === trapId);
      if (!trap) return;
      stopSpokenTimer();

      appendDiagEvent({
        id: trap.id,
        module: 'chiro',
        source: 'chiro',
        rootCause: trap.rootCause,
        rootCauseTag: trap.rootCause,
        confidence: state.trapConf || 'unsure',
        correct: nailed,
        label: trap.station,
        ts: Date.now(),
        timestamp: Date.now(),
      });

      if (nailed) {
        delete state.slippedIds[trap.id];
        showToast('✓ Clean setup logged!', 'emerald');
      } else {
        state.slippedIds[trap.id] = true;
        if (state.trapConf === 'certain') {
          showToast('High-Confidence Slip logged & queued for replay!', 'red');
        } else {
          showToast('Queued in Slips Only for Mistake Replay.', 'amber');
        }
      }

      const list = getFilteredTraps();
      state.trapIdx = (state.trapIdx + 1) % list.length;
      state.trapConf = null;
      state.trapRevealed = false;
      state.spokenSecs = 15;
      renderApp();
    }

    function getChiroDiagStats() {
      const all = readDiagEvents().filter((e) => e && (e.module === 'chiro' || e.source === 'chiro'));
      const total = all.length;
      const clean = all.filter((e) => e.correct).length;
      const rate = total > 0 ? Math.round((clean / total) * 100) : 0;
      const highConfSlips = all.filter((e) => e.confidence === 'certain' && !e.correct).length;
      return { total, rate, highConfSlips };
    }

    // =========================================================================
    // 8. TAB 3 HANDLERS (40-MIN LIVE MOCK TIMER & SAVING)
    // =========================================================================
    function fmtMMSS(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function toggleMockTimer() {
      if (state.mockRunning) {
        clearInterval(mockTimerId);
        mockTimerId = null;
        state.mockRunning = false;
      } else {
        state.mockRunning = true;
        mockTimerId = setInterval(() => {
          if (state.mockSecs > 0) {
            state.mockSecs--;
            const el = document.getElementById('mock-clock');
            if (el) {
              el.textContent = fmtMMSS(state.mockSecs);
              el.style.color = state.mockSecs < 300 ? 'var(--red)' : state.mockSecs < 600 ? 'var(--amber)' : 'var(--text-main)';
            }
          } else {
            clearInterval(mockTimerId);
            mockTimerId = null;
            state.mockRunning = false;
            showToast('40:00 Live Mock Time Up!', 'red');
            renderApp();
          }
        }, 1000);
      }
      renderApp();
    }

    function resetMockTimer() {
      clearInterval(mockTimerId);
      mockTimerId = null;
      state.mockRunning = false;
      state.mockSecs = 2400;
      renderApp();
    }

    function adjustSec2(id, val, max) {
      const clamped = Math.max(0, Math.min(max, parseInt(val, 10) || 0));
      state.sec2[id] = clamped;
      renderApp();
    }

    function saveMockAttempt() {
      const sec1Passed = MOCK_SEC1.filter((s) => state.sec1[s.id] === 'pass').length;
      const sec2Total = MOCK_SEC2.reduce((acc, s) => acc + (state.sec2[s.id] || 0), 0);
      const habits = HABIT_CHECKS.filter((_, i) => state.recurredHabits['h_' + i]);

      const record = {
        id: 'mk_' + Date.now().toString(36),
        date: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
        timeRemaining: fmtMMSS(state.mockSecs),
        sec1Passed,
        sec2Total,
        habitsCount: habits.length,

    // =========================================================================
    // 9. TAB 4 HANDLERS (CONFIDENCE-WEIGHTED SRS & VAULT)
    // =========================================================================
    function gradeChiroSrs(cardId, grade) {
      const card = CHIRO_SRS_CARDS.find((c) => c.id === cardId);
      if (!card) return;

      // Merge safely into mchiro_srs_v4 without overwriting other modules
      const latest = loadJSON('mchiro_srs_v4', {});
      const cur = latest[cardId] || { box: 1 };
      let nextBox = typeof cur.box === 'number' ? cur.box : 1;
      let days = 0;

      if (grade === 'again') { nextBox = 1; days = 0; }
      else if (grade === 'good') { nextBox = Math.min(5, nextBox + 1); days = [0, 1, 3, 7, 14, 30][nextBox]; }
      else { nextBox = 5; days = 14; }

      const now = Date.now();
      const dueTs = now + days * DAY_MS;
      latest[cardId] = {
        box: nextBox,
        dueAt: dueTs,
        nextReview: dueTs,
        lastReviewed: now,
      };
      saveJSON('mchiro_srs_v4', latest);
      state.srs = latest;

      const isCorrect = grade !== 'again';
      appendDiagEvent({
        id: cardId,
        module: 'chiro',
        source: 'chiro',
        rootCause: card.rootCause,
        rootCauseTag: card.rootCause,
        confidence: state.srsConf || 'unsure',
        correct: isCorrect,
        label: card.q,
        ts: now,
        timestamp: now,
      });

      if (!isCorrect && state.srsConf === 'certain') {
        showToast('High-Confidence Slip logged (Box 1)', 'red');
      } else if (!isCorrect) {
        showToast('Reset to Box 1 — Review Today', 'amber');
      } else {
        showToast(`Saved to Box ${nextBox} (${days}d)`, 'emerald');
      }

      state.srsConf = null;
      state.srsRevealed = false;
      state.srsIdx = (state.srsIdx + 1) % CHIRO_SRS_CARDS.length;
      renderApp();
    }

          </section>

          <!-- Past Mock Attempts History -->
          <section class="ah-card pad-card stack-sm">
            <div class="flex-between">
              <h3 style="font-size:16px;font-weight:800;">Saved Mock Attempts (<span class="mono">mchiro_chiro_mocks_v1</span>)</h3>
              <span class="badge badge-muted mono">${state.mockHistory.length} logged</span>
            </div>

            ${state.mockHistory.length ? `
              <div class="stack-sm">
                ${state.mockHistory.map((mk) => `
                  <article class="ah-card-alt pad-card stack-sm" style="border-left:4px solid ${mk.sec2Total >= 85 && mk.habitsCount === 0 ? 'var(--emerald)' : 'var(--amber)'};">
                    <div class="flex-between">
                      <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;">
                        <strong class="mono" style="font-size:15px;">${mk.sec2Total}/100</strong>
                        <span class="badge badge-blue mono">Sec 1: ${mk.sec1Passed}/10</span>
                        <span class="badge ${mk.habitsCount === 0 ? 'badge-emerald' : 'badge-red'}">${mk.habitsCount === 0 ? '✓ 0 Habit Slips' : `⚠ ${mk.habitsCount} Slips`}</span>
                        <span style="font-size:12px;color:var(--text-muted);font-weight:700;">${esc(mk.date)} &bull; ${esc(mk.timeRemaining)} left</span>
                      </div>
                      <button type="button" class="icon-del" aria-label="Delete attempt" onclick="deleteMockAttempt('${mk.id}')">&times;</button>
                    </div>
                    ${mk.habits && mk.habits.length ? `<p style="font-size:12px;color:var(--text-muted);">Recurred: ${mk.habits.map(esc).join(' • ')}</p>` : ''}
                  </article>
                `).join('')}
              </div>
            ` : `
              <p style="font-size:13px;color:var(--text-muted);text-align:center;padding:12px;">No mock runs saved yet. Complete a live 40-minute peer-marked run and tap Save above.</p>
            `}
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 14. RENDER TAB 4 — YEAR 3 VAULT & TECHNIQUE SRS
    // =========================================================================
    function renderTabVault() {
      const card = CHIRO_SRS_CARDS[state.srsIdx % CHIRO_SRS_CARDS.length];
      const rec = state.srs[card.id] || { box: 1 };
      const boxNum = typeof rec.box === 'number' ? rec.box : 1;

      return `
        <div class="stack">
          <!-- 1. Confidence-Weighted Technique & Reading SRS (8 Cards) -->
          <section class="ah-card pad-card stack">
            <div class="flex-between">
              <div>
                <span class="badge badge-purple mono">mchiro_srs_v4 &bull; mchiro_diag_v1</span>
                <h2 style="font-size:17.5px;font-weight:800;margin-top:4px;">Technique &amp; Reading Active-Recall SRS (8 Cards)</h2>
              </div>
              <span class="badge badge-amber mono">Card ${state.srsIdx + 1}/${CHIRO_SRS_CARDS.length} &bull; Box ${boxNum}/5</span>
            </div>

            <article class="ah-card-alt pad-card stack">
              <div class="flex-between">
                <span class="badge badge-emerald">${esc(card.tag)}</span>
                <span class="badge badge-muted mono">${esc(card.rootCause)}</span>
              </div>

              <h3 style="font-size:18px;font-weight:800;line-height:1.34;">${esc(card.q)}</h3>

              ${!state.srsRevealed ? `
                <div class="stack-sm">
                  <span class="field-label" style="margin:0;">1. Speak the rule aloud, then rate confidence:</span>
                  <div class="grid-3-compact">
                    <button type="button" class="pill-btn ${state.srsConf === 'guess' ? 'active-red' : ''}" onclick="state.srsConf='guess'; renderApp();">🎲 Guess</button>
                    <button type="button" class="pill-btn ${state.srsConf === 'unsure' ? 'active-amber' : ''}" onclick="state.srsConf='unsure'; renderApp();">🤔 Unsure</button>
                    <button type="button" class="pill-btn ${state.srsConf === 'certain' ? 'active-emerald' : ''}" onclick="state.srsConf='certain'; renderApp();">🎯 Certain</button>
                  </div>
                  <button type="button" class="btn-3d btn-blue btn-full" ${state.srsConf ? '' : 'disabled'} onclick="state.srsRevealed=true; renderApp();">
                    ${state.srsConf ? 'Reveal Model Rule &rarr;' : 'Select Confidence Pill First'}
                  </button>
                </div>
              ` : `
                <div class="sem-box sem-emerald">
                  <span class="sem-label">Model Technique Rule</span>
                  <p style="font-weight:600;line-height:1.5;">${esc(card.a)}</p>
                </div>
                <div class="grid-3-compact">
                  <button type="button" class="btn-3d btn-red" onclick="gradeChiroSrs('${card.id}', 'again')">↺ Again</button>
                  <button type="button" class="btn-3d btn-blue" onclick="gradeChiroSrs('${card.id}', 'good')">✓ Good</button>
                  <button type="button" class="btn-3d btn-emerald" onclick="gradeChiroSrs('${card.id}', 'easy')">★ Easy</button>
                </div>
              `}
            </article>
          </section>

          <!-- 2. Year 3 Chiropractic Studies 3 Scaffolding Vault -->
          <section class="ah-card pad-card stack">
            <div class="flex-between">
              <div>
                <span class="badge badge-emerald mono">mchiro_chiro_vault_v1 &bull; Jan 2027 Ready</span>
                <h2 style="font-size:17.5px;font-weight:800;margin-top:4px;">Year 3 Diversified &amp; Biomechanics Vault</h2>
              </div>
              <button type="button" class="btn-3d btn-emerald sm" onclick="state.showAddVault=!state.showAddVault; renderApp();">
                ${state.showAddVault ? 'Close Form' : '+ Add Technique Note'}
              </button>
            </div>

            ${state.showAddVault ? `
              <form onsubmit="addVaultNote(event)" class="ah-card-alt pad-card stack-sm">
                <div class="grid-2">
                  <div>
                    <label class="field-label" for="vn_sec">Vault Section</label>
                    <select id="vn_sec" class="select">
                      ${VAULT_SECTIONS.map((s) => `<option value="${s.id}">${esc(s.title)}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="field-label" for="vn_title">Technique / Concept Title</label>
                    <input id="vn_title" type="text" class="input" required placeholder="e.g. Lumbar Roll Side-Posture Setup" />
                  </div>
                </div>
                <div>
                  <label class="field-label" for="vn_body">Contact Point, Line of Drive &amp; Clinical Reasoning</label>
                  <textarea id="vn_body" rows="3" class="textarea" required placeholder="Add Year 3 handbook cues, biomechanical vectors, or contraindications..."></textarea>
                </div>
                <div class="grid-2">
                  <button type="button" class="btn-3d btn-neutral" onclick="state.showAddVault=false; renderApp();">Cancel</button>
                  <button type="submit" class="btn-3d btn-emerald">Save Note</button>
                </div>
              </form>
            ` : ''}

            <div class="stack-sm">
              ${VAULT_SECTIONS.map((sec) => {
                const open = !!state.openVault[sec.id];
                const items = state.vaultNotes.filter((n) => n.section === sec.id);
                return `
                  <article class="ah-card-alt" style="overflow:hidden;">
                    <button type="button" class="acc-btn" onclick="state.openVault['${sec.id}']=!state.openVault['${sec.id}']; renderApp();">
                      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                        <strong style="font-size:14px;">${esc(sec.title)}</strong>
                        <span class="badge ${sec.badge} mono">${items.length}</span>
                      </div>
                      <span style="font-size:12px;font-weight:800;color:var(--text-muted);">${open ? '▲' : '▼'}</span>
                    </button>

                    ${open ? `
                      <div class="stack-sm" style="padding:12px;border-top:1px solid var(--border-card);">
                        ${items.length ? items.map((n) => `
                          <div class="ah-card pad-card stack-sm" style="padding:12px 14px;">
                            <div class="flex-between">
                              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                                <strong style="font-size:14px;">${esc(n.title)}</strong>
                                ${n.isTemplate ? `<span class="badge badge-amber">Template</span>` : `<span class="badge badge-emerald">Custom</span>`}
                              </div>
                              <button type="button" class="icon-del" aria-label="Delete note" onclick="deleteVaultNote('${n.id}')">&times;</button>
                            </div>
                            <p style="font-size:13px;color:var(--text-muted);">${esc(n.body)}</p>
                          </div>
                        `).join('') : `<p style="font-size:12.5px;color:var(--text-muted);padding:4px 6px;">No notes in this section yet.</p>`}
                      </div>
                    ` : ''}
                  </article>
                `;
              }).join('')}
            </div>
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 15. INITIALISE
    // =========================================================================
    initTheme();
    renderTabs();
    renderApp();
  </script>
</body>
</html>
