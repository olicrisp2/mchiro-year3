    function safeGetStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function safeSetStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        // Ignore storage quota/privacy mode errors gracefully
      }
    }

    // =========================================================================
    // 4. THEME MANAGEMENT (LIGHT / DARK MODE)
    // =========================================================================
    function initTheme() {
      let saved = null;
      try {
        saved = localStorage.getItem('mchiro_y3_theme');
      } catch (e) {}

      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? saved === 'dark' : prefersDark;
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      try {
        localStorage.setItem('mchiro_y3_theme', isDark ? 'dark' : 'light');
      } catch (e) {}

      const sunIcon = `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>`;
      const moonIcon = `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>`;

      document.querySelectorAll('.theme-toggle-btn').forEach((el) => {
        el.innerHTML = isDark ? sunIcon : moonIcon;
      });
      const label = document.getElementById('theme-label');
      if (label) {
        label.textContent = isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      applyTheme(!isDark);
    }

    // =========================================================================

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const colors = {
        info: 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900',
        success: 'bg-emerald-600 text-white',
        warn: 'bg-amber-600 text-white',
      };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 transition-all duration-300 ${colors[type] || colors.info}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2400);
    }

    function openMobileMenu() {
      document.getElementById('sidebar').classList.remove('-translate-x-full');
      document.getElementById('mobile-overlay').classList.remove('hidden');
    }

    function closeMobileMenu() {
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('mobile-overlay').classList.add('hidden');
    }

    document.getElementById('mobile-menu-btn').addEventListener('click', openMobileMenu);

    // 6. SIDEBAR RENDERING
    // =========================================================================
    function renderSidebar() {
      const activeContainer = document.getElementById('nav-active-modules');
      const upcomingContainer = document.getElementById('nav-upcoming-modules');

      const buildItem = (mod) => {
        const isSelected = state.activeModule === mod.id;
        const activeClasses = isSelected
          ? 'bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300 border-teal-200 dark:border-teal-800/80 shadow-xs'
          : 'text-slate-600 dark:text-slate-300 border-transparent hover:bg-slate-100 dark:hover:bg-slate-800/70';

        const badgeClasses = mod.active
          ? 'bg-teal-100 dark:bg-teal-900/70 text-teal-700 dark:text-teal-300'
          : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400';

        return `
          <button
            type="button"
            onclick="selectModule('${mod.id}')"
            class="w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl border text-left transition ${activeClasses}"
          >
            <span class="flex items-center gap-3 min-w-0">
              <span class="shrink-0 ${isSelected ? 'text-teal-600 dark:text-teal-400' : 'text-slate-400 dark:text-slate-500'}">${mod.icon}</span>
              <span class="text-sm font-semibold truncate">${mod.name}</span>
            </span>
            <span class="shrink-0 text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-lg ${badgeClasses}">
              ${mod.badge}
            </span>
          </button>
        `;
      };

      activeContainer.innerHTML = MODULES.filter((m) => m.active).map(buildItem).join('');
      upcomingContainer.innerHTML = MODULES.filter((m) => !m.active).map(buildItem).join('');
    }

    function selectModule(moduleId) {
      state.activeModule = moduleId;
      closeMobileMenu();
      renderSidebar();
      renderMainContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderMainContent() {
      const container = document.getElementById('app-content');
      const mod = MODULES.find((m) => m.id === state.activeModule);

      if (mod.id === 'neuro') {
        container.innerHTML = renderNeuroModule(mod);
      } else if (mod.id === 'msk') {
        container.innerHTML = renderMskModule(mod);
      } else {
        container.innerHTML = renderPlaceholderModule(mod);
      }
    }

              class="px-4 py-3 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-semibold text-slate-700 dark:text-slate-200 transition"
            >
              &larr; Previous
            </button>
            <button
              type="button"
              onclick="markFlashcard('${card.id}', 'review')"
              class="px-4 py-3 rounded-xl bg-amber-100 dark:bg-amber-900/40 hover:bg-amber-200 dark:hover:bg-amber-900/70 text-sm font-bold text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800/60 transition"
            >
              Review Again
            </button>
            <button
              type="button"
              onclick="markFlashcard('${card.id}', 'got')"
              class="px-4 py-3 rounded-xl bg-emerald-100 dark:bg-emerald-900/40 hover:bg-emerald-200 dark:hover:bg-emerald-900/70 text-sm font-bold text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60 transition"
            >
              Got it &#10003;
            </button>
            <button
              type="button"
              onclick="nextFlashcard()"
              class="px-4 py-3 rounded-xl bg-teal-600 hover:bg-teal-700 text-sm font-semibold text-white shadow-xs transition"
            >
              Next &rarr;
            </button>
          </div>
        ` : `<p class="text-center py-10 text-slate-500">No flashcards found in this section.</p>`}
      `;
    }

    function filterFlashcards(sectionId) {
      state.fcFilter = sectionId;
      state.fcIndex = 0;
      state.fcFlipped = false;
      renderMainContent();
    }

    function flipFlashcard() {
      state.fcFlipped = !state.fcFlipped;
      renderMainContent();
    }

    function nextFlashcard() {
      const deck = getFilteredDeck();
      if (!deck.length) return;
      state.fcIndex = (state.fcIndex + 1) % deck.length;
      state.fcFlipped = false;
      renderMainContent();
    }

    function prevFlashcard() {
      const deck = getFilteredDeck();
      if (!deck.length) return;
      state.fcIndex = (state.fcIndex - 1 + deck.length) % deck.length;
      state.fcFlipped = false;
      renderMainContent();
    }

    function shuffleFlashcards() {
      for (let i = state.fcDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.fcDeck[i], state.fcDeck[j]] = [state.fcDeck[j], state.fcDeck[i]];
      }
      state.fcIndex = 0;
      state.fcFlipped = false;
      showToast('Flashcard deck shuffled', 'info');
      renderMainContent();
    }

    function markFlashcard(cardId, status) {
      state.fcStatus[cardId] = status;
      safeSetStorage('mchiro_y3_fc_status', state.fcStatus);
      nextFlashcard();
    }

    function resetFlashcardStats() {
      state.fcStatus = {};
      safeSetStorage('mchiro_y3_fc_status', {});
      showToast('Flashcard progress reset', 'warn');
      renderMainContent();
    }

            >

            </button>
          </div>
          <div class="w-full h-2.5 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">

          </div>
        </div>

        <!-- 8 Exam Sections -->

    // --- 8C: GRADING SCALES QUICK-REF ---

            <div class="p-4 space-y-2.5 flex-1">

                <div class="flex items-start gap-3 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60">

            </div>
            <div class="p-4 space-y-2.5 flex-1">
              ${reflexGrades.map((row) => `
                <div class="flex items-start gap-3 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60">
                  <span class="shrink-0 w-9 h-8 rounded-lg bg-indigo-600 text-white font-extrabold text-sm flex items-center justify-center">${row.g}</span>

                    <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-200 leading-snug">${row.desc}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Sensory Grading + Key Terms -->
          <div class="space-y-5 flex flex-col">
            <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden shadow-xs">
              <div class="p-4 bg-violet-50 dark:bg-violet-950/40 border-b border-violet-100 dark:border-violet-900/60">
                <span class="text-[11px] font-bold uppercase tracking-wider text-violet-700 dark:text-violet-300">Dermatomes</span>
                <h3 class="text-lg font-extrabold text-slate-900 dark:text-white">Sensory Grading (0–2)</h3>

        <div class="flex flex-wrap gap-2 mb-6 p-1.5 rounded-2xl bg-slate-200/70 dark:bg-slate-900 border border-slate-200 dark:border-slate-800">

      state.mskTab = tabId;

    }

    function toggleMskBlur() {
      state.mskBlurMode = !state.mskBlurMode;

      );

    function toggleCellReveal(el) {
      if (!state.mskBlurMode) return;

      el.classList.toggle('opacity-70');

    function revealAllBlurred() {
      document.querySelectorAll('.recall-cell').forEach((el) => {
        el.classList.remove('blur-sm', 'opacity-70');
      });

    function recallCellAttr() {
      return state.mskBlurMode

          color: 'violet',
          mech: 'Defective mineralisation of newly formed osteoid matrix due to <strong>Vitamin D deficiency</strong>, malabsorption, or renal phosphate loss (Rickets in children).',
          density: '<strong>Impaired mineralisation</strong> (excess unmineralised osteoid); bone becomes soft and deformable.',
          hallmarks: 'Low/normal Ca<sup>2+</sup>, low PO<sub>4</sub>, <strong>high ALP</strong>, high PTH. X-ray: <strong>Looser zones</strong> (pseudofractures), diffuse bone pain, proximal myopathy.',
        },
        {
          name: 'Paget’s Disease',
          badge: 'Disordered Remodelling',
          color: 'indigo',
          mech: 'Focal, excessive osteoclast resorption followed by rapid, chaotic, mosaic osteoblast bone formation.',
          density: 'Thickened, enlarged, vascular, structurally <strong>weak &amp; brittle</strong> bone.',
          hallmarks: '<strong>Markedly elevated ALP</strong> with normal Ca<sup>2+</sup> &amp; PO<sub>4</sub>. X-ray: "Cotton-wool" skull, blade-of-grass lytic lesions, bowing of tibia/femur; deafness (CN VIII compression).',
        },
      ];

      return `
        <div class="space-y-6">
          <!-- Metabolic Bone Table -->
          <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden shadow-xs">
            <div class="px-5 py-3.5 bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800">
              <h3 class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white">Metabolic Bone Diseases Comparison</h3>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse min-w-[700px]">
                <thead>
                  <tr class="border-b border-slate-200 dark:border-slate-800 text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 bg-slate-50/50 dark:bg-slate-900">
                    <th class="p-4 w-1/5">Condition</th>
                    <th class="p-4 w-1/4">Mechanism</th>
                    <th class="p-4 w-1/4">Density vs. Mineralisation</th>
                    <th class="p-4 w-1/3">Lab &amp; Imaging Hallmarks</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 dark:divide-slate-800 text-sm">
                  ${metabolicRows.map((r) => `
                    <tr class="hover:bg-slate-50/60 dark:hover:bg-slate-800/30">
                      <td class="p-4 align-top">
                        <span class="block font-extrabold text-slate-900 dark:text-white">${r.name}</span>
                        <span class="mt-1 inline-block text-[11px] font-bold px-2 py-0.5 rounded-md bg-${r.color}-100 dark:bg-${r.color}-950/60 text-${r.color}-800 dark:text-${r.color}-300">
                          ${r.badge}
                        </span>
                      </td>
                      <td class="p-4 align-top text-slate-700 dark:text-slate-300 leading-relaxed">
                        <div ${recallCellAttr()}>${r.mech}</div>
                      </td>
                      <td class="p-4 align-top text-slate-700 dark:text-slate-300 leading-relaxed">
                        <div ${recallCellAttr()}>${r.density}</div>
                      </td>
                      <td class="p-4 align-top text-slate-700 dark:text-slate-300 leading-relaxed">
                        <div ${recallCellAttr()}>${r.hallmarks}</div>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Red Flag Highlight: Gout vs Septic Arthritis -->
          <div class="rounded-2xl border-2 border-rose-300 dark:border-rose-800/80 bg-rose-50/60 dark:bg-rose-950/20 overflow-hidden shadow-xs">
            <div class="px-5 py-3.5 bg-rose-600 text-white flex flex-wrap items-center justify-between gap-2">
              <h3 class="text-sm sm:text-base font-extrabold">Acute Hot Swollen Joint Red Flag: Gout vs. Septic Arthritis</h3>
              <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-lg bg-white/20">Urgent Medical Referral</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-rose-200 dark:divide-rose-800/60">
              <div class="p-5 space-y-2.5">
                <h4 class="text-base font-extrabold text-amber-800 dark:text-amber-300">Gout (Crystal Arthropathy)</h4>
                <div ${recallCellAttr()}>
                  <ul class="space-y-1.5 text-sm text-slate-700 dark:text-slate-300 list-disc pl-4">
                    <li><strong>Cause:</strong> Monosodium urate (MSU) crystal deposition (negatively birefringent needle-shaped crystals).</li>
                    <li><strong>Classic Site:</strong> 1st MTP joint (podagra), rapid onset peaking within 12–24 hrs, intensely red/hot/tender.</li>
                    <li><strong>Systemic:</strong> Usually afebrile or mild fever; history of purine-rich diet, alcohol, diuretics, or CKD.</li>
                    <li><strong>Action:</strong> Refer to GP for confirmation/NSAIDs/colchicine; <strong>never manipulate an acutely inflamed joint</strong>.</li>
                  </ul>
                </div>
              </div>
              <div class="p-5 space-y-2.5">
                <h4 class="text-base font-extrabold text-rose-700 dark:text-rose-400">Septic Arthritis (Orthopaedic Emergency)</h4>
                <div ${recallCellAttr()}>
                  <ul class="space-y-1.5 text-sm text-slate-700 dark:text-slate-300 list-disc pl-4">
                    <li><strong>Cause:</strong> Bacterial joint invasion (most commonly <em>Staph. aureus</em>) — destroys cartilage within 24–48 hrs.</li>
                    <li><strong>Classic Site:</strong> Large monoarthritis (knee/hip), severe pain on <strong>any passive or active ROM</strong>, inability to weight-bear.</li>
                    <li><strong>Systemic:</strong> High fever, rigors, malaise, tachycardia; elevated WCC, CRP, ESR.</li>
                    <li><strong>Action:</strong> <strong>SAME-DAY A&amp;E REFERRAL</strong> for joint aspiration (Gram stain/culture) &amp; IV antibiotics. Treat every acute hot swollen joint as septic until proven otherwise!</li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // --- 9C: SYSTEMIC & RENAL RED FLAGS ---
    function renderMskRenal() {
      const steps = [

          step: 'Step 1',

        },
        {
          step: 'Step 2',
          title: 'Decreased GFR & 1-&alpha;-Hydroxylase',
          detail: 'Impaired filtration reduces phosphate excretion, while damaged tubules fail to activate Vitamin D.',
          color: 'sky',
        },
        {
          step: 'Step 3',
          title: 'Phosphate Retention + Low Active Vitamin D (Calcitriol)',
          detail: 'Hyperphosphataemia binds serum calcium directly; low calcitriol decreases gut Ca<sup>2+</sup> absorption.',
          color: 'indigo',
        },
        {
          step: 'Step 4',
          title: 'Hypocalcaemia',
          detail: 'Low ionised serum calcium triggers calcium-sensing receptors on the parathyroid glands.',
          color: 'violet',
        },
        {
          step: 'Step 5',
          title: 'Secondary Hyperparathyroidism (High PTH)',
          detail: 'Persistent parathyroid hyperplasia drives chronically elevated PTH to restore serum calcium.',
          color: 'amber',

        {
          step: 'Step 6',
          title: 'Increased Osteoclastic Bone Resorption',
          detail: 'Excess PTH mobilises calcium from bone matrix, accelerating cortical thinning and marrow fibrosis.',
          color: 'orange',
        },
        {
          step: 'Step 7',
          title: 'Renal Osteodystrophy &amp; Pathological Fracture Risk',
          detail: 'Weakened, demineralised bone presenting with deep bone pain, proximal myopathy, and high fracture risk — <strong>contraindication to high-velocity manipulation!</strong>',
          color: 'rose',
        },
      ];

      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <!-- Visual Flowchart Cascade -->
          <div class="lg:col-span-2 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 sm:p-6 shadow-xs">

              <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">Pathophysiology Flowchart</span>
              <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white">CKD &rarr; Renal Osteodystrophy Cascade</h3>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">Visualise each link in sequence to bridge Renal BMS directly into MSK clinical safety.</p>
            </div>

            <div class="space-y-2">
              ${steps.map((s, idx) => `
                <div class="flex flex-col items-center">
                  <div class="w-full p-4 rounded-2xl border-l-4 border-${s.color}-500 bg-${s.color}-50/60 dark:bg-${s.color}-950/30 border border-slate-200/80 dark:border-slate-800">
                    <div class="flex items-center justify-between gap-2 mb-1">
                      <span class="text-[11px] font-extrabold uppercase tracking-wider text-${s.color}-700 dark:text-${s.color}-300">${s.step}</span>
                    </div>
                    <h4 class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white">${s.title}</h4>
                    <div ${recallCellAttr()}>
                      <p class="mt-1 text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed">${s.detail}</p>
                    </div>
                  </div>
                  ${idx < steps.length - 1 ? `
                    <div class="py-1 text-slate-400 dark:text-slate-600">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 13.5L12 21m0 0l-7.5-7.5M12 21V3" />
                      </svg>
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Red Flag Referral Box -->
          <div class="space-y-5">
            <div class="rounded-2xl border-2 border-rose-300 dark:border-rose-800 bg-rose-50 dark:bg-rose-950/30 p-5 shadow-xs">
              <div class="flex items-center gap-2.5 mb-3">
                <span class="w-8 h-8 rounded-xl bg-rose-600 text-white flex items-center justify-center font-extrabold text-sm">!</span>
                <h3 class="text-base font-extrabold text-rose-900 dark:text-rose-200">Quick-Ref Red Flag Referrals</h3>
              </div>
              <ul class="space-y-3 text-xs sm:text-sm text-rose-950 dark:text-rose-100">
                <li class="p-3 rounded-xl bg-white/80 dark:bg-slate-900/70 border border-rose-200 dark:border-rose-900">
                  <strong class="block text-rose-700 dark:text-rose-400">Renal / Systemic Bone Pain</strong>
                  Known CKD + new atraumatic axial/rib/hip pain, unexplained fatigue, oedema, or oliguria &rarr; <strong>Refer GP / Nephrology</strong> (assess fracture risk before manual therapy).
                </li>
                <li class="p-3 rounded-xl bg-white/80 dark:bg-slate-900/70 border border-rose-200 dark:border-rose-900">
                  <strong class="block text-rose-700 dark:text-rose-400">Suspected Septic Arthritis</strong>
                  Acute hot, swollen, severely painful single joint + fever/malaise &rarr; <strong>Immediate A&amp;E Referral</strong>.
                </li>
                <li class="p-3 rounded-xl bg-white/80 dark:bg-slate-900/70 border border-rose-200 dark:border-rose-900">
                  <strong class="block text-rose-700 dark:text-rose-400">Cauda Equina / Cord Compression</strong>
                  Saddle anaesthesia, bladder/bowel dysfunction, bilateral progressive leg weakness &rarr; <strong>Emergency A&amp;E</strong>.
                </li>
                <li class="p-3 rounded-xl bg-white/80 dark:bg-slate-900/70 border border-rose-200 dark:border-rose-900">
                  <strong class="block text-rose-700 dark:text-rose-400">Malignancy / Pathological Fracture</strong>
                  History of cancer, unexplained weight loss, constant night pain unrelieved by rest &rarr; <strong>Urgent GP / 2-Week Wait</strong>.
                </li>
              </ul>
            </div>

            <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5">
              <h4 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Clinical Pearl</h4>
              <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed">
                In chiropractic practice, systemic metabolic bone disease (osteoporosis, osteomalacia, Paget’s, renal osteodystrophy) increases fragility fracture risk. Always screen medical history and modify or withhold thrust techniques accordingly.
              </p>
            </div>
          </div>
        </div>

    }

  </script>
