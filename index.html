<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    };

  <style>
    :root {
      --svg-bg: #f8fafc;
      --svg-skin: #f1f5f9;
      --svg-skin-stroke: #475569;
      --svg-bone: #e2e8f0;
      --svg-bone-stroke: #475569;
      --svg-text: #0f172a;
      --svg-muted: #64748b;
      --svg-line: #cbd5e1;
      --svg-sulcus: rgba(15, 23, 42, 0.25);
      --svg-highlight: #0d9488;
      --svg-cartilage: #38bdf8;
      --svg-synovium: #f43f5e;
      --svg-effusion: #fb7185;
    }

    .dark {
      --svg-bg: #0f172a;
      --svg-skin: #1e293b;
      --svg-skin-stroke: #94a3b8;
      --svg-bone: #334155;
      --svg-bone-stroke: #cbd5e1;
      --svg-text: #f8fafc;
      --svg-muted: #94a3b8;
      --svg-line: #475569;
      --svg-sulcus: rgba(248, 250, 252, 0.25);
      --svg-highlight: #2dd4bf;
      --svg-cartilage: #0ea5e9;
      --svg-synovium: #fb7185;
      --svg-effusion: #e11d48;
    }

    /* Interactive SVG Zone Styling */
    .svg-zone {
      cursor: pointer;
      transition: opacity 0.16s ease, filter 0.16s ease, stroke-width 0.16s ease;
    }
    .svg-zone:hover {
      filter: brightness(1.12);
      opacity: 0.96;
    }
    .svg-zone-active {
      stroke: var(--svg-text) !important;
      stroke-width: 2.8px !important;
      filter: drop-shadow(0 0 6px rgba(13, 148, 136, 0.55));
    }

    /* Hide scrollbar for horizontal nav */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Active Recall Blur */
    .recall-blurred {
      filter: blur(6px);
      opacity: 0.6;
      user-select: none;
      cursor: pointer;
      transition: filter 0.2s ease, opacity 0.2s ease;
    }
    .recall-blurred:hover { opacity: 0.85; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased transition-colors duration-200 selection:bg-teal-200 dark:selection:bg-teal-800">

  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-5 pb-16">
    <!-- Active Recall Banner -->
    <div id="global-blur-banner" class="hidden mb-4 px-4 py-2.5 rounded-2xl bg-indigo-50 dark:bg-indigo-950/50 border border-indigo-200 dark:border-indigo-800/70 text-xs sm:text-sm text-indigo-900 dark:text-indigo-200 flex items-center justify-between gap-3">

    // =========================================================================

      } catch (e) {
        return fallback;

      if (state.mastery[id] === status) {

        state.mastery[id] = status;

      saveStore('mchiro_v3_mastery', state.mastery);
      updateHeaderMasteryUI();
      renderApp();

      const total = ALL_TRACKABLE_IDS.length;
      const gotCount = ALL_TRACKABLE_IDS.filter((id) => state.mastery[id] === 'got').length;
      const drillCount = ALL_TRACKABLE_IDS.filter((id) => state.mastery[id] === 'drill').length;
      const pct = total ? Math.round((gotCount / total) * 100) : 0;

      const txt = document.getElementById('header-mastery-text');
      const bar = document.getElementById('header-mastery-bar');
      const badge = document.getElementById('weak-count-badge');

      const banner = document.getElementById('weak-only-banner');

      if (txt) txt.textContent = `Mastery: ${pct}% (${gotCount}/${total})`;
      if (bar) bar.style.width = `${pct}%`;
      if (badge) badge.textContent = String(drillCount);

      if (btn && dot && banner) {

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const palette = {
        info: 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900',
        success: 'bg-emerald-600 text-white',
        warn: 'bg-amber-600 text-white',
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-semibold transition-all duration-300 ${palette[type] || palette.info}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {

        root.innerHTML = renderMskModule();
      } else if (['clinic3', 'philosophy3', 'research2'].includes(state.activeModule)) {
        root.innerHTML = renderAuditorModule(state.activeModule);
      } else {
        const mod = MODULES.find((m) => m.id === state.activeModule);
        root.innerHTML = renderPlaceholderModule(mod);

    function getLimbKey() { return `${state.limbRegion}_${state.limbMode}`; }

    function setLimbView(region, mode) {
      state.limbRegion = region;
      state.limbMode = mode;
      const keys = Object.keys(LIMB_DATA[getLimbKey()]);
      state.selectedZone = keys[0];
      if (state.limbQuizActive) nextLimbQuizPrompt();
      renderApp();
    }

    function toggleLimbQuiz() {
      state.limbQuizActive = !state.limbQuizActive;
      state.limbQuizScore = 0;
      state.limbQuizTotal = 0;
      state.limbQuizFeedback = null;
      if (state.limbQuizActive) nextLimbQuizPrompt();
      renderApp();
    }

    function nextLimbQuizPrompt() {
      const keys = Object.keys(LIMB_DATA[getLimbKey()]);
      state.limbQuizTarget = keys[Math.floor(Math.random() * keys.length)];
      state.limbQuizFeedback = null;
    }

    function handleLimbZoneClick(zoneId) {
      const data = LIMB_DATA[getLimbKey()];
      if (!data[zoneId]) return;
      state.selectedZone = zoneId;
      if (state.limbQuizActive) {
        state.limbQuizTotal++;
        if (zoneId === state.limbQuizTarget) {
          state.limbQuizScore++;
          state.limbQuizFeedback = { ok: true, msg: `Correct! That is ${data[zoneId].label}.` };
        } else {
          state.limbQuizFeedback = { ok: false, msg: `You tapped ${data[zoneId].label}. Try again or tap Next.` };
        }
      }
      renderApp();
    }

      const key = getLimbKey();
      const mapData = LIMB_DATA[key];
      const info = mapData[state.selectedZone] || Object.values(mapData)[0];
      const target = state.limbQuizActive && state.limbQuizTarget ? mapData[state.limbQuizTarget] : null;

              <button type="button" onclick="setLimbView(state.limbRegion, 'periph')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${state.limbMode==='periph'?'bg-indigo-600 text-white':'text-slate-600 dark:text-slate-300'}">Peripheral Nerves</button>

            ${state.limbQuizActive ? `Quiz Me ON (${state.limbQuizScore}/${state.limbQuizTotal})` : 'Quiz Me (Hide Labels)'}

    // --- 8C. BRAIN LESIONS BOARD + LOCALISE THE LESION GAME ---
    function handleBrainRegionTap(regionId) {
      if (state.lesionMode === 'game') {
        const curCase = LESION_CASES[state.gameIdx];
        if (!state.gameAnswered) {
          const correct = regionId === curCase.target;
          if (correct) state.gameScore++;
          state.gameAnswered = { correct, tapped: regionId };
          renderApp();
        }
      } else {
        state.selectedBrainRegion = state.selectedBrainRegion === regionId ? 'all' : regionId;
        renderApp();
      }
    }

    function nextLesionCase() {
      state.gameIdx = (state.gameIdx + 1) % LESION_CASES.length;
      state.gameAnswered = null;
      renderApp();
    }

    function resetLesionGame() {
      state.gameIdx = 0;
      state.gameScore = 0;
      state.gameAnswered = null;
      renderApp();
    }

      const isGame = state.lesionMode === 'game';
      const curCase = LESION_CASES[state.gameIdx];

      const rCls = (id) => `svg-zone ${activeRegion === id ? 'svg-zone-active' : ''}`;

      // Filter Reference Cards
      const q = state.lesionSearch.trim().toLowerCase();
      const filtered = BRAIN_LESIONS.filter((item) => {
        if (state.weakSpotsOnly && state.mastery[item.id] !== 'drill') return false;
        const matchReg = state.selectedBrainRegion === 'all' || item.region === state.selectedBrainRegion;
        const matchQ = !q || item.term.toLowerCase().includes(q) || item.definition.toLowerCase().includes(q) || item.site.toLowerCase().includes(q);
        return matchReg && matchQ;
      });

      const badgeStyles = {
        purple: 'bg-purple-100 dark:bg-purple-950/60 text-purple-800 dark:text-purple-300',
        blue: 'bg-blue-100 dark:bg-blue-950/60 text-blue-800 dark:text-blue-300',

        slate: 'bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300',
      };

      return `
        <!-- Mode Toggle -->

    // --- 8D. TIMED 15-MINUTE PRACTICAL / OSCE SIMULATOR ---
    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function toggleOsceTimer() {
      if (state.osceRunning) {
        clearInterval(osceIntervalId);
        state.osceRunning = false;
      } else {
        state.osceRunning = true;
        osceIntervalId = setInterval(() => {
          if (state.osceRemaining > 0) {
            state.osceRemaining--;
            const el = document.getElementById('osce-clock');
            if (el) el.textContent = formatTime(state.osceRemaining);
          } else {
            clearInterval(osceIntervalId);
            state.osceRunning = false;
            showToast('Time up! Station finished.', 'warn');
            renderApp();
          }
        }, 1000);
      }
      renderApp();
    }

    function setOsceDuration(secs) {
      clearInterval(osceIntervalId);
      state.osceRunning = false;
      state.osceDuration = secs;
      state.osceRemaining = secs;
      renderApp();
    }

    function drawRandomOsce() {
      const pool = OSCE_PROMPTS.filter((p) => state.osceCat === 'All' || p.cat === state.osceCat);
      if (!pool.length) return;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      state.oscePromptIdx = OSCE_PROMPTS.findIndex((p) => p.id === pick.id);
      state.osceShowSteps = false;
      renderApp();
    }

    function renderOsceTab() {
      const prompt = OSCE_PROMPTS[state.oscePromptIdx] || OSCE_PROMPTS[0];
      const cats = ['All', 'SMR & Peripheral', 'Cranial Nerves', 'Cerebral & Gait', 'Motor & Sensory', 'Special Tests'];

      return `
        <div class="max-w-3xl mx-auto space-y-5">
          <!-- Timer & Mode Card -->
          <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-center sm:text-left">
              <span class="text-[11px] font-extrabold uppercase tracking-wider text-teal-600 dark:text-teal-400">Practical Exam Timer</span>
              <div id="osce-clock" class="text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white tabular-nums mt-0.5">
                ${formatTime(state.osceRemaining)}
              </div>
              <div class="mt-2 flex items-center justify-center sm:justify-start gap-1.5">
                <button type="button" onclick="setOsceDuration(900)" class="px-2.5 py-1 rounded-lg text-[11px] font-bold ${state.osceDuration===900?'bg-teal-600 text-white':'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">15:00 Full Exam</button>
                <button type="button" onclick="setOsceDuration(60)" class="px-2.5 py-1 rounded-lg text-[11px] font-bold ${state.osceDuration===60?'bg-indigo-600 text-white':'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">01:00 Rapid Station</button>
              </div>
            </div>

            <div class="flex flex-col items-center sm:items-end gap-2">
              <div class="flex items-center gap-2">
                <button type="button" onclick="toggleOsceTimer()" class="px-5 py-2.5 rounded-xl text-xs font-bold text-white transition ${state.osceRunning ? 'bg-amber-600 hover:bg-amber-700' : 'bg-teal-600 hover:bg-teal-700'}">
                  ${state.osceRunning ? 'Pause' : 'Start Timer'}
                </button>
                <button type="button" onclick="setOsceDuration(state.osceDuration)" class="px-4 py-2.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200">
                  Reset
                </button>
              </div>
              <div class="text-xs font-bold text-slate-500 dark:text-slate-400">
                Session Tally: <span class="text-emerald-600 dark:text-emerald-400">${state.oscePassCount} Pass</span> &bull; <span class="text-rose-600 dark:text-rose-400">${state.osceDrillCount} Flagged</span>
              </div>
            </div>
          </div>

          <!-- Category Filter & Draw Prompt -->
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap gap-1.5">
              ${cats.map((c) => `
                <button type="button" onclick="state.osceCat='${c}'; drawRandomOsce();" class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition ${state.osceCat===c ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900' : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300'}">${c}</button>
              `).join('')}
            </div>
            <button type="button" onclick="drawRandomOsce()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-xs">
              🎲 Draw Random Prompt
            </button>
          </div>

          <!-- Active Examiner Prompt Card -->
          <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 sm:p-6 space-y-4 shadow-xs">
            <span class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-indigo-100 dark:bg-indigo-950/60 text-indigo-800 dark:text-indigo-300">${prompt.cat}</span>
            <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white leading-snug">
              Examiner: “${prompt.command}”
            </h3>

            <!-- Assessor Trap Check -->
            <div class="p-3.5 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60 text-xs sm:text-sm text-amber-900 dark:text-amber-200">
              <strong class="block text-[11px] uppercase tracking-wider text-amber-700 dark:text-amber-400 mb-0.5">⚠ Assessor Trap Check</strong>
              ${prompt.trap}
            </div>

            <!-- Collapsible Model Steps -->
            <div>
              <button
                type="button"
                onclick="state.osceShowSteps=!state.osceShowSteps; renderApp();"
                class="w-full py-2.5 px-4 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center justify-between"
              >
                <span>${state.osceShowSteps ? 'Hide Model Steps & Grading' : 'Reveal Model Steps & Grading'}</span>
                <span>${state.osceShowSteps ? '▲' : '▼'}</span>
              </button>
              ${state.osceShowSteps ? `
                <div class="mt-2 p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 text-xs sm:text-sm text-slate-800 dark:text-slate-200 whitespace-pre-line leading-relaxed border border-slate-200 dark:border-slate-700">
                  ${prompt.steps}
                </div>
              ` : ''}
            </div>

            <!-- Pass / Flag Buttons -->
            <div class="grid grid-cols-2 gap-3 pt-2">
              <button type="button" onclick="state.oscePassCount++; drawRandomOsce(); showToast('Marked Pass ✓','success');" class="py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold">
                ✓ Pass &amp; Next
              </button>
              <button type="button" onclick="state.osceDrillCount++; drawRandomOsce(); showToast('Flagged to Drill ↺','warn');" class="py-3 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs sm:text-sm font-bold">
                ↺ Flag to Drill &amp; Next
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // --- 8E. COMPACT EXAM CHECKLIST & GRADING SCALES ---
    function renderChecklistTab() {
      const totalItems = NEURO_CHECKLIST.reduce((s, sec) => s + sec.items.length, 0);
      const doneItems = Object.values(state.checkedItems).filter(Boolean).length;
      const pct = totalItems ? Math.round((doneItems / totalItems) * 100) : 0;

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
          <!-- Left: 8-Section Accordions -->
          <div class="lg:col-span-8 space-y-3">
            <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <div class="flex items-center justify-between gap-2 mb-2">
                <div>
                  <h3 class="text-sm font-extrabold text-slate-900 dark:text-white">Year 3 Clinical Neurology Testing Overview</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400">${doneItems}/${totalItems} checked (${pct}%)</p>
                </div>
                <button type="button" onclick="state.checkedItems={}; saveStore('mchiro_v3_checklist',{}); renderApp();" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300">Reset</button>
              </div>
              <div class="w-full h-2 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
                <div class="h-full bg-gradient-to-r from-teal-500 to-emerald-500 transition-all" style="width:${pct}%"></div>
              </div>
            </div>

            ${NEURO_CHECKLIST.map((sec) => {
              const isOpen = !!state.openAccordions[sec.num];
              const secDone = sec.items.filter((_, idx) => state.checkedItems[`s${sec.num}-i${idx}`]).length;
              return `
                <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden">
                  <button type="button" onclick="state.openAccordions[${sec.num}]=!state.openAccordions[${sec.num}]; renderApp();" class="w-full px-4 py-3 flex items-center justify-between gap-2 text-left hover:bg-slate-50 dark:hover:bg-slate-800/50">
                    <span class="text-xs sm:text-sm font-bold text-slate-900 dark:text-white">${sec.title}</span>
                    <span class="flex items-center gap-2 shrink-0">
                      <span class="text-[11px] font-bold px-2 py-0.5 rounded-md ${secDone===sec.items.length?'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300':'bg-slate-100 dark:bg-slate-800 text-slate-500'}">${secDone}/${sec.items.length}</span>
                      <span class="text-xs text-slate-400">${isOpen ? '▲' : '▼'}</span>
                    </span>
                  </button>
                  ${isOpen ? `
                    <div class="border-t border-slate-100 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800/70">
                      ${sec.items.map((txt, idx) => {
                        const k = `s${sec.num}-i${idx}`;
                        const chk = !!state.checkedItems[k];
                        return `
                          <label class="flex items-start gap-3 px-4 py-2.5 cursor-pointer hover:bg-slate-50/70 dark:hover:bg-slate-800/30">
                            <input type="checkbox" ${chk?'checked':''} onchange="state.checkedItems['${k}']=!state.checkedItems['${k}']; saveStore('mchiro_v3_checklist',state.checkedItems); renderApp();" class="mt-0.5 w-4 h-4 accent-teal-600 rounded shrink-0" />
                            <span class="text-xs sm:text-sm ${chk?'line-through text-slate-400':'text-slate-700 dark:text-slate-200'}">${txt}</span>
                          </label>
                        `;
                      }).join('')}
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>

          <!-- Right: Compact Grading Scales Reference -->
          <div class="lg:col-span-4 space-y-3">
            <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 space-y-1.5 text-xs">
              <h4 class="font-extrabold text-teal-700 dark:text-teal-400">MRC Strength Scale (0–5)</h4>
              <p><strong>5:</strong> Full power against resistance</p>
              <p><strong>4:</strong> Active movement against gravity &amp; resistance</p>
              <p><strong>3:</strong> Active movement against gravity only</p>
              <p><strong>2:</strong> Movement with gravity eliminated</p>
              <p><strong>1:</strong> Flicker / trace contraction</p>
              <p><strong>0:</strong> No contraction</p>
            </div>
            <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 space-y-1.5 text-xs">
              <h4 class="font-extrabold text-indigo-700 dark:text-indigo-400">Reflex Grading (0–4+)</h4>
              <p><strong>0:</strong> Absent (areflexia)</p>
              <p><strong>1+:</strong> Diminished / reinforcement needed</p>
              <p><strong>2+:</strong> Normal</p>
              <p><strong>3+:</strong> Brisk (possibly normal or UMN)</p>
              <p><strong>4+:</strong> Hyperreflexia with clonus (UMN)</p>
            </div>
            <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 space-y-1.5 text-xs">

    // --- 8F. CLEAN MODE FLASHCARDS ---
    function getFilteredFlashcards() {
      return state.fcDeck.filter((c) => {
        if (state.weakSpotsOnly && state.mastery[c.id] !== 'drill') return false;
        return state.fcCat === 'All' || c.cat === state.fcCat;
      });
    }

    function navFlashcard(delta) {
      const deck = getFilteredFlashcards();
      if (!deck.length) return;
      state.fcIdx = (state.fcIdx + delta + deck.length) % deck.length;
      state.fcFlipped = false;
      renderApp();
    }

    function shuffleFlashcards() {
      for (let i = state.fcDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.fcDeck[i], state.fcDeck[j]] = [state.fcDeck[j], state.fcDeck[i]];
      }
      state.fcIdx = 0;
      state.fcFlipped = false;
      showToast('Flashcards shuffled', 'info');
      renderApp();
    }

    function renderFlashcardsTab() {
      const deck = getFilteredFlashcards();
      if (state.fcIdx >= deck.length) state.fcIdx = 0;
      const card = deck[state.fcIdx];
      const cats = ['All', 'Brain Lesions', 'Limb SMR & Nerves', 'Cranial Nerves', 'Special Tests'];

      return `
        <div class="max-w-xl mx-auto space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap gap-1.5">

                  ? 'bg-teal-50/70 dark:bg-teal-950/30 border-teal-400 dark:border-teal-600'
                  : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-teal-300'

    function toggleAuditorCheck(modId, key) {
      if (!state.auditorChecks[modId]) state.auditorChecks[modId] = {};
      state.auditorChecks[modId][key] = !state.auditorChecks[modId][key];
      saveStore('mchiro_v3_auditor_checks', state.auditorChecks);
      renderApp();
    }

    function updateWordTarget(modId, val) {
      const num = Math.max(100, parseInt(val, 10) || 0);
      state.auditorWordTarget[modId] = num;
      saveStore('mchiro_v3_word_target', state.auditorWordTarget);
      const minEl = document.getElementById('wc-min');
      const maxEl = document.getElementById('wc-max');
      if (minEl) minEl.textContent = Math.round(num * 0.9).toLocaleString();
      if (maxEl) maxEl.textContent = Math.round(num * 1.1).toLocaleString();
    }

    function renderAuditorModule(modId) {
      const cfg = AUDITOR_CONFIGS[modId];
      const modChecks = state.auditorChecks[modId] || {};
      const targetWords = state.auditorWordTarget[modId] || 2500;

      const sections = [
        { id: 'voice', title: '1. Voice & Presentation', items: AUDITOR_COMMON_CHECKS.voice },
        { id: 'depth', title: '2. Critical Evaluation & Rubric Depth', items: cfg.depthChecks },
        { id: 'ref', title: '3. Referencing & Literature Density', items: AUDITOR_COMMON_CHECKS.referencing },
        { id: 'conc', title: '4. Conclusion Integrity', items: AUDITOR_COMMON_CHECKS.conclusion },
      ];

      const total = sections.reduce((s, sec) => s + sec.items.length, 0);
      const done = sections.reduce((s, sec) => s + sec.items.filter((_, idx) => modChecks[`${sec.id}_${idx}`]).length, 0);
      const pct = total ? Math.round((done / total) * 100) : 0;

      return `
        <div class="max-w-4xl mx-auto space-y-5">
          <!-- Strict Rubric Calibration Warning Banner -->
          <div class="p-4 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-800 text-xs sm:text-sm text-amber-900 dark:text-amber-200 flex items-start gap-2.5">
            <span class="font-extrabold text-base leading-none">⚠</span>
            <div>
              <strong>Strict Rubric Calibration:</strong> Audit directly against McTimoney criteria; never rely on inflated grade estimates.
            </div>
          </div>

          <!-- Header + Readiness Bar + Word-Count Calculator -->
          <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
            <div class="md:col-span-7 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 space-y-3">
              <div>
                <h2 class="text-lg font-extrabold text-slate-900 dark:text-white">${cfg.title}</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${cfg.subtitle}</p>
              </div>
              <div>
                <div class="flex items-center justify-between text-xs font-bold mb-1.5">
                  <span class="text-slate-600 dark:text-slate-300">Submission Readiness</span>
                  <span class="${pct === 100 ? 'text-emerald-600 dark:text-emerald-400' : 'text-indigo-600 dark:text-indigo-400'}">${done}/${total} (${pct}%)</span>
                </div>
                <div class="w-full h-2.5 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
                  <div class="h-full bg-gradient-to-r from-indigo-500 to-emerald-500 transition-all duration-300" style="width:${pct}%"></div>
                </div>
              </div>
              <div class="flex items-center gap-2 pt-1">
                <button type="button" onclick="state.auditorShowRubric=!state.auditorShowRubric; renderApp();" class="px-3 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-700 dark:text-indigo-300 text-xs font-bold">
                  ${state.auditorShowRubric ? 'Hide Rubric Weightings' : 'View Rubric Weightings (60–69% vs 70%+)'}
                </button>
                <button type="button" onclick="state.auditorChecks['${modId}']={}; saveStore('mchiro_v3_auditor_checks',state.auditorChecks); renderApp();" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300">
                  Reset Audit
                </button>
              </div>
            </div>

            <!-- Word Count Window Calculator -->
            <div class="md:col-span-5 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 flex flex-col justify-between space-y-3">
              <div>
                <span class="text-[11px] font-extrabold uppercase tracking-wider text-teal-600 dark:text-teal-400">±10% Word-Count Window</span>
                <label class="block text-xs text-slate-500 dark:text-slate-400 mt-1">Target Word Count:</label>
                <input
                  type="number"
                  min="100"
                  step="100"
                  value="${targetWords}"
                  oninput="updateWordTarget('${modId}', this.value)"
                  class="mt-1 w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-extrabold text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500"
                />
              </div>
              <div class="grid grid-cols-2 gap-2 text-center">
                <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/70">
                  <span class="block text-[10px] font-bold uppercase text-slate-400">-10% Min</span>
                  <span id="wc-min" class="text-base font-extrabold text-slate-900 dark:text-white">${Math.round(targetWords * 0.9).toLocaleString()}</span>
                </div>
                <div class="p-2.5 rounded-xl bg-teal-50 dark:bg-teal-950/40">
                  <span class="block text-[10px] font-bold uppercase text-teal-600 dark:text-teal-400">+10% Max</span>
                  <span id="wc-max" class="text-base font-extrabold text-teal-700 dark:text-teal-300">${Math.round(targetWords * 1.1).toLocaleString()}</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Collapsible Rubric Table -->
          ${state.auditorShowRubric ? `
            <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden">
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[560px] text-xs">
                  <thead>
                    <tr class="border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/70">
                      <th class="p-3 font-extrabold text-slate-500">Weight</th>
                      <th class="p-3 font-extrabold text-slate-700 dark:text-slate-200">Criterion</th>
                      <th class="p-3 font-extrabold text-sky-700 dark:text-sky-300">60–69% (Very Good)</th>
                      <th class="p-3 font-extrabold text-emerald-700 dark:text-emerald-300">70%+ (Excellent)</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
                    ${cfg.rubricBands.map((r) => `
                      <tr>
                        <td class="p-3 font-extrabold text-indigo-600 dark:text-indigo-400">${r.weight}</td>
                        <td class="p-3 font-bold text-slate-900 dark:text-white">${r.area}</td>
                        <td class="p-3 text-slate-600 dark:text-slate-300">${r.good}</td>
                        <td class="p-3 font-medium text-emerald-900 dark:text-emerald-200 bg-emerald-50/40 dark:bg-emerald-950/20">${r.excellent}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          ` : ''}

          <!-- 4 Interactive Pre-Submission Checklist Categories -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${sections.map((sec) => `
              <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden">
                <div class="px-4 py-3 bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800">
                  <h3 class="text-xs sm:text-sm font-extrabold text-slate-900 dark:text-white">${sec.title}</h3>
                </div>
                <div class="divide-y divide-slate-100 dark:divide-slate-800/70">
                  ${sec.items.map((txt, idx) => {
                    const k = `${sec.id}_${idx}`;
                    const chk = !!modChecks[k];
                    return `
                      <label class="flex items-start gap-3 px-4 py-2.5 cursor-pointer hover:bg-slate-50/70 dark:hover:bg-slate-800/30">
                        <input type="checkbox" ${chk ? 'checked' : ''} onchange="toggleAuditorCheck('${modId}','${k}')" class="mt-0.5 w-4 h-4 accent-indigo-600 rounded shrink-0" />
                        <span class="text-xs sm:text-sm leading-snug ${chk ? 'line-through text-slate-400' : 'text-slate-700 dark:text-slate-200'}">${txt}</span>
                      </label>
                    `;
                  }).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 11. PLACEHOLDER MODULES (BEHAVIOURAL SCIENCES & CHIROPRACTIC STUDIES 3)
    // =========================================================================
    function renderPlaceholderModule(mod) {
      return `
        <div class="max-w-2xl mx-auto mt-4 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 sm:p-8 text-center space-y-4">
          <span class="inline-block px-3 py-1 rounded-xl text-xs font-bold uppercase tracking-wider bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">
            Ready for Year 3 Handbooks &amp; Notes (Late Jan 2027)
          </span>
          <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white">${mod.name}</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400">
            This module tab is live in your navigation shell and ready for lecture diagrams, cue cards, and active recall quizzes once term begins.
          </p>
          <div class="flex flex-wrap justify-center gap-2 pt-1">
            ${(mod.topics || []).map((t) => `
              <span class="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-300">${t}</span>
            `).join('')}
          </div>
          <div class="pt-3 flex flex-wrap justify-center gap-2">
            <button type="button" onclick="selectModule('neuro')" class="px-4 py-2 rounded-xl bg-teal-600 text-white text-xs font-bold">Clinical Neurology</button>
            <button type="button" onclick="selectModule('msk')" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">MSK Medicine</button>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 12. INITIALISE
    // =========================================================================
    initTheme();
    updateGlobalBlurUI();
    updateHeaderMasteryUI();
    renderTopNav();
    renderApp();
  </script>
</body>
</html>
