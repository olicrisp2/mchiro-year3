<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />

  <title>MChiro Year 3 Revision Hub</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Theme-Adaptive CSS Variables for Inline SVGs & Subtle Transitions -->
  <style>
    :root {
      --svg-bg: #f8fafc;
      --svg-skin: #f1f5f9;
      --svg-skin-stroke: #64748b;
      --svg-bone: #e2e8f0;
      --svg-bone-stroke: #475569;
      --svg-text: #0f172a;
      --svg-muted: #64748b;
      --svg-line: #cbd5e1;
      --svg-highlight: #0d9488;
      --svg-cartilage: #38bdf8;
      --svg-synovium: #f43f5e;
      --svg-effusion: #fb7185;
    }

    .dark {
      --svg-bg: #0f172a;
      --svg-skin: #1e293b;
      --svg-skin-stroke: #94a3b8;
      --svg-bone: #334155;
      --svg-bone-stroke: #cbd5e1;
      --svg-text: #f8fafc;
      --svg-muted: #94a3b8;
      --svg-line: #475569;
      --svg-highlight: #2dd4bf;
      --svg-cartilage: #0ea5e9;
      --svg-synovium: #fb7185;
      --svg-effusion: #e11d48;
    }

    /* Interactive SVG Zone Styling */
    .svg-zone {
      cursor: pointer;
      transition: opacity 0.18s ease, filter 0.18s ease, stroke-width 0.18s ease;
    }
    .svg-zone:hover {
      filter: brightness(1.08);
      opacity: 0.95;
    }
    .svg-zone-active {
      stroke: var(--svg-text) !important;
      stroke-width: 3px !important;
      filter: drop-shadow(0 0 6px rgba(13, 148, 136, 0.45));
    }

    /* Hide scrollbars on horizontal pill bars while keeping scrollability */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Active Recall Blur Effect */
    .recall-blurred {
      filter: blur(6px);
      opacity: 0.65;
      user-select: none;
      cursor: pointer;
      transition: filter 0.2s ease, opacity 0.2s ease;
    }
    .recall-blurred:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased transition-colors duration-200 selection:bg-teal-200 dark:selection:bg-teal-800">

      applyTheme(saved ? saved === 'dark' : prefersDark);

    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      saveStore('mchiro_y3_v2_theme', isDark ? 'dark' : 'light');
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) {
        btn.innerHTML = isDark
          ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>`

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const palette = {
        info: 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900',
        success: 'bg-emerald-600 text-white',
        warn: 'bg-amber-600 text-white',
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-semibold transition-all duration-300 ${palette[type] || palette.info}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 2200);
    }

        dot.className = 'w-2 h-2 rounded-full bg-amber-300 animate-pulse';
        lbl.textContent = 'ON';
        banner.classList.remove('hidden');

        btn.className = 'px-3 py-2 rounded-xl text-xs font-bold border transition flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-indigo-400';

        lbl.textContent = 'OFF';
        banner.classList.add('hidden');
      }

      state.globalBlur = !state.globalBlur;

            : 'bg-transparent text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/70 border border-dashed border-slate-300 dark:border-slate-700';
        return `

            class="px-3.5 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap flex items-center gap-1.5 ${base}"

            <span>${m.name}</span>
            ${!m.active ? `<span class="text-[10px] opacity-70 font-semibold">Jan '27</span>` : ''}
          </button>
        `;
      }).join('');

        root.innerHTML = renderMskModule();

      state.limbRegion = region;
      state.limbMode = mode;
      const keys = Object.keys(LIMB_DATA[getLimbKey()]);
      state.selectedZone = keys[0];
      if (state.quizActive) startLimbQuizPrompt();
      renderApp();

    function toggleLimbQuiz() {
      state.quizActive = !state.quizActive;

      state.quizTotal = 0;
      state.quizFeedback = null;
      if (state.quizActive) startLimbQuizPrompt();
      renderApp();

    function startLimbQuizPrompt() {
      const data = LIMB_DATA[getLimbKey()];
      const keys = Object.keys(data);
      const next = keys[Math.floor(Math.random() * keys.length)];
      state.quizTarget = next;
      state.quizFeedback = null;
    }

    function handleLimbZoneClick(zoneId) {
      const data = LIMB_DATA[getLimbKey()];
      if (!data[zoneId]) return;

      if (state.quizActive) {
        state.quizTotal++;
        if (zoneId === state.quizTarget) {
          state.quizScore++;
          state.selectedZone = zoneId;
          state.quizFeedback = { ok: true, msg: `Correct! That is ${data[zoneId].label}.` };
        } else {
          state.selectedZone = zoneId;
          state.quizFeedback = { ok: false, msg: `You tapped ${data[zoneId].label}. Try again or click Next!` };
        }
      } else {
        state.selectedZone = zoneId;
      }
      renderApp();
    }

    // --- 8D. TAB 4: EXAM CHECKLIST ACCORDIONS & CLEAN MODE FLASHCARDS ---
    function getFilteredCards() {

    }

    function renderExamAndCardsTab() {
      const deck = getFilteredCards();
      if (state.fcIdx >= deck.length) state.fcIdx = 0;
      const card = deck[state.fcIdx];

      const totalItems = NEURO_CHECKLIST.reduce((s, sec) => s + sec.items.length, 0);
      const doneItems = Object.values(state.checkedItems).filter(Boolean).length;
      const pct = totalItems ? Math.round((doneItems / totalItems) * 100) : 0;

      const cats = ['All', 'Brain Lesions', 'Dermatomes & Nerves', 'Cranial Nerves', 'Special Tests'];

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
          <!-- Left: Clean Mode Flashcards (3-5 word fronts) -->
          <div class="lg:col-span-5 space-y-3">

              <h3 class="text-sm font-extrabold text-slate-900 dark:text-white">Clean Mode Flashcards</h3>

            </div>

            <!-- Category Pills -->
            <div class="flex flex-wrap gap-1.5">
              ${cats.map((c) => `
                <button
                  type="button"
                  onclick="state.fcCat='${c}'; state.fcIdx=0; state.fcFlipped=false; renderApp();"
                  class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition ${
                    state.fcCat === c
                      ? 'bg-teal-600 text-white'
                      : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300'
                  }"
                >${c}</button>
              `).join('')}
            </div>

            <!-- Flashcard Box -->
            ${card ? `
              <div
                onclick="state.fcFlipped=!state.fcFlipped; renderApp();"
                role="button"
                tabindex="0"
                class="cursor-pointer select-none min-h-[220px] p-6 rounded-3xl border-2 flex flex-col justify-between transition ${
                  state.fcFlipped
                    ? 'bg-teal-50/70 dark:bg-teal-950/30 border-teal-400 dark:border-teal-600'
                    : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-teal-300'
                }"
              >
                <div class="flex items-center justify-between text-[11px] font-bold">
                  <span class="text-slate-400">${card.cat} &bull; ${state.fcIdx + 1}/${deck.length}</span>
                  <span class="px-2 py-0.5 rounded-md ${state.fcFlipped ? 'bg-teal-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}">
                    ${state.fcFlipped ? 'Answer' : 'Tap to Flip'}
                  </span>
                </div>
                <div class="my-5 text-center">
                  ${state.fcFlipped
                    ? `<p class="text-sm sm:text-base font-medium text-slate-800 dark:text-slate-100 leading-relaxed">${card.back}</p>`
                    : `<p class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">${card.front}</p>`
                  }
                </div>
                <div class="flex justify-center gap-2 text-[11px] font-bold">
                  ${state.fcStatus[card.id] === 'got' ? '<span class="text-emerald-600 dark:text-emerald-400">✓ Got it</span>' : ''}
                  ${state.fcStatus[card.id] === 'review' ? '<span class="text-amber-600 dark:text-amber-400">↺ Review Again</span>' : ''}
                </div>
              </div>

              <div class="grid grid-cols-4 gap-2">
                <button type="button" onclick="navCard(-1)" class="py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs font-bold">&larr;</button>
                <button type="button" onclick="markCard('${card.id}','review')" class="py-2.5 rounded-xl bg-amber-100 dark:bg-amber-950/50 text-amber-800 dark:text-amber-300 text-xs font-bold">Review</button>
                <button type="button" onclick="markCard('${card.id}','got')" class="py-2.5 rounded-xl bg-emerald-100 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-300 text-xs font-bold">Got it ✓</button>
                <button type="button" onclick="navCard(1)" class="py-2.5 rounded-xl bg-teal-600 text-white text-xs font-bold">&rarr;</button>
              </div>
            ` : ''}
          </div>

          <!-- Right: Tap-to-Expand 8-Section Practical Checklist Accordions -->
          <div class="lg:col-span-7 space-y-3">
            <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <div class="flex items-center justify-between gap-2 mb-2">
                <div>
                  <h3 class="text-sm font-extrabold text-slate-900 dark:text-white">Year 3 Practical Exam Checklist (8 Sections)</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400">${doneItems}/${totalItems} checked (${pct}%) &bull; Tap headers to expand</p>

                <button type="button" onclick="resetChecklist()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-rose-100 dark:hover:bg-rose-950/50 text-xs font-bold text-slate-600 dark:text-slate-300">Reset</button>

            <div class="space-y-2">
              ${NEURO_CHECKLIST.map((sec) => {
                const isOpen = !!state.openAccordions[sec.num];
                const secDone = sec.items.filter((_, idx) => state.checkedItems[`s${sec.num}-i${idx}`]).length;
                return `
                  <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden">
                    <button
                      type="button"
                      onclick="state.openAccordions[${sec.num}]=!state.openAccordions[${sec.num}]; renderApp();"

                        <svg class="w-4 h-4 text-slate-400 transition-transform ${isOpen ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
                      </span>
                    </button>
                    ${isOpen ? `
                      <div class="border-t border-slate-100 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800/70">
                        ${sec.items.map((txt, idx) => {
                          const k = `s${sec.num}-i${idx}`;
                          const chk = !!state.checkedItems[k];
                          return `
                            <label class="flex items-start gap-3 px-4 py-2.5 cursor-pointer hover:bg-slate-50/70 dark:hover:bg-slate-800/30">
                              <input type="checkbox" ${chk ? 'checked' : ''} onchange="toggleCheck('${k}')" class="mt-0.5 w-4 h-4 accent-teal-600 rounded shrink-0 cursor-pointer" />
                              <span class="text-xs sm:text-sm leading-snug ${chk ? 'line-through text-slate-400' : 'text-slate-700 dark:text-slate-200'}">${txt}</span>
                            </label>
                          `;
                        }).join('')}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;

    function navCard(delta) {
      const deck = getFilteredCards();
      if (!deck.length) return;
      state.fcIdx = (state.fcIdx + delta + deck.length) % deck.length;
      state.fcFlipped = false;
      renderApp();
    }

    function markCard(id, status) {
      state.fcStatus[id] = status;
      saveStore('mchiro_v2_fc_status', state.fcStatus);
      navCard(1);
    }

    function shuffleDeck() {
      for (let i = state.fcDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.fcDeck[i], state.fcDeck[j]] = [state.fcDeck[j], state.fcDeck[i]];
      }
      state.fcIdx = 0;
      state.fcFlipped = false;
      showToast('Deck shuffled', 'info');
      renderApp();
    }

    function toggleCheck(key) {
      state.checkedItems[key] = !state.checkedItems[key];
      saveStore('mchiro_v2_checklist', state.checkedItems);
      renderApp();
    }

    function resetChecklist() {
      state.checkedItems = {};
      saveStore('mchiro_v2_checklist', {});
      showToast('Checklist reset', 'info');
      renderApp();
    }

    // =========================================================================
    // 9. MODULE 2: MUSCULOSKELETAL MEDICINE
    // =========================================================================
    function renderMskModule() {
      const tabs = [
