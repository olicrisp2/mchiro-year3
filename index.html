<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MChiro Year 3 Revision Hub (v4)</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --svg-bg: #f8fafc;
      --svg-skin: #f1f5f9;
      --svg-skin-stroke: #475569;
      --svg-bone: #e2e8f0;
      --svg-bone-stroke: #475569;
      --svg-text: #0f172a;
      --svg-muted: #64748b;
      --svg-line: #cbd5e1;
      --svg-sulcus: rgba(15, 23, 42, 0.25);
      --svg-cartilage: #38bdf8;
      --svg-synovium: #f43f5e;
      --svg-effusion: #fb7185;
    }

    .dark {
      --svg-bg: #0f172a;
      --svg-skin: #1e293b;
      --svg-skin-stroke: #94a3b8;
      --svg-bone: #334155;
      --svg-bone-stroke: #cbd5e1;
      --svg-text: #f8fafc;
      --svg-muted: #94a3b8;
      --svg-line: #475569;
      --svg-sulcus: rgba(248, 250, 252, 0.25);
      --svg-cartilage: #0ea5e9;
      --svg-synovium: #fb7185;
      --svg-effusion: #e11d48;
    }

    .svg-zone {
      cursor: pointer;
      transition: opacity 0.16s ease, filter 0.16s ease, stroke-width 0.16s ease;
    }
    .svg-zone:hover {
      filter: brightness(1.1);
      opacity: 0.96;
    }
    .svg-zone-active {
      stroke: var(--svg-text) !important;
      stroke-width: 2.6px !important;
      filter: drop-shadow(0 0 6px rgba(13, 148, 136, 0.55));
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .recall-blurred {
      filter: blur(6px);
      opacity: 0.6;
      user-select: none;
      cursor: pointer;
      transition: filter 0.2s ease, opacity 0.2s ease;
    }
    .recall-blurred:hover { opacity: 0.85; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased transition-colors duration-200 selection:bg-teal-200 dark:selection:bg-teal-800">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Sticky Header Shell -->
  <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <!-- Top Bar -->
    <div class="max-w-6xl mx-auto px-3 sm:px-4 py-2.5 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0 cursor-pointer" onclick="selectModule('dashboard')">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-teal-500 to-indigo-600 text-white font-extrabold text-sm flex items-center justify-center shadow-xs shrink-0">
          Y3
        </div>
        <div class="min-w-0">
          <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-slate-900 dark:text-white truncate">
            MChiro Year 3 Hub
          </h1>
          <div class="flex items-center gap-2 text-[11px] font-semibold text-slate-500 dark:text-slate-400">
            <span id="header-due-text" class="truncate">Due Today: 0</span>
          </div>
        </div>
      </div>

      <!-- Global Controls -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <!-- Quick 5-Minute Mix Launcher -->
        <button
          type="button"
          onclick="openQuickMix()"
          class="px-2.5 sm:px-3 py-2 rounded-xl text-[11px] sm:text-xs font-bold bg-gradient-to-r from-indigo-600 to-teal-600 hover:opacity-95 text-white shadow-xs transition flex items-center gap-1"
          title="5-question interleaved warm-up across Neuro, MSK & Red Flags"
        >
          <span>⚡</span>
          <span class="hidden sm:inline">5-Min Mix</span>
          <span class="sm:hidden">Mix</span>
        </button>

        <!-- Study Due Only Toggle (Leitner Spaced Repetition) -->
        <button
          id="due-only-btn"
          type="button"
          onclick="toggleDueOnly()"
          class="px-2.5 sm:px-3 py-2 rounded-xl text-[11px] sm:text-xs font-bold border transition flex items-center gap-1.5"
          title="Filter cards to show only items Due Today"
        >
          <span id="due-only-dot" class="w-2 h-2 rounded-full"></span>
          <span>Due</span>
          <span id="due-count-badge" class="px-1.5 py-0.5 rounded-md text-[10px] font-extrabold">0</span>
        </button>

        <!-- Global Active Recall Blur -->
        <button
          id="global-blur-btn"
          type="button"
          onclick="toggleGlobalBlur()"
          class="px-2.5 py-2 rounded-xl text-[11px] sm:text-xs font-bold border transition flex items-center gap-1"
          title="Blur answers to test active recall"
        >
          <span class="hidden md:inline">Blur:</span>
          <span id="global-blur-label">OFF</span>
        </button>

        <!-- Light/Dark Theme Toggle -->
        <button
          type="button"
          onclick="toggleTheme()"
          aria-label="Toggle Light or Dark Mode"
          id="theme-toggle-btn"
          class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-amber-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
        ></button>
      </div>
    </div>

    <!-- Dashboard + All 7 Year 3 Modules Navigation Bar -->
    <nav class="max-w-6xl mx-auto px-3 sm:px-4 pb-2.5 overflow-x-auto no-scrollbar" aria-label="Year 3 Modules">
      <div id="top-module-nav" class="flex items-center gap-1.5 min-w-max"></div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-3 sm:px-4 py-5 pb-16">
    <!-- Active Recall Banner -->
    <div id="global-blur-banner" class="hidden mb-4 px-4 py-2.5 rounded-2xl bg-indigo-50 dark:bg-indigo-950/50 border border-indigo-200 dark:border-indigo-800/70 text-xs sm:text-sm text-indigo-900 dark:text-indigo-200 flex items-center justify-between gap-3">
      <span><strong>Active Recall Blur ON:</strong> Tap any blurred answer to reveal it.</span>
      <button type="button" onclick="revealAllBlurred()" class="shrink-0 font-bold underline">Reveal All</button>
    </div>

    <!-- Study Due Only Banner -->
    <div id="due-only-banner" class="hidden mb-4 px-4 py-2.5 rounded-2xl bg-amber-50 dark:bg-amber-950/50 border border-amber-300 dark:border-amber-800/70 text-xs sm:text-sm text-amber-900 dark:text-amber-200 flex items-center justify-between gap-3">
      <span><strong>Study Due Only ON:</strong> Showing only Flashcards, Brain Lesions &amp; MSK cards due for review today.</span>
      <button type="button" onclick="toggleDueOnly()" class="shrink-0 font-bold underline">Show All</button>
    </div>

    <!-- Dynamic Root -->
    <div id="app-root"></div>
  </main>

  <!-- Quick 5-Minute Mix Modal -->
  <div id="mix-modal" class="hidden fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4">
    <div id="mix-modal-content" class="w-full max-w-xl rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden max-h-[90vh] flex flex-col"></div>
  </div>

    const CN_DETAILS = {
      I: { id: 'I', name: 'Olfactory', type: 'Sensory', landmark: 'Nasal Bridge', tests: 'History of anosmia / hyposmia (not routinely tested at bedside).', pearl: 'Rule out nasal obstruction vs. cribriform plate trauma or frontal mass.' },
      II: { id: 'II', name: 'Optic', type: 'Sensory', landmark: 'Eyes & Visual Fields', tests: 'Visual acuity (Snellen/small print), confrontation fields (4 quadrants), visual neglect, afferent pupillary light reflex, refer out for ophthalmoscopy.', pearl: 'Papilloedema suggests weeks of raised intracranial pressure (ICP).' },
      III: { id: 'III', name: 'Oculomotor', type: 'Motor + Para', landmark: 'Eyelids, Pupils & Extraocular "H"', tests: 'Ptosis, pupil size (meiosis/mydriasis/anisocoria) & border, direct/consensual light reflex, accommodation, saccades (U/D/L/R), convergence, smooth pursuit ("H"), VOR.', pearl: 'CN III palsy: ptosis + "down & out" eye + dilated fixed pupil.' },

    // --- Spaced Repetition Helpers ---
    function isCardDue(id) {
      const rec = state.sr[id];
      if (!rec) return true; // Unseen cards are due today
      return Date.now() >= rec.dueAt;
    }

    function setLeitner(id, box) {
      const DAY = 86400000;
      const offset = box === 'again' ? 0 : box === 'shaky' ? 2 * DAY : 7 * DAY;
      state.sr[id] = { box, dueAt: Date.now() + offset };
      saveStore('mchiro_v4_sr', state.sr);
      updateHeaderDueUI();
      const labels = { again: 'Queued for Today', shaky: 'Scheduled in 2 Days', solid: 'Scheduled in 7 Days' };
      showToast(labels[box], box === 'solid' ? 'success' : box === 'shaky' ? 'info' : 'warn');
      renderApp();
    }

    function getDueStats() {
      const total = ALL_TRACKABLE_IDS.length;
      const due = ALL_TRACKABLE_IDS.filter((id) => isCardDue(id)).length;
      const solid = ALL_TRACKABLE_IDS.filter((id) => state.sr[id] && state.sr[id].box === 'solid' && !isCardDue(id)).length;
      const shaky = ALL_TRACKABLE_IDS.filter((id) => state.sr[id] && state.sr[id].box === 'shaky' && !isCardDue(id)).length;
      return { total, due, solid, shaky };
    }

      const container = document.getElementById('toast-container');

        success: 'bg-emerald-600 text-white',
        warn: 'bg-amber-600 text-white',

      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-semibold transition-all duration-300 ${palette[type] || palette.info}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 2200);
    }

    function copyTextSafe(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Copied strict marking prompt to clipboard!', 'success');
      } catch (e) {
        showToast('Could not copy automatically — please select and copy.', 'warn');
      }
    }

    // =========================================================================
    // 9. QUICK 5-MINUTE MIX MODAL LOGIC
    // =========================================================================
    function openQuickMix() {
      const pool = [...MIX_QUESTIONS].sort(() => Math.random() - 0.5).slice(0, 5);
      state.mixQuestions = pool;
      state.mixIdx = 0;
      state.mixScore = 0;
      state.mixSelected = null;
      state.mixFinished = false;
      state.mixOpen = true;
      document.getElementById('mix-modal').classList.remove('hidden');
      renderQuickMixModal();
    }

    function closeQuickMix() {
      state.mixOpen = false;
      document.getElementById('mix-modal').classList.add('hidden');
    }

    function answerMix(optIdx) {
      if (state.mixSelected !== null) return;
      state.mixSelected = optIdx;
      if (optIdx === state.mixQuestions[state.mixIdx].ans) state.mixScore++;
      renderQuickMixModal();
    }

    function nextMixQ() {
      if (state.mixIdx + 1 >= state.mixQuestions.length) {
        state.mixFinished = true;
      } else {
        state.mixIdx++;
        state.mixSelected = null;
      }
      renderQuickMixModal();
    }

    function renderQuickMixModal() {
      const box = document.getElementById('mix-modal-content');
      if (state.mixFinished) {
        const pct = Math.round((state.mixScore / state.mixQuestions.length) * 100);
        box.innerHTML = `
          <div class="p-6 text-center space-y-4">
            <span class="inline-block px-3 py-1 rounded-xl text-xs font-extrabold uppercase bg-teal-100 dark:bg-teal-950 text-teal-700 dark:text-teal-300">Warm-Up Complete</span>
            <h3 class="text-3xl font-extrabold text-slate-900 dark:text-white">${state.mixScore} / ${state.mixQuestions.length} (${pct}%)</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400">
              ${pct >= 80 ? 'Sharp clinical switching! Ready for deeper revision.' : 'Solid warm-up — consider drilling any missed topics in Neuro or MSK.'}
            </p>
            <div class="flex justify-center gap-2 pt-2">
              <button type="button" onclick="openQuickMix()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold">Play Another 5</button>
              <button type="button" onclick="closeQuickMix()" class="px-5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-bold">Close</button>
            </div>
          </div>
        `;
        return;
      }

      const q = state.mixQuestions[state.mixIdx];
      const answered = state.mixSelected !== null;

      box.innerHTML = `
        <div class="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="px-2.5 py-0.5 rounded-lg text-[11px] font-extrabold bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300">${q.cat}</span>
            <span class="text-xs font-bold text-slate-400">Question ${state.mixIdx + 1} of ${state.mixQuestions.length}</span>
          </div>
          <button type="button" onclick="closeQuickMix()" class="text-slate-400 hover:text-slate-700 dark:hover:text-white font-extrabold text-lg leading-none">&times;</button>
        </div>
        <div class="p-5 overflow-y-auto space-y-4">
          <p class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white leading-snug">${q.q}</p>
          <div class="space-y-2">
            ${q.opts.map((opt, idx) => {
              let cls = 'bg-slate-50 dark:bg-slate-800/70 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 hover:border-indigo-400';
              if (answered) {
                if (idx === q.ans) cls = 'bg-emerald-50 dark:bg-emerald-950/50 border-emerald-500 text-emerald-900 dark:text-emerald-200';
                else if (idx === state.mixSelected) cls = 'bg-rose-50 dark:bg-rose-950/50 border-rose-500 text-rose-900 dark:text-rose-200';
                else cls = 'opacity-50 bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-800';
              }
              return `
                <button type="button" onclick="answerMix(${idx})" class="w-full text-left px-4 py-3 rounded-xl border-2 text-xs sm:text-sm font-semibold transition ${cls}">
                  ${opt}
                </button>
              `;
            }).join('')}
          </div>
          ${answered ? `
            <div class="p-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800 text-xs sm:text-sm text-slate-700 dark:text-slate-200 leading-relaxed">
              <strong>Explanation:</strong> ${q.exp}

            <div class="flex justify-end">
              <button type="button" onclick="nextMixQ()" class="px-5 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold">
                ${state.mixIdx + 1 >= state.mixQuestions.length ? 'See Score &rarr;' : 'Next Question &rarr;'}
              </button>
            </div>
          ` : ''}
        </div>
      `;
    }

        if (zoneId === state.limbQuizTarget) {
          state.limbQuizScore++;

        } else {
          state.limbQuizFeedback = { ok: false, msg: `You tapped ${data[zoneId].label}. Try again or tap Next.` };
        }
      }
      renderApp();

    // --- 10C. BRAIN LESIONS & LOCALISE THE LESION GAME ---
    function handleBrainRegionTap(regionId) {
      if (state.lesionMode === 'game') {
        const curCase = LESION_CASES[state.gameIdx];
        if (!state.gameAnswered) {
          const correct = regionId === curCase.target;
          if (correct) state.gameScore++;
          state.gameAnswered = { correct, tapped: regionId };
          renderApp();
        }
      } else {
        state.selectedBrainRegion = state.selectedBrainRegion === regionId ? 'all' : regionId;
        renderApp();
      }
    }

    function renderBrainLesionsTab() {
      const isGame = state.lesionMode === 'game';

        const matchQ = !q || item.term.toLowerCase().includes(q) || item.definition.toLowerCase().includes(q) || item.site.toLowerCase().includes(q);
        return matchReg && matchQ;

              <path onclick="handleBrainRegionTap('occipital')" class="${rCls('occipital')}" d="M 310,96 C 334,124 334,168 304,186 L 258,176 L 260,136 Z" fill="#ec4899" fill-opacity="0.8" stroke="var(--svg-skin-stroke)" stroke-width="1.5" />

              <text x="296" y="148" text-anchor="middle" fill="#fff" font-size="9.5" font-weight="800" pointer-events="none">Occip.</text>

            </svg>
            ${!isGame ? `

          <div class="lg:col-span-7 space-y-3">

    // --- 10D. 15-MIN OSCE SIMULATOR WITH 'SAY IT ALOUD' MARK-SCHEME MODE ---
    function formatTime(secs) {
      return `${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`;
    }

    function toggleOsceTimer() {
      if (state.osceRunning) {
        clearInterval(osceIntervalId);
        state.osceRunning = false;
      } else {
        state.osceRunning = true;
        osceIntervalId = setInterval(() => {
          if (state.osceRemaining > 0) {
            state.osceRemaining--;
            const el = document.getElementById('osce-clock');
            if (el) el.textContent = formatTime(state.osceRemaining);
          } else {
            clearInterval(osceIntervalId);
            state.osceRunning = false;
            showToast('Time up! Station finished.', 'warn');
            renderApp();
          }
        }, 1000);
      }
      renderApp();
    }

    function setOsceDuration(secs) {
      clearInterval(osceIntervalId);
      state.osceRunning = false;
      state.osceDuration = secs;
      state.osceRemaining = secs;
      renderApp();
    }

    function drawRandomOsce() {
      const pool = OSCE_PROMPTS.filter((p) => state.osceCat === 'All' || p.cat === state.osceCat);
      if (!pool.length) return;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      state.oscePromptIdx = OSCE_PROMPTS.findIndex((p) => p.id === pick.id);
      state.osceTickedPoints = {};
      renderApp();
    }

    function renderOsceTab() {
      const prompt = OSCE_PROMPTS[state.oscePromptIdx] || OSCE_PROMPTS[0];
      const cats = ['All', 'SMR & Peripheral', 'Cranial Nerves', 'Cerebral & Gait', 'Motor & Sensory', 'Special Tests'];
      const tickedCount = prompt.markPoints.filter((_, i) => state.osceTickedPoints[i]).length;

      return `
        <div class="max-w-3xl mx-auto space-y-4">
          <!-- Timer Bar -->
          <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 sm:p-5 flex flex-wrap items-center justify-between gap-4">
            <div>
              <span class="text-[10px] font-extrabold uppercase text-teal-600 dark:text-teal-400">OSCE Countdown</span>
              <div id="osce-clock" class="text-3xl sm:text-4xl font-extrabold tabular-nums text-slate-900 dark:text-white">${formatTime(state.osceRemaining)}</div>
              <div class="mt-1.5 flex gap-1.5">
                <button type="button" onclick="setOsceDuration(900)" class="px-2.5 py-1 rounded-lg text-[11px] font-bold ${state.osceDuration===900?'bg-teal-600 text-white':'bg-slate-100 dark:bg-slate-800'}">15:00 Full</button>
                <button type="button" onclick="setOsceDuration(60)" class="px-2.5 py-1 rounded-lg text-[11px] font-bold ${state.osceDuration===60?'bg-indigo-600 text-white':'bg-slate-100 dark:bg-slate-800'}">01:00 Rapid</button>
              </div>
            </div>
            <div class="flex flex-col items-end gap-2">
              <div class="flex gap-2">
                <button type="button" onclick="toggleOsceTimer()" class="px-4 py-2 rounded-xl text-xs font-bold text-white ${state.osceRunning ? 'bg-amber-600' : 'bg-teal-600'}">${state.osceRunning ? 'Pause' : 'Start'}</button>
                <button type="button" onclick="setOsceDuration(state.osceDuration)" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800">Reset</button>
              </div>
              <span class="text-xs font-bold text-slate-500">Tally: <span class="text-emerald-600">${state.oscePassCount} Pass</span> &bull; <span class="text-rose-600">${state.osceDrillCount} Drill</span></span>
            </div>
          </div>

          <!-- Category & Randomiser -->
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap gap-1.5">
              ${cats.map((c) => `<button type="button" onclick="state.osceCat='${c}'; drawRandomOsce();" class="px-2.5 py-1.5 rounded-lg text-xs font-bold ${state.osceCat===c ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900' : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800'}">${c}</button>`).join('')}
            </div>
            <button type="button" onclick="drawRandomOsce()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">🎲 Random Prompt</button>
          </div>

          <!-- Examiner Prompt & 'Say It Aloud' Mark Scheme -->

      return `

    function runPreFlightScan(modId) {
      const text = (state.scannerDrafts[modId] || '').trim();
      const target = state.auditorWordTarget[modId] || 2500;
      const words = text ? text.split(/\s+/).filter(Boolean) : [];
      const wordCount = words.length;
      const minW = Math.round(target * 0.9);
      const maxW = Math.round(target * 1.1);

      // First-person detector (I, me, my, we, our, us, myself)
      const fpMatches = text.match(/\b(I|me|my|mine|myself|we|us|our|ours|ourselves)\b/gi) || [];

      // Direct quotes missing page numbers (p. or pp.)
      const quoteRegex = /["“]([^"”]{12,})["”]([^.?!\n]{0,45})/g;
      let missingPageQuotes = [];
      let m;
      while ((m = quoteRegex.exec(text)) !== null) {
        const trailing = m[2] || '';
        if (!/\bp\.?\s*\d+|\bpp\.?\s*\d+/i.test(trailing)) {
          missingPageQuotes.push(m[1].slice(0, 55) + (m[1].length > 55 ? '…' : ''));
        }
      }

      // In-text citation density (matches Harvard style e.g. (Smith, 2022) or (Smith & Jones, 2021))
      const citeMatches = text.match(/\([A-Z][A-Za-z\-&.,\s]+?\d{4}[a-z]?(?:,\s*p{1,2}\.?\s*\d+(?:[-–]\d+)?)?\)/g) || [];
      const citeCount = citeMatches.length;
      const densityPer250 = wordCount > 0 ? ((citeCount / wordCount) * 250).toFixed(1) : '0.0';

      state.scannerResults[modId] = {
        wordCount, minW, maxW,
        inWindow: wordCount >= minW && wordCount <= maxW,
        fpCount: fpMatches.length,
        fpSample: [...new Set(fpMatches.map((w) => w.toLowerCase()))].slice(0, 6),
        missingPageQuotes,
        citeCount,
        densityPer250,
      };
      renderApp();
    }

    function copyStrictMarkingPrompt(modId) {
      const cfg = AUDITOR_CONFIGS[modId];
      const weights = cfg.rubricBands.map((b) => `- ${b.area} (${b.weight}): 70%+ requires "${b.excellent}"`).join('\n');
      const prompt = `Please mark my ${cfg.title} draft STRICTLY against the official McTimoney College marking criteria below. Do NOT inflate the grade—be candid, highlight where description needs to become critical evaluation, check for first-person voice, check Harvard referencing (including page numbers on direct quotes), and give a realistic band-by-band breakdown:\n\n${weights}\n\n[PASTE ESSAY DRAFT BELOW]`;
      copyTextSafe(prompt);
    }

    function renderAuditorModule(modId) {
      const cfg = AUDITOR_CONFIGS[modId];
      const modChecks = state.auditorChecks[modId] || {};
      const targetWords = state.auditorWordTarget[modId] || 2500;
      const scan = state.scannerResults[modId];

      const sections = [
        { id: 'voice', title: '1. Voice & Presentation', items: AUDITOR_COMMON_CHECKS.voice },
        { id: 'depth', title: '2. Critical Evaluation & Rubric Depth', items: cfg.depthChecks },
        { id: 'ref', title: '3. Referencing & Literature Density', items: AUDITOR_COMMON_CHECKS.referencing },
        { id: 'conc', title: '4. Conclusion Integrity', items: AUDITOR_COMMON_CHECKS.conclusion },
      ];

      const total = sections.reduce((s, sec) => s + sec.items.length, 0);
      const done = sections.reduce((s, sec) => s + sec.items.filter((_, idx) => modChecks[`${sec.id}_${idx}`]).length, 0);
      const pct = total ? Math.round((done / total) * 100) : 0;

      return `
        <div class="max-w-4xl mx-auto space-y-5">
          <!-- Header & Prompt Copier -->
          <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-lg font-extrabold text-slate-900 dark:text-white">${cfg.title}</h2>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${cfg.subtitle}</p>
            </div>
            <div class="flex flex-wrap gap-2 shrink-0">
              <button type="button" onclick="copyStrictMarkingPrompt('${modId}')" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-xs">
                📋 Copy Strict Marking Prompt
              </button>
              <button type="button" onclick="state.auditorShowRubric=!state.auditorShowRubric; renderApp();" class="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold">
                ${state.auditorShowRubric ? 'Hide Rubric' : 'View Rubric'}
              </button>
            </div>
          </div>

          <!-- 100% Client-Side Pre-Flight Essay Scanner -->
          <div class="rounded-3xl bg-white dark:bg-slate-900 border-2 border-indigo-200 dark:border-indigo-900/70 p-5 space-y-3.5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold uppercase bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300">100% Private &bull; Runs Locally in Browser</span>
                <h3 class="text-base font-extrabold text-slate-900 dark:text-white mt-1">Pre-Flight Essay Scanner</h3>
              </div>
              <div class="flex items-center gap-2 text-xs">
                <label class="font-bold text-slate-500">Target Words:</label>
                <input type="number" min="100" step="100" value="${targetWords}" oninput="state.auditorWordTarget['${modId}']=parseInt(this.value,10)||2500; saveStore('mchiro_v4_word_target',state.auditorWordTarget);" class="w-24 px-2.5 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-extrabold text-slate-900 dark:text-white" />
              </div>
            </div>

            <textarea
              rows="5"
              placeholder="Paste your essay draft here to scan word count (±10%), first-person words (I, me, my, we, our), direct quotes missing page numbers, and citation density..."
              oninput="state.scannerDrafts['${modId}']=this.value"
              class="w-full p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >${state.scannerDrafts[modId] || ''}</textarea>

            <div class="flex items-center justify-between gap-2">
              <span class="text-[11px] text-slate-400">Your text never leaves your device.</span>
              <button type="button" onclick="runPreFlightScan('${modId}')" class="px-5 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold">
                🔍 Run Pre-Flight Scan
              </button>
            </div>

            ${scan ? `
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 pt-2">
                <div class="p-3 rounded-2xl border ${scan.inWindow ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-300 dark:border-emerald-800' : 'bg-rose-50 dark:bg-rose-950/30 border-rose-300 dark:border-rose-800'}">
                  <span class="block text-[10px] font-extrabold uppercase text-slate-500">Word Count (±10%)</span>
                  <span class="text-lg font-extrabold ${scan.inWindow ? 'text-emerald-700 dark:text-emerald-300' : 'text-rose-700 dark:text-rose-300'}">${scan.wordCount.toLocaleString()}</span>
                  <span class="block text-[10px] text-slate-500">Window: ${scan.minW.toLocaleString()}–${scan.maxW.toLocaleString()}</span>
                </div>
                <div class="p-3 rounded-2xl border ${scan.fpCount === 0 ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-300 dark:border-emerald-800' : 'bg-amber-50 dark:bg-amber-950/30 border-amber-300 dark:border-amber-800'}">
                  <span class="block text-[10px] font-extrabold uppercase text-slate-500">1st-Person Words</span>
                  <span class="text-lg font-extrabold ${scan.fpCount === 0 ? 'text-emerald-700 dark:text-emerald-300' : 'text-amber-700 dark:text-amber-300'}">${scan.fpCount}</span>
                  <span class="block text-[10px] text-slate-500 truncate">${scan.fpCount ? scan.fpSample.join(', ') : 'Clean third-person ✓'}</span>
                </div>
                <div class="p-3 rounded-2xl border ${scan.missingPageQuotes.length === 0 ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-300 dark:border-emerald-800' : 'bg-rose-50 dark:bg-rose-950/30 border-rose-300 dark:border-rose-800'}">
                  <span class="block text-[10px] font-extrabold uppercase text-slate-500">Quotes Missing p.</span>
                  <span class="text-lg font-extrabold ${scan.missingPageQuotes.length === 0 ? 'text-emerald-700 dark:text-emerald-300' : 'text-rose-700 dark:text-rose-300'}">${scan.missingPageQuotes.length}</span>
                  <span class="block text-[10px] text-slate-500">${scan.missingPageQuotes.length ? 'Add p./pp. to quotes' : 'All quotes ok ✓'}</span>
                </div>
                <div class="p-3 rounded-2xl border bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700">
                  <span class="block text-[10px] font-extrabold uppercase text-slate-500">Citation Density</span>
                  <span class="text-lg font-extrabold text-indigo-700 dark:text-indigo-300">${scan.densityPer250}</span>
                  <span class="block text-[10px] text-slate-500">per 250 words (${scan.citeCount} total)</span>
                </div>
              </div>
              ${scan.missingPageQuotes.length ? `
                <div class="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 text-xs text-rose-800 dark:text-rose-200 space-y-1">
                  <strong>Quotes flagged for missing page numbers:</strong>
                  ${scan.missingPageQuotes.slice(0, 3).map((q) => `<p class="italic">“${q}”</p>`).join('')}
                </div>
              ` : ''}
            ` : ''}
          </div>

          <!-- Collapsible Rubric Table -->
          ${state.auditorShowRubric ? `
            <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-x-auto">
              <table class="w-full text-left border-collapse min-w-[540px] text-xs">
                <thead>
                  <tr class="border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/70">
                    <th class="p-3 font-extrabold">Weight</th>
                    <th class="p-3 font-extrabold">Criterion</th>
                    <th class="p-3 font-extrabold text-sky-700 dark:text-sky-300">60–69%</th>
                    <th class="p-3 font-extrabold text-emerald-700 dark:text-emerald-300">70%+ (First)</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
                  ${cfg.rubricBands.map((r) => `
                    <tr>
                      <td class="p-3 font-extrabold text-indigo-600">${r.weight}</td>
                      <td class="p-3 font-bold">${r.area}</td>
                      <td class="p-3 text-slate-600 dark:text-slate-300">${r.good}</td>
                      <td class="p-3 font-medium bg-emerald-50/40 dark:bg-emerald-950/20">${r.excellent}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          ` : ''}

          <!-- Checklist Progress & Sections -->
          <div class="space-y-3">
            <div class="flex items-center justify-between text-xs font-bold px-1">
              <span>Pre-Submission Rubric Checklist: ${done}/${total} (${pct}%)</span>
              <button type="button" onclick="state.auditorChecks['${modId}']={}; saveStore('mchiro_v4_auditor_checks',state.auditorChecks); renderApp();" class="underline text-slate-500">Reset Checklist</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${sections.map((sec) => `
                <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden">
                  <div class="px-4 py-2.5 bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800 font-extrabold text-xs">${sec.title}</div>
                  <div class="divide-y divide-slate-100 dark:divide-slate-800/70">
                    ${sec.items.map((txt, idx) => {
                      const k = `${sec.id}_${idx}`;
                      const chk = !!modChecks[k];
                      return `
                        <label class="flex items-start gap-3 px-4 py-2.5 cursor-pointer">
                          <input type="checkbox" ${chk ? 'checked' : ''} onchange="if(!state.auditorChecks['${modId}'])state.auditorChecks['${modId}']={}; state.auditorChecks['${modId}']['${k}']=!state.auditorChecks['${modId}']['${k}']; saveStore('mchiro_v4_auditor_checks',state.auditorChecks); renderApp();" class="mt-0.5 w-4 h-4 accent-indigo-600 rounded shrink-0" />
                          <span class="text-xs leading-snug ${chk ? 'line-through text-slate-400' : 'text-slate-700 dark:text-slate-200'}">${txt}</span>
                        </label>
                      `;
                    }).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 13. PLACEHOLDER MODULES
    // =========================================================================
    function renderPlaceholderModule(mod) {
      return `
        <div class="max-w-xl mx-auto mt-4 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 text-center space-y-4">
          <span class="inline-block px-3 py-1 rounded-xl text-xs font-bold uppercase bg-slate-100 dark:bg-slate-800 text-slate-500">Ready for Year 3 (Late Jan 2027)</span>
          <h2 class="text-2xl font-extrabold text-slate-900 dark:text-white">${mod.name}</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400">Navigation tab ready for your Year 3 handbooks, lecture diagrams, and active recall drills.</p>
          <div class="flex flex-wrap justify-center gap-2">
            ${(mod.topics || []).map((t) => `<span class="px-3 py-1 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold">${t}</span>`).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 14. INITIALISE
    // =========================================================================
    initTheme();
    updateGlobalBlurUI();
    updateHeaderDueUI();
    renderTopNav();
    renderApp();
  </script>
</body>
</html>
