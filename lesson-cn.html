<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lesson 3: Cranial Nerves (I–XII) &amp; Eye/Face Lab – MChiro Year 3 Hub</title>

  <style>
    /* =========================================================================
       1. DESIGN TOKENS & THEME VARIABLES (LIGHT / DARK SYNCED: mchiro_theme)
       Zero external CDNs — pure system font stack for instant mobile loading.
       ========================================================================= */
    :root {
      --bg-page: #F2F2F7;
      --bg-card: #FFFFFF;
      --bg-subtle: #EAEAF0;
      --bg-header: rgba(255, 255, 255, 0.94);
      --border-card: #D8DEE9;
      --border-strong: #CBD5E1;
      --text-main: #0F172A;
      --text-muted: #475569;

      /* Semantic Cognitive Colour-Coding (High-Contrast Pairs) */
      --sem-blue: #1D4ED8;
      --sem-blue-dark: #1E40AF;
      --sem-blue-soft: #EFF6FF;
      --sem-blue-border: #93C5FD;

      --sem-emerald: #059669;
      --sem-emerald-dark: #065F46;
      --sem-emerald-soft: #ECFDF5;
      --sem-emerald-border: #6EE7B7;

      --sem-purple: #7C3AED;
      --sem-purple-dark: #5B21B6;
      --sem-purple-soft: #F5F3FF;
      --sem-purple-border: #C4B5FD;

      --sem-coral: #DC2626;
      --sem-coral-dark: #991B1B;
      --sem-coral-soft: #FEF2F2;
      --sem-coral-border: #FCA5A5;

      --sem-amber: #D97706;
      --sem-amber-dark: #92400E;
      --sem-amber-soft: #FFFBEB;
      --sem-amber-border: #FCD34D;

      /* SVG Anatomical Tokens */
      --svg-bg: #F8FAFC;
      --svg-skin: #ECEFF4;
      --svg-quiz-fill: #E2E8F0;
      --svg-quiz-hover: #CBD5E1;
      --svg-outline: #1E293B;
      --svg-focus-stroke: #0F172A;
      --svg-landmark: rgba(30, 41, 59, 0.55);
      --svg-divider: #475569;
      --svg-iris: #0284C7;
      --svg-c2c3: #CBD5E1;

      --drawer-correct-bg: #ECFDF5;
      --drawer-wrong-bg: #FEF2F2;
      --shadow-card: 0 2px 12px rgba(15, 23, 42, 0.06);
    }

    .dark {
      --bg-page: #0B1120;
      --bg-card: #131D33;
      --bg-subtle: #1E293B;
      --bg-header: rgba(11, 17, 32, 0.94);
      --border-card: #2B3B59;
      --border-strong: #475569;
      --text-main: #F8FAFC;
      --text-muted: #CBD5E1;

      --sem-blue: #38BDF8;
      --sem-blue-dark: #0284C7;
      --sem-blue-soft: #102542;
      --sem-blue-border: #38BDF8;

      --sem-emerald: #10B981;
      --sem-emerald-dark: #047857;
      --sem-emerald-soft: #0A2E25;
      --sem-emerald-border: #34D399;

      --sem-purple: #A78BFA;
      --sem-purple-dark: #6D28D9;
      --sem-purple-soft: #221740;
      --sem-purple-border: #A78BFA;

      --sem-coral: #F87171;
      --sem-coral-dark: #B91C1C;
      --sem-coral-soft: #36131A;
      --sem-coral-border: #F87171;

      --sem-amber: #FBBF24;
      --sem-amber-dark: #B45309;
      --sem-amber-soft: #33220A;
      --sem-amber-border: #FBBF24;

      --svg-bg: #0F172A;
      --svg-skin: #24324A;
      --svg-quiz-fill: #24344D;
      --svg-quiz-hover: #33486B;
      --svg-outline: #E2E8F0;
      --svg-focus-stroke: #FFFFFF;
      --svg-landmark: rgba(226, 232, 240, 0.55);
      --svg-divider: #94A3B8;
      --svg-iris: #38BDF8;
      --svg-c2c3: #334155;

      --drawer-correct-bg: #08291F;
      --drawer-wrong-bg: #2F1016;
      --shadow-card: 0 4px 18px rgba(0, 0, 0, 0.45);
    }

    /* =========================================================================
       2. BASE RESET & SYSTEM TYPOGRAPHY
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    h1, h2, h3, h4, p { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: -0.02em;
    }

    /* CRITICAL SVG LEGIBILITY GUARDRAIL:
       Never allow SVG text to inherit thick focus/highlight strokes from parent groups. */
    svg text {
      stroke: none !important;
      paint-order: fill;
    }

    /* =========================================================================
       3. STICKY TOP BAR & DUOLINGO ANIMATED PROGRESS BAR
       ========================================================================= */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-header);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-card);
    }

    .header-inner {
      max-width: 680px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-links {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 36px;
      padding: 6px 10px;
      border-radius: 11px;
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 800;
      transition: background-color 0.15s ease;
    }
    .nav-pill:hover { background: var(--border-card); }

    .mode-switch {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border-radius: 12px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      min-height: 30px;
      padding: 4px 11px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .mode-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .xp-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 36px;
      padding: 6px 10px;
      border-radius: 11px;
      background: var(--sem-amber-soft);
      border: 1.5px solid var(--sem-amber-border);
      color: var(--sem-amber-dark);
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .dark .xp-pill { color: #FCD34D; }

    .theme-btn {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      border: 1px solid var(--border-card);
      background: var(--bg-subtle);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .theme-btn:hover { background: var(--border-card); }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-row.hidden { display: none; }

    .progress-track {
      flex: 1;
      height: 14px;
      border-radius: 999px;
      background: var(--bg-subtle);
      padding: 2px;
      overflow: hidden;
    }

    .progress-fill {
      position: relative;
      height: 100%;
      border-radius: 999px;
      background: #10B981;
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.25s ease;
      overflow: hidden;
    }
    .progress-fill.replay { background: #F59E0B; }
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 6px;
      right: 6px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
    }

    .progress-label {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* =========================================================================
       4. MAIN LAYOUT, CARDS, PILLS & HIGH-CONTRAST SEMANTIC BOXES
       ========================================================================= */
    .app-main {
      flex: 1;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 14px 164px;
    }

    .stack { display: flex; flex-direction: column; gap: 14px; }
    .stack-sm { display: flex; flex-direction: column; gap: 10px; }

    .card {
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: 22px;
      box-shadow: var(--shadow-card);
    }

    .svg-card { padding: 12px; }

    .info-card {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg-card);
      color: var(--text-main);
    }

    .flex-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-blue { background: var(--sem-blue-soft); color: var(--sem-blue-dark); border: 1.5px solid var(--sem-blue-border); }
    .dark .badge-blue { color: #7DD3FC; }
    .badge-emerald { background: var(--sem-emerald-soft); color: var(--sem-emerald-dark); border: 1.5px solid var(--sem-emerald-border); }
    .dark .badge-emerald { color: #6EE7B7; }
    .badge-purple { background: var(--sem-purple-soft); color: var(--sem-purple-dark); border: 1.5px solid var(--sem-purple-border); }
    .dark .badge-purple { color: #DDD6FE; }
    .badge-coral { background: var(--sem-coral-soft); color: var(--sem-coral-dark); border: 1.5px solid var(--sem-coral-border); }
    .dark .badge-coral { color: #FECACA; }
    .badge-amber { background: var(--sem-amber-soft); color: var(--sem-amber-dark); border: 1.5px solid var(--sem-amber-border); }
    .dark .badge-amber { color: #FDE68A; }

    .step-title {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-top: 8px;
      color: var(--text-main);
    }

    .step-prompt {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.38;
      letter-spacing: -0.015em;
      margin-top: 8px;
      color: var(--text-main);
    }

    .step-sub {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Pill Grids (>= 44px touch targets) */
    .pill-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .pill-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .zone-pill {
      flex: 1;
      min-width: 56px;
      min-height: 44px;
      padding: 8px 10px;
      border-radius: 13px;
      border: 2px solid var(--border-card);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.14s ease;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .zone-pill:hover { border-color: var(--sem-blue); }
    .zone-pill.active {
      background: #1D4ED8;
      border-color: #1D4ED8;
      color: #FFFFFF;
    }
    .zone-pill.active-coral {
      background: #DC2626;
      border-color: #DC2626;
      color: #FFFFFF;
    }

    .reset-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 36px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .reset-pill:hover:not(:disabled) {
      border-color: var(--sem-blue);
      color: var(--sem-blue);
    }
    .reset-pill:disabled {
      opacity: 0.45;
      cursor: default;
    }

    /* High-Contrast Semantic Info Boxes */
    .sem-box {
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      color: var(--text-main);
      border: 1.5px solid transparent;
    }
    .sem-box-label {
      display: block;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .sem-blue { background: var(--sem-blue-soft); border-color: var(--sem-blue-border); }
    .sem-blue .sem-box-label { color: var(--sem-blue-dark); }
    .dark .sem-blue .sem-box-label { color: #7DD3FC; }

    .sem-emerald { background: var(--sem-emerald-soft); border-color: var(--sem-emerald-border); }
    .sem-emerald .sem-box-label { color: var(--sem-emerald-dark); }
    .dark .sem-emerald .sem-box-label { color: #6EE7B7; }

    .sem-purple { background: var(--sem-purple-soft); border-color: var(--sem-purple-border); }
    .sem-purple .sem-box-label { color: var(--sem-purple-dark); }
    .dark .sem-purple .sem-box-label { color: #DDD6FE; }

    .sem-amber { background: var(--sem-amber-soft); border-color: var(--sem-amber-border); }
    .sem-amber .sem-box-label { color: var(--sem-amber-dark); }
    .dark .sem-amber .sem-box-label { color: #FDE68A; }

    .sem-coral { background: var(--sem-coral-soft); border-color: var(--sem-coral-border); }
    .sem-coral .sem-box-label { color: var(--sem-coral-dark); }
    .dark .sem-coral .sem-box-label { color: #FECACA; }

    /* =========================================================================
       5. TACTILE 3D DUOLINGO BUTTONS & MULTIPLE-CHOICE CARDS
       ========================================================================= */
    .btn-3d {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      padding: 13px 18px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, opacity 0.15s ease;
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px !important;
    }
    .btn-3d:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-emerald {
      background: #10B981;
      color: #FFFFFF;
      border: 2px solid #10B981;
      border-bottom: 4px solid #047857;
    }
    .btn-emerald:hover:not(:disabled) { filter: brightness(1.05); }

    .btn-blue {
      background: #1D4ED8;
      color: #FFFFFF;
      border: 2px solid #1D4ED8;
      border-bottom: 4px solid #1E3A8A;
    }
    .btn-blue:hover:not(:disabled) { filter: brightness(1.06); }

    .btn-coral {
      background: #DC2626;
      color: #FFFFFF;
      border: 2px solid #DC2626;
      border-bottom: 4px solid #991B1B;
    }
    .btn-coral:hover:not(:disabled) { filter: brightness(1.05); }

    .btn-neutral {
      background: var(--bg-card);
      color: var(--text-main);
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-strong);
    }
    .btn-neutral:hover:not(:disabled) { background: var(--bg-subtle); }

    .choice-card {
      width: 100%;
      min-height: 54px;
      padding: 13px 14px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-strong);
      color: var(--text-main);
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .choice-card:hover:not(:disabled) {
      border-color: var(--sem-blue);
      background: var(--sem-blue-soft);
    }
    .choice-card:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
    .choice-card:disabled { cursor: default; }

    .choice-letter {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-card);
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .choice-text {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
    }

    .choice-selected {
      border-color: #1D4ED8 !important;
      border-bottom-color: #1E3A8A !important;
      background: var(--sem-blue-soft) !important;
    }
    .choice-selected .choice-letter {
      background: #1D4ED8;
      border-color: #1D4ED8;
      color: #FFFFFF;
    }

    .choice-correct {
      border-color: #10B981 !important;
      border-bottom-color: #047857 !important;
      background: var(--sem-emerald-soft) !important;
    }
    .choice-correct .choice-letter {
      background: #10B981;
      border-color: #10B981;
      color: #FFFFFF;
    }

    .choice-wrong {
      border-color: #DC2626 !important;
      border-bottom-color: #991B1B !important;
      background: var(--sem-coral-soft) !important;
    }
    .choice-wrong .choice-letter {
      background: #DC2626;
      border-color: #DC2626;
      color: #FFFFFF;
    }

    /* =========================================================================
       6. INTERACTIVE SVG SPOTLIGHT / FADE-OTHERS & CN VII CARD ISOLATION
       ========================================================================= */
    .anatomy-svg {
      display: block;
      width: 100%;
      max-width: 450px;
      height: auto;
      margin: 0 auto;
      user-select: none;
    }

    .cn-zone {
      cursor: pointer;
      transition: opacity 0.22s ease, filter 0.22s ease, fill 0.18s ease, stroke-width 0.18s ease;
    }
    .cn-zone:hover {
      filter: brightness(1.06);
    }

    .zone-label {
      transition: opacity 0.22s ease;
    }

    .cn-zone-quiz {
      fill: var(--svg-quiz-fill);
    }
    .cn-zone-quiz:hover {
      fill: var(--svg-quiz-hover);
    }

    /* SPOTLIGHT / FADE-OTHERS FOR CN V & H-TEST */
    .anatomy-svg.has-selection .cn-zone:not(.is-active):not(.is-correct):not(.is-wrong) {
      opacity: 0.18;
      filter: saturate(0.25);
    }
    .anatomy-svg.has-selection .zone-label:not(.is-active) {
      opacity: 0.28;
    }

    .cn-zone.is-active {
      opacity: 1 !important;
      stroke: var(--svg-focus-stroke);
      stroke-width: 2.3px;
      filter: drop-shadow(0 0 8px rgba(15, 23, 42, 0.25));
    }
    .dark .cn-zone.is-active {
      filter: drop-shadow(0 0 10px rgba(248, 250, 252, 0.34));
    }

    .cn-zone.is-quiz-selected {
      fill: #1D4ED8 !important;
      fill-opacity: 0.9 !important;
    }

    .cn-zone.is-correct {
      opacity: 1 !important;
      fill: #059669 !important;
      fill-opacity: 0.94 !important;
      stroke: var(--svg-focus-stroke);
      stroke-width: 2.3px;
      animation: pulseGreen 0.65s ease-in-out 2;
    }

    .cn-zone.is-wrong {
      opacity: 1 !important;
      fill: #DC2626 !important;
      fill-opacity: 0.9 !important;
      stroke: var(--svg-focus-stroke);
      stroke-width: 2px;
    }

    /* DEDICATED CN VII CARD ISOLATION (NO STROKE ON <g> SO TEXT STAYS 100% CRISP) */
    .cn7-card-group {
      cursor: pointer;
      transition: opacity 0.22s ease, transform 0.18s ease;
    }
    .cn7-card-group.is-faded {
      opacity: 0.28;
    }
    .cn7-card-group.is-selected {
      opacity: 1;
    }

    /* Smooth moving pupils for H-Test SVG B */
    .eye-gaze-group {
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes pulseGreen {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(5, 150, 105, 0)); }
      50% { filter: drop-shadow(0 0 12px rgba(5, 150, 105, 0.95)); }
    }

    /* =========================================================================
       7. FIXED BOTTOM ACTION / FEEDBACK DRAWER & EXPLORE LAB ACCORDIONS
       ========================================================================= */
    .bottom-drawer-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      pointer-events: none;
    }

    .drawer-bar {
      pointer-events: auto;
      background: var(--bg-header);
      backdrop-filter: blur(14px);

      gap: 10px;
    }

      padding: 14px;

      border: 2px solid transparent;
    }
    .stat-val {
      display: block;
      font-size: 24px;
      font-weight: 800;
      margin-top: 2px;
    }

    .confetti-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .confetti-piece {
      position: absolute;
      top: -12px;
      width: 9px;
      height: 13px;
      border-radius: 3px;
      animation: confettiFall linear forwards;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.7; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes stepIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .step-enter { animation: stepIn 0.2s ease-out forwards; }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(440px) rotate(540deg); opacity: 0; }
    }

      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? (saved === 'dark' || saved === '"dark"') : prefersDark;
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      try { localStorage.setItem('mchiro_theme', isDark ? 'dark' : 'light'); } catch (e) {}
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) btn.textContent = isDark ? '☀️' : '🌙';
    }

    function toggleTheme() {
      applyTheme(!document.documentElement.classList.contains('dark'));
    }

            <path d="M 107,82 Q 118,77 130,82 M 107,90 Q 118,85 130,90" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" />

            <!-- Eyes: Both Close Tightly / Normally -->
            <path d="M 71,110 Q 82,103 93,110" fill="none" stroke="var(--svg-outline)" stroke-width="2.3" stroke-linecap="round" />
            <path d="M 109,110 Q 120,103 131,110" fill="none" stroke="var(--svg-outline)" stroke-width="2.3" stroke-linecap="round" />

            <!-- Nose & Intact Left Nasolabial Fold vs Flattened Right Fold -->

            <path d="M 86,133 Q 78,142 76,152" fill="none" stroke="var(--svg-outline)" stroke-width="1.5" stroke-linecap="round" />
            <path d="M 116,135 Q 123,143 125,152" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="2.5 2.5" stroke-linecap="round" />

            <!-- Contralateral Drooping Mouth Corner -->
            <path d="M 79,152 Q 101,149 116,154 Q 124,158 128,166" fill="none" stroke="#DC2626" stroke-width="2.8" stroke-linecap="round" />

            <!-- Bottom High-Contrast Solid Pills (100% Legible in Light & Dark Mode) -->
            <rect x="24" y="190" width="154" height="25" rx="9" fill="#065F46" />
            <text x="101" y="206.5" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="800">✓ FOREHEAD SPARED</text>

            <rect x="24" y="222" width="154" height="26" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" />
            <text x="101" y="238.5" text-anchor="middle" fill="#0F172A" font-size="9.5" font-weight="800">Lower Contralateral Droop</text>
          </g>

          <!-- ==================== RIGHT CARD: LMN LESION (BELL'S PALSY) ==================== -->
          <g ${tap('lmn')} class="${cardGroupClass('lmn')}">
            <!-- Outer Card Frame (Highlight ring sits ONLY here) -->
            <rect x="200" y="12" width="178" height="248" rx="18" fill="var(--bg-card)" stroke="${lFrame.color}" stroke-width="${lFrame.width}" />

            <!-- Top Title Pill (Solid Deep Crimson #991B1B + Crisp White Text) -->
            <rect x="212" y="22" width="154" height="26" rx="10" fill="${isQuiz ? '#334155' : '#991B1B'}" />
            <text x="289" y="39" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="800">${isQuiz ? 'CASE B' : "LMN (Bell's Palsy)"}</text>

            <!-- Sculpted Anterior Face -->
            <path d="M 289,62 C 320,62 338,86 338,118 C 338,152 318,178 289,178 C 260,178 240,152 240,118 C 240,86 258,62 289,62 Z" fill="var(--svg-skin)" stroke="var(--svg-outline)" stroke-width="2" />

            <!-- Entire Affected Ipsilateral Half Tint (No raw text placed directly on top!) -->
            <path d="M 289,62 C 320,62 338,86 338,118 C 338,152 318,178 289,178 Z" fill="#EF4444" fill-opacity="0.22" />

            <!-- Healthy Side Wrinkles Only (Affected Forehead Smooth) -->
            <path d="M 260,82 Q 272,77 283,82 M 260,90 Q 272,85 283,90" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" />

            <ellipse cx="310" cy="110" rx="11" ry="6.5" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.2" />
            <circle cx="310" cy="110" r="3.4" fill="#0F172A" />

            <!-- Nose & Flattened Affected Nasolabial Fold -->
            <path d="M 289,112 L 289,132 M 282,134 Q 289,138 296,134" fill="none" stroke="var(--svg-outline)" stroke-width="1.6" stroke-linecap="round" />
            <path d="M 274,133 Q 266,142 264,152" fill="none" stroke="var(--svg-outline)" stroke-width="1.5" stroke-linecap="round" />
            <path d="M 304,135 Q 311,143 313,152" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="2.5 2.5" stroke-linecap="round" />

            <!-- Ipsilateral Drooping Mouth Corner -->
            <path d="M 267,152 Q 289,149 304,154 Q 312,158 316,167" fill="none" stroke="#DC2626" stroke-width="2.8" stroke-linecap="round" />

            <!-- Bottom High-Contrast Solid Pills (100% Legible in Light & Dark Mode) -->
            <rect x="212" y="190" width="154" height="25" rx="9" fill="#991B1B" />
            <text x="289" y="206.5" text-anchor="middle" fill="#FFFFFF" font-size="9.6" font-weight="800">✕ FULL IPSILATERAL FACE</text>

            <rect x="212" y="222" width="154" height="26" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" />
            <text x="289" y="238.5" text-anchor="middle" fill="#0F172A" font-size="9.2" font-weight="800">Smooth Brow • Open Eye • Droop</text>
          </g>
        </svg>
      `;
    }

    // =========================================================================
    // 6. INTERACTION HANDLERS (SPOTLIGHT, QUIZ & AUTOMATIC MISTAKE LOOP)
    // =========================================================================
    function setAppMode(mode) {
      state.appMode = mode;
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function inspectCn5(zId) {
      if (state.appMode === 'explore') {
        state.exploreCn5 = state.exploreCn5 === zId ? null : zId;
      } else {
        state.teachCn5 = state.teachCn5 === zId ? null : zId;
      }
      renderAll();
    }

    function inspectEyeTarget(tId) {
      if (state.appMode === 'explore') {
        state.exploreEyes = state.exploreEyes === tId ? null : tId;
      } else {
        state.teachEyes = state.teachEyes === tId ? null : tId;
      }
      renderAll();
    }

    function inspectCn7(side) {
      if (state.appMode === 'explore') {
        state.exploreCn7 = state.exploreCn7 === side ? null : side;
      } else {
        state.teachCn7 = state.teachCn7 === side ? null : side;
      }
      renderAll();
    }

    function toggleDeckCard(cnId) {
      state.openDeckIds[cnId] = !state.openDeckIds[cnId];
      renderAll();
    }

    function selectQuizZone(zId) {
      if (state.checked) return;
      state.selectedAnswer = state.selectedAnswer === zId ? null : zId;
      renderAll();
    }

    function selectChoice(optId) {
      if (state.checked) return;
      state.selectedAnswer = optId;
      renderAll();
    }

    function awardStepXp(stepId) {
      if (!state.earnedStepXp[stepId]) {
        state.earnedStepXp[stepId] = true;
        state.xp += 10; // 14 steps × 10 XP = +140 XP
      }
    }

    function checkAnswer() {
      const step = getCurrentStep();
      if (!state.selectedAnswer || state.checked) return;

      const correctVal = step.type === 'choice' ? step.correct : step.target;
      const isRight = state.selectedAnswer === correctVal;

      state.checked = true;
      state.isCorrect = isRight;

      if (!state.inMistakeReplay && !state.seenQuizSteps[step.id]) {
        state.seenQuizSteps[step.id] = true;
        state.firstTryTotal++;
        if (isRight) state.firstTryCorrect++;
      }

      if (isRight) {
        awardStepXp(step.id);
      } else {
        state.hadMistakes = true;
        const origIdx = LESSON_STEPS.findIndex((s) => s.id === step.id);
        if (!state.inMistakeReplay) {
          if (!state.mistakeQueue.includes(origIdx)) state.mistakeQueue.push(origIdx);
        } else {
          state.mistakeQueue.push(origIdx);
        }
      }

      renderAll();
    }

    function finishLesson() {
      state.completed = true;
      state.xp = 140;
      saveLessonCompletion();
    }

    function continueLesson() {
      const step = getCurrentStep();
      if (step && step.type.startsWith('teach_')) {
        awardStepXp(step.id);
      }

      state.selectedAnswer = null;
      state.checked = false;
      state.isCorrect = false;

      if (!state.inMistakeReplay) {
        if (state.stepIdx + 1 < LESSON_STEPS.length) {
          state.stepIdx++;
        } else if (state.mistakeQueue.length > 0) {
          state.inMistakeReplay = true;
          state.mistakeCursor = 0;
        } else {
          finishLesson();
        }
      } else {
        if (state.mistakeCursor + 1 < state.mistakeQueue.length) {
          state.mistakeCursor++;
        } else {
          finishLesson();
        }
      }

      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function replayLesson() {
      state.appMode = 'lesson';
      state.stepIdx = 0;
      state.inMistakeReplay = false;
      state.mistakeQueue = [];
      state.mistakeCursor = 0;
      state.hadMistakes = false;
      state.completed = false;
      state.selectedAnswer = null;
      state.checked = false;
      state.isCorrect = false;
      state.teachEyes = 'so';
      state.teachCn5 = 'V3';
      state.teachCn7 = 'lmn';
      state.xp = 0;
      state.earnedStepXp = {};
      state.firstTryTotal = 0;
      state.firstTryCorrect = 0;
      state.seenQuizSteps = {};
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // 7. RENDER HEADER & ROUTER
    // =========================================================================
    function renderHeader() {
      document.getElementById('mode-btn-lesson').classList.toggle('active', state.appMode === 'lesson');
      document.getElementById('mode-btn-explore').classList.toggle('active', state.appMode === 'explore');
      document.getElementById('xp-value').textContent = `${state.xp} XP`;

      const row = document.getElementById('progress-row');
      const fill = document.getElementById('progress-fill');
      const lbl = document.getElementById('progress-label');

      if (state.appMode === 'explore') {
        row.classList.add('hidden');
        return;
      }
      row.classList.remove('hidden');

      if (state.completed) {
        fill.style.width = '100%';
        fill.classList.remove('replay');
        lbl.textContent = '14 / 14';
      } else if (state.inMistakeReplay) {
        const remaining = state.mistakeQueue.length - state.mistakeCursor;
        const pct = Math.max(15, Math.round((state.mistakeCursor / state.mistakeQueue.length) * 100));
        fill.style.width = `${pct}%`;
        fill.classList.add('replay');
        lbl.textContent = `🔁 ${remaining} left`;
      } else {
        const pct = Math.max(7, Math.round(((state.stepIdx + (state.checked && state.isCorrect ? 1 : 0)) / LESSON_STEPS.length) * 100));
        fill.style.width = `${pct}%`;
        fill.classList.remove('replay');
        lbl.textContent = `${state.stepIdx + 1} / ${LESSON_STEPS.length}`;
      }
    }

    function renderAll() {
      renderHeader();
      const main = document.getElementById('app-main');
      const drawer = document.getElementById('bottom-drawer');

      if (state.appMode === 'explore') {
        main.innerHTML = renderExploreLab();
        drawer.innerHTML = '';
        return;
      }

      if (state.completed) {
        main.innerHTML = renderCelebrationScreen();
        drawer.innerHTML = '';
        spawnConfetti();
        return;
      }

      const step = getCurrentStep();
      main.innerHTML = renderLessonStep(step);
      drawer.innerHTML = renderBottomDrawer(step);
    }

    // =========================================================================
    // 8. RENDER 14 GUIDED LESSON STEPS
    // =========================================================================
    function renderLessonStep(step) {
      const mistakeBanner = state.inMistakeReplay
        ? `<div style="margin-bottom:8px;"><span class="step-badge badge-amber">🔁 Mistake Review</span></div>`
        : '';

      // STEP 1: CN I & CN II Teach
      if (step.type === 'teach_cn12') {
        return `
          <div class="stack step-enter">
            <div>
              <span class="step-badge badge-blue">${step.badge}</span>
              <h2 class="step-title">${step.title}</h2>
              <p class="step-sub">${step.subtitle}</p>
            </div>

            <article class="card info-card">
              <div class="flex-between">
                <span class="step-badge badge-blue mono">CN I • Olfactory</span>
                <span style="font-size:12px;font-weight:700;color:var(--text-muted);">Purely Sensory</span>
              </div>
              <div class="sem-box sem-blue">
                <span class="sem-box-label">Bedside Approach</span>
                <p><strong>Not routinely tested</strong> — explain only and ask patient about any history of <strong>anosmia</strong> (loss of smell).</p>
              </div>
            </article>

            <article class="card info-card">
              <div class="flex-between">
                <span class="step-badge badge-blue mono">CN II • Optic</span>
                <span style="font-size:12px;font-weight:700;color:var(--text-muted);">Vision &amp; Afferent Light</span>
              </div>
              <div class="sem-box sem-blue">
                <span class="sem-box-label">5 Core Exam Elements</span>
                <p><strong>1.</strong> Visual acuity (Snellen / small print) &bull; <strong>2.</strong> Visual fields (4-quadrant confrontation) &bull; <strong>3.</strong> Visual neglect test &bull; <strong>4.</strong> Afferent pupillary light reflex &bull; <strong>5.</strong> Refer out for ophthalmoscopy.</p>
              </div>
              <div class="sem-box sem-coral">
                <span class="sem-box-label">⚠️ Assessor Traps (Say Both Aloud!)</span>
                <p><strong>Visual Neglect</strong> = Posterior Parietal Cortex (Right Parietal) lesion.<br><strong>Ophthalmoscopy Referral</strong> = checks for <strong>papilloedema</strong> (suggestive of <em>weeks</em> of raised ICP).</p>
              </div>
            </article>
          </div>
        `;
      }

      // STEP 3: CN III, IV, VI Eye Trio Teach (SVG B)
      if (step.type === 'teach_eyes') {
        const cur = state.teachEyes ? HTEST_DATA[state.teachEyes] : null;
        return `
          <div class="stack step-enter">
            <div>
              <span class="step-badge badge-emerald">${step.badge}</span>
              <h2 class="step-title">${step.title}</h2>
              <p class="step-sub">${step.subtitle}</p>
            </div>

            <div class="card svg-card">
              ${buildHTestSVG('explore', state.teachEyes, null)}
            </div>

            ${cur ? `
              <article class="card info-card">
                <div class="flex-between">
                  <span class="step-badge ${cur.badgeCls}">${cur.nerve}</span>
                  <span style="font-size:12px;font-weight:700;color:var(--text-muted);">${cur.short}</span>
                </div>
                <div class="sem-box sem-emerald">
                  <span class="sem-box-label">Muscle &amp; Action</span>
                  <p><strong>${cur.muscle}</strong> — ${cur.action}</p>
                </div>
                <div class="sem-box sem-purple">
                  <span class="sem-box-label">Full Eye Trio Checklist</span>
                  <p>Ptosis, pupil size (miosis/mydriasis/anisocoria) &amp; border, direct &amp; consensual light (CN II → CN III), accommodation, saccades (U/D/L/R), convergence, smooth pursuit ("H"), and VOR.</p>
                </div>
                <div class="sem-box sem-coral">
                  <span class="sem-box-label">⚠️ Clinical Pearl / Red Flag</span>
                  <p>${cur.trap}</p>
                </div>
              </article>
            ` : `
              <div class="card info-card"><p class="hint-text">Tap any H-Test direction or the central Pupil badge above to spotlight it.</p></div>
            `}
          </div>
        `;
      }

      // STEP 6: CN V Trigeminal Teach (SVG A)
      if (step.type === 'teach_cn5') {
        const z = state.teachCn5 ? CNV_DATA[state.teachCn5] : null;
        return `
          <div class="stack step-enter">
            <div>
              <span class="step-badge badge-blue">${step.badge}</span>
              <h2 class="step-title">${step.title}</h2>
              <p class="step-sub">${step.subtitle}</p>
            </div>

            <div class="pill-grid-3">
              ${['V1', 'V2', 'V3'].map((k) => `
                <button type="button" class="zone-pill mono ${state.teachCn5 === k ? 'active' : ''}" onclick="inspectCn5('${k}')">${k}</button>
              `).join('')}
            </div>

            <div class="card svg-card">
              ${buildFaceCn5SVG('explore', state.teachCn5, null)}

            ${z ? `
              <article class="card info-card">
                <div class="flex-between">
                  <span class="step-badge ${z.badgeCls}">${z.name}</span>

      // STEP 9: CN VII Facial Nerve Teach (SVG C — High-Contrast Fixed)
      if (step.type === 'teach_cn7') {
        const cur = state.teachCn7 ? CN7_DATA[state.teachCn7] : null;
        return `
          <div class="stack step-enter">

      if (step.type === 'teach_cn8') {

              <span class="step-badge badge-purple">${step.badge}</span>

            <div class="pill-grid-2">

                <span class="step-badge badge-amber">Conductive Loss</span>
                <p style="font-size:13.5px;"><strong>Weber’s:</strong> Lateralises to <strong>AFFECTED</strong> ear (less room-noise masking).</p>
                <p style="font-size:13.5px;"><strong>Rinne’s:</strong> <strong>NEGATIVE (BC &gt; AC)</strong> on affected side.</p>
              </article>

              <article class="card info-card" style="border-color:var(--sem-blue-border);">
                <span class="step-badge badge-blue">Sensorineural Loss</span>
                <p style="font-size:13.5px;"><strong>Weber’s:</strong> Lateralises to <strong>GOOD (healthy)</strong> ear.</p>
                <p style="font-size:13.5px;"><strong>Rinne’s:</strong> <strong>POSITIVE (AC &gt; BC)</strong> bilaterally (both reduced on bad side).</p>
              </article>
            </div>

            <article class="card info-card">
              <div class="sem-box sem-purple">
                <span class="sem-box-label">Full CN VIII OSCE Sequence</span>
                <p><strong>1.</strong> Whisper hearing screen &rarr; <strong>2.</strong> 512 Hz Weber’s (midline forehead) &rarr; <strong>3.</strong> 512 Hz Rinne’s (mastoid vs. ear canal) &rarr; <strong>4.</strong> Vestibular balance.</p>
              </div>
              <div class="sem-box sem-coral">
                <span class="sem-box-label">⚠️ Assessor Omission Trap</span>
                <p><strong>Don’t forget Balance!</strong> Explicitly tell the examiner that CN VIII also controls vestibular balance (tested in stance &amp; gait / Romberg’s).</p>
              </div>
            </article>
          </div>
        `;
      }

      // STEP 13: Lower Bulbar Four Teach (CN IX, X, XI, XII)
      if (step.type === 'teach_bulbar') {
        return `
          <div class="stack step-enter">
            <div>
              <span class="step-badge badge-emerald">${step.badge}</span>
              <h2 class="step-title">${step.title}</h2>
              <p class="step-sub">${step.subtitle}</p>
            </div>

            <article class="card info-card">
              <div class="sem-box sem-purple">
                <span class="sem-box-label">CN IX (Glossopharyngeal) &amp; CN X (Vagus)</span>
                <p>Tested together: Swallowing (dysphagia), speech (dysphonia), symmetrical palatal lift &amp; uvula ("Ahh"), gag reflex if indicated, autonomic effects.<br><strong>Rule:</strong> Uvula deviates <strong>AWAY</strong> from the lesion side!</p>
              </div>

              <div class="sem-box sem-emerald">
                <span class="sem-box-label">CN XI (Accessory) — UMN vs. LMN</span>
                <p><strong>Sternocleidomastoid (SCM)</strong> turns the chin to the <strong>OPPOSITE</strong> side (Right SCM turns head Left) + <strong>Upper Trapezius</strong> shoulder shrug.</p>
              </div>

              <div class="sem-box sem-coral">
                <span class="sem-box-label">CN XII (Hypoglossal) — "Licks the Lesion"</span>
                <p>Observe tongue at rest for <strong>atrophy &amp; fasciculations</strong>, protrude tongue, test resisted tongue strength.<br><strong>Rule:</strong> In an LMN lesion, the tongue deviates <strong>TOWARD</strong> the weak lesion side!</p>
              </div>
            </article>
          </div>
        `;
      }

      // TAP-THE-SVG QUIZ STEPS (SVG A, SVG B, SVG C)
      if (step.type === 'quiz_eyes' || step.type === 'quiz_cn5' || step.type === 'quiz_cn7') {
        const fb = {
          selected: state.selectedAnswer,
          correctTarget: step.target,
          checked: state.checked,
          isCorrect: state.isCorrect,
        };
        let svgHtml = '';
        if (step.type === 'quiz_eyes') svgHtml = buildHTestSVG('quiz', null, fb);
        else if (step.type === 'quiz_cn5') svgHtml = buildFaceCn5SVG('quiz', null, fb);
        else svgHtml = buildCn7CompareSVG('quiz', null, fb);

        return `
          <div class="stack step-enter">
            <div>
              ${mistakeBanner}
              <span class="step-badge badge-emerald">${step.badge}</span>
              <h2 class="step-prompt">${step.prompt}</h2>
            </div>

            <div class="card svg-card">${svgHtml}</div>

            <p class="hint-text">
              ${state.selectedAnswer && !state.checked
                ? 'Selection spotlighted — tap <strong>CHECK</strong> below to confirm!'
                : !state.checked
                  ? 'Tap directly on the diagram above.'
                  : ''}
            </p>
          </div>
        `;
      }

      // MULTIPLE-CHOICE QUIZ STEPS
      if (step.type === 'choice') {
        return `
          <div class="stack step-enter">
            <div>
              ${mistakeBanner}
              <span class="step-badge ${step.isTrap ? 'badge-coral' : 'badge-blue'}">${step.badge}</span>
              <h2 class="step-prompt">${step.prompt}</h2>
            </div>

            <div class="stack-sm">
              ${step.options.map((opt, idx) => {
                const letter = ['A', 'B', 'C', 'D'][idx];
                let cls = '';
                if (state.checked) {
                  if (opt.id === step.correct) cls = 'choice-correct';
                  else if (opt.id === state.selectedAnswer && !state.isCorrect) cls = 'choice-wrong';
                } else if (state.selectedAnswer === opt.id) {
                  cls = 'choice-selected';
                }
                return `
                  <button type="button" ${state.checked ? 'disabled' : ''} class="choice-card ${cls}" onclick="selectChoice('${opt.id}')">
                    <span class="choice-letter">${letter}</span>
                    <span class="choice-text">${opt.text}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      return '';
    }

    function renderCn7InfoCard(cur) {
      return `
        <article class="card info-card">
          <div class="flex-between">
            <h3 style="font-size:16px;font-weight:800;color:var(--text-main);">${cur.title}</h3>
            <span class="step-badge ${cur.badgeCls}">${cur.badge}</span>
          </div>
          <div class="sem-box sem-emerald">
            <span class="sem-box-label">Facial Pattern &amp; Mechanism</span>
            <p><strong>${cur.pattern}</strong> ${cur.mechanism}</p>
          </div>
          <div class="sem-box sem-blue">
            <span class="sem-box-label">Muscles of Facial Expression (Name Aloud)</span>
            <p>${cur.muscles}</p>
          </div>
          <div class="sem-box sem-amber">
            <span class="sem-box-label">💡 Non-Motor Functions (Taste, Salivation, Hyperacusis &amp; Ear)</span>
            <p>${cur.nonMotor}</p>
          </div>
          <div class="sem-box sem-coral">
            <span class="sem-box-label">⚠️ Assessor Trap</span>
            <p><strong>${cur.trap}</strong></p>
          </div>
        </article>
      `;
    }

    // =========================================================================
    // 9. FIXED BOTTOM ACTION / FEEDBACK DRAWER
    // =========================================================================
    function renderBottomDrawer(step) {
      if (step.type.startsWith('teach_')) {
        return `
          <div class="drawer-bar">
            <div class="drawer-inner">
              <button type="button" class="btn-3d btn-emerald" onclick="continueLesson()">CONTINUE</button>
            </div>
          </div>
        `;
      }

      if (!state.checked) {
        return `
          <div class="drawer-bar">
            <div class="drawer-inner">
              <button type="button" class="btn-3d btn-blue" ${state.selectedAnswer ? '' : 'disabled'} onclick="checkAnswer()">CHECK</button>
            </div>
          </div>
        `;
      }

      if (state.isCorrect) {
        return `
          <div class="drawer-feedback correct">
            <div class="drawer-inner">
              <div class="fb-row">
                <span class="fb-icon correct">✓</span>
                <div>
                  <p class="fb-title correct">Spot on! +10 XP</p>
                  <p class="fb-msg">${step.correctMsg}</p>
                </div>
              </div>
              <button type="button" class="btn-3d btn-emerald" onclick="continueLesson()">CONTINUE</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="drawer-feedback wrong">
          <div class="drawer-inner">
            <div class="fb-row">
              <span class="fb-icon wrong">✕</span>
              <div>
                <p class="fb-title wrong">Watch the Trap! (Queued for Mistake Review)</p>
                <p class="fb-msg">${step.wrongMsg}</p>
              </div>
            </div>
            <button type="button" class="btn-3d btn-coral" onclick="continueLesson()">CONTINUE</button>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 10. FREE EXPLORE ANATOMY LAB (3 TABS)
    // =========================================================================
    function renderExploreLab() {
      return `
        <div class="stack step-enter">
          <div class="sub-seg-3" role="tablist" aria-label="Explore Lab Tabs">
            <button type="button" class="sub-seg-btn ${state.exploreSub === 'cn5' ? 'active' : ''}" onclick="state.exploreSub='cn5'; renderAll();">1. CN V Face</button>
            <button type="button" class="sub-seg-btn ${state.exploreSub === 'eyes_cn7' ? 'active' : ''}" onclick="state.exploreSub='eyes_cn7'; renderAll();">2. Eyes &amp; CN VII</button>
            <button type="button" class="sub-seg-btn ${state.exploreSub === 'deck' ? 'active' : ''}" onclick="state.exploreSub='deck'; renderAll();">3. CN I–XII Deck</button>
          </div>

          ${state.exploreSub === 'cn5' ? renderExploreCn5() : ''}
          ${state.exploreSub === 'eyes_cn7' ? renderExploreEyesCn7() : ''}
          ${state.exploreSub === 'deck' ? renderExploreDeck() : ''}
        </div>
      `;
    }

    function renderExploreCn5() {
      const z = state.exploreCn5 ? CNV_DATA[state.exploreCn5] : null;
      return `
        <div class="stack">
          <div class="flex-between">
            <div>
              <span class="step-badge badge-blue">SVG A &bull; Trigeminal Lab</span>
              <h2 class="step-title">CN V Face Map (V1 / V2 / V3)</h2>
            </div>
            <button type="button" class="reset-pill" ${state.exploreCn5 ? '' : 'disabled'} onclick="state.exploreCn5=null; renderAll();">
              <span>👁️</span>
              <span>Show All Zones</span>
            </button>
          </div>

          <div class="card svg-card">
            ${buildFaceCn5SVG('explore', state.exploreCn5, null)}
          </div>

          <div class="pill-grid-3">
            ${['V1', 'V2', 'V3'].map((k) => `
              <button type="button" class="zone-pill mono ${state.exploreCn5 === k ? 'active' : ''}" onclick="inspectCn5('${k}')">${k}</button>
            `).join('')}
          </div>

          ${z ? `
            <article class="card info-card">
              <div class="flex-between">
                <span class="step-badge ${z.badgeCls}">${z.name}</span>
                <span style="font-size:11.5px;font-weight:700;color:var(--text-muted);">Tap zone again to un-isolate</span>
              </div>
              <div class="sem-box sem-blue">
                <span class="sem-box-label">Sensory</span>
                <p>${z.sensory}</p>
              </div>
              <div class="sem-box sem-emerald">
                <span class="sem-box-label">Motor</span>
                <p><strong>${z.motor}</strong></p>
              </div>
              <div class="sem-box sem-purple">
                <span class="sem-box-label">Reflex</span>
                <p>${z.reflex}</p>
              </div>
              <div class="sem-box sem-amber">
                <span class="sem-box-label">💡 Visual Analogy</span>
                <p>${z.analogy}</p>
              </div>
              <div class="sem-box sem-coral">
                <span class="sem-box-label">⚠️ Assessor Trap</span>
                <p><strong>${z.trap}</strong></p>
              </div>
            </article>
          ` : `
            <article class="card info-card" style="text-align:center;">
              <p style="font-size:14.5px;font-weight:800;">Showing All Trigeminal Divisions</p>
              <p class="hint-text">Tap V1, V2, or V3 on the face above to spotlight it and inspect sensory, motor &amp; reflex notes.</p>
            </article>
          `}
        </div>
      `;
    }

    function renderExploreEyesCn7() {
      const eye = state.exploreEyes ? HTEST_DATA[state.exploreEyes] : null;
      const cn7 = state.exploreCn7 ? CN7_DATA[state.exploreCn7] : null;

      return `
        <div class="stack">
          <!-- SVG B: H-Test Eye Lab -->
          <div class="flex-between">
            <div>
              <span class="step-badge badge-emerald">SVG B &bull; Extraocular Lab</span>
              <h2 class="step-title">H-Test &amp; Pupil Reflex</h2>
            </div>
            <button type="button" class="reset-pill" ${state.exploreEyes ? '' : 'disabled'} onclick="state.exploreEyes=null; renderAll();">
              <span>👁️</span>
              <span>Show All Zones</span>
            </button>
          </div>

          <div class="card svg-card">
            ${buildHTestSVG('explore', state.exploreEyes, null)}
          </div>

          ${eye ? `
            <article class="card info-card">
              <div class="flex-between">
                <span class="step-badge ${eye.badgeCls}">${eye.nerve}</span>
                <span style="font-size:12px;font-weight:700;color:var(--text-muted);">${eye.short}</span>
              </div>
              <div class="sem-box sem-emerald">
                <span class="sem-box-label">Muscle &amp; Action</span>
                <p><strong>${eye.muscle}</strong> — ${eye.action}</p>
              </div>
              <div class="sem-box sem-blue">
                <span class="sem-box-label">Clinical Detail</span>
                <p>${eye.detail}</p>
              </div>
              <div class="sem-box sem-coral">
                <span class="sem-box-label">⚠️ Assessor Trap</span>
                <p><strong>${eye.trap}</strong></p>
              </div>
            </article>
          ` : `
            <article class="card info-card" style="text-align:center;">
              <p class="hint-text">Tap any direction on the H-Test or the central Pupil badge to move both eyes &amp; spotlight the nerve.</p>
            </article>
          `}

          <!-- SVG C: CN VII UMN vs LMN -->
          <div class="flex-between" style="margin-top:8px;">
            <div>
              <span class="step-badge badge-coral">SVG C &bull; CN VII Comparison</span>
              <h2 class="step-title">Facial Nerve: UMN vs. LMN</h2>
            </div>
            <button type="button" class="reset-pill" ${state.exploreCn7 ? '' : 'disabled'} onclick="state.exploreCn7=null; renderAll();">
              <span>👁️</span>
              <span>Show Both</span>
            </button>
          </div>

          <div class="card svg-card">
            ${buildCn7CompareSVG('explore', state.exploreCn7, null)}
          </div>

          ${cn7 ? renderCn7InfoCard(cn7) : `
            <article class="card info-card" style="text-align:center;">
              <p class="hint-text">Tap either UMN or LMN face card above to spotlight it and inspect the clinical breakdown.</p>
            </article>
          `}
        </div>
      `;
    }

    function renderExploreDeck() {
      return `
        <div class="stack">
          <div class="flex-between">
            <div>
              <span class="step-badge badge-purple">All 12 Cranial Nerves</span>
              <h2 class="step-title">CN I–XII Quick Deck</h2>
              <p class="step-sub">Tap any cranial nerve card to expand exact McTimoney Year 3 tests &amp; assessor traps.</p>
            </div>
          </div>

          <div class="stack-sm">
            ${ALL_CN_DECK.map((cn) => {
              const isOpen = !!state.openDeckIds[cn.id];
              return `
                <article class="deck-card ${isOpen ? 'is-open' : ''}">
                  <button type="button" class="deck-trigger" onclick="toggleDeckCard('${cn.id}')">
                    <div style="display:flex;align-items:center;gap:10px;min-width:0;">
                      <span class="step-badge badge-blue mono" style="flex-shrink:0;">CN ${cn.id}</span>
                      <div style="min-width:0;">
                        <h3 style="font-size:15px;font-weight:800;color:var(--text-main);">${cn.name}</h3>
                        <p style="font-size:12px;color:var(--text-muted);">${cn.type}</p>
                      </div>
                    </div>
                    <span style="font-size:12px;font-weight:800;color:var(--text-muted);flex-shrink:0;">${isOpen ? '▲' : '▼'}</span>
                  </button>

                  ${isOpen ? `
                    <div class="deck-body">
                      <div class="sem-box sem-blue">
                        <span class="sem-box-label">Sensory / Afferent</span>
                        <p>${cn.sensory}</p>
                      </div>
                      <div class="sem-box sem-emerald">
                        <span class="sem-box-label">Motor / Muscles to Name</span>
                        <p><strong>${cn.motor}</strong></p>
                      </div>
                      <div class="sem-box sem-purple">
                        <span class="sem-box-label">McTimoney Year 3 Bedside Tests</span>
                        <p>${cn.tests}</p>
                      </div>
                      <div class="sem-box sem-amber">
                        <span class="sem-box-label">Abnormal Findings</span>
                        <p>${cn.abnormal}</p>
                      </div>
                      <div class="sem-box sem-coral">
                        <span class="sem-box-label">⚠️ Assessor Trap</span>
                        <p><strong>${cn.trap}</strong></p>
                      </div>
                    </div>
                  ` : ''}
                </article>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 11. CELEBRATION COMPLETION SCREEN (+140 XP & SAVED TO mchiro_lessons_v1)
    // =========================================================================
    function renderCelebrationScreen() {
      const acc = state.firstTryTotal > 0
        ? Math.round((state.firstTryCorrect / state.firstTryTotal) * 100)
        : 100;

      return `
        <div class="card celebration-card step-enter">
          <div id="confetti-layer" class="confetti-layer"></div>

          <div style="position:relative;z-index:2;" class="stack-sm">
            <div class="trophy-badge">🏆</div>
            <div><span class="step-badge badge-emerald">Lesson 3 Complete!</span></div>
            <h2 style="font-size:26px;font-weight:800;letter-spacing:-0.02em;">Cranial Nerves Mastered</h2>
            <p class="step-sub">Saved to your Revision Hub progress. You cleared CN I–XII, the H-Test extraocular lab, Trigeminal V1–V3, Facial UMN vs. LMN, Weber/Rinne, and Bulbar deviations.</p>
          </div>

          <div style="position:relative;z-index:2;" class="stat-grid">
            <div class="stat-box sem-amber">
              <span class="sem-box-label">XP Earned</span>
              <span class="stat-val" style="color:var(--sem-amber-dark);">+140 XP</span>
            </div>
            <div class="stat-box sem-emerald">
              <span class="sem-box-label">First-Try Accuracy</span>
              <span class="stat-val" style="color:var(--sem-emerald-dark);">${acc}%</span>
            </div>
          </div>

          <div style="position:relative;z-index:2;" class="sem-box sem-blue">
            <p style="font-weight:600;">
              ${state.hadMistakes
                ? '🔁 <strong>Mistake Mastery:</strong> You replayed and cleared every missed cranial nerve trap before finishing!'
                : '✨ <strong>Flawless Run:</strong> Zero mistakes — every cranial nerve trap cleared on the first try!'}
            </p>
          </div>

          <div style="position:relative;z-index:2;" class="stack-sm">
            <button type="button" class="btn-3d btn-emerald" onclick="setAppMode('explore')">🔬 OPEN EXPLORE LAB</button>
            <button type="button" class="btn-3d btn-blue" onclick="replayLesson()">↺ PRACTICE AGAIN</button>
            <div class="pill-grid-2">
              <a href="neuro.html" class="btn-3d btn-neutral" style="font-size:13.5px;">&larr; Neuro Hub</a>
              <a href="index.html" class="btn-3d btn-neutral" style="font-size:13.5px;">🏠 Home Hub</a>
            </div>
          </div>
        </div>
      `;
    }

    function spawnConfetti() {
      const layer = document.getElementById('confetti-layer');
      if (!layer) return;
      const colors = ['#10B981', '#1D4ED8', '#7C3AED', '#D97706', '#DC2626'];
      for (let i = 0; i < 36; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.backgroundColor = colors[i % colors.length];
        piece.style.animationDuration = `${1.5 + Math.random() * 1.4}s`;
        piece.style.animationDelay = `${Math.random() * 0.4}s`;
        layer.appendChild(piece);
      }
    }

    // =========================================================================
    // 12. INITIALISE
    // =========================================================================
    initTheme();
    renderAll();
  </script>
</body>
</html>
