<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lesson 3: Cranial Nerves (I–XII) &amp; Eye/Face Lab – MChiro Year 3 Hub</title>

  <style>
    /* =========================================================================
       1. DESIGN TOKENS & THEME VARIABLES (LIGHT / DARK SYNCED: mchiro_theme)
       Zero external CDNs — pure system font stack for instant mobile loading.
       ========================================================================= */
    :root {
      --bg-page: #F2F2F7;
      --bg-card: #FFFFFF;
      --bg-subtle: #EAEAF0;
      --bg-header: rgba(255, 255, 255, 0.92);
      --border-card: #E2E8F0;
      --border-strong: #CBD5E1;
      --text-main: #1C1C1E;
      --text-muted: #636366;

      /* Semantic Cognitive Colour-Coding */
      --sem-blue: #007AFF;
      --sem-blue-dark: #005BBF;
      --sem-blue-soft: rgba(0, 122, 255, 0.11);
      --sem-blue-border: rgba(0, 122, 255, 0.3);

      --sem-emerald: #10B981;
      --sem-emerald-dark: #047857;
      --sem-emerald-soft: rgba(16, 185, 129, 0.12);
      --sem-emerald-border: rgba(16, 185, 129, 0.34);

      --sem-purple: #8B5CF6;
      --sem-purple-dark: #6D28D9;
      --sem-purple-soft: rgba(139, 92, 246, 0.12);
      --sem-purple-border: rgba(139, 92, 246, 0.34);

      --sem-coral: #EF4444;
      --sem-coral-dark: #B91C1C;
      --sem-coral-soft: rgba(239, 68, 68, 0.11);
      --sem-coral-border: rgba(239, 68, 68, 0.35);

      --sem-amber: #F59E0B;
      --sem-amber-dark: #B45309;
      --sem-amber-soft: rgba(245, 158, 11, 0.14);
      --sem-amber-border: rgba(245, 158, 11, 0.38);

      /* SVG Anatomical Tokens */
      --svg-bg: #F8FAFC;
      --svg-skin: #ECEFF4;
      --svg-quiz-fill: #DFE7F2;
      --svg-quiz-hover: #CBD6E6;
      --svg-outline: #1E293B;
      --svg-focus-stroke: #0F172A;
      --svg-landmark: rgba(30, 41, 59, 0.5);
      --svg-divider: #475569;
      --svg-label-bg: #FFFFFF;
      --svg-label-text: #0F172A;
      --svg-iris: #007AFF;
      --svg-c2c3: #CBD5E1;

      --drawer-correct-bg: #ECFDF5;
      --drawer-wrong-bg: #FEF2F2;
      --shadow-card: 0 2px 12px rgba(15, 23, 42, 0.05);
    }

    .dark {
      --bg-page: #0B1120;
      --bg-card: #131D33;
      --bg-subtle: #1C2944;
      --bg-header: rgba(11, 17, 32, 0.94);
      --border-card: #263654;
      --border-strong: #374B70;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;

      --sem-blue: #38BDF8;
      --sem-blue-dark: #0284C7;
      --sem-blue-soft: rgba(56, 189, 248, 0.18);
      --sem-blue-border: rgba(56, 189, 248, 0.38);

      --sem-emerald-soft: rgba(16, 185, 129, 0.18);
      --sem-emerald-border: rgba(52, 211, 153, 0.38);

      --sem-purple-soft: rgba(139, 92, 246, 0.22);
      --sem-purple-border: rgba(167, 139, 250, 0.4);

      --sem-coral-soft: rgba(239, 68, 68, 0.2);
      --sem-coral-border: rgba(248, 113, 113, 0.42);

      --sem-amber-soft: rgba(245, 158, 11, 0.2);
      --sem-amber-border: rgba(251, 191, 36, 0.42);

      --svg-bg: #0F172A;
      --svg-skin: #1E293B;
      --svg-quiz-fill: #23324D;
      --svg-quiz-hover: #304569;
      --svg-outline: #E2E8F0;
      --svg-focus-stroke: #FFFFFF;
      --svg-landmark: rgba(226, 232, 240, 0.5);
      --svg-divider: #94A3B8;
      --svg-label-bg: #0F172A;
      --svg-label-text: #F8FAFC;
      --svg-iris: #38BDF8;
      --svg-c2c3: #334155;

      --drawer-correct-bg: #08291F;
      --drawer-wrong-bg: #2C1018;
      --shadow-card: 0 4px 18px rgba(0, 0, 0, 0.4);
    }

    /* =========================================================================
       2. BASE RESET & SYSTEM TYPOGRAPHY
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.48;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    h1, h2, h3, h4, p { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: -0.02em;
    }

    /* =========================================================================
       3. STICKY TOP BAR & DUOLINGO ANIMATED PROGRESS BAR
       ========================================================================= */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-header);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-card);
    }

    .header-inner {
      max-width: 680px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-links {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 36px;
      padding: 6px 10px;
      border-radius: 11px;
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 800;
      transition: background-color 0.15s ease;
    }
    .nav-pill:hover { background: var(--border-card); }

    .mode-switch {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border-radius: 12px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      min-height: 30px;
      padding: 4px 11px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .mode-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .xp-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 36px;
      padding: 6px 10px;
      border-radius: 11px;
      background: var(--sem-amber-soft);
      border: 1px solid var(--sem-amber-border);
      color: var(--sem-amber-dark);
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .dark .xp-pill { color: #FCD34D; }

    .theme-btn {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      border: 1px solid var(--border-card);
      background: var(--bg-subtle);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .theme-btn:hover { background: var(--border-card); }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-row.hidden { display: none; }

    .progress-track {
      flex: 1;
      height: 14px;
      border-radius: 999px;
      background: var(--bg-subtle);
      padding: 2px;
      overflow: hidden;
    }

    .progress-fill {
      position: relative;
      height: 100%;
      border-radius: 999px;
      background: var(--sem-emerald);
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.25s ease;
      overflow: hidden;
    }
    .progress-fill.replay { background: var(--sem-amber); }
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 6px;
      right: 6px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
    }

    .progress-label {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* =========================================================================
       4. MAIN LAYOUT, CARDS, PILLS & SEMANTIC COGNITIVE BOXES
       ========================================================================= */
    .app-main {
      flex: 1;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 14px 158px;
    }

    .stack { display: flex; flex-direction: column; gap: 14px; }
    .stack-sm { display: flex; flex-direction: column; gap: 10px; }

    .card {
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: 22px;
      box-shadow: var(--shadow-card);
    }

    .svg-card { padding: 12px; }

    .info-card {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .flex-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-blue { background: var(--sem-blue-soft); color: var(--sem-blue-dark); border: 1px solid var(--sem-blue-border); }
    .dark .badge-blue { color: #7DD3FC; }
    .badge-emerald { background: var(--sem-emerald-soft); color: var(--sem-emerald-dark); border: 1px solid var(--sem-emerald-border); }
    .dark .badge-emerald { color: #6EE7B7; }
    .badge-purple { background: var(--sem-purple-soft); color: var(--sem-purple-dark); border: 1px solid var(--sem-purple-border); }
    .dark .badge-purple { color: #C4B5FD; }
    .badge-coral { background: var(--sem-coral-soft); color: var(--sem-coral-dark); border: 1px solid var(--sem-coral-border); }
    .dark .badge-coral { color: #FCA5A5; }
    .badge-amber { background: var(--sem-amber-soft); color: var(--sem-amber-dark); border: 1px solid var(--sem-amber-border); }
    .dark .badge-amber { color: #FCD34D; }

    .step-title {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-top: 8px;
    }

    .step-prompt {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.36;
      letter-spacing: -0.015em;
      margin-top: 8px;
    }

    .step-sub {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Pill Grids (Generous >= 44px touch targets) */
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .pill-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .pill-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }
    .pill-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }
    @media (min-width: 520px) {
      .pill-grid-6 {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 7px;
      }
    }
    @media (max-width: 519px) {
      .pill-grid-6 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
      }
    }

    .zone-pill {
      flex: 1;
      min-width: 56px;
      min-height: 44px;
      padding: 8px 10px;
      border-radius: 13px;
      border: 2px solid var(--border-card);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.14s ease;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .zone-pill:hover { border-color: var(--sem-blue); color: var(--text-main); }
    .zone-pill.active {
      background: var(--sem-blue);
      border-color: var(--sem-blue);
      color: #FFFFFF;
    }

    .reset-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 36px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .reset-pill:hover:not(:disabled) {
      border-color: var(--sem-blue);
      color: var(--sem-blue);
    }
    .reset-pill:disabled {
      opacity: 0.45;
      cursor: default;
    }

    /* Semantic Info Cards */
    .sem-box {
      padding: 11px 13px;
      border-radius: 14px;
      font-size: 13.5px;
      border: 1px solid transparent;
    }
    .sem-box-label {
      display: block;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }

    .sem-blue { background: var(--sem-blue-soft); border-color: var(--sem-blue-border); }
    .sem-blue .sem-box-label { color: var(--sem-blue-dark); }
    .dark .sem-blue .sem-box-label { color: #7DD3FC; }

    .sem-emerald { background: var(--sem-emerald-soft); border-color: var(--sem-emerald-border); }
    .sem-emerald .sem-box-label { color: var(--sem-emerald-dark); }
    .dark .sem-emerald .sem-box-label { color: #6EE7B7; }

    .sem-purple { background: var(--sem-purple-soft); border-color: var(--sem-purple-border); }
    .sem-purple .sem-box-label { color: var(--sem-purple-dark); }
    .dark .sem-purple .sem-box-label { color: #C4B5FD; }

    .sem-amber { background: var(--sem-amber-soft); border-color: var(--sem-amber-border); }
    .sem-amber .sem-box-label { color: var(--sem-amber-dark); }
    .dark .sem-amber .sem-box-label { color: #FCD34D; }

    .sem-coral { background: var(--sem-coral-soft); border-color: var(--sem-coral-border); }
    .sem-coral .sem-box-label { color: var(--sem-coral-dark); }
    .dark .sem-coral .sem-box-label { color: #FCA5A5; }

    .mini-tile {
      padding: 11px 10px;
      border-radius: 14px;
      border: 1px solid var(--border-card);
      text-align: center;
    }
    .mini-tile strong {
      display: block;
      font-size: 13.5px;
      font-weight: 800;
    }
    .mini-tile span {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      margin-top: 2px;
      color: var(--text-muted);
    }

    /* =========================================================================
       5. TACTILE 3D DUOLINGO BUTTONS & MULTIPLE-CHOICE CARDS
       ========================================================================= */
    .btn-3d {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      padding: 13px 18px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.15s ease, opacity 0.15s ease;
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px !important;
    }
    .btn-3d:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-emerald {
      background: var(--sem-emerald);
      color: #FFFFFF;
      border: 2px solid var(--sem-emerald);
      border-bottom: 4px solid var(--sem-emerald-dark);
    }
    .btn-emerald:hover:not(:disabled) { filter: brightness(1.05); }

    .btn-blue {
      background: #007AFF;
      color: #FFFFFF;
      border: 2px solid #007AFF;
      border-bottom: 4px solid #005BBF;
    }
    .btn-blue:hover:not(:disabled) { filter: brightness(1.06); }

    .btn-coral {
      background: var(--sem-coral);
      color: #FFFFFF;
      border: 2px solid var(--sem-coral);
      border-bottom: 4px solid var(--sem-coral-dark);
    }
    .btn-coral:hover:not(:disabled) { filter: brightness(1.05); }

    .btn-neutral {
      background: var(--bg-card);
      color: var(--text-main);
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-strong);
    }
    .btn-neutral:hover:not(:disabled) { background: var(--bg-subtle); }

    .choice-card {
      width: 100%;
      min-height: 54px;
      padding: 13px 14px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-strong);
      color: var(--text-main);
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .choice-card:hover:not(:disabled) {
      border-color: var(--sem-blue);
      background: var(--sem-blue-soft);
    }
    .choice-card:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
    .choice-card:disabled { cursor: default; }

    .choice-letter {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-card);
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .choice-text {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.38;
    }

    .choice-selected {
      border-color: var(--sem-blue) !important;
      border-bottom-color: var(--sem-blue-dark) !important;
      background: var(--sem-blue-soft) !important;
    }
    .choice-selected .choice-letter {
      background: var(--sem-blue);
      border-color: var(--sem-blue);
      color: #FFFFFF;
    }

    .choice-correct {
      border-color: var(--sem-emerald) !important;
      border-bottom-color: var(--sem-emerald-dark) !important;
      background: var(--sem-emerald-soft) !important;
    }
    .choice-correct .choice-letter {
      background: var(--sem-emerald);
      border-color: var(--sem-emerald);
      color: #FFFFFF;
    }

    .choice-wrong {
      border-color: var(--sem-coral) !important;
      border-bottom-color: var(--sem-coral-dark) !important;
      background: var(--sem-coral-soft) !important;
    }
    .choice-wrong .choice-letter {
      background: var(--sem-coral);
      border-color: var(--sem-coral);
      color: #FFFFFF;
    }

    /* =========================================================================
       6. INTERACTIVE SVG SPOTLIGHT / FADE-OTHERS ISOLATION & MOVING PUPILS
       ========================================================================= */
    .anatomy-svg {
      display: block;
      width: 100%;
      max-width: 440px;
      height: auto;
      margin: 0 auto;
      user-select: none;
    }

    .cn-zone {
      cursor: pointer;
      transition: opacity 0.22s ease, filter 0.22s ease, fill 0.18s ease, stroke-width 0.18s ease;
    }
    .cn-zone:hover {
      filter: brightness(1.07);
    }

    .zone-label {
      transition: opacity 0.22s ease, filter 0.22s ease;
    }

    .cn-zone-quiz {
      fill: var(--svg-quiz-fill);
    }
    .cn-zone-quiz:hover {
      fill: var(--svg-quiz-hover);
    }

    /* SPOTLIGHT / FADE-OTHERS RULE */
    .anatomy-svg.has-selection .cn-zone:not(.is-active):not(.is-correct):not(.is-wrong) {
      opacity: 0.16;
      filter: saturate(0.25);
    }
    .anatomy-svg.has-selection .zone-label:not(.is-active) {
      opacity: 0.25;
    }

    .cn-zone.is-active {
      opacity: 1 !important;
      stroke: var(--svg-focus-stroke);
      stroke-width: 2.3px;
      filter: drop-shadow(0 0 8px rgba(15, 23, 42, 0.28));
    }
    .dark .cn-zone.is-active {
      filter: drop-shadow(0 0 10px rgba(248, 250, 252, 0.36));
    }

    .cn-zone.is-quiz-selected {
      fill: #007AFF !important;
      fill-opacity: 0.9 !important;
    }

    .cn-zone.is-correct {
      opacity: 1 !important;
      fill: #10B981 !important;
      fill-opacity: 0.92 !important;
      stroke: var(--svg-focus-stroke);
      stroke-width: 2.3px;
      animation: pulseGreen 0.65s ease-in-out 2;
    }

    .cn-zone.is-wrong {
      opacity: 1 !important;
      fill: #EF4444 !important;
      fill-opacity: 0.88 !important;
      stroke: var(--svg-focus-stroke);
      stroke-width: 2px;
    }

    /* Smooth moving pupils for H-Test SVG B */
    .eye-gaze-group {
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes pulseGreen {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(16, 185, 129, 0)); }

      let saved = null;
      try { saved = localStorage.getItem('mchiro_theme'); } catch (e) {}
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? (saved === 'dark' || saved === '"dark"') : prefersDark;
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      try { localStorage.setItem('mchiro_theme', isDark ? 'dark' : 'light'); } catch (e) {}
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) btn.textContent = isDark ? '☀️' : '🌙';
    }

    function toggleTheme() {
      applyTheme(!document.documentElement.classList.contains('dark'));
    }

    function saveLessonCompletion() {

          cn: {
            completed: true,
            xp: 140,
            updatedAt: Date.now(),

        localStorage.setItem('mchiro_lessons_v1', JSON.stringify(merged));

    // =========================================================================
    // 6. INTERACTION HANDLERS (SPOTLIGHT, QUIZ & MISTAKE REVIEW LOOP)
    // =========================================================================
    function setAppMode(mode) {
      state.appMode = mode;
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function inspectCn5(zId) {
      if (state.appMode === 'explore') {
        state.exploreCn5 = state.exploreCn5 === zId ? null : zId;
      } else {
        state.teachCn5 = state.teachCn5 === zId ? null : zId;
      }
      renderAll();
    }

    function inspectEyeTarget(tId) {
      if (state.appMode === 'explore') {
        state.exploreEyes = state.exploreEyes === tId ? null : tId;
      } else {
        state.teachEyes = state.teachEyes === tId ? null : tId;
      }
      renderAll();
    }

    function inspectCn7(side) {
      if (state.appMode === 'explore') {
        state.exploreCn7 = state.exploreCn7 === side ? null : side;
      } else {
        state.teachCn7 = state.teachCn7 === side ? null : side;
      }
      renderAll();
    }

    function selectQuizZone(zId) {
      if (state.checked) return;
      state.selectedAnswer = state.selectedAnswer === zId ? null : zId;
      renderAll();
    }

    function selectChoice(optId) {
      if (state.checked) return;
      state.selectedAnswer = optId;
      renderAll();
    }

    function awardStepXp(stepId) {
      if (!state.earnedStepXp[stepId]) {
        state.earnedStepXp[stepId] = true;
        state.xp += 10; // 14 steps × 10 XP = +140 XP
      }
    }

    function checkAnswer() {
      const step = getCurrentStep();
      if (!state.selectedAnswer || state.checked) return;

      const correctVal = step.type === 'choice' ? step.correct : step.target;
      const isRight = state.selectedAnswer === correctVal;

      state.checked = true;
      state.isCorrect = isRight;

      if (!state.inMistakeReplay && !state.seenQuizSteps[step.id]) {
        state.seenQuizSteps[step.id] = true;
        state.firstTryTotal++;
        if (isRight) state.firstTryCorrect++;
      }

      if (isRight) {
        awardStepXp(step.id);
      } else {
        state.hadMistakes = true;
        const origIdx = LESSON_STEPS.findIndex((s) => s.id === step.id);
        if (!state.inMistakeReplay) {
          if (!state.mistakeQueue.includes(origIdx)) state.mistakeQueue.push(origIdx);
        } else {
          state.mistakeQueue.push(origIdx);
        }
      }

      renderAll();
    }

    function finishLesson() {
      state.completed = true;
      state.xp = 140;
      saveLessonCompletion();
    }

    function continueLesson() {
      const step = getCurrentStep();
      if (step && step.type.startsWith('teach_')) {
        awardStepXp(step.id);
      }

      state.selectedAnswer = null;
      state.checked = false;
      state.isCorrect = false;

      if (!state.inMistakeReplay) {
        if (state.stepIdx + 1 < LESSON_STEPS.length) {
          state.stepIdx++;
        } else if (state.mistakeQueue.length > 0) {
          state.inMistakeReplay = true;
          state.mistakeCursor = 0;
        } else {
          finishLesson();
        }
      } else {
        if (state.mistakeCursor + 1 < state.mistakeQueue.length) {
          state.mistakeCursor++;
        } else {
          finishLesson();
        }
      }

      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function replayLesson() {
      state.appMode = 'lesson';
      state.stepIdx = 0;
      state.inMistakeReplay = false;
      state.mistakeQueue = [];
      state.mistakeCursor = 0;
      state.hadMistakes = false;
      state.completed = false;
      state.selectedAnswer = null;
      state.checked = false;
      state.isCorrect = false;
      state.teachEyes = 'so';
      state.teachCn5 = 'V3';
      state.teachCn7 = 'lmn';
      state.xp = 0;
      state.earnedStepXp = {};
      state.firstTryTotal = 0;
      state.firstTryCorrect = 0;
      state.seenQuizSteps = {};
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // 7. RENDER HEADER & ROUTER
    // =========================================================================
    function renderHeader() {
      document.getElementById('mode-btn-lesson').classList.toggle('active', state.appMode === 'lesson');
      document.getElementById('mode-btn-explore').classList.toggle('active', state.appMode === 'explore');
      document.getElementById('xp-value').textContent = `${state.xp} XP`;

      const row = document.getElementById('progress-row');
      const fill = document.getElementById('progress-fill');
      const lbl = document.getElementById('progress-label');

      if (state.appMode === 'explore') {
        row.classList.add('hidden');
        return;
      }
      row.classList.remove('hidden');

      if (state.completed) {
        fill.style.width = '100%';
        fill.classList.remove('replay');
        lbl.textContent = '14 / 14';
      } else if (state.inMistakeReplay) {
        const remaining = state.mistakeQueue.length - state.mistakeCursor;
        const pct = Math.max(15, Math.round((state.mistakeCursor / state.mistakeQueue.length) * 100));
        fill.style.width = `${pct}%`;
        fill.classList.add('replay');
        lbl.textContent = `🔁 ${remaining} left`;
      } else {
        const pct = Math.max(7, Math.round(((state.stepIdx + (state.checked && state.isCorrect ? 1 : 0)) / LESSON_STEPS.length) * 100));
        fill.style.width = `${pct}%`;
        fill.classList.remove('replay');
        lbl.textContent = `${state.stepIdx + 1} / ${LESSON_STEPS.length}`;
      }
    }

    function renderAll() {
      renderHeader();
      const main = document.getElementById('app-main');
      const drawer = document.getElementById('bottom-drawer');

      if (state.appMode === 'explore') {
        main.innerHTML = renderExploreLab();
        drawer.innerHTML = '';
        return;
      }

      if (state.completed) {
        main.innerHTML = renderCelebrationScreen();
        drawer.innerHTML = '';
        spawnConfetti();
        return;
      }

      const step = getCurrentStep();
      main.innerHTML = renderLessonStep(step);
      drawer.innerHTML = renderBottomDrawer(step);
    }

    // =========================================================================
    // 8. RENDER 14 GUIDED LESSON STEPS
    // =========================================================================
    function renderLessonStep(step) {
      const mistakeBanner = state.inMistakeReplay
        ? `<div style="margin-bottom:8px;"><span class="step-badge badge-amber">🔁 Mistake Review</span></div>`
        : '';

      // STEP 1: CN I & II Teach
      if (step.type === 'teach_cn12') {
        return `
          <div class="stack step-enter">
            <div>
              <span class="step-badge badge-blue">${step.badge}</span>
              <h2 class="step-title">${step.title}</h2>
              <p class="step-sub">${step.subtitle}</p>
            </div>

            <article class="card info-card">
              <div class="flex-between">
                <span class="step-badge badge-blue mono">CN I • Olfactory</span>
                <span style="font-size:12px;font-weight:700;color:var(--text-muted);">Purely Sensory</span>
              </div>
              <div class="sem-box sem-blue">
                <span class="sem-box-label">Bedside Approach</span>
                <p><strong>Explain only (not routinely tested)</strong> — ask patient about any history of <strong>anosmia</strong> (loss of smell).</p>
              </div>
            </article>

            <article class="card info-card">
              <div class="flex-between">
                <span class="step-badge badge-blue mono">CN II • Optic</span>
                <span style="font-size:12px;font-weight:700;color:var(--text-muted);">Vision &amp; Afferent Light</span>
              </div>
              <div class="sem-box sem-blue">
                <span class="sem-box-label">5 Core Exam Elements</span>
                <p><strong>1.</strong> Visual acuity (Snellen / small print) &bull; <strong>2.</strong> Visual fields (4-quadrant confrontation) &bull; <strong>3.</strong> Visual neglect test &bull; <strong>4.</strong> Afferent pupillary light reflex &bull; <strong>5.</strong> Refer out for ophthalmoscopy.</p>
              </div>
              <div class="sem-box sem-coral">
                <span class="sem-box-label">⚠️ Assessor Traps (Say Both Aloud!)</span>
                <p><strong>Visual Neglect</strong> = Posterior Parietal Cortex (Right Parietal) lesion.<br><strong>Ophthalmoscopy Referral</strong> = checks for <strong>papilloedema</strong> (suggestive of <em>weeks</em> of raised ICP).</p>
              </div>
            </article>
          </div>
        `;
      }

      // STEP 3: CN III, IV, VI Eye Trio Teach (SVG B)
      if (step.type === 'teach_eyes') {
        const cur = state.teachEyes ? HTEST_DATA[state.teachEyes] : null;
        return `
          <div class="stack step-enter">
            <div>
              <span class="step-badge badge-emerald">${step.badge}</span>
              <h2 class="step-title">${step.title}</h2>
              <p class="step-sub">${step.subtitle}</p>
            </div>

            <div class="card svg-card">
              ${buildHTestSVG('explore', state.teachEyes, null)}
            </div>

            ${cur ? `
              <article class="card info-card">
                <div class="flex-between">
                  <span class="step-badge ${cur.badgeCls}">${cur.nerve}</span>
                  <span style="font-size:12px;font-weight:700;color:var(--text-muted);">${cur.short}</span>
                </div>
                <div class="sem-box sem-emerald">
                  <span class="sem-box-label">Muscle &amp; Action</span>
                  <p><strong>${cur.muscle}</strong> — ${cur.action}</p>
                </div>
                <div class="sem-box sem-purple">
                  <span class="sem-box-label">Eye Trio Checklist</span>
                  <p>Direct &amp; consensual light (CN II in → CN III out), accommodation, saccades (U/D/L/R), convergence, smooth pursuit ("H"), VOR.</p>
                </div>
                <div class="sem-box sem-coral">
                  <span class="sem-box-label">⚠️ Clinical Pearl / Red Flag</span>
                  <p>${cur.trap}</p>
                </div>
              </article>
            ` : `
              <div class="card info-card"><p class="hint-text">Tap any H-Test direction or the central Pupil badge above to spotlight it.</p></div>
            `}
          </div>
        `;
      }

      // STEP 6: CN V Trigeminal Teach (SVG A)
      if (step.type === 'teach_cn5') {
        const z = state.teachCn5 ? CNV_DATA[state.teachCn5] : null;
        return `
          <div class="stack step-enter">
            <div>
              <span class="step-badge badge-blue">${step.badge}</span>
              <h2 class="step-title">${step.title}</h2>
              <p class="step-sub">${step.subtitle}</p>
            </div>

            <div class="pill-grid-3">
              ${['V1', 'V2', 'V3'].map((k) => `
                <button type="button" class="zone-pill mono ${state.teachCn5 === k ? 'active' : ''}" onclick="inspectCn5('${k}')">${k}</button>
              `).join('')}
            </div>

            <div class="card svg-card">
              ${buildFaceCn5SVG('explore', state.teachCn5, null)}
            </div>

            ${z ? `
              <article class="card info-card">
                <div class="flex-between">
                  <span class="step-badge ${z.badgeCls}">${z.name}</span>
                  <span style="font-size:12px;font-weight:700;color:var(--text-muted);">${z.hook}</span>
                </div>
                <div class="sem-box sem-blue">
                  <span class="sem-box-label">Sensory (Light Touch &amp; Pin-Prick)</span>
                  <p>${z.sensory}</p>
                </div>
                <div class="sem-box sem-emerald">
                  <span class="sem-box-label">Motor</span>
                  <p><strong>${z.motor}</strong></p>
                </div>
                <div class="sem-box sem-purple">
                  <span class="sem-box-label">Reflex</span>
                  <p>${z.reflex}</p>
                </div>
                <div class="sem-box sem-coral">
                  <span class="sem-box-label">⚠️ Assessor Trap</span>
                  <p><strong>${z.trap}</strong></p>
                </div>
              </article>
            ` : `
              <div class="card info-card"><p class="hint-text">All divisions visible — tap V1, V2, or V3 on the face to spotlight.</p></div>
            `}
          </div>
        `;
      }

      // STEP 9: CN VII Facial Teach (SVG C)
      if (step.type === 'teach_cn7') {
        const cur = state.teachCn7 ? CN7_DATA[state.teachCn7] : null;
        return `
          <div class="stack step-enter">
            <div>
              <span class="step-badge badge-coral">${step.badge}</span>
              <h2 class="step-title">${step.title}</h2>
              <p class="step-sub">${step.subtitle}</p>
            </div>

            <div class="card svg-card">
              ${buildCn7CompareSVG(state.teachCn7)}
            </div>

            ${cur ? `
              <article class="card info-card">
                <div class="flex-between">
                  <span class="step-badge ${cur.badgeCls}">${cur.title}</span>

                  <p><strong>${cur.pattern}</strong> ${cur.mechanism}</p>
                </div>
                <div class="sem-box sem-amber">
                  <span class="sem-box-label">💡 Classic McTimoney Non-Motor Omissions</span>
                  <p>${cur.nonMotor}</p>
                </div>
              </article>
            ` : `
              <div class="card info-card"><p class="hint-text">Tap either UMN or LMN face above to spotlight its clinical breakdown.</p></div>
            `}
          </div>
        `;
      }

      // STEP 11: CN VIII Teach
      if (step.type === 'teach_cn8') {
        return `
          <div class="stack step-enter">
            <div>
              <span class="step-badge badge-purple">${step.badge}</span>
              <h2 class="step-title">${step.title}</h2>
              <p class="step-sub">${step.subtitle}</p>
            </div>

            <div class="pill-grid-2">
              <article class="card info-card" style="border-color:var(--sem-amber-border);">
                <span class="step-badge badge-amber">Conductive Loss</span>
                <p style="font-size:13.5px;"><strong>Weber’s:</strong> Lateralises to <strong>AFFECTED</strong> ear (less room noise masking).</p>
                <p style="font-size:13.5px;"><strong>Rinne’s:</strong> <strong>NEGATIVE (BC &gt; AC)</strong> on affected side.</p>
              </article>

              <article class="card info-card" style="border-color:var(--sem-blue-border);">
                <span class="step-badge badge-blue">Sensorineural Loss</span>
                <p style="font-size:13.5px;"><strong>Weber’s:</strong> Lateralises to <strong>GOOD (healthy)</strong> ear.</p>
                <p style="font-size:13.5px;"><strong>Rinne’s:</strong> <strong>POSITIVE (AC &gt; BC)</strong> bilaterally (both reduced on bad side).</p>
              </article>
            </div>

            <article class="card info-card">
              <div class="sem-box sem-purple">
                <span class="sem-box-label">Full CN VIII OSCE Sequence</span>
                <p><strong>1.</strong> Whisper hearing screen &rarr; <strong>2.</strong> 512 Hz Weber’s (midline forehead) &rarr; <strong>3.</strong> 512 Hz Rinne’s (mastoid vs ear canal) &rarr; <strong>4.</strong> Vestibular balance.</p>
              </div>
              <div class="sem-box sem-coral">
                <span class="sem-box-label">⚠️ Assessor Omission Trap</span>
                <p><strong>Don’t forget Balance!</strong> Explicitly tell the examiner that CN VIII also controls vestibular balance (tested in stance &amp; gait / Romberg’s).</p>
              </div>
            </article>
          </div>
        `;
      }

      // STEP 13: Lower Bulbar Four Teach (CN IX, X, XI, XII)
      if (step.type === 'teach_bulbar') {
        return `
          <div class="stack step-enter">
            <div>
              <span class="step-badge badge-emerald">${step.badge}</span>
              <h2 class="step-title">${step.title}</h2>
              <p class="step-sub">${step.subtitle}</p>
            </div>

            <article class="card info-card">
              <div class="sem-box sem-purple">
                <span class="sem-box-label">CN IX (Glossopharyngeal) &amp; CN X (Vagus)</span>
                <p>Tested together: Swallowing (dysphagia), speech (dysphonia), symmetrical palatal lift ("Ahh"), gag reflex (if indicated), autonomic effects.<br><strong>Rule:</strong> Uvula deviates <strong>AWAY</strong> from the lesion side!</p>
              </div>

              <div class="sem-box sem-emerald">
                <span class="sem-box-label">CN XI (Accessory)</span>
                <p><strong>Sternocleidomastoid (SCM)</strong> turns the chin to the <strong>OPPOSITE</strong> side (Right SCM turns head Left) + <strong>Upper Trapezius</strong> shoulder shrug.</p>

      if (step.type === 'quiz_eyes' || step.type === 'quiz_cn5') {
        const fb = {
          selected: state.selectedAnswer,

        return `

                ? 'Selection spotlighted — tap <strong>CHECK</strong> below to confirm!'

      // MULTIPLE-CHOICE QUIZ STEPS
      if (step.type === 'choice') {
        return `
          <div class="stack step-enter">

              ${mistakeBanner}

              <h2 class="step-prompt">${step.prompt}</h2>

            <div class="stack-sm">
              ${step.options.map((opt, idx) => {
                const letter = ['A', 'B', 'C', 'D'][idx];
                let cls = '';
                if (state.checked) {
                  if (opt.id === step.correct) cls = 'choice-correct';
                  else if (opt.id === state.selectedAnswer && !state.isCorrect) cls = 'choice-wrong';
                } else if (state.selectedAnswer === opt.id) {
                  cls = 'choice-selected';
                }
                return `
                  <button type="button" ${state.checked ? 'disabled' : ''} class="choice-card ${cls}" onclick="selectChoice('${opt.id}')">
                    <span class="choice-letter">${letter}</span>
                    <span class="choice-text">${opt.text}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      return '';
    }

    // =========================================================================
    // 9. FIXED BOTTOM ACTION / FEEDBACK DRAWER
    // =========================================================================
    function renderBottomDrawer(step) {
      if (step.type.startsWith('teach_')) {
        return `
          <div class="drawer-bar">
            <div class="drawer-inner">
              <button type="button" class="btn-3d btn-emerald" onclick="continueLesson()">CONTINUE</button>
            </div>
          </div>
        `;
      }

      if (!state.checked) {
        return `
          <div class="drawer-bar">
            <div class="drawer-inner">
              <button type="button" class="btn-3d btn-blue" ${state.selectedAnswer ? '' : 'disabled'} onclick="checkAnswer()">CHECK</button>
            </div>
          </div>
        `;
      }

      if (state.isCorrect) {
        return `
          <div class="drawer-feedback correct">
            <div class="drawer-inner">
              <div class="fb-row">
                <span class="fb-icon correct">✓</span>
                <div>
                  <p class="fb-title correct">Spot on! +10 XP</p>
                  <p class="fb-msg">${step.correctMsg}</p>
                </div>
              </div>
              <button type="button" class="btn-3d btn-emerald" onclick="continueLesson()">CONTINUE</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="drawer-feedback wrong">
          <div class="drawer-inner">
            <div class="fb-row">
              <span class="fb-icon wrong">✕</span>
              <div>
                <p class="fb-title wrong">Watch the Trap! (Queued for Mistake Review)</p>
                <p class="fb-msg">${step.wrongMsg}</p>
              </div>
            </div>
            <button type="button" class="btn-3d btn-coral" onclick="continueLesson()">CONTINUE</button>
          </div>
        </div>
      `;
    }

    // =========================================================================

            <button type="button" class="sub-seg-btn ${state.exploreSub === 'eyes_cn7' ? 'active' : ''}" onclick="state.exploreSub='eyes_cn7'; renderAll();">2. Eyes &amp; CN VII</button>
            <button type="button" class="sub-seg-btn ${state.exploreSub === 'deck' ? 'active' : ''}" onclick="state.exploreSub='deck'; renderAll();">3. All CN I–XII</button>
          </div>

          ${state.exploreSub === 'cn5' ? renderExploreCn5() : ''}
          ${state.exploreSub === 'eyes_cn7' ? renderExploreEyesCn7() : ''}
          ${state.exploreSub === 'deck' ? renderExploreDeck() : ''}

    function renderExploreCn5() {

          </div>

                <span style="font-size:11.5px;font-weight:700;color:var(--text-muted);">Tap zone again to un-isolate</span>

              </div>
              <div class="sem-box sem-purple">
                <span class="sem-box-label">Reflex</span>
                <p>${z.reflex}</p>
              </div>
              <div class="sem-box sem-amber">
                <span class="sem-box-label">💡 Visual Analogy</span>
                <p>${z.analogy}</p>
              </div>
              <div class="sem-box sem-coral">
                <span class="sem-box-label">⚠️ Assessor Trap</span>

            <article class="card info-card" style="text-align:center;">

    function renderExploreEyesCn7() {
      const eye = state.exploreEyes ? HTEST_DATA[state.exploreEyes] : null;

          `}

          <!-- SVG C: CN VII UMN vs LMN -->
          <div class="flex-between" style="margin-top:6px;">

            ${buildCn7CompareSVG(state.exploreCn7)}

          ${cn7 ? `
            <article class="card info-card">

              <div class="sem-box sem-amber">

    function renderExploreDeck() {
      const cn = ALL_CN_DECK.find((c) => c.id === state.exploreDeckCn) || ALL_CN_DECK[6];

      return `
        <div class="stack">

    // =========================================================================
    // 11. CELEBRATION COMPLETION SCREEN (+140 XP & SAVED TO mchiro_lessons_v1)
    // =========================================================================
    function renderCelebrationScreen() {
      const acc = state.firstTryTotal > 0
        ? Math.round((state.firstTryCorrect / state.firstTryTotal) * 100)
        : 100;

      return `
        <div class="card celebration-card step-enter">
          <div id="confetti-layer" class="confetti-layer"></div>

          <div style="position:relative;z-index:2;" class="stack-sm">
            <div class="trophy-badge">🏆</div>
            <div><span class="step-badge badge-emerald">Lesson 3 Complete!</span></div>
            <h2 style="font-size:26px;font-weight:800;letter-spacing:-0.02em;">Cranial Nerves Mastered</h2>
            <p class="step-sub">Saved to your Revision Hub progress. You cleared CN I–XII, the H-Test extraocular lab, Trigeminal V1–V3, Facial UMN vs. LMN, Weber/Rinne, and Bulbar deviations.</p>
          </div>

          <div style="position:relative;z-index:2;" class="stat-grid">
            <div class="stat-box sem-amber">
              <span class="sem-box-label">XP Earned</span>
              <span class="stat-val" style="color:var(--sem-amber);">+140 XP</span>
            </div>
            <div class="stat-box sem-emerald">
              <span class="sem-box-label">First-Try Accuracy</span>
              <span class="stat-val" style="color:var(--sem-emerald);">${acc}%</span>
            </div>
          </div>

          <div style="position:relative;z-index:2;" class="sem-box sem-blue">
            <p style="font-weight:600;">
              ${state.hadMistakes
                ? '🔁 <strong>Mistake Mastery:</strong> You replayed and cleared every missed cranial nerve trap before finishing!'
                : '✨ <strong>Flawless Run:</strong> Zero mistakes — every cranial nerve trap cleared on the first try!'}
            </p>
          </div>

          <div style="position:relative;z-index:2;" class="stack-sm">
            <button type="button" class="btn-3d btn-emerald" onclick="setAppMode('explore')">🔬 OPEN EXPLORE LAB</button>
            <button type="button" class="btn-3d btn-blue" onclick="replayLesson()">↺ PRACTICE AGAIN</button>
            <div class="pill-grid-2">
              <a href="neuro.html" class="btn-3d btn-neutral" style="font-size:13.5px;">&larr; Neuro Hub</a>
              <a href="index.html" class="btn-3d btn-neutral" style="font-size:13.5px;">🏠 Home Hub</a>
            </div>
          </div>
        </div>
      `;
    }

    function spawnConfetti() {
      const layer = document.getElementById('confetti-layer');
      if (!layer) return;
      const colors = ['#10B981', '#007AFF', '#8B5CF6', '#F59E0B', '#EF4444'];
      for (let i = 0; i < 36; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.backgroundColor = colors[i % colors.length];
        piece.style.animationDuration = `${1.5 + Math.random() * 1.4}s`;
        piece.style.animationDelay = `${Math.random() * 0.4}s`;
        layer.appendChild(piece);
      }
    }

    // =========================================================================
    // 12. INITIALISE
    // =========================================================================
    initTheme();
    renderAll();
  </script>
</body>
