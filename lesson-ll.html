      top: 2px;
      left: 6px;
      right: 6px;
      height: 3px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.38);
      pointer-events: none;

      user-select: none;
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px !important;
    }
    .btn-3d:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
    }

      background-color: #10b981;
      color: #ffffff;
      border: 2px solid #10b981;
      border-bottom: 4px solid #047857;

      background-color: #007aff;
      color: #ffffff;
      border: 2px solid #007aff;
      border-bottom: 4px solid #0056b3;
    }
    .btn-blue:hover:not(:disabled) { background-color: #0066d6; }

      background-color: #ef4444;
      color: #ffffff;
      border: 2px solid #ef4444;
      border-bottom: 4px solid #b91c1c;

      background-color: var(--bg-card);
      color: var(--text-main);
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-card);
    }
    .btn-neutral:hover:not(:disabled) { background-color: var(--bg-subtle); }

      background-color: var(--bg-card);
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-card);
      border-radius: 16px;
      transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
      cursor: pointer;

    .choice-card:hover:not(:disabled) {
      border-color: #007aff;
      background-color: rgba(0, 122, 255, 0.05);
    }
    .choice-card:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
    .choice-selected {
      border-color: #007aff !important;
      border-bottom-color: #0056b3 !important;
      background-color: rgba(0, 122, 255, 0.11) !important;
    }
    .choice-correct {
      border-color: #10b981 !important;
      border-bottom-color: #047857 !important;
      background-color: rgba(16, 185, 129, 0.14) !important;
    }
    .choice-wrong {
      border-color: #ef4444 !important;
      border-bottom-color: #b91c1c !important;
      background-color: rgba(239, 68, 68, 0.14) !important;

      filter: brightness(1.08);
    }
    .leg-zone-quiz {

    }
    .leg-zone-quiz:hover {
      fill: var(--svg-limb-quiz-hover);
    }
    .leg-zone-selected {
      fill: #007aff !important;
      fill-opacity: 0.86 !important;
      filter: drop-shadow(0 0 6px rgba(0, 122, 255, 0.55));

    .leg-zone-correct {
      fill: #10b981 !important;
      fill-opacity: 0.92 !important;
      animation: zonePulseGreen 0.7s ease-in-out 2;

    .leg-zone-wrong {
      fill: #ef4444 !important;
      fill-opacity: 0.88 !important;
    }
    .leg-zone-inspected {
      filter: drop-shadow(0 0 8px rgba(0, 122, 255, 0.45));

      stroke-width: 2.2px !important;

    .leg-zone-dim {

    }

      50% { filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.9)); }

      from { transform: translateY(100%); opacity: 0.65; }
      to { transform: translateY(0); opacity: 1; }
    }
    .drawer-enter {
      animation: slideUp 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;

      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }

      width: 10px;
      height: 14px;
      border-radius: 3px;

    // =========================================================================
    function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem('mchiro_theme'); } catch (e) {}
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? (saved === 'dark' || saved === '"dark"') : prefersDark;
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      try { localStorage.setItem('mchiro_theme', isDark ? 'dark' : 'light'); } catch (e) {}
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) btn.textContent = isDark ? '☀️' : '🌙';
    }

    function toggleTheme() {
      applyTheme(!document.documentElement.classList.contains('dark'));

            <line x1="208" y1="196" x2="284" y2="196" stroke="var(--svg-divider)" stroke-width="1.5" stroke-dasharray="${isQuiz ? '3 2' : 'none'}" pointer-events="none" />
          </g>
          <path d="${postLegPath}" fill="none" stroke="var(--svg-outline)" stroke-width="2.1" stroke-linejoin="round" pointer-events="none" />

          <!-- ==================== MINI SOLE OF FOOT INSET (TIBIAL) ==================== -->
          <path d="${solePath}" fill="var(--svg-limb-base)" />
          <g clip-path="url(#periphSoleClip)">
            <rect ${clickAttr('tibial')} ${pProps('tibial')} x="310" y="278" width="64" height="136" />
          </g>
          <path d="${solePath}" fill="none" stroke="var(--svg-outline)" stroke-width="2" pointer-events="none" />

          <!-- ==================== LABELED PILLS (TEACH / EXPLORE) ==================== -->
          ${!isQuiz ? `
            <g pointer-events="none">
              <!-- LFCN -->
              <rect x="6" y="76" width="54" height="22" rx="7" fill="#14b8a6" />
              <text x="33" y="90" text-anchor="middle" fill="#ffffff" font-size="8.5" font-weight="800">LFCN</text>

              <!-- Obturator -->
              <rect x="108" y="68" width="56" height="22" rx="7" fill="#10b981" />
              <text x="136" y="82" text-anchor="middle" fill="#ffffff" font-size="8.2" font-weight="800">OBTUR.</text>

              <!-- Femoral -->
              <rect x="50" y="160" width="76" height="24" rx="8" fill="#007aff" />
              <text x="88" y="175" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="800">FEMORAL</text>

              <!-- Fibular -->
              <rect x="18" y="294" width="74" height="24" rx="8" fill="#ef4444" />
              <text x="55" y="309" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="800">FIBULAR</text>

              <!-- Sciatic -->
              <rect x="208" y="96" width="74" height="24" rx="8" fill="#f59e0b" />
              <text x="245" y="111" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="800">SCIATIC</text>

              <!-- Tibial (Calf + Sole) -->
              <rect x="212" y="272" width="68" height="24" rx="8" fill="#8b5cf6" />
              <text x="246" y="287" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="800">TIBIAL</text>

              <rect x="314" y="336" width="56" height="20" rx="7" fill="#8b5cf6" stroke="#ffffff" stroke-width="1.2" />
              <text x="342" y="349" text-anchor="middle" fill="#ffffff" font-size="8.5" font-weight="800">TIBIAL</text>
            </g>
          ` : `
            <g pointer-events="none">
              <text x="84" y="427" text-anchor="middle" fill="var(--text-muted)" font-size="8.5" font-weight="700">Front of Leg</text>
              <text x="245" y="427" text-anchor="middle" fill="var(--text-muted)" font-size="8.5" font-weight="700">Back of Leg</text>
              <text x="342" y="427" text-anchor="middle" fill="var(--text-muted)" font-size="8.5" font-weight="700">Sole</text>
            </g>
          `}
        </svg>
      `;
    }

    // =========================================================================
    // 6. INTERACTION HANDLERS
    // =========================================================================
    function setAppMode(mode) {
      state.appMode = mode;
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function inspectDermZone(zId) {
      if (state.appMode === 'explore') state.exploreDerm = zId;
      else state.teachSelectedDerm = zId;
      renderAll();
    }

    function inspectPeriphZone(nId) {
      if (state.appMode === 'explore') state.explorePeriph = nId;
      else state.teachSelectedPeriph = nId;
      renderAll();
    }

    function selectQuizZone(zId) {
      if (state.checked) return;
      state.selectedAnswer = zId;
      renderAll();
    }

    function selectChoice(optId) {
      if (state.checked) return;
      state.selectedAnswer = optId;
      renderAll();
    }

    function awardStepXp(stepId) {
      if (!state.earnedStepXp[stepId]) {
        state.earnedStepXp[stepId] = true;
        state.xp += 10; // 12 steps × 10 XP = +120 XP
      }
    }

    function checkAnswer() {
      const step = getCurrentStep();
      if (!state.selectedAnswer || state.checked) return;

      const correctVal = step.type === 'choice' ? step.correct : step.target;
      const isRight = state.selectedAnswer === correctVal;

      state.checked = true;
      state.isCorrect = isRight;

      // Track first-try accuracy only on initial pass
      if (!state.inMistakeReplay && !state.seenQuizSteps[step.id]) {
        state.seenQuizSteps[step.id] = true;
        state.firstTryTotal++;
        if (isRight) state.firstTryCorrect++;
      }

      if (isRight) {
        awardStepXp(step.id);
      } else {
        state.hadMistakes = true;
        const origIdx = LESSON_STEPS.findIndex((s) => s.id === step.id);
        if (!state.inMistakeReplay) {
          if (!state.mistakeQueue.includes(origIdx)) {
            state.mistakeQueue.push(origIdx);
          }
        } else {
          // Missed again during Mistake Review -> push back to end of queue
          state.mistakeQueue.push(origIdx);
        }
      }

      renderAll();
    }

    function continueLesson() {
      const step = getCurrentStep();

      if (step && step.type.startsWith('teach_')) {
        awardStepXp(step.id);
      }

      state.selectedAnswer = null;
      state.checked = false;
      state.isCorrect = false;

      if (!state.inMistakeReplay) {
        if (state.stepIdx + 1 < LESSON_STEPS.length) {
          state.stepIdx++;
          // Set sensible default inspected zone for upcoming teach steps
          const next = LESSON_STEPS[state.stepIdx];
          if (next.type === 'teach_thigh') state.teachSelectedDerm = 'L2';
          if (next.type === 'teach_shin') state.teachSelectedDerm = 'L4';
          if (next.type === 'teach_periph') state.teachSelectedPeriph = 'fibular';
        } else if (state.mistakeQueue.length > 0) {
          state.inMistakeReplay = true;
          state.mistakeCursor = 0;
        } else {
          state.completed = true;
        }
      } else {
        if (state.mistakeCursor + 1 < state.mistakeQueue.length) {
          state.mistakeCursor++;
        } else {
          state.completed = true;
        }
      }

      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function replayLesson() {
      state.appMode = 'lesson';
      state.stepIdx = 0;
      state.inMistakeReplay = false;
      state.mistakeQueue = [];
      state.mistakeCursor = 0;
      state.hadMistakes = false;
      state.completed = false;
      state.selectedAnswer = null;
      state.checked = false;
      state.isCorrect = false;
      state.teachSelectedDerm = 'L2';
      state.teachSelectedPeriph = 'fibular';
      state.xp = 0;
      state.earnedStepXp = {};
      state.firstTryTotal = 0;
      state.firstTryCorrect = 0;
      state.seenQuizSteps = {};
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // 7. RENDER ENGINE (HEADER, MAIN VIEW, BOTTOM DRAWER)
    // =========================================================================
    function renderHeader() {
      const btnL = document.getElementById('mode-btn-lesson');
      const btnE = document.getElementById('mode-btn-explore');
      const activeCls = 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-xs';
      const inactiveCls = 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white';
      btnL.className = `px-3 py-1 rounded-lg text-[11px] font-display font-extrabold transition ${state.appMode === 'lesson' ? activeCls : inactiveCls}`;
      btnE.className = `px-3 py-1 rounded-lg text-[11px] font-display font-extrabold transition ${state.appMode === 'explore' ? activeCls : inactiveCls}`;

      document.getElementById('xp-value').textContent = `${state.xp} XP`;

      const row = document.getElementById('progress-row');
      const fill = document.getElementById('progress-fill');
      const lbl = document.getElementById('progress-label');

      if (state.appMode === 'explore') {
        row.classList.add('hidden');
        return;
      }
      row.classList.remove('hidden');

      if (state.completed) {
        fill.style.width = '100%';
        fill.className = 'progress-shine h-full rounded-full bg-[#10b981] transition-all duration-500 ease-out';
        lbl.textContent = '12 / 12';
      } else if (state.inMistakeReplay) {
        const remaining = state.mistakeQueue.length - state.mistakeCursor;
        const pct = Math.max(15, Math.round((state.mistakeCursor / state.mistakeQueue.length) * 100));
        fill.style.width = `${pct}%`;
        fill.className = 'progress-shine h-full rounded-full bg-[#f59e0b] transition-all duration-500 ease-out';
        lbl.textContent = `🔁 ${remaining} left`;
      } else {
        const pct = Math.max(8, Math.round(((state.stepIdx + (state.checked && state.isCorrect ? 1 : 0)) / LESSON_STEPS.length) * 100));
        fill.style.width = `${pct}%`;
        fill.className = 'progress-shine h-full rounded-full bg-[#10b981] transition-all duration-500 ease-out';
        lbl.textContent = `${state.stepIdx + 1} / ${LESSON_STEPS.length}`;
      }
    }

    function renderAll() {
      renderHeader();
      const main = document.getElementById('app-main');
      const drawer = document.getElementById('bottom-drawer');

      if (state.appMode === 'explore') {
        main.innerHTML = renderExploreLab();
        drawer.innerHTML = '';
        return;
      }

      if (state.completed) {
        main.innerHTML = renderCelebrationScreen();
        drawer.innerHTML = '';
        spawnConfetti();
        return;
      }

      const step = getCurrentStep();
      main.innerHTML = renderLessonStep(step);
      drawer.innerHTML = renderBottomDrawer(step);
    }

    // =========================================================================
    // 8. RENDER LESSON STEPS
    // =========================================================================
    function renderLessonStep(step) {
      const mistakePill = state.inMistakeReplay ? `
        <div class="mb-3 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-100 dark:bg-amber-950/70 border border-amber-300 dark:border-amber-800 text-amber-800 dark:text-amber-300 text-xs font-display font-extrabold">
          <span>🔁</span>
          <span>Mistake Review</span>
        </div>
      ` : '';

      // --- STEP 1 & STEP 4: VISUAL TEACH DERMATOMES ---
      if (step.type === 'teach_thigh' || step.type === 'teach_shin') {
        const z = DERMATOME_DATA[state.teachSelectedDerm] || DERMATOME_DATA[step.focusZones[0]];

        return `
          <div class="step-enter space-y-4">
            <div>
              <span class="inline-block px-2.5 py-1 rounded-xl text-[11px] font-display font-extrabold uppercase bg-[#007aff]/12 text-[#007aff]">${step.badge}</span>
              <h2 class="text-xl sm:text-2xl font-display font-extrabold mt-1.5">${step.title}</h2>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">${step.subtitle}</p>
            </div>

            <!-- Focus Root Pills -->
            <div class="flex items-center gap-2">
              ${step.focusZones.map((code) => {
                const active = state.teachSelectedDerm === code;
                return `
                  <button
                    type="button"
                    onclick="inspectDermZone('${code}')"
                    class="flex-1 py-2 px-3 rounded-xl text-xs font-display font-extrabold border-2 transition ${
                      active
                        ? 'bg-[#007aff] text-white border-[#007aff] shadow-xs'
                        : 'bg-white dark:bg-[#131c31] border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300'
                    }"
                  >${code}</button>
                `;
              }).join('')}
            </div>

            <!-- Sharpened Labeled Dermatome Leg SVG -->
            <div class="rounded-3xl bg-white dark:bg-[#131c31] border-2 border-slate-200 dark:border-slate-800 p-3 shadow-xs">
              ${buildDermatomeLegSVG('teach', state.teachSelectedDerm, null, step.focusZones)}
            </div>

            <!-- Highlighted Teaching Strip (Step 4 Heel vs Toe + L5 No Reflex) -->
            ${step.type === 'teach_shin' ? `
              <div class="grid grid-cols-3 gap-2 text-center">
                <div class="p-2.5 rounded-2xl bg-emerald-50 dark:bg-emerald-950/35 border border-emerald-200 dark:border-emerald-800">
                  <span class="block text-xs font-display font-extrabold text-emerald-700 dark:text-emerald-300">L4</span>
                  <span class="text-[11px] font-semibold">Heel Walk &bull; Patellar</span>
                </div>
                <div class="p-2.5 rounded-2xl bg-rose-50 dark:bg-rose-950/35 border border-rose-200 dark:border-rose-800">
                  <span class="block text-xs font-display font-extrabold text-rose-600 dark:text-rose-400">L5</span>
                  <span class="text-[11px] font-semibold">Big Toe &bull; NO Reflex</span>
                </div>
                <div class="p-2.5 rounded-2xl bg-amber-50 dark:bg-amber-950/35 border border-amber-200 dark:border-amber-800">
                  <span class="block text-xs font-display font-extrabold text-amber-700 dark:text-amber-300">S1</span>
                  <span class="text-[11px] font-semibold">Toe Walk &bull; Achilles</span>
                </div>
              </div>
            ` : ''}

            <!-- Compact Semantic Inspector Card -->
            <div class="rounded-2xl bg-white dark:bg-[#131c31] border-2 border-slate-200 dark:border-slate-800 p-4 space-y-2.5 shadow-xs">
              <div class="flex items-center justify-between gap-2">
                <span class="px-2.5 py-0.5 rounded-lg text-xs font-display font-extrabold border ${z.badgeClass}">${z.name}</span>
                <span class="text-xs font-display font-bold text-slate-500 dark:text-slate-400">${z.hook}</span>
              </div>
              <p class="text-xs sm:text-sm"><strong class="text-[#007aff]">Sensation:</strong> ${z.sensation}</p>
              <p class="text-xs sm:text-sm"><strong class="text-[#10b981]">Myotome:</strong> <span class="font-display font-extrabold">${z.myotome}</span> (${z.action})</p>
              <p class="text-xs sm:text-sm"><strong class="text-[#8b5cf6]">Reflex:</strong> ${z.reflex}</p>
              <p class="text-xs text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-950/35 px-3 py-2 rounded-xl border border-amber-200 dark:border-amber-800/60">
                💡 <strong>Analogy:</strong> ${z.analogy}
              </p>
            </div>
          </div>
        `;
      }

      // --- STEP 9: VISUAL TEACH PERIPHERAL NERVES ---
      if (step.type === 'teach_periph') {
        const p = PERIPHERAL_DATA[state.teachSelectedPeriph] || PERIPHERAL_DATA.fibular;
        const keys = ['femoral', 'lfcn', 'obturator', 'sciatic', 'tibial', 'fibular'];

        return `
          <div class="step-enter space-y-4">
            <div>
              <span class="inline-block px-2.5 py-1 rounded-xl text-[11px] font-display font-extrabold uppercase bg-[#8b5cf6]/15 text-[#8b5cf6]">${step.badge}</span>
              <h2 class="text-xl sm:text-2xl font-display font-extrabold mt-1.5">${step.title}</h2>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">${step.subtitle}</p>
            </div>

            <!-- 6 Quick Nerve Pills -->
            <div class="grid grid-cols-3 gap-1.5">
              ${keys.map((k) => {
                const obj = PERIPHERAL_DATA[k];
                const active = state.teachSelectedPeriph === k;
                return `
                  <button
                    type="button"
                    onclick="inspectPeriphZone('${k}')"
                    class="py-1.5 px-2 rounded-xl text-[11px] font-display font-extrabold border-2 transition truncate ${
                      active
                        ? 'bg-[#007aff] text-white border-[#007aff]'
                        : 'bg-white dark:bg-[#131c31] border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300'
                    }"
                  >${obj.shortName || obj.name.replace(' Nerve', '')}</button>
                `;
              }).join('')}
            </div>

            <!-- Sharpened Peripheral Nerve Leg SVG -->
            <div class="rounded-3xl bg-white dark:bg-[#131c31] border-2 border-slate-200 dark:border-slate-800 p-3 shadow-xs">
              ${buildPeripheralLegSVG('teach', state.teachSelectedPeriph, null)}
            </div>

            <!-- Inspector Card -->
            <div class="rounded-2xl bg-white dark:bg-[#131c31] border-2 border-slate-200 dark:border-slate-800 p-4 space-y-2 shadow-xs">
              <div class="flex items-center justify-between gap-2">
                <span class="px-2.5 py-0.5 rounded-lg text-xs font-display font-extrabold border ${p.badgeClass}">${p.name}</span>
                <span class="text-xs font-bold text-slate-400">${p.roots}</span>
              </div>
              <p class="text-xs sm:text-sm"><strong class="text-[#007aff]">Sensation:</strong> ${p.sensation}</p>
              <p class="text-xs sm:text-sm"><strong class="text-[#10b981]">Motor:</strong> <span class="font-display font-extrabold">${p.muscles}</span></p>
              <p class="text-xs text-[#ef4444] bg-rose-50 dark:bg-rose-950/35 px-3 py-2 rounded-xl border border-rose-200 dark:border-rose-800/60 font-bold">
                ⚠️ ${p.trap}
              </p>
            </div>
          </div>
        `;
      }

      // --- TAP-THE-LEG QUIZ (DERMATOME OR PERIPHERAL) ---
      if (step.type === 'quiz_derm' || step.type === 'quiz_periph') {
        const fb = {
          selected: state.selectedAnswer,
          correctTarget: step.target,
          checked: state.checked,
          isCorrect: state.isCorrect,
        };

        return `
          <div class="step-enter space-y-4">
            <div>
              ${mistakePill}
              <div class="block">
                <span class="inline-block px-2.5 py-1 rounded-xl text-[11px] font-display font-extrabold uppercase bg-emerald-100 dark:bg-emerald-950/70 text-emerald-700 dark:text-emerald-300">${step.badge}</span>
              </div>
              <h2 class="text-lg sm:text-xl font-display font-extrabold mt-2 leading-snug">${step.prompt}</h2>
            </div>

            <div class="rounded-3xl bg-white dark:bg-[#131c31] border-2 border-slate-200 dark:border-slate-800 p-3 shadow-xs">
              ${step.type === 'quiz_derm'
                ? buildDermatomeLegSVG('quiz', null, fb, null)
                : buildPeripheralLegSVG('quiz', null, fb)}
            </div>

            <p class="text-center text-xs font-bold text-slate-500 dark:text-slate-400">
              ${state.selectedAnswer && !state.checked
                ? 'Zone highlighted — tap <strong>CHECK</strong> below to confirm!'
                : !state.checked
                  ? 'Tap directly on the anatomical zone above.'
                  : ''}
            </p>
          </div>
        `;
      }

      // --- CHUNKY MULTIPLE CHOICE QUIZ ---
      if (step.type === 'choice') {
        return `
          <div class="step-enter space-y-5">
            <div>
              ${mistakePill}
              <div class="block">
                <span class="inline-block px-2.5 py-1 rounded-xl text-[11px] font-display font-extrabold uppercase ${
                  step.isTrap
                    ? 'bg-rose-100 dark:bg-rose-950/70 text-[#ef4444] dark:text-rose-300 border border-rose-300 dark:border-rose-800'
                    : 'bg-sky-100 dark:bg-sky-950/70 text-[#007aff] dark:text-sky-300'
                }">${step.badge}</span>
              </div>
              <h2 class="text-lg sm:text-xl font-display font-extrabold mt-2.5 leading-snug">${step.prompt}</h2>
            </div>

            <div class="space-y-3">
              ${step.options.map((opt, idx) => {
                const letter = ['A', 'B', 'C', 'D'][idx];
                let extraCls = '';
                if (state.checked) {
                  if (opt.id === step.correct) extraCls = 'choice-correct';
                  else if (opt.id === state.selectedAnswer && !state.isCorrect) extraCls = 'choice-wrong';
                } else if (state.selectedAnswer === opt.id) {
                  extraCls = 'choice-selected';
                }

                return `
                  <button
                    type="button"
                    ${state.checked ? 'disabled' : ''}
                    onclick="selectChoice('${opt.id}')"
                    class="choice-card w-full p-4 text-left flex items-center gap-3.5 ${extraCls}"
                  >
                    <span class="w-8 h-8 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-display font-extrabold flex items-center justify-center shrink-0">${letter}</span>
                    <span class="text-sm sm:text-[15px] font-semibold leading-snug">${opt.text}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      return '';
    }

    // =========================================================================
    // 9. FIXED SLIDE-UP BOTTOM ACTION / FEEDBACK DRAWER
    // =========================================================================
    function renderBottomDrawer(step) {
      if (step.type.startsWith('teach_')) {
        return `
          <div class="pointer-events-auto bg-white/95 dark:bg-[#0b1120]/95 backdrop-blur border-t border-slate-200 dark:border-slate-800">
            <div class="max-w-[560px] mx-auto px-3.5 py-3.5">
              <button type="button" onclick="continueLesson()" class="btn-3d btn-emerald w-full py-3.5 text-sm sm:text-base tracking-wide">
                CONTINUE
              </button>
            </div>
          </div>
        `;
      }

      if (!state.checked) {
        return `
          <div class="pointer-events-auto bg-white/95 dark:bg-[#0b1120]/95 backdrop-blur border-t border-slate-200 dark:border-slate-800">
            <div class="max-w-[560px] mx-auto px-3.5 py-3.5">
              <button
                type="button"
                ${state.selectedAnswer ? '' : 'disabled'}
                onclick="checkAnswer()"
                class="btn-3d btn-blue w-full py-3.5 text-sm sm:text-base tracking-wide"
              >
                CHECK
              </button>
            </div>
          </div>
        `;
      }

      if (state.isCorrect) {
        return `
          <div class="pointer-events-auto drawer-enter bg-emerald-50 dark:bg-[#092920] border-t-2 border-[#10b981] shadow-2xl">
            <div class="max-w-[560px] mx-auto px-4 py-4 space-y-3">
              <div class="flex items-start gap-3">
                <span class="w-8 h-8 rounded-full bg-[#10b981] text-white font-extrabold flex items-center justify-center shrink-0 text-base">✓</span>
                <div class="min-w-0">
                  <p class="text-base font-display font-extrabold text-emerald-800 dark:text-emerald-300">Spot on! +10 XP</p>
                  <p class="text-xs sm:text-sm text-emerald-900 dark:text-emerald-100 mt-0.5 leading-snug">${step.correctMsg}</p>
                </div>
              </div>
              <button type="button" onclick="continueLesson()" class="btn-3d btn-emerald w-full py-3.5 text-sm sm:text-base tracking-wide">
                CONTINUE
              </button>
            </div>
          </div>
        `;
      }

      return `
        <div class="pointer-events-auto drawer-enter bg-rose-50 dark:bg-[#2b0f18] border-t-2 border-[#ef4444] shadow-2xl">
          <div class="max-w-[560px] mx-auto px-4 py-4 space-y-3">
            <div class="flex items-start gap-3">
              <span class="w-8 h-8 rounded-full bg-[#ef4444] text-white font-extrabold flex items-center justify-center shrink-0 text-base">✕</span>
              <div class="min-w-0">
                <p class="text-base font-display font-extrabold text-rose-800 dark:text-rose-300">Clinical Trap! <span class="text-xs font-bold opacity-80">(Added to Mistake Review)</span></p>
                <p class="text-xs sm:text-sm text-rose-900 dark:text-rose-100 mt-0.5 leading-snug">${step.wrongMsg}</p>
              </div>
            </div>
            <button type="button" onclick="continueLesson()" class="btn-3d btn-red w-full py-3.5 text-sm sm:text-base tracking-wide">
              GOT IT
            </button>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 10. FREE EXPLORE ANATOMY LAB
    // =========================================================================
    function renderExploreLab() {
      const isDerm = state.exploreTab === 'derm';
      const item = isDerm
        ? (DERMATOME_DATA[state.exploreDerm] || DERMATOME_DATA.L4)
        : (PERIPHERAL_DATA[state.explorePeriph] || PERIPHERAL_DATA.fibular);

      return `
        <div class="step-enter space-y-4 pb-8">
          <div>
            <span class="text-[11px] font-display font-extrabold uppercase tracking-wider text-[#007aff]">Free Explore Anatomy Lab</span>
            <h2 class="text-xl font-display font-extrabold">Tap Any Lower Limb Zone</h2>
          </div>

          <!-- Sub-Toggle Pill: Dermatomes (L2–S1) vs Peripheral Nerves (6) -->
          <div class="grid grid-cols-2 gap-2 p-1.5 rounded-2xl bg-slate-200/75 dark:bg-slate-800/80">
            <button
              type="button"
              onclick="state.exploreTab='derm'; renderAll();"
              class="py-2 rounded-xl text-xs sm:text-sm font-display font-extrabold transition ${
                isDerm ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-xs' : 'text-slate-600 dark:text-slate-400'
              }"
            >Dermatomes (L2–S1)</button>
            <button
              type="button"
              onclick="state.exploreTab='periph'; renderAll();"
              class="py-2 rounded-xl text-xs sm:text-sm font-display font-extrabold transition ${
                !isDerm ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-xs' : 'text-slate-600 dark:text-slate-400'
              }"
            >Peripheral Nerves (6)</button>
          </div>

          <!-- Interactive Labeled SVG -->
          <div class="rounded-3xl bg-white dark:bg-[#131c31] border-2 border-slate-200 dark:border-slate-800 p-3 shadow-xs">
            ${isDerm
              ? buildDermatomeLegSVG('teach', state.exploreDerm, null, null)
              : buildPeripheralLegSVG('teach', state.explorePeriph, null)}
          </div>

          <!-- Quick-Tap Root / Nerve Pills -->
          <div class="flex flex-wrap gap-1.5 justify-center">
            ${isDerm
              ? Object.keys(DERMATOME_DATA).map((k) => `
                  <button
                    type="button"
                    onclick="inspectDermZone('${k}')"
                    class="px-3.5 py-1.5 rounded-xl text-xs font-display font-extrabold border-2 transition ${
                      state.exploreDerm === k
                        ? 'bg-[#007aff] text-white border-[#007aff]'
                        : 'bg-white dark:bg-[#131c31] border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300'
                    }"
                  >${k}</button>
                `).join('')
              : Object.entries(PERIPHERAL_DATA).map(([k, v]) => `
                  <button
                    type="button"
                    onclick="inspectPeriphZone('${k}')"
                    class="px-3 py-1.5 rounded-xl text-xs font-display font-extrabold border-2 transition ${
                      state.explorePeriph === k
                        ? 'bg-[#007aff] text-white border-[#007aff]'
                        : 'bg-white dark:bg-[#131c31] border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300'
                    }"
                  >${v.shortName || v.name.replace(' Nerve', '')}</button>
                `).join('')
            }
          </div>

          <!-- Colour-Coded Pinned Info Card -->
          <article class="rounded-3xl bg-white dark:bg-[#131c31] border-2 border-slate-200 dark:border-slate-800 p-5 space-y-3 shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 rounded-xl text-xs font-display font-extrabold border ${item.badgeClass}">${item.name}</span>
                ${item.roots ? `<span class="text-xs font-bold text-slate-400">${item.roots}</span>` : ''}
              </div>
              <span class="text-xs font-display font-extrabold text-slate-500 dark:text-slate-400">${item.hook}</span>
            </div>

            <div class="space-y-2.5 text-xs sm:text-sm">
              <!-- Blue: Sensation -->
              <div class="p-3 rounded-2xl bg-[#007aff]/10 border border-[#007aff]/25">
                <span class="block text-[10px] font-display font-extrabold uppercase text-[#007aff]">Sensation</span>
                <p class="font-medium mt-0.5">${item.sensation}</p>
              </div>

              <!-- Emerald: Myotome / Muscles -->
              <div class="p-3 rounded-2xl bg-[#10b981]/10 border border-[#10b981]/25">
                <span class="block text-[10px] font-display font-extrabold uppercase text-[#059669] dark:text-[#10b981]">${isDerm ? 'Myotome (Specific Muscles)' : 'Muscles & Actions'}</span>
                <p class="font-display font-extrabold text-[#059669] dark:text-[#34d399] mt-0.5">${isDerm ? item.myotome : item.muscles}</p>
                <p class="text-xs text-slate-600 dark:text-slate-300 mt-0.5">${isDerm ? item.action : item.actions}</p>
              </div>

              <!-- Purple: Reflex / Gait Screen -->
              <div class="p-3 rounded-2xl bg-[#8b5cf6]/10 border border-[#8b5cf6]/25">
                <span class="block text-[10px] font-display font-extrabold uppercase text-[#8b5cf6]">Reflex &amp; Gait Screen</span>
                <p class="font-bold mt-0.5">${isDerm ? `${item.reflex} • ${item.gait}` : item.reflexGait}</p>
              </div>

              <!-- Amber: Visual Analogy -->
              <div class="p-3 rounded-2xl bg-[#f59e0b]/10 border border-[#f59e0b]/25">
                <span class="block text-[10px] font-display font-extrabold uppercase text-[#d97706] dark:text-[#f59e0b]">💡 Visual Analogy</span>
                <p class="mt-0.5">${item.analogy}</p>
              </div>

              <!-- Coral Red: Assessor Trap -->
              <div class="p-3 rounded-2xl bg-[#ef4444]/10 border border-[#ef4444]/30">
                <span class="block text-[10px] font-display font-extrabold uppercase text-[#ef4444]">⚠️ Assessor Trap</span>
                <p class="font-bold text-rose-900 dark:text-rose-100 mt-0.5">${item.trap}</p>
              </div>
            </div>
          </article>

          <!-- Collapsible Exam Sequence & Grading Scales Drawer -->
          <section class="rounded-3xl bg-white dark:bg-[#131c31] border-2 border-slate-200 dark:border-slate-800 overflow-hidden">
            <button
              type="button"
              onclick="state.exploreGradingOpen=!state.exploreGradingOpen; renderAll();"
              class="w-full px-5 py-4 flex items-center justify-between gap-2 text-left"
            >
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded-lg text-[10px] font-display font-extrabold uppercase bg-[#f59e0b]/15 text-[#d97706] dark:text-[#f59e0b]">Grading</span>
                <span class="text-sm font-display font-extrabold">Exam Sequence &amp; Grading Scales</span>
              </div>
              <span class="text-xs font-bold text-slate-400">${state.exploreGradingOpen ? '▲' : '▼'}</span>
            </button>

            ${state.exploreGradingOpen ? `
              <div class="px-5 pb-5 pt-2 border-t border-slate-100 dark:border-slate-800 space-y-3 text-xs">
                <div class="p-3 rounded-2xl bg-[#007aff]/10 border border-[#007aff]/25">
                  <strong class="block text-[#007aff] uppercase text-[10px]">Sensory Sequence &amp; Scale (0–2)</strong>
                  <p class="font-display font-extrabold mt-0.5">Soft (R, L, compare) &rarr; Sharp (R, L, compare) &rarr; Discriminate</p>
                  <p class="text-slate-600 dark:text-slate-300 mt-1"><strong>2:</strong> Normal &bull; <strong>1:</strong> Altered/Impaired &bull; <strong>0:</strong> Absent</p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  <div class="p-3 rounded-2xl bg-[#10b981]/10 border border-[#10b981]/25 space-y-0.5">
                    <strong class="block text-[#059669] dark:text-[#10b981] uppercase text-[10px]">Myotomes (MRC 1–5)</strong>
                    <p><strong>5:</strong> Full power &bull; <strong>4:</strong> Reduced vs resistance</p>
                    <p><strong>3:</strong> Against gravity &bull; <strong>2:</strong> Gravity eliminated &bull; <strong>1:</strong> Flicker</p>
                  </div>

                  <div class="p-3 rounded-2xl bg-[#8b5cf6]/10 border border-[#8b5cf6]/25 space-y-0.5">
                    <strong class="block text-[#8b5cf6] uppercase text-[10px]">Lower Limb Reflexes (1+ to 4+)</strong>
                    <p><strong>1+:</strong> Diminished &bull; <strong>2+:</strong> Normal</p>
                    <p><strong>3+:</strong> Brisker &bull; <strong>4+:</strong> Hyperreflexia + clonus (0 = absent)</p>
                  </div>
                </div>
              </div>
            ` : ''}
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 11. COMPLETION SCREEN + CONFETTI
    // =========================================================================
    function renderCelebrationScreen() {
      const acc = state.firstTryTotal > 0
        ? Math.round((state.firstTryCorrect / state.firstTryTotal) * 100)
        : 100;

      return `
        <div class="step-enter relative overflow-hidden rounded-3xl bg-white dark:bg-[#131c31] border-2 border-[#10b981]/60 p-6 sm:p-8 text-center space-y-6 shadow-lg">
          <div id="confetti-layer" class="absolute inset-0 overflow-hidden pointer-events-none"></div>

          <div class="relative z-10 space-y-2">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-[#10b981] text-white text-3xl flex items-center justify-center shadow-md">🏆</div>
            <span class="inline-block px-3 py-1 rounded-xl text-xs font-display font-extrabold uppercase bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300">
              Lesson 2 Complete!
            </span>
            <h2 class="text-2xl sm:text-3xl font-display font-extrabold">Lower Limb Mastered</h2>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
              You conquered L2–S1 dermatomes, specific myotomes, 1+–4+ reflexes, and all 6 lower limb peripheral nerves.
            </p>
          </div>

          <!-- Stats Row -->
          <div class="relative z-10 grid grid-cols-2 gap-3">
            <div class="p-4 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border-2 border-amber-200 dark:border-amber-800">
              <span class="block text-[11px] font-display font-extrabold uppercase text-amber-700 dark:text-amber-400">XP Earned</span>
              <span class="text-2xl font-display font-extrabold text-amber-600 dark:text-amber-300">+${state.xp} XP</span>
            </div>
            <div class="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border-2 border-emerald-200 dark:border-emerald-800">
              <span class="block text-[11px] font-display font-extrabold uppercase text-emerald-700 dark:text-emerald-400">Accuracy</span>
              <span class="text-2xl font-display font-extrabold text-emerald-600 dark:text-emerald-300">${acc}%</span>
            </div>
          </div>

          <!-- Mistake Mastery Callout -->
          <div class="relative z-10 p-3.5 rounded-2xl bg-sky-50 dark:bg-sky-950/35 border border-sky-200 dark:border-sky-800 text-xs sm:text-sm font-semibold text-sky-900 dark:text-sky-100">
            ${state.hadMistakes
              ? '🔁 <strong>Mistake Mastery:</strong> You replayed and nailed every missed clinical trap before finishing!'
              : '✨ <strong>Flawless Run:</strong> Zero mistakes — every assessor trap cleared on the first try!'}
          </div>

          <!-- Chunky 3D Action Buttons -->
          <div class="relative z-10 space-y-2.5 pt-1">
            <button type="button" onclick="replayLesson()" class="btn-3d btn-emerald w-full py-3.5 text-sm">
              ↺ REPLAY LESSON
            </button>
            <button type="button" onclick="setAppMode('explore')" class="btn-3d btn-blue w-full py-3.5 text-sm">
              🔬 OPEN EXPLORE LAB
            </button>
            <a href="neuro.html" class="btn-3d btn-neutral block w-full py-3.5 text-sm text-center">
              &larr; BACK TO NEURO HUB
            </a>
          </div>
        </div>
      `;
    }

    function spawnConfetti() {
      const layer = document.getElementById('confetti-layer');
      if (!layer) return;
      const colors = ['#10b981', '#007aff', '#8b5cf6', '#f59e0b', '#ef4444'];
      for (let i = 0; i < 36; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.backgroundColor = colors[i % colors.length];
        piece.style.animationDuration = `${1.6 + Math.random() * 1.4}s`;
        piece.style.animationDelay = `${Math.random() * 0.4}s`;
        layer.appendChild(piece);
      }
    }

    // =========================================================================
    // 12. INITIALISE LESSON 2
    // =========================================================================
    initTheme();
    renderAll();
  </script>
</body>
</html>
