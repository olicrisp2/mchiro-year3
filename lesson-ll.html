<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lower Limb Visual Lesson – MChiro Year 3 Hub</title>

  <!-- Google Fonts: Plus Jakarta Sans (Display/Buttons) & Inter (Clinical Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================================
       1. DESIGN TOKENS & THEME VARIABLES (LIGHT / DARK SYNCED: mchiro_theme)
       ========================================================================= */
    :root {
      --bg-page: #f3f6fa;
      --bg-card: #ffffff;
      --bg-subtle: #eef2f7;
      --bg-header: rgba(255, 255, 255, 0.94);
      --border-card: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;

      /* Semantic Cognitive Colour-Coding */
      --sem-blue: #2563eb;
      --sem-blue-soft: rgba(37, 99, 235, 0.11);
      --sem-blue-border: rgba(37, 99, 235, 0.3);

      --sem-emerald: #10b981;
      --sem-emerald-dark: #047857;
      --sem-emerald-soft: rgba(16, 185, 129, 0.12);
      --sem-emerald-border: rgba(16, 185, 129, 0.34);

      --sem-purple: #8b5cf6;
      --sem-purple-soft: rgba(139, 92, 246, 0.12);
      --sem-purple-border: rgba(139, 92, 246, 0.32);

      --sem-red: #ef4444;
      --sem-red-dark: #b91c1c;
      --sem-red-soft: rgba(239, 68, 68, 0.11);
      --sem-red-border: rgba(239, 68, 68, 0.34);

      --sem-amber: #f59e0b;
      --sem-amber-dark: #b45309;
      --sem-amber-soft: rgba(245, 158, 11, 0.13);
      --sem-amber-border: rgba(245, 158, 11, 0.36);

      /* SVG Anatomical Tokens */
      --svg-bg: #f8fafc;
      --svg-limb-base: #e6ecf4;
      --svg-limb-quiz: #dfe7f2;
      --svg-limb-quiz-hover: #cbd6e6;
      --svg-outline: #263449;
      --svg-landmark: rgba(38, 52, 73, 0.42);
      --svg-divider: #475569;
      --svg-label-bg: #ffffff;
      --svg-label-text: #0f172a;
      --drawer-correct-bg: #ecfdf5;
      --drawer-wrong-bg: #fef2f2;
      --shadow-card: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .dark {
      --bg-page: #0b1120;
      --bg-card: #131d33;
      --bg-subtle: #1c2944;
      --bg-header: rgba(11, 17, 32, 0.94);
      --border-card: #263654;
      --border-strong: #374b70;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;

      --sem-blue-soft: rgba(37, 99, 235, 0.22);
      --sem-blue-border: rgba(96, 165, 250, 0.38);
      --sem-emerald-soft: rgba(16, 185, 129, 0.18);
      --sem-emerald-border: rgba(52, 211, 153, 0.36);
      --sem-purple-soft: rgba(139, 92, 246, 0.2);
      --sem-purple-border: rgba(167, 139, 250, 0.38);
      --sem-red-soft: rgba(239, 68, 68, 0.2);
      --sem-red-border: rgba(248, 113, 113, 0.4);
      --sem-amber-soft: rgba(245, 158, 11, 0.2);
      --sem-amber-border: rgba(251, 191, 36, 0.4);

      --svg-bg: #0f172a;
      --svg-limb-base: #1e293b;
      --svg-limb-quiz: #23324d;
      --svg-limb-quiz-hover: #304569;
      --svg-outline: #cbd5e1;
      --svg-landmark: rgba(203, 213, 225, 0.42);
      --svg-divider: #94a3b8;
      --svg-label-bg: #0f172a;
      --svg-label-text: #f8fafc;
      --drawer-correct-bg: #08291f;
      --drawer-wrong-bg: #2c1018;
      --shadow-card: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    /* =========================================================================
       2. BASE RESET & TYPOGRAPHY
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.48;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    h1, h2, h3, h4, .font-display {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      margin: 0;
    }

    p { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* =========================================================================
       3. STICKY HEADER & DUOLINGO PROGRESS BAR
       ========================================================================= */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-header);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-card);
    }

    .header-inner {
      max-width: 560px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 11px;
      border-radius: 12px;
      background: var(--bg-subtle);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 800;
      transition: background-color 0.15s ease;
      flex-shrink: 0;
    }
    .back-btn:hover { background: var(--border-card); }

    .mode-switch {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border-radius: 12px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 11px;
      border-radius: 9px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .xp-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 12px;
      background: var(--sem-amber-soft);
      border: 1px solid var(--sem-amber-border);
      color: var(--sem-amber-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .dark .xp-pill { color: #fbbf24; }

    .theme-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--border-card);
      background: var(--bg-subtle);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .theme-btn:hover { background: var(--border-card); }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-row.hidden { display: none; }

    .progress-track {
      flex: 1;
      height: 14px;
      border-radius: 999px;
      background: var(--bg-subtle);
      padding: 2px;
      overflow: hidden;
    }

    .progress-fill {
      position: relative;
      height: 100%;
      border-radius: 999px;
      background: var(--sem-emerald);
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.25s ease;
      overflow: hidden;
    }
    .progress-fill.replay { background: var(--sem-amber); }
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 6px;
      right: 6px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
    }

    .progress-label {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* =========================================================================
       4. MAIN LAYOUT, CARDS & BADGES
       ========================================================================= */
    .app-main {
      flex: 1;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 16px 14px 144px;
    }

    .stack { display: flex; flex-direction: column; gap: 14px; }
    .stack-sm { display: flex; flex-direction: column; gap: 10px; }

    .card {
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: 22px;
      box-shadow: var(--shadow-card);
    }

    .svg-card {
      padding: 12px;
    }

    .info-card {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-blue { background: var(--sem-blue-soft); color: var(--sem-blue); }
    .dark .badge-blue { color: #60a5fa; }
    .badge-emerald { background: var(--sem-emerald-soft); color: var(--sem-emerald-dark); }
    .dark .badge-emerald { color: #34d399; }
    .badge-purple { background: var(--sem-purple-soft); color: var(--sem-purple); }
    .dark .badge-purple { color: #c4b5fd; }
    .badge-red { background: var(--sem-red-soft); color: var(--sem-red); border: 1px solid var(--sem-red-border); }
    .dark .badge-red { color: #fca5a5; }
    .badge-amber { background: var(--sem-amber-soft); color: var(--sem-amber-dark); border: 1px solid var(--sem-amber-border); }
    .dark .badge-amber { color: #fcd34d; }

    .step-title {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.24;
      margin-top: 8px;
    }

    .step-prompt {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.35;
      margin-top: 8px;
    }

    .step-sub {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Quick Selector Pills */
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .pill-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .pill-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .zone-pill {
      flex: 1;
      min-width: 54px;
      padding: 9px 10px;
      border-radius: 13px;
      border: 2px solid var(--border-card);
      background: var(--bg-card);
      color: var(--text-muted);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.14s ease;
      text-align: center;
    }
    .zone-pill:hover { border-color: var(--sem-blue); color: var(--text-main); }
    .zone-pill.active {
      background: var(--sem-blue);
      border-color: var(--sem-blue);
      color: #ffffff;
    }

    /* Semantic Info Boxes */
    .sem-box {
      padding: 11px 13px;
      border-radius: 14px;
      font-size: 13px;
      border: 1px solid transparent;
    }
    .sem-box-label {
      display: block;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }

    .sem-blue { background: var(--sem-blue-soft); border-color: var(--sem-blue-border); }
    .sem-blue .sem-box-label { color: var(--sem-blue); }
    .dark .sem-blue .sem-box-label { color: #60a5fa; }

    .sem-emerald { background: var(--sem-emerald-soft); border-color: var(--sem-emerald-border); }
    .sem-emerald .sem-box-label { color: var(--sem-emerald-dark); }
    .dark .sem-emerald .sem-box-label { color: #34d399; }

    .sem-purple { background: var(--sem-purple-soft); border-color: var(--sem-purple-border); }
    .sem-purple .sem-box-label { color: var(--sem-purple); }
    .dark .sem-purple .sem-box-label { color: #c4b5fd; }

    .sem-amber { background: var(--sem-amber-soft); border-color: var(--sem-amber-border); }
    .sem-amber .sem-box-label { color: var(--sem-amber-dark); }
    .dark .sem-amber .sem-box-label { color: #fbbf24; }

    .sem-red { background: var(--sem-red-soft); border-color: var(--sem-red-border); }
    .sem-red .sem-box-label { color: var(--sem-red); }
    .dark .sem-red .sem-box-label { color: #f87171; }

    /* Mini Highlight Cards (Step 4 L4/L5/S1) */
    .mini-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }
    .mini-tile {
      padding: 10px 8px;
      border-radius: 14px;
      border: 1px solid var(--border-card);
    }
    .mini-tile strong {
      display: block;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 800;
    }
    .mini-tile span {
      display: block;
      font-size: 11px;
      font-weight: 600;
      margin-top: 2px;
      color: var(--text-muted);
    }

    /* =========================================================================
       5. TACTILE 3D DUOLINGO BUTTONS & CHUNKY CHOICE CARDS
       ========================================================================= */
    .btn-3d {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s ease, border-bottom-width 0.08s ease, background-color 0.15s ease, opacity 0.15s ease;
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px !important;
    }
    .btn-3d:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-emerald {
      background: var(--sem-emerald);
      color: #ffffff;
      border: 2px solid var(--sem-emerald);
      border-bottom: 4px solid var(--sem-emerald-dark);
    }
    .btn-emerald:hover:not(:disabled) { background: #059669; }

    .btn-blue {
      background: var(--sem-blue);
      color: #ffffff;
      border: 2px solid var(--sem-blue);
      border-bottom: 4px solid #1d4ed8;
    }
    .btn-blue:hover:not(:disabled) { background: #1d4ed8; }

    .btn-red {
      background: var(--sem-red);
      color: #ffffff;
      border: 2px solid var(--sem-red);
      border-bottom: 4px solid var(--sem-red-dark);
    }
    .btn-red:hover:not(:disabled) { background: #dc2626; }

    .btn-neutral {
      background: var(--bg-card);
      color: var(--text-main);
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-strong);
    }
    .btn-neutral:hover:not(:disabled) { background: var(--bg-subtle); }

    .choice-card {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-card);
      color: var(--text-main);
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .choice-card:hover:not(:disabled) {
      border-color: var(--sem-blue);
      background: var(--sem-blue-soft);
    }
    .choice-card:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
    .choice-card:disabled { cursor: default; }

    .choice-letter {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-card);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .choice-text {
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.35;
    }

    .choice-selected {
      border-color: var(--sem-blue) !important;
      border-bottom-color: #1d4ed8 !important;
      background: var(--sem-blue-soft) !important;
    }
    .choice-selected .choice-letter {
      background: var(--sem-blue);
      border-color: var(--sem-blue);
      color: #ffffff;
    }

    .choice-correct {
      border-color: var(--sem-emerald) !important;
      border-bottom-color: var(--sem-emerald-dark) !important;
      background: var(--sem-emerald-soft) !important;
    }
    .choice-correct .choice-letter {
      background: var(--sem-emerald);
      border-color: var(--sem-emerald);
      color: #ffffff;
    }

    .choice-wrong {
      border-color: var(--sem-red) !important;
      border-bottom-color: var(--sem-red-dark) !important;
      background: var(--sem-red-soft) !important;
    }
    .choice-wrong .choice-letter {
      background: var(--sem-red);
      border-color: var(--sem-red);
      color: #ffffff;
    }

    /* =========================================================================
       6. INTERACTIVE SVG ANATOMY STYLING
       ========================================================================= */
    .anatomy-svg {
      display: block;
      width: 100%;
      max-width: 390px;
      height: auto;
      margin: 0 auto;
      user-select: none;
    }

    .leg-zone {
      cursor: pointer;
      transition: fill 0.16s ease, fill-opacity 0.16s ease, opacity 0.16s ease, filter 0.16s ease;
    }
    .leg-zone:hover { filter: brightness(1.07); }

    .leg-zone-quiz { fill: var(--svg-limb-quiz); }
    .leg-zone-quiz:hover { fill: var(--svg-limb-quiz-hover); }

    .leg-zone-selected {
      fill: var(--sem-blue) !important;
      fill-opacity: 0.84 !important;
      filter: drop-shadow(0 0 7px rgba(37, 99, 235, 0.55));
    }

    .leg-zone-correct {
      fill: var(--sem-emerald) !important;
      fill-opacity: 0.9 !important;
      animation: pulseGreen 0.65s ease-in-out 2;
    }

    .leg-zone-wrong {
      fill: var(--sem-red) !important;
      fill-opacity: 0.86 !important;
    }

    .leg-zone-inspected {
      filter: drop-shadow(0 0 8px rgba(37, 99, 235, 0.45));
    }

    .leg-zone-dim { opacity: 0.25; }

    @keyframes pulseGreen {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(16, 185, 129, 0)); }
      50% { filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.95)); }
    }

    /* =========================================================================
       7. FIXED BOTTOM ACTION / FEEDBACK DRAWER & ANIMATIONS
       ========================================================================= */
    .bottom-drawer-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      pointer-events: none;
    }

    .drawer-bar {
      pointer-events: auto;
      background: var(--bg-header);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-card);
    }

    .drawer-feedback {
      pointer-events: auto;
      border-top-width: 2px;
      border-top-style: solid;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.14);
      animation: slideUp 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .drawer-feedback.correct {
      background: var(--drawer-correct-bg);
      border-top-color: var(--sem-emerald);
    }
    .drawer-feedback.wrong {
      background: var(--drawer-wrong-bg);
      border-top-color: var(--sem-red);
    }

    .drawer-inner {
      max-width: 560px;
      margin: 0 auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .fb-row {
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    .fb-icon {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      color: #ffffff;
      font-weight: 800;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .fb-icon.correct { background: var(--sem-emerald); }
    .fb-icon.wrong { background: var(--sem-red); }

    .fb-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15.5px;
      font-weight: 800;
    }
    .fb-title.correct { color: var(--sem-emerald-dark); }
    .dark .fb-title.correct { color: #34d399; }
    .fb-title.wrong { color: var(--sem-red-dark); }
    .dark .fb-title.wrong { color: #fca5a5; }

    .fb-msg {
      font-size: 13px;
      margin-top: 2px;
      color: var(--text-main);
    }

    .hint-text {
      text-align: center;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Explore Lab Segmented Toggle & Collapsible Drawer */
    .sub-seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      border-radius: 16px;
      background: var(--bg-subtle);

    .sub-seg-btn {

      border-radius: 11px;

      font-weight: 800;

      transition: all 0.15s ease;
    }
    .sub-seg-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.09);
    }

    .accordion-trigger {
      width: 100%;
      padding: 15px 16px;
      border: none;
      background: transparent;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: left;
    }

    .accordion-body {
      padding: 0 16px 16px;
      border-top: 1px solid var(--border-card);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

      position: relative;
      overflow: hidden;
      padding: 28px 20px;
      text-align: center;
      border-color: var(--sem-emerald);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .trophy-badge {
      width: 66px;
      height: 66px;
      margin: 0 auto;
      border-radius: 20px;
      background: var(--sem-emerald);
      color: #ffffff;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-box {
      padding: 14px;
      border-radius: 16px;
      border: 2px solid transparent;
    }
    .stat-val {
      display: block;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 24px;
      font-weight: 800;
      margin-top: 2px;
    }

    .confetti-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti-piece {
      position: absolute;
      top: -12px;
      width: 9px;
      height: 13px;
      border-radius: 3px;
      animation: confettiFall linear forwards;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.7; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes stepIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .step-enter { animation: stepIn 0.2s ease-out forwards; }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(400px) rotate(540deg); opacity: 0; }
    }

    .flex-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    // =========================================================================
    // 6. INTERACTION HANDLERS
    // =========================================================================
    function setAppMode(mode) {
      state.appMode = mode;
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function inspectDermZone(zId) {
      if (state.appMode === 'explore') state.exploreDerm = zId;
      else state.teachSelectedDerm = zId;
      renderAll();
    }

    function inspectPeriphZone(nId) {
      if (state.appMode === 'explore') state.explorePeriph = nId;
      else state.teachSelectedPeriph = nId;
      renderAll();
    }

    function selectQuizZone(zId) {
      if (state.checked) return;
      state.selectedAnswer = zId;
      renderAll();
    }

    function selectChoice(optId) {
      if (state.checked) return;
      state.selectedAnswer = optId;
      renderAll();
    }

    function awardStepXp(stepId) {
      if (!state.earnedStepXp[stepId]) {
        state.earnedStepXp[stepId] = true;
        state.xp += 10; // 12 steps × 10 XP = +120 XP
      }
    }

    function checkAnswer() {
      const step = getCurrentStep();
      if (!state.selectedAnswer || state.checked) return;

      const correctVal = step.type === 'choice' ? step.correct : step.target;
      const isRight = state.selectedAnswer === correctVal;

      state.checked = true;
      state.isCorrect = isRight;

      if (!state.inMistakeReplay && !state.seenQuizSteps[step.id]) {
        state.seenQuizSteps[step.id] = true;
        state.firstTryTotal++;
        if (isRight) state.firstTryCorrect++;
      }

      if (isRight) {
        awardStepXp(step.id);
      } else {
        state.hadMistakes = true;
        const origIdx = LESSON_STEPS.findIndex((s) => s.id === step.id);
        if (!state.inMistakeReplay) {
          if (!state.mistakeQueue.includes(origIdx)) state.mistakeQueue.push(origIdx);
        } else {
          state.mistakeQueue.push(origIdx);
        }
      }

      renderAll();
    }

    function continueLesson() {
      const step = getCurrentStep();
      if (step && step.type.startsWith('teach_')) {
        awardStepXp(step.id);
      }

      state.selectedAnswer = null;
      state.checked = false;
      state.isCorrect = false;

      if (!state.inMistakeReplay) {
        if (state.stepIdx + 1 < LESSON_STEPS.length) {
          state.stepIdx++;
          const next = LESSON_STEPS[state.stepIdx];
          if (next.type === 'teach_thigh') state.teachSelectedDerm = 'L2';
          if (next.type === 'teach_shin') state.teachSelectedDerm = 'L4';
          if (next.type === 'teach_periph') state.teachSelectedPeriph = 'fibular';
        } else if (state.mistakeQueue.length > 0) {
          state.inMistakeReplay = true;
          state.mistakeCursor = 0;
        } else {
          state.completed = true;
        }
      } else {
        if (state.mistakeCursor + 1 < state.mistakeQueue.length) {
          state.mistakeCursor++;
        } else {
          state.completed = true;
        }
      }

      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function replayLesson() {
      state.appMode = 'lesson';
      state.stepIdx = 0;
      state.inMistakeReplay = false;
      state.mistakeQueue = [];
      state.mistakeCursor = 0;
      state.hadMistakes = false;
      state.completed = false;
      state.selectedAnswer = null;
      state.checked = false;
      state.isCorrect = false;
      state.teachSelectedDerm = 'L2';
      state.teachSelectedPeriph = 'fibular';
      state.xp = 0;
      state.earnedStepXp = {};
      state.firstTryTotal = 0;
      state.firstTryCorrect = 0;
      state.seenQuizSteps = {};
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // 7. RENDER ENGINE
    // =========================================================================
    function renderHeader() {
      document.getElementById('mode-btn-lesson').classList.toggle('active', state.appMode === 'lesson');
      document.getElementById('mode-btn-explore').classList.toggle('active', state.appMode === 'explore');
      document.getElementById('xp-value').textContent = `${state.xp} XP`;

      const row = document.getElementById('progress-row');
      const fill = document.getElementById('progress-fill');
      const lbl = document.getElementById('progress-label');

      if (state.appMode === 'explore') {
        row.classList.add('hidden');
        return;
      }
      row.classList.remove('hidden');

      if (state.completed) {
        fill.style.width = '100%';
        fill.classList.remove('replay');
        lbl.textContent = '12 / 12';
      } else if (state.inMistakeReplay) {
        const remaining = state.mistakeQueue.length - state.mistakeCursor;
        const pct = Math.max(15, Math.round((state.mistakeCursor / state.mistakeQueue.length) * 100));
        fill.style.width = `${pct}%`;
        fill.classList.add('replay');
        lbl.textContent = `🔁 ${remaining} left`;
      } else {
        const pct = Math.max(8, Math.round(((state.stepIdx + (state.checked && state.isCorrect ? 1 : 0)) / LESSON_STEPS.length) * 100));
        fill.style.width = `${pct}%`;
        fill.classList.remove('replay');
        lbl.textContent = `${state.stepIdx + 1} / ${LESSON_STEPS.length}`;
      }
    }

    function renderAll() {
      renderHeader();
      const main = document.getElementById('app-main');
      const drawer = document.getElementById('bottom-drawer');

      if (state.appMode === 'explore') {
        main.innerHTML = renderExploreLab();
        drawer.innerHTML = '';
        return;
      }

      if (state.completed) {
        main.innerHTML = renderCelebrationScreen();
        drawer.innerHTML = '';
        spawnConfetti();
        return;
      }

      const step = getCurrentStep();
      main.innerHTML = renderLessonStep(step);
      drawer.innerHTML = renderBottomDrawer(step);
    }

    // =========================================================================
    // 8. RENDER LESSON STEPS
    // =========================================================================
    function renderLessonStep(step) {
      const mistakeBanner = state.inMistakeReplay
        ? `<div style="margin-bottom:8px;"><span class="step-badge badge-amber">🔁 Mistake Review</span></div>`
        : '';

      if (step.type === 'teach_thigh' || step.type === 'teach_shin') {
        const z = DERMATOME_DATA[state.teachSelectedDerm] || DERMATOME_DATA[step.focusZones[0]];
        return `
          <div class="stack step-enter">
            <div>
              <span class="step-badge badge-blue">${step.badge}</span>
              <h2 class="step-title">${step.title}</h2>
              <p class="step-sub">${step.subtitle}</p>
            </div>

            <div class="pill-row">
              ${step.focusZones.map((code) => `
                <button type="button" class="zone-pill ${state.teachSelectedDerm === code ? 'active' : ''}" onclick="inspectDermZone('${code}')">${code}</button>
              `).join('')}
            </div>

            <div class="card svg-card">
              ${buildDermatomeLegSVG('teach', state.teachSelectedDerm, null, step.focusZones)}
            </div>

            ${step.type === 'teach_shin' ? `
              <div class="mini-grid-3">
                <div class="mini-tile sem-emerald">
                  <strong>L4</strong>
                  <span>Heel Walk &bull; Patellar</span>
                </div>
                <div class="mini-tile sem-red">
                  <strong>L5</strong>
                  <span>Big Toe &bull; NO Reflex</span>
                </div>
                <div class="mini-tile sem-amber">
                  <strong>S1</strong>
                  <span>Toe Walk &bull; Achilles</span>
                </div>
              </div>
            ` : ''}

            <div class="card info-card">
              <div class="flex-between">
                <span class="step-badge ${z.badgeCls}">${z.name}</span>
                <span style="font-size:12px;font-weight:700;color:var(--text-muted);">${z.hook}</span>
              </div>
              <div class="sem-box sem-blue">
                <span class="sem-box-label">Sensation</span>
                <p>${z.sensation}</p>
              </div>
              <div class="sem-box sem-emerald">
                <span class="sem-box-label">Myotome (Specific Muscles)</span>
                <p><strong>${z.myotome}</strong> (${z.action})</p>
              </div>
              <div class="sem-box sem-purple">
                <span class="sem-box-label">Reflex</span>
                <p><strong>${z.reflex}</strong></p>
              </div>
              <div class="sem-box sem-amber">
                <span class="sem-box-label">💡 Visual Analogy</span>
                <p>${z.analogy}</p>
              </div>
            </div>
          </div>
        `;
      }

      if (step.type === 'teach_periph') {
        const p = PERIPHERAL_DATA[state.teachSelectedPeriph] || PERIPHERAL_DATA.fibular;
        const keys = ['femoral', 'lfcn', 'obturator', 'sciatic', 'tibial', 'fibular'];
        return `
          <div class="stack step-enter">
            <div>
              <span class="step-badge badge-purple">${step.badge}</span>
              <h2 class="step-title">${step.title}</h2>
              <p class="step-sub">${step.subtitle}</p>
            </div>

            <div class="pill-grid-3">
              ${keys.map((k) => `
                <button type="button" class="zone-pill ${state.teachSelectedPeriph === k ? 'active' : ''}" onclick="inspectPeriphZone('${k}')">${PERIPHERAL_DATA[k].shortName}</button>
              `).join('')}
            </div>

            <div class="card svg-card">
              ${buildPeripheralLegSVG('teach', state.teachSelectedPeriph, null)}
            </div>

            <div class="card info-card">
              <div class="flex-between">
                <span class="step-badge ${p.badgeCls}">${p.name}</span>
                <span style="font-size:12px;font-weight:700;color:var(--text-muted);">${p.roots}</span>
              </div>
              <div class="sem-box sem-blue">
                <span class="sem-box-label">Sensation</span>
                <p>${p.sensation}</p>
              </div>
              <div class="sem-box sem-emerald">
                <span class="sem-box-label">Motor Supply</span>
                <p><strong>${p.muscles}</strong> — ${p.actions}</p>
              </div>
              <div class="sem-box sem-red">
                <span class="sem-box-label">⚠️ Assessor Trap</span>
                <p><strong>${p.trap}</strong></p>
              </div>
            </div>
          </div>
        `;
      }

      if (step.type === 'quiz_derm' || step.type === 'quiz_periph') {
        const fb = {
          selected: state.selectedAnswer,
          correctTarget: step.target,
          checked: state.checked,
          isCorrect: state.isCorrect,
        };
        return `
          <div class="stack step-enter">
            <div>
              ${mistakeBanner}
              <span class="step-badge badge-emerald">${step.badge}</span>
              <h2 class="step-prompt">${step.prompt}</h2>
            </div>

            <div class="card svg-card">
              ${step.type === 'quiz_derm'
                ? buildDermatomeLegSVG('quiz', null, fb, null)
                : buildPeripheralLegSVG('quiz', null, fb)}
            </div>

            <p class="hint-text">
              ${state.selectedAnswer && !state.checked
                ? 'Zone highlighted — tap <strong>CHECK</strong> below to confirm!'
                : !state.checked
                  ? 'Tap directly on the anatomical region above.'
                  : ''}
            </p>
          </div>
        `;
      }

      if (step.type === 'choice') {
        return `
          <div class="stack step-enter">
            <div>
              ${mistakeBanner}
              <span class="step-badge ${step.isTrap ? 'badge-red' : 'badge-blue'}">${step.badge}</span>
              <h2 class="step-prompt">${step.prompt}</h2>
            </div>

            <div class="stack-sm">
              ${step.options.map((opt, idx) => {
                const letter = ['A', 'B', 'C', 'D'][idx];
                let cls = '';
                if (state.checked) {
                  if (opt.id === step.correct) cls = 'choice-correct';
                  else if (opt.id === state.selectedAnswer && !state.isCorrect) cls = 'choice-wrong';
                } else if (state.selectedAnswer === opt.id) {
                  cls = 'choice-selected';
                }
                return `
                  <button type="button" ${state.checked ? 'disabled' : ''} class="choice-card ${cls}" onclick="selectChoice('${opt.id}')">
                    <span class="choice-letter">${letter}</span>
                    <span class="choice-text">${opt.text}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      return '';
    }

    // =========================================================================
    // 9. FIXED BOTTOM ACTION / FEEDBACK DRAWER
    // =========================================================================
    function renderBottomDrawer(step) {
      if (step.type.startsWith('teach_')) {
        return `
          <div class="drawer-bar">
            <div class="drawer-inner">
              <button type="button" class="btn-3d btn-emerald" onclick="continueLesson()">CONTINUE</button>
            </div>
          </div>
        `;
      }

      if (!state.checked) {
        return `
          <div class="drawer-bar">
            <div class="drawer-inner">
              <button type="button" class="btn-3d btn-blue" ${state.selectedAnswer ? '' : 'disabled'} onclick="checkAnswer()">CHECK</button>
            </div>
          </div>
        `;
      }

      if (state.isCorrect) {
        return `
          <div class="drawer-feedback correct">
            <div class="drawer-inner">
              <div class="fb-row">
                <span class="fb-icon correct">✓</span>
                <div>
                  <p class="fb-title correct">Spot on! +10 XP</p>
                  <p class="fb-msg">${step.correctMsg}</p>
                </div>
              </div>
              <button type="button" class="btn-3d btn-emerald" onclick="continueLesson()">CONTINUE</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="drawer-feedback wrong">
          <div class="drawer-inner">
            <div class="fb-row">
              <span class="fb-icon wrong">✕</span>
              <div>
                <p class="fb-title wrong">Watch the Trap! (Queued for Mistake Review)</p>
                <p class="fb-msg">${step.wrongMsg}</p>
              </div>
            </div>
            <button type="button" class="btn-3d btn-red" onclick="continueLesson()">GOT IT</button>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 10. FREE EXPLORE ANATOMY LAB
    // =========================================================================
    function renderExploreLab() {
      const isDerm = state.exploreTab === 'derm';
      const item = isDerm
        ? (DERMATOME_DATA[state.exploreDerm] || DERMATOME_DATA.L4)
        : (PERIPHERAL_DATA[state.explorePeriph] || PERIPHERAL_DATA.fibular);

      return `
        <div class="stack step-enter">
          <div>
            <span class="step-badge badge-blue">Free Explore Anatomy Lab</span>
            <h2 class="step-title">Tap Any Lower Limb Zone</h2>
          </div>

          <div class="sub-seg">
            <button type="button" class="sub-seg-btn ${isDerm ? 'active' : ''}" onclick="state.exploreTab='derm'; renderAll();">Dermatomes (L2–S1)</button>
            <button type="button" class="sub-seg-btn ${!isDerm ? 'active' : ''}" onclick="state.exploreTab='periph'; renderAll();">Peripheral Nerves (6)</button>
          </div>

          <div class="card svg-card">
            ${isDerm
              ? buildDermatomeLegSVG('teach', state.exploreDerm, null, null)
              : buildPeripheralLegSVG('teach', state.explorePeriph, null)}
          </div>

          <div class="${isDerm ? 'pill-row' : 'pill-grid-3'}">
            ${isDerm
              ? Object.keys(DERMATOME_DATA).map((k) => `
                  <button type="button" class="zone-pill ${state.exploreDerm === k ? 'active' : ''}" onclick="inspectDermZone('${k}')">${k}</button>
                `).join('')
              : Object.entries(PERIPHERAL_DATA).map(([k, v]) => `
                  <button type="button" class="zone-pill ${state.explorePeriph === k ? 'active' : ''}" onclick="inspectPeriphZone('${k}')">${v.shortName}</button>
                `).join('')
            }
          </div>

          <article class="card info-card">
            <div class="flex-between">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span class="step-badge ${item.badgeCls}">${item.name}</span>
                ${item.roots ? `<span style="font-size:12px;font-weight:700;color:var(--text-muted);">${item.roots}</span>` : ''}
              </div>
              <span style="font-size:12px;font-weight:700;color:var(--text-muted);">${item.hook}</span>
            </div>

            <div class="sem-box sem-blue">
              <span class="sem-box-label">Sensation</span>
              <p>${item.sensation}</p>
            </div>

            <div class="sem-box sem-emerald">
              <span class="sem-box-label">${isDerm ? 'Myotome (Specific Muscles)' : 'Muscles & Actions'}</span>
              <p><strong>${isDerm ? item.myotome : item.muscles}</strong></p>
              <p style="font-size:12.5px;color:var(--text-muted);margin-top:2px;">${isDerm ? item.action : item.actions}</p>
            </div>

            <div class="sem-box sem-purple">
              <span class="sem-box-label">Reflex &amp; Gait Screen</span>
              <p><strong>${isDerm ? `${item.reflex} • ${item.gait}` : item.reflexGait}</strong></p>
            </div>

            <div class="sem-box sem-amber">
              <span class="sem-box-label">💡 Visual Analogy</span>
              <p>${item.analogy}</p>
            </div>

            <div class="sem-box sem-red">
              <span class="sem-box-label">⚠️ Assessor Trap</span>
              <p><strong>${item.trap}</strong></p>
            </div>
          </article>

          <!-- Collapsible Exam Sequence & Grading Scales Drawer -->
          <section class="card">
            <button type="button" class="accordion-trigger" onclick="state.exploreGradingOpen=!state.exploreGradingOpen; renderAll();">
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="step-badge badge-amber">Grading</span>
                <span class="font-display" style="font-size:14px;font-weight:800;">Exam Sequence &amp; Grading Scales</span>
              </div>
              <span style="font-size:12px;font-weight:800;color:var(--text-muted);">${state.exploreGradingOpen ? '▲' : '▼'}</span>
            </button>

            ${state.exploreGradingOpen ? `
              <div class="accordion-body">
                <div class="sem-box sem-blue">
                  <span class="sem-box-label">Sensory Sequence &amp; Scale (0–2)</span>
                  <p><strong>Soft (R, L, compare) &rarr; Sharp (R, L, compare) &rarr; Discriminate as required</strong></p>
                  <p style="margin-top:4px;font-size:12.5px;color:var(--text-muted);"><strong>2:</strong> Normal &bull; <strong>1:</strong> Altered / Impaired &bull; <strong>0:</strong> Absent</p>
                </div>

                <div class="pill-grid-2">
                  <div class="sem-box sem-emerald">
                    <span class="sem-box-label">Myotomes (MRC 1–5)</span>
                    <p style="font-size:12px;"><strong>5:</strong> Full power<br><strong>4:</strong> Reduced vs resistance<br><strong>3:</strong> Against gravity<br><strong>2:</strong> Gravity eliminated &bull; <strong>1:</strong> Flicker</p>
                  </div>

                  <div class="sem-box sem-purple">
                    <span class="sem-box-label">Lower Limb Reflexes (1+ to 4+)</span>
                    <p style="font-size:12px;"><strong>1+:</strong> Diminished<br><strong>2+:</strong> Normal<br><strong>3+:</strong> Brisker<br><strong>4+:</strong> Hyperreflexia + clonus (0 = absent)</p>
                  </div>
                </div>
              </div>
            ` : ''}
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 11. CELEBRATION COMPLETION SCREEN + CONFETTI
    // =========================================================================
    function renderCelebrationScreen() {
      const acc = state.firstTryTotal > 0
        ? Math.round((state.firstTryCorrect / state.firstTryTotal) * 100)
        : 100;

      return `
        <div class="card celebration-card step-enter">
          <div id="confetti-layer" class="confetti-layer"></div>

          <div style="position:relative;z-index:2;" class="stack-sm">
            <div class="trophy-badge">🏆</div>
            <div><span class="step-badge badge-emerald">Lesson 2 Complete!</span></div>
            <h2 class="font-display" style="font-size:26px;font-weight:800;">Lower Limb Mastered</h2>
            <p class="step-sub">You nailed L2–S1 dermatomes, specific myotomes, 1+–4+ reflexes, and all 6 lower limb peripheral nerves.</p>
          </div>

          <div style="position:relative;z-index:2;" class="stat-grid">
            <div class="stat-box sem-amber">
              <span class="sem-box-label">XP Earned</span>
              <span class="stat-val" style="color:var(--sem-amber);">+${state.xp} XP</span>
            </div>
            <div class="stat-box sem-emerald">
              <span class="sem-box-label">First-Try Accuracy</span>
              <span class="stat-val" style="color:var(--sem-emerald);">${acc}%</span>
            </div>
          </div>

          <div style="position:relative;z-index:2;" class="sem-box sem-blue">
            <p style="font-weight:600;">
              ${state.hadMistakes
                ? '🔁 <strong>Mistake Mastery:</strong> You replayed and cleared every missed clinical trap before finishing!'
                : '✨ <strong>Flawless Run:</strong> Zero mistakes — every assessor trap cleared on the first try!'}
            </p>
          </div>

          <div style="position:relative;z-index:2;" class="stack-sm">
            <button type="button" class="btn-3d btn-emerald" onclick="replayLesson()">↺ REPLAY LESSON</button>
            <button type="button" class="btn-3d btn-blue" onclick="setAppMode('explore')">🔬 OPEN EXPLORE LAB</button>
            <a href="neuro.html" class="btn-3d btn-neutral">&larr; BACK TO NEURO HUB</a>
            <a href="index.html" class="btn-3d btn-neutral">🏠 HOME DASHBOARD</a>
          </div>
        </div>
      `;
    }

    function spawnConfetti() {
      const layer = document.getElementById('confetti-layer');
      if (!layer) return;
      const colors = ['#10b981', '#2563eb', '#8b5cf6', '#f59e0b', '#ef4444'];
      for (let i = 0; i < 36; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.backgroundColor = colors[i % colors.length];
        piece.style.animationDuration = `${1.5 + Math.random() * 1.4}s`;
        piece.style.animationDelay = `${Math.random() * 0.4}s`;
        layer.appendChild(piece);
      }
    }

    // =========================================================================
    // 12. INITIALISE
    // =========================================================================
    initTheme();
    renderAll();
  </script>
</body>
</html>
