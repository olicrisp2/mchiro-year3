<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson 1: Upper Limb SMR &amp; Peripheral Nerves – MChiro Year 3 Hub</title>

  <style>
    /* =========================================================================
       1. DESIGN TOKENS & THEME VARIABLES (LIGHT / DARK SYNCED: mchiro_theme)
       ========================================================================= */
    :root {
      --bg-page: #f3f6fa;
      --bg-card: #ffffff;
      --bg-subtle: #eef2f7;
      --bg-header: rgba(255, 255, 255, 0.94);
      --border-card: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;

      /* Semantic Cognitive Colour-Coding */
      --sem-blue: #0284c7;
      --sem-blue-dark: #0369a1;
      --sem-blue-soft: #e0f2fe;
      --sem-blue-border: #7dd3fc;

      --sem-emerald: #059669;
      --sem-emerald-dark: #047857;
      --sem-emerald-soft: #d1fae5;
      --sem-emerald-border: #6ee7b7;

      --sem-purple: #7c3aed;
      --sem-purple-dark: #6d28d9;
      --sem-purple-soft: #ede9fe;
      --sem-purple-border: #c4b5fd;

      --sem-coral: #e11d48;
      --sem-coral-dark: #be123c;
      --sem-coral-soft: #ffe4e6;
      --sem-coral-border: #fda4af;

      --sem-amber: #d97706;
      --sem-amber-dark: #b45309;
      --sem-amber-soft: #fef3c7;
      --sem-amber-border: #fcd34d;

      /* SVG Anatomical Tokens */
      --svg-bg: #f8fafc;
      --svg-limb-base: #e6ecf4;
      --svg-limb-quiz: #dfe7f2;
      --svg-limb-quiz-hover: #cbd6e6;
      --svg-outline: #1e293b;
      --svg-focus-stroke: #0f172a;
      --svg-landmark: rgba(30, 41, 59, 0.45);
      --svg-divider: #475569;
      --svg-label-bg: #ffffff;
      --svg-label-text: #0f172a;

      --drawer-correct-bg: #ecfdf5;
      --drawer-wrong-bg: #fff1f2;
      --shadow-card: 0 2px 10px rgba(15, 23, 42, 0.045);
    }

    .dark {
      --bg-page: #0b1120;
      --bg-card: #131d33;
      --bg-subtle: #1c2944;
      --bg-header: rgba(11, 17, 32, 0.94);
      --border-card: #263654;
      --border-strong: #374b70;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;

      --sem-blue-soft: rgba(2, 132, 199, 0.22);
      --sem-blue-border: rgba(56, 189, 248, 0.38);

      --sem-emerald-soft: rgba(5, 150, 105, 0.2);
      --sem-emerald-border: rgba(52, 211, 153, 0.36);

      --sem-purple-soft: rgba(124, 58, 237, 0.22);
      --sem-purple-border: rgba(167, 139, 250, 0.38);

      --sem-coral-soft: rgba(225, 29, 72, 0.22);
      --sem-coral-border: rgba(251, 113, 133, 0.4);

      --sem-amber-soft: rgba(217, 119, 6, 0.22);
      --sem-amber-border: rgba(251, 191, 36, 0.4);

      --svg-bg: #0f172a;
      --svg-limb-base: #1e293b;
      --svg-limb-quiz: #23324d;
      --svg-limb-quiz-hover: #304569;
      --svg-outline: #e2e8f0;
      --svg-focus-stroke: #ffffff;
      --svg-landmark: rgba(226, 232, 240, 0.48);
      --svg-divider: #94a3b8;
      --svg-label-bg: #0f172a;
      --svg-label-text: #f8fafc;

      --drawer-correct-bg: #08291f;
      --drawer-wrong-bg: #2c0f19;
      --shadow-card: 0 4px 18px rgba(0, 0, 0, 0.38);
    }

    /* =========================================================================
       2. BASE RESET & TYPOGRAPHY (ZERO-CDN INSTANT LOAD)
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.48;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    h1, h2, h3, h4, .font-display {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      letter-spacing: -0.015em;
      margin: 0;
    }
    p { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    .mono-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: -0.02em;
    }

    /* =========================================================================
       3. STICKY TOP BAR & DUOLINGO ANIMATED PROGRESS BAR
       ========================================================================= */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-header);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-card);
    }

    .header-inner {
      max-width: 560px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 11px;
      border-radius: 12px;
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 12.5px;
      font-weight: 800;
      transition: background-color 0.15s ease;
      flex-shrink: 0;
    }
    .back-btn:hover { background: var(--border-card); }

    .mode-switch {
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border-radius: 12px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .xp-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 12px;
      background: var(--sem-amber-soft);
      border: 1px solid var(--sem-amber-border);
      color: var(--sem-amber-dark);
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .dark .xp-pill { color: #fbbf24; }

    .theme-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--border-card);
      background: var(--bg-subtle);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .theme-btn:hover { background: var(--border-card); }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-row.hidden { display: none; }

    .progress-track {
      flex: 1;
      height: 14px;
      border-radius: 999px;
      background: var(--bg-subtle);
      padding: 2px;
      overflow: hidden;
    }

    .progress-fill {
      position: relative;
      height: 100%;
      border-radius: 999px;
      background: var(--sem-emerald);
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.25s ease;
      overflow: hidden;
    }
    .progress-fill.replay { background: var(--sem-amber); }
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 6px;
      right: 6px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
    }

    .progress-label {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* =========================================================================
       4. MAIN LAYOUT, CARDS, PILLS & SEMANTIC BOXES
       ========================================================================= */
    .app-main {
      flex: 1;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 16px 14px 150px;
    }

    .stack { display: flex; flex-direction: column; gap: 14px; }
    .stack-sm { display: flex; flex-direction: column; gap: 10px; }

    .card {
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: 22px;
      box-shadow: var(--shadow-card);
    }

    .svg-card { padding: 12px; }

    .info-card {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .flex-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-blue { background: var(--sem-blue-soft); color: var(--sem-blue-dark); border: 1px solid var(--sem-blue-border); }
    .dark .badge-blue { color: #7dd3fc; }
    .badge-emerald { background: var(--sem-emerald-soft); color: var(--sem-emerald-dark); border: 1px solid var(--sem-emerald-border); }
    .dark .badge-emerald { color: #6ee7b7; }
    .badge-purple { background: var(--sem-purple-soft); color: var(--sem-purple-dark); border: 1px solid var(--sem-purple-border); }
    .dark .badge-purple { color: #c4b5fd; }
    .badge-coral { background: var(--sem-coral-soft); color: var(--sem-coral-dark); border: 1px solid var(--sem-coral-border); }
    .dark .badge-coral { color: #fda4af; }
    .badge-amber { background: var(--sem-amber-soft); color: var(--sem-amber-dark); border: 1px solid var(--sem-amber-border); }
    .dark .badge-amber { color: #fcd34d; }

    .step-title {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.24;
      margin-top: 8px;
    }

    .step-prompt {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.36;
      margin-top: 8px;
    }

    .step-sub {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Zone Pills & Reset Pill */
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .pill-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }
    .pill-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .zone-pill {
      flex: 1;
      min-width: 54px;
      padding: 9px 10px;
      border-radius: 13px;
      border: 2px solid var(--border-card);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.14s ease;
      text-align: center;
    }
    .zone-pill:hover { border-color: var(--sem-blue); color: var(--text-main); }
    .zone-pill.active {
      background: var(--sem-blue);
      border-color: var(--sem-blue);
      color: #ffffff;
    }

    .reset-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .reset-pill:hover:not(:disabled) {
      border-color: var(--sem-blue);
      color: var(--sem-blue);
    }
    .reset-pill:disabled {
      opacity: 0.48;
      cursor: default;
    }

    /* Semantic Info Boxes */
    .sem-box {
      padding: 11px 13px;
      border-radius: 14px;
      font-size: 13.5px;
      border: 1px solid transparent;
    }
    .sem-box-label {
      display: block;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }

    .sem-blue { background: var(--sem-blue-soft); border-color: var(--sem-blue-border); }
    .sem-blue .sem-box-label { color: var(--sem-blue-dark); }
    .dark .sem-blue .sem-box-label { color: #7dd3fc; }

    .sem-emerald { background: var(--sem-emerald-soft); border-color: var(--sem-emerald-border); }
    .sem-emerald .sem-box-label { color: var(--sem-emerald-dark); }
    .dark .sem-emerald .sem-box-label { color: #6ee7b7; }

    .sem-purple { background: var(--sem-purple-soft); border-color: var(--sem-purple-border); }
    .sem-purple .sem-box-label { color: var(--sem-purple-dark); }
    .dark .sem-purple .sem-box-label { color: #c4b5fd; }

    .sem-amber { background: var(--sem-amber-soft); border-color: var(--sem-amber-border); }
    .sem-amber .sem-box-label { color: var(--sem-amber-dark); }
    .dark .sem-amber .sem-box-label { color: #fcd34d; }

    .sem-coral { background: var(--sem-coral-soft); border-color: var(--sem-coral-border); }
    .sem-coral .sem-box-label { color: var(--sem-coral-dark); }
    .dark .sem-coral .sem-box-label { color: #fda4af; }

    .mini-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }
    .mini-tile {
      padding: 10px 8px;
      border-radius: 14px;
      border: 1px solid var(--border-card);
    }
    .mini-tile strong {
      display: block;
      font-size: 13px;
      font-weight: 800;
    }
    .mini-tile span {
      display: block;
      font-size: 11px;
      font-weight: 600;
      margin-top: 2px;
      color: var(--text-muted);
    }

    /* =========================================================================
       5. TACTILE 3D BUTTONS & MULTIPLE-CHOICE CARDS
       ========================================================================= */
    .btn-3d {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s ease, border-bottom-width 0.08s ease, background-color 0.15s ease, opacity 0.15s ease;
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px !important;
    }
    .btn-3d:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-emerald {
      background: var(--sem-emerald);
      color: #ffffff;
      border: 2px solid var(--sem-emerald);
      border-bottom: 4px solid var(--sem-emerald-dark);
    }
    .btn-emerald:hover:not(:disabled) { background: #047857; }

    .btn-blue {
      background: var(--sem-blue);
      color: #ffffff;
      border: 2px solid var(--sem-blue);
      border-bottom: 4px solid var(--sem-blue-dark);
    }
    .btn-blue:hover:not(:disabled) { background: #0369a1; }

    .btn-coral {
      background: var(--sem-coral);
      color: #ffffff;
      border: 2px solid var(--sem-coral);
      border-bottom: 4px solid var(--sem-coral-dark);
    }
    .btn-coral:hover:not(:disabled) { background: #be123c; }

    .btn-neutral {
      background: var(--bg-card);
      color: var(--text-main);
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-strong);
    }
    .btn-neutral:hover:not(:disabled) { background: var(--bg-subtle); }

    .choice-card {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-card);
      color: var(--text-main);
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .choice-card:hover:not(:disabled) {
      border-color: var(--sem-blue);
      background: var(--sem-blue-soft);
    }
    .choice-card:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
    .choice-card:disabled { cursor: default; }

    .choice-letter {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-card);
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .choice-text {
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.35;
    }

    .choice-selected {
      border-color: var(--sem-blue) !important;
      border-bottom-color: var(--sem-blue-dark) !important;
      background: var(--sem-blue-soft) !important;
    }
    .choice-selected .choice-letter {
      background: var(--sem-blue);
      border-color: var(--sem-blue);
      color: #ffffff;
    }

    .choice-correct {
      border-color: var(--sem-emerald) !important;
      border-bottom-color: var(--sem-emerald-dark) !important;
      background: var(--sem-emerald-soft) !important;
    }
    .choice-correct .choice-letter {
      background: var(--sem-emerald);
      border-color: var(--sem-emerald);
      color: #ffffff;
    }

    .choice-wrong {
      border-color: var(--sem-coral) !important;
      border-bottom-color: var(--sem-coral-dark) !important;
      background: var(--sem-coral-soft) !important;
    }
    .choice-wrong .choice-letter {
      background: var(--sem-coral);
      border-color: var(--sem-coral);
      color: #ffffff;
    }

    /* =========================================================================
       6. INTERACTIVE SVG SPOTLIGHT / FADE-OTHERS ISOLATION ENGINE
       ========================================================================= */
    .anatomy-svg {
      display: block;
      width: 100%;
      max-width: 390px;
      height: auto;
      margin: 0 auto;
      user-select: none;
    }

    .arm-zone {
      cursor: pointer;
      transition: opacity 0.22s ease, filter 0.22s ease, fill 0.18s ease, stroke-width 0.18s ease;
    }
    .arm-zone:hover {
      filter: brightness(1.07);
    }

    .zone-label {
      transition: opacity 0.22s ease, filter 0.22s ease;
    }

    .arm-zone-quiz {
      fill: var(--svg-limb-quiz);
    }
    .arm-zone-quiz:hover {
      fill: var(--svg-limb-quiz-hover);
    }

    /* SPOTLIGHT / FADE-OTHERS RULE:
       Unselected anatomical zones fade to opacity: 0.16 & saturate(0.25).
       Unselected zone labels fade to opacity: 0.25.
       Outer contour, creases & 5 finger outlines stay 100% crisp ON TOP. */
    .anatomy-svg.has-selection .arm-zone:not(.is-active):not(.is-correct):not(.is-wrong) {
      opacity: 0.16;
      filter: saturate(0.25);
    }
    .anatomy-svg.has-selection .zone-label:not(.is-active) {
      opacity: 0.25;
    }

    .arm-zone.is-active {
      opacity: 1 !important;
      stroke: var(--svg-focus-stroke);
      stroke-width: 2.2px;
      filter: drop-shadow(0 0 8px rgba(15, 23, 42, 0.28));
    }
    .dark .arm-zone.is-active {
      filter: drop-shadow(0 0 10px rgba(248, 250, 252, 0.36));
    }

    .arm-zone.is-quiz-selected {
      fill: var(--sem-blue) !important;
      fill-opacity: 0.9 !important;
    }

    .arm-zone.is-correct {
      opacity: 1 !important;
      fill: var(--sem-emerald) !important;
      fill-opacity: 0.92 !important;
      stroke: var(--svg-focus-stroke);
      stroke-width: 2.2px;
      animation: pulseGreen 0.65s ease-in-out 2;
    }

    .arm-zone.is-wrong {
      opacity: 1 !important;
      fill: var(--sem-coral) !important;
      fill-opacity: 0.88 !important;
      stroke: var(--svg-focus-stroke);
      stroke-width: 2px;
    }

    @keyframes pulseGreen {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(5, 150, 105, 0)); }
      50% { filter: drop-shadow(0 0 12px rgba(5, 150, 105, 0.95)); }
    }

    /* =========================================================================
       7. FIXED BOTTOM ACTION / FEEDBACK DRAWER & EXPLORE CONTROLS
       ========================================================================= */
    .bottom-drawer-wrap {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      pointer-events: none;
    }

    .drawer-bar {
      pointer-events: auto;
      background: var(--bg-header);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-card);
    }

    .drawer-feedback {
      pointer-events: auto;
      border-top-width: 2px;
      border-top-style: solid;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.14);
      animation: slideUp 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .drawer-feedback.correct {
      background: var(--drawer-correct-bg);
      border-top-color: var(--sem-emerald);
    }
    .drawer-feedback.wrong {
      background: var(--drawer-wrong-bg);
      border-top-color: var(--sem-coral);
    }

    .drawer-inner {
      max-width: 560px;
      margin: 0 auto;
      padding: 14px;
      display: flex;
      flex-direction: column;

    }

    .hint-text {
      text-align: center;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .sub-seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      border-radius: 16px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);

      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 9px 10px;
      border-radius: 11px;

      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;

      color: var(--text-main);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.09);

      padding: 15px 16px;
      border: none;
      background: transparent;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: left;
    }

      padding: 12px 16px 16px;
      border-top: 1px solid var(--border-card);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

      position: relative;
      overflow: hidden;
      padding: 28px 20px;
      text-align: center;
      border-color: var(--sem-emerald);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

      width: 66px;
      height: 66px;
      margin: 0 auto;
      border-radius: 20px;

      color: #ffffff;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(5, 150, 105, 0.35);

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

      padding: 14px;
      border-radius: 16px;
      border: 2px solid transparent;
    }
    .stat-val {
      display: block;
      font-size: 24px;
      font-weight: 800;
      margin-top: 2px;
    }

    .confetti-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .confetti-piece {
      position: absolute;
      top: -12px;
      width: 9px;
      height: 13px;
      border-radius: 3px;
      animation: confettiFall linear forwards;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.7; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes stepIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .step-enter { animation: stepIn 0.2s ease-out forwards; }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(420px) rotate(540deg); opacity: 0; }

    }

    // =========================================================================
    // 6. INTERACTION HANDLERS (SPOTLIGHT TOGGLE, QUIZ & MISTAKE REPLAY LOOP)
    // =========================================================================
    function setAppMode(mode) {
      state.appMode = mode;
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Tapping the active zone again un-isolates and shows all zones at full opacity
    function inspectDermZone(zId) {
      if (state.appMode === 'explore') {
        state.exploreDerm = state.exploreDerm === zId ? null : zId;
      } else {
        state.teachSelectedDerm = state.teachSelectedDerm === zId ? null : zId;
      }
      renderAll();
    }

    function inspectPeriphZone(nId) {
      if (state.appMode === 'explore') {
        state.explorePeriph = state.explorePeriph === nId ? null : nId;
      } else {
        state.teachSelectedPeriph = state.teachSelectedPeriph === nId ? null : nId;
      }
      renderAll();
    }

    function resetExploreSelection() {
      if (state.exploreTab === 'derm') state.exploreDerm = null;
      else state.explorePeriph = null;
      renderAll();
    }

    function selectQuizZone(zId) {
      if (state.checked) return;
      state.selectedAnswer = state.selectedAnswer === zId ? null : zId;
      renderAll();
    }

    function selectChoice(optId) {
      if (state.checked) return;
      state.selectedAnswer = optId;
      renderAll();
    }

    function awardStepXp(stepId) {
      if (!state.earnedStepXp[stepId]) {
        state.earnedStepXp[stepId] = true;
        state.xp += 10; // 12 steps × 10 XP = +120 XP
      }
    }

    function checkAnswer() {
      const step = getCurrentStep();
      if (!state.selectedAnswer || state.checked) return;

      const correctVal = step.type === 'choice' ? step.correct : step.target;
      const isRight = state.selectedAnswer === correctVal;

      state.checked = true;
      state.isCorrect = isRight;

      if (!state.inMistakeReplay && !state.seenQuizSteps[step.id]) {
        state.seenQuizSteps[step.id] = true;
        state.firstTryTotal++;
        if (isRight) state.firstTryCorrect++;
      }

      if (isRight) {
        awardStepXp(step.id);
      } else {
        state.hadMistakes = true;
        const origIdx = LESSON_STEPS.findIndex((s) => s.id === step.id);
        if (!state.inMistakeReplay) {
          if (!state.mistakeQueue.includes(origIdx)) state.mistakeQueue.push(origIdx);
        } else {
          state.mistakeQueue.push(origIdx);
        }
      }

      renderAll();
    }

    function finishLesson() {
      state.completed = true;
      state.xp = 120;
      saveLessonCompletion();
    }

    function continueLesson() {
      const step = getCurrentStep();
      if (step && step.type.startsWith('teach_')) {
        awardStepXp(step.id);
      }

      state.selectedAnswer = null;
      state.checked = false;
      state.isCorrect = false;

      if (!state.inMistakeReplay) {
        if (state.stepIdx + 1 < LESSON_STEPS.length) {
          state.stepIdx++;
          const next = LESSON_STEPS[state.stepIdx];
          if (next.type === 'teach_c5c6') state.teachSelectedDerm = 'C6';
          if (next.type === 'teach_c7t1') state.teachSelectedDerm = 'C8';
          if (next.type === 'teach_periph') state.teachSelectedPeriph = 'radial';
        } else if (state.mistakeQueue.length > 0) {
          state.inMistakeReplay = true;
          state.mistakeCursor = 0;
        } else {
          finishLesson();
        }
      } else {
        if (state.mistakeCursor + 1 < state.mistakeQueue.length) {
          state.mistakeCursor++;
        } else {
          finishLesson();
        }
      }

      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function replayLesson() {
      state.appMode = 'lesson';
      state.stepIdx = 0;
      state.inMistakeReplay = false;
      state.mistakeQueue = [];
      state.mistakeCursor = 0;
      state.hadMistakes = false;
      state.completed = false;
      state.selectedAnswer = null;
      state.checked = false;
      state.isCorrect = false;
      state.teachSelectedDerm = 'C6';
      state.teachSelectedPeriph = 'radial';
      state.xp = 0;
      state.earnedStepXp = {};
      state.firstTryTotal = 0;
      state.firstTryCorrect = 0;
      state.seenQuizSteps = {};
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // 7. RENDER ENGINE
    // =========================================================================
    function renderHeader() {
      document.getElementById('mode-btn-lesson').classList.toggle('active', state.appMode === 'lesson');
      document.getElementById('mode-btn-explore').classList.toggle('active', state.appMode === 'explore');
      document.getElementById('xp-value').textContent = `${state.xp} XP`;

      const row = document.getElementById('progress-row');
      const fill = document.getElementById('progress-fill');
      const lbl = document.getElementById('progress-label');

      if (state.appMode === 'explore') {
        row.classList.add('hidden');
        return;
      }
      row.classList.remove('hidden');

      if (state.completed) {
        fill.style.width = '100%';
        fill.classList.remove('replay');
        lbl.textContent = '12 / 12';
      } else if (state.inMistakeReplay) {
        const remaining = state.mistakeQueue.length - state.mistakeCursor;
        const pct = Math.max(15, Math.round((state.mistakeCursor / state.mistakeQueue.length) * 100));
        fill.style.width = `${pct}%`;
        fill.classList.add('replay');
        lbl.textContent = `🔁 ${remaining} left`;
      } else {
        const pct = Math.max(8, Math.round(((state.stepIdx + (state.checked && state.isCorrect ? 1 : 0)) / LESSON_STEPS.length) * 100));
        fill.style.width = `${pct}%`;
        fill.classList.remove('replay');
        lbl.textContent = `${state.stepIdx + 1} / ${LESSON_STEPS.length}`;
      }
    }

    function renderAll() {
      renderHeader();
      const main = document.getElementById('app-main');
      const drawer = document.getElementById('bottom-drawer');

      if (state.appMode === 'explore') {
        main.innerHTML = renderExploreLab();
        drawer.innerHTML = '';
        return;
      }

      if (state.completed) {
        main.innerHTML = renderCelebrationScreen();
        drawer.innerHTML = '';
        spawnConfetti();
        return;
      }

      const step = getCurrentStep();
      main.innerHTML = renderLessonStep(step);
      drawer.innerHTML = renderBottomDrawer(step);
    }

    // =========================================================================
    // 8. RENDER LESSON STEPS

            `}

      if (step.type === 'teach_periph') {
        const p = state.teachSelectedPeriph ? PERIPHERAL_DATA[state.teachSelectedPeriph] : null;
        const keys = ['axillary', 'radial', 'median', 'ulnar', 'cutaneous'];
        return `
          <div class="stack step-enter">
            <div>

                <button type="button" class="zone-pill ${state.teachSelectedPeriph === k ? 'active' : ''}" onclick="inspectPeriphZone('${k}')">${PERIPHERAL_DATA[k].shortName}</button>
              `).join('')}
            </div>

              ${buildPeripheralArmSVG('teach', state.teachSelectedPeriph, null)}
            </div>

            ${p ? `

          correctTarget: step.target,
          checked: state.checked,
          isCorrect: state.isCorrect,
        };
        return `
          <div class="stack step-enter">
            <div>
              ${mistakeBanner}
              <span class="step-badge badge-emerald">${step.badge}</span>
              <h2 class="step-prompt">${step.prompt}</h2>

                ? buildDermatomeArmSVG('quiz', null, fb)
                : buildPeripheralArmSVG('quiz', null, fb)}
            </div>

            <p class="hint-text">
              ${state.selectedAnswer && !state.checked
                ? 'Zone spotlighted — tap <strong>CHECK</strong> below to confirm!'
                : !state.checked
                  ? 'Tap directly on the anatomical zone above.'
                  : ''}
            </p>
          </div>
        `;
      }

      if (step.type === 'choice') {
        return `
          <div class="stack step-enter">
            <div>
              ${mistakeBanner}
              <span class="step-badge ${step.isTrap ? 'badge-coral' : 'badge-blue'}">${step.badge}</span>
              <h2 class="step-prompt">${step.prompt}</h2>
            </div>

            <div class="stack-sm">
              ${step.options.map((opt, idx) => {
                const letter = ['A', 'B', 'C', 'D'][idx];
                let cls = '';
                if (state.checked) {
                  if (opt.id === step.correct) cls = 'choice-correct';
                  else if (opt.id === state.selectedAnswer && !state.isCorrect) cls = 'choice-wrong';
                } else if (state.selectedAnswer === opt.id) {
                  cls = 'choice-selected';
                }
                return `
                  <button type="button" ${state.checked ? 'disabled' : ''} class="choice-card ${cls}" onclick="selectChoice('${opt.id}')">
                    <span class="choice-letter">${letter}</span>
                    <span class="choice-text">${opt.text}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      return '';
    }

    // =========================================================================
    // 9. FIXED BOTTOM ACTION / FEEDBACK DRAWER
    // =========================================================================
    function renderBottomDrawer(step) {
      if (step.type.startsWith('teach_')) {
        return `

              <button type="button" class="btn-3d btn-emerald" onclick="continueLesson()">CONTINUE</button>

      }

      if (!state.checked) {
        return `
          <div class="drawer-bar">
            <div class="drawer-inner">
              <button type="button" class="btn-3d btn-blue" ${state.selectedAnswer ? '' : 'disabled'} onclick="checkAnswer()">CHECK</button>

          </div>

      if (state.isCorrect) {
        return `
          <div class="drawer-feedback correct">
            <div class="drawer-inner">

              <div>

                <div class="pill-grid-2">

    // =========================================================================
    // 11. CELEBRATION COMPLETION SCREEN (+120 XP & SAVED TO mchiro_lessons_v1)
    // =========================================================================
    function renderCelebrationScreen() {
      const acc = state.firstTryTotal > 0
        ? Math.round((state.firstTryCorrect / state.firstTryTotal) * 100)
        : 100;

      return `
        <div class="card celebration-card step-enter">
          <div id="confetti-layer" class="confetti-layer"></div>

          <div style="position:relative;z-index:2;" class="stack-sm">
            <div class="trophy-badge">🏆</div>
            <div><span class="step-badge badge-emerald">Lesson 1 Complete!</span></div>
            <h2 class="font-display" style="font-size:26px;font-weight:800;">Upper Limb Mastered</h2>
            <p class="step-sub">Saved to your Revision Hub progress. You cleared C5–T1 dermatomes, specific myotomes, 0–4 reflexes, and all upper limb peripheral nerves.</p>
          </div>

          <div style="position:relative;z-index:2;" class="stat-grid">
            <div class="stat-box sem-amber">
              <span class="sem-box-label">XP Earned</span>
              <span class="stat-val" style="color:var(--sem-amber);">+120 XP</span>
            </div>
            <div class="stat-box sem-emerald">
              <span class="sem-box-label">First-Try Accuracy</span>
              <span class="stat-val" style="color:var(--sem-emerald);">${acc}%</span>
            </div>
          </div>

          <div style="position:relative;z-index:2;" class="sem-box sem-blue">
            <p style="font-weight:600;">
              ${state.hadMistakes
                ? '🔁 <strong>Mistake Mastery:</strong> You replayed and cleared every missed clinical trap before finishing!'
                : '✨ <strong>Flawless Run:</strong> Zero mistakes — every assessor trap cleared on the first try!'}
            </p>
          </div>

          <div style="position:relative;z-index:2;" class="stack-sm">
            <a href="lesson-ll.html" class="btn-3d btn-emerald">Next: Lesson 2 Lower Limb &rarr;</a>
            <button type="button" class="btn-3d btn-blue" onclick="setAppMode('explore')">🔬 EXPLORE ANATOMY LAB</button>
            <button type="button" class="btn-3d btn-neutral" onclick="replayLesson()">↺ PRACTICE AGAIN</button>
            <div class="pill-grid-2">
              <a href="neuro.html" class="btn-3d btn-neutral" style="font-size:13px;">&larr; Neuro Hub</a>
              <a href="index.html" class="btn-3d btn-neutral" style="font-size:13px;">🏠 Home Hub</a>
            </div>
          </div>
        </div>
      `;
    }

    function spawnConfetti() {
      const layer = document.getElementById('confetti-layer');
      if (!layer) return;
      const colors = ['#059669', '#0284c7', '#7c3aed', '#d97706', '#e11d48'];
      for (let i = 0; i < 36; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.backgroundColor = colors[i % colors.length];
        piece.style.animationDuration = `${1.5 + Math.random() * 1.4}s`;
        piece.style.animationDelay = `${Math.random() * 0.4}s`;
        layer.appendChild(piece);
      }
    }

    // =========================================================================
    // 12. INITIALISE
    // =========================================================================
    initTheme();
    renderAll();
  </script>
