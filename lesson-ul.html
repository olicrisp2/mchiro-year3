    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {

  <style>
    /* =========================================================================
       THEME TOKENS & TACTILE DUOLINGO × BRILLIANT STYLING
       ========================================================================= */
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --border-card: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;

      /* SVG Neutral & Outline Tokens */
      --svg-bg: #f8fafc;
      --svg-limb-base: #e2e8f0;
      --svg-limb-quiz: #e2e8f0;
      --svg-limb-quiz-hover: #cbd5e1;
      --svg-outline: #334155;
      --svg-divider: #475569;
      --svg-label-bg: #ffffff;
      --svg-label-text: #0f172a;
    }

    .dark {
      --bg-page: #0b1120;
      --bg-card: #131c31;
      --bg-subtle: #1e293b;
      --border-card: #27354f;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;

      --svg-bg: #0f172a;
      --svg-limb-base: #1e293b;
      --svg-limb-quiz: #24324a;
      --svg-limb-quiz-hover: #334666;
      --svg-outline: #cbd5e1;
      --svg-divider: #94a3b8;
      --svg-label-bg: #0f172a;
      --svg-label-text: #f8fafc;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    h1, h2, h3, h4, .font-display {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    /* Tactile 3D Chunky Buttons */
    .btn-3d {
      border-radius: 16px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-weight: 800;
      transition: transform 0.08s ease, border-bottom-width 0.08s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
      user-select: none;
    }
    .btn-3d:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px !important;
    }
    .btn-3d:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-emerald {
      background-color: #10b981;
      color: #ffffff;
      border: 2px solid #10b981;
      border-bottom: 4px solid #047857;
    }
    .btn-emerald:hover:not(:disabled) {
      background-color: #059669;
    }

    .btn-sky {
      background-color: #0ea5e9;
      color: #ffffff;
      border: 2px solid #0ea5e9;
      border-bottom: 4px solid #0369a1;
    }
    .btn-sky:hover:not(:disabled) {
      background-color: #0284c7;
    }

    .btn-rose {
      background-color: #f43f5e;
      color: #ffffff;
      border: 2px solid #f43f5e;
      border-bottom: 4px solid #be123c;
    }
    .btn-rose:hover:not(:disabled) {
      background-color: #e11d48;
    }

    .btn-neutral {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-card);
    }
    .btn-neutral:hover:not(:disabled) {
      background-color: var(--bg-subtle);
    }

    /* Chunky Option Cards */
    .choice-card {
      background-color: var(--bg-card);
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-card);
      border-radius: 16px;
      transition: transform 0.08s ease, border-color 0.15s ease, background-color 0.15s ease;
      cursor: pointer;
    }
    .choice-card:hover:not(:disabled) {
      border-color: #38bdf8;
      background-color: rgba(14, 165, 233, 0.06);
    }
    .choice-card:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
    .choice-selected {
      border-color: #0ea5e9 !important;
      border-bottom-color: #0284c7 !important;
      background-color: rgba(14, 165, 233, 0.12) !important;
    }
    .choice-correct {
      border-color: #10b981 !important;
      border-bottom-color: #047857 !important;
      background-color: rgba(16, 185, 129, 0.14) !important;
    }
    .choice-wrong {
      border-color: #f43f5e !important;
      border-bottom-color: #be123c !important;
      background-color: rgba(244, 63, 94, 0.14) !important;
    }

    /* Interactive SVG Zone Styling */
    .arm-zone {
      cursor: pointer;
      transition: fill 0.18s ease, opacity 0.18s ease, filter 0.18s ease;
    }
    .arm-zone:hover {
      filter: brightness(1.08);
    }
    .arm-zone-quiz {
      fill: var(--svg-limb-quiz);
    }
    .arm-zone-quiz:hover {
      fill: var(--svg-limb-quiz-hover);
    }
    .arm-zone-selected {
      fill: #38bdf8 !important;
      fill-opacity: 0.85 !important;
      filter: drop-shadow(0 0 6px rgba(14, 165, 233, 0.55));
    }
    .arm-zone-correct {
      fill: #10b981 !important;
      fill-opacity: 0.92 !important;
      animation: zonePulseGreen 0.7s ease-in-out 2;
    }
    .arm-zone-wrong {
      fill: #f43f5e !important;
      fill-opacity: 0.88 !important;
    }
    .arm-zone-inspected {
      filter: drop-shadow(0 0 8px rgba(14, 165, 233, 0.5));
      stroke: #ffffff !important;
      stroke-width: 2.5px !important;
    }

    @keyframes zonePulseGreen {
      0%, 100% { filter: drop-shadow(0 0 0px rgba(16, 185, 129, 0)); }
      50% { filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.9)); }
    }

    /* Slide-Up Feedback Drawer Animation */
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
    .drawer-enter {
      animation: slideUp 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Subtle Step Fade-In */
    @keyframes stepIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .step-enter {
      animation: stepIn 0.22s ease-out forwards;
    }

    /* Confetti Celebration Particles */
    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(360px) rotate(540deg); opacity: 0; }
    }
    .confetti-piece {
      position: absolute;
      top: -12px;
      width: 10px;
      height: 14px;
      border-radius: 3px;
      animation: confettiFall linear forwards;
      pointer-events: none;
    }
  </style>
</head>

    // =========================================================================
    function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem('mchiro_theme'); } catch (e) {}
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? (saved === 'dark' || saved === '"dark"') : prefersDark;
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      try { localStorage.setItem('mchiro_theme', isDark ? 'dark' : 'light'); } catch (e) {}
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) btn.textContent = isDark ? '☀️' : '🌙';
    }

    function toggleTheme() {
      applyTheme(!document.documentElement.classList.contains('dark'));

            <line x1="271" y1="284" x2="271" y2="404" stroke="var(--svg-divider)" stroke-width="1.5" stroke-dasharray="${isQuiz ? '3 2' : 'none'}" pointer-events="none" />
          </g>
          <path d="${postArmPath}" fill="none" stroke="var(--svg-outline)" stroke-width="2.1" stroke-linejoin="round" pointer-events="none" />

          <!-- ==================== LABELED PILLS (TEACH / EXPLORE) ==================== -->
          ${!isQuiz ? `
            <g pointer-events="none">
              <!-- Axillary Pill -->
              <rect x="148" y="54" width="94" height="22" rx="8" fill="var(--svg-label-bg)" stroke="#f59e0b" stroke-width="1.8" />
              <text x="195" y="69" text-anchor="middle" fill="#d97706" font-size="9.5" font-weight="800">AXILLARY</text>

              <!-- Cutaneous Pill -->
              <rect x="52" y="182" width="88" height="22" rx="8" fill="var(--svg-label-bg)" stroke="#14b8a6" stroke-width="1.6" />
              <text x="96" y="196" text-anchor="middle" fill="#0d9488" font-size="8.5" font-weight="800">LAT / MED CUT.</text>

              <!-- Radial Pill -->
              <rect x="255" y="182" width="78" height="24" rx="8" fill="#f43f5e" />
              <text x="294" y="198" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">RADIAL</text>

              <!-- Median Pill -->
              <rect x="40" y="397" width="74" height="20" rx="7" fill="#0ea5e9" />
              <text x="77" y="410" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="800">MEDIAN</text>

              <!-- Ulnar Pills (Ant & Post) -->
              <rect x="122" y="397" width="60" height="20" rx="7" fill="#8b5cf6" />
              <text x="152" y="410" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="800">ULNAR</text>

              <rect x="212" y="397" width="60" height="20" rx="7" fill="#8b5cf6" />
              <text x="242" y="410" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="800">ULNAR</text>

              <!-- Dorsal Radial Pill -->
              <rect x="282" y="397" width="74" height="20" rx="7" fill="#f43f5e" />
              <text x="319" y="410" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="800">RADIAL</text>
            </g>
          ` : `
            <g pointer-events="none">
              <text x="96" y="416" text-anchor="middle" fill="var(--text-muted)" font-size="8.5" font-weight="700">Palmar View</text>
              <text x="294" y="416" text-anchor="middle" fill="var(--text-muted)" font-size="8.5" font-weight="700">Dorsal View</text>
            </g>
          `}
        </svg>
      `;
    }

    // =========================================================================
    // 6. INTERACTION HANDLERS (LESSON & EXPLORE)
    // =========================================================================
    function setAppMode(mode) {
      state.appMode = mode;
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Teach / Explore Zone Inspection
    function inspectDermZone(zId) {
      if (state.appMode === 'explore') {
        state.exploreDerm = zId;
      } else {
        state.teachSelectedZone = zId;
        state.teachTapped[zId] = true;
      }
      renderAll();
    }

    function inspectPeriphZone(nId) {
      if (state.appMode === 'explore') {
        state.explorePeriph = nId;
      } else {
        state.teachSelectedPeriph = nId;
        state.teachTapped[nId] = true;
      }
      renderAll();
    }

    // Quiz Selection
    function selectQuizZone(zId) {
      if (state.checked) return;
      state.selectedAnswer = zId;
      renderAll();
    }

    function selectChoice(optId) {
      if (state.checked) return;
      state.selectedAnswer = optId;
      renderAll();
    }

    // Check Answer
    function checkAnswer() {
      const step = getCurrentStep();
      if (!state.selectedAnswer || state.checked) return;

      const correctVal = step.type === 'choice' ? step.correct : step.target;
      const isRight = state.selectedAnswer === correctVal;

      state.checked = true;
      state.isCorrect = isRight;

      // Record first-try accuracy (only outside mistake replay)
      if (!state.inMistakeReplay && !state.seenSteps[step.id]) {
        state.seenSteps[step.id] = true;
        state.firstTryTotal++;
        if (isRight) state.firstTryCorrect++;
      }

      if (isRight) {
        state.xp += 15;
      } else {
        // Queue into Mistake Replay Loop
        const origIdx = LESSON_STEPS.findIndex((s) => s.id === step.id);
        if (!state.inMistakeReplay) {
          if (!state.mistakeQueue.includes(origIdx)) {
            state.mistakeQueue.push(origIdx);
          }
        } else {
          // Missed again during replay -> push back to end of replay queue
          state.mistakeQueue.push(origIdx);
        }
      }

      renderAll();
    }

    // Advance to Next Step / Mistake Replay / Celebration
    function continueLesson() {
      const step = getCurrentStep();

      // Award +10 XP for completing a Visual Teach step
      if (step && step.type.startsWith('teach_')) {
        state.xp += 10;
      }

      // Reset per-step interaction state
      state.selectedAnswer = null;
      state.checked = false;
      state.isCorrect = false;
      state.teachTapped = {};

      if (!state.inMistakeReplay) {
        if (state.stepIdx + 1 < LESSON_STEPS.length) {
          state.stepIdx++;
        } else if (state.mistakeQueue.length > 0) {
          state.inMistakeReplay = true;
          state.mistakeCursor = 0;
        } else {
          state.completed = true;
        }
      } else {
        if (state.mistakeCursor + 1 < state.mistakeQueue.length) {
          state.mistakeCursor++;
        } else {
          state.completed = true;
        }
      }

      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function replayLesson() {
      state.appMode = 'lesson';
      state.stepIdx = 0;
      state.inMistakeReplay = false;
      state.mistakeQueue = [];
      state.mistakeCursor = 0;
      state.completed = false;
      state.selectedAnswer = null;
      state.checked = false;
      state.isCorrect = false;
      state.teachTapped = {};
      state.teachSelectedZone = 'C6';
      state.teachSelectedPeriph = 'radial';
      state.xp = 0;
      state.firstTryTotal = 0;
      state.firstTryCorrect = 0;
      state.seenSteps = {};
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // 7. RENDER ENGINE (HEADER, MAIN VIEW, BOTTOM DRAWER)
    // =========================================================================
    function renderHeader() {
      // Mode pills
      const btnL = document.getElementById('mode-btn-lesson');
      const btnE = document.getElementById('mode-btn-explore');
      const activeCls = 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-xs';
      const inactiveCls = 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white';
      btnL.className = `px-2.5 py-1 rounded-lg text-[11px] font-display font-extrabold transition ${state.appMode === 'lesson' ? activeCls : inactiveCls}`;
      btnE.className = `px-2.5 py-1 rounded-lg text-[11px] font-display font-extrabold transition ${state.appMode === 'explore' ? activeCls : inactiveCls}`;

      // XP Badge
      document.getElementById('xp-value').textContent = `${state.xp} XP`;

      // Progress Bar
      const row = document.getElementById('progress-row');
      const fill = document.getElementById('progress-fill');
      const lbl = document.getElementById('progress-label');

      if (state.appMode === 'explore') {
        row.classList.add('hidden');
        return;
      }
      row.classList.remove('hidden');

      if (state.completed) {
        fill.style.width = '100%';
        fill.className = 'h-full rounded-full bg-emerald-500 transition-all duration-500 ease-out';
        lbl.textContent = '100%';
      } else if (state.inMistakeReplay) {
        const remaining = state.mistakeQueue.length - state.mistakeCursor;
        const pct = Math.max(15, Math.round((state.mistakeCursor / state.mistakeQueue.length) * 100));
        fill.style.width = `${pct}%`;
        fill.className = 'h-full rounded-full bg-amber-500 transition-all duration-500 ease-out';
        lbl.textContent = `🔁 ${remaining} left`;
      } else {
        const pct = Math.max(6, Math.round(((state.stepIdx + (state.checked && state.isCorrect ? 1 : 0)) / LESSON_STEPS.length) * 100));
        fill.style.width = `${pct}%`;
        fill.className = 'h-full rounded-full bg-emerald-500 transition-all duration-500 ease-out';
        lbl.textContent = `${state.stepIdx + 1} / ${LESSON_STEPS.length}`;
      }
    }

    function renderAll() {
      renderHeader();
      const main = document.getElementById('app-main');
      const drawer = document.getElementById('bottom-drawer');

      if (state.appMode === 'explore') {
        main.innerHTML = renderExploreLab();
        drawer.innerHTML = '';
        return;
      }

      if (state.completed) {
        main.innerHTML = renderCelebrationScreen();
        drawer.innerHTML = '';
        spawnConfetti();
        return;
      }

      const step = getCurrentStep();
      main.innerHTML = renderLessonStep(step);
      drawer.innerHTML = renderBottomDrawer(step);
    }

    // =========================================================================
    // 8. RENDER LESSON STEPS
    // =========================================================================
    function renderLessonStep(step) {
      const replayBanner = state.inMistakeReplay ? `
        <div class="mb-3 px-3.5 py-2 rounded-2xl bg-amber-100 dark:bg-amber-950/60 border border-amber-300 dark:border-amber-800 text-amber-900 dark:text-amber-200 text-xs font-display font-extrabold flex items-center justify-between">
          <span>🔁 Mistake Replay Loop</span>
          <span>Nail this to reach 100%!</span>
        </div>
      ` : '';

      // --- STEP 1: VISUAL TEACH — DERMATOME ARM ---
      if (step.type === 'teach_derm') {
        const tappedCount = Object.keys(state.teachTapped).length;
        const z = DERMATOME_DATA[state.teachSelectedZone] || DERMATOME_DATA.C6;
        const roots = ['C5', 'C6', 'C7', 'C8', 'T1'];

        return `
          <div class="step-enter space-y-4">
            <div>
              <span class="inline-block px-2.5 py-1 rounded-xl text-[11px] font-display font-extrabold uppercase bg-sky-100 dark:bg-sky-950/70 text-sky-700 dark:text-sky-300">${step.badge}</span>
              <h2 class="text-xl sm:text-2xl font-display font-extrabold mt-1.5">${step.title}</h2>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">${step.subtitle}</p>
            </div>

            <!-- Interactive Checkmark Progress Chips -->
            <div class="flex items-center justify-between gap-1.5">
              ${roots.map((r) => {
                const done = !!state.teachTapped[r];
                const active = state.teachSelectedZone === r;
                return `
                  <button
                    type="button"
                    onclick="inspectDermZone('${r}')"
                    class="flex-1 py-1.5 px-2 rounded-xl text-xs font-display font-extrabold border-2 transition flex items-center justify-center gap-1 ${
                      active
                        ? 'border-sky-500 bg-sky-50 dark:bg-sky-950/50 text-sky-700 dark:text-sky-300'
                        : done
                          ? 'border-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300'
                          : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-[#131c31] text-slate-500'
                    }"
                  >
                    <span>${r}</span>
                    ${done ? '<span class="text-emerald-500">✓</span>' : ''}
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Sharpened Labeled Dermatome Arm SVG -->
            <div class="rounded-3xl bg-white dark:bg-[#131c31] border-2 border-slate-200 dark:border-slate-800 p-3 shadow-xs">
              ${buildDermatomeArmSVG('teach', state.teachSelectedZone, null)}
            </div>

            <!-- Compact Visual Hook & Anatomy Inspector Card -->
            <div class="rounded-2xl bg-white dark:bg-[#131c31] border-2 border-slate-200 dark:border-slate-800 p-4 space-y-2 shadow-xs">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  <span class="px-2.5 py-0.5 rounded-lg text-xs font-display font-extrabold border ${z.badgeClass}">${z.id}</span>
                  <h3 class="text-sm sm:text-base font-display font-extrabold">${z.hook}</h3>
                </div>
                <span class="text-[11px] font-bold text-slate-400">${Math.min(tappedCount, 5)}/5 tapped</span>
              </div>
              <p class="text-xs sm:text-sm font-semibold text-slate-800 dark:text-slate-100">${z.sensation}</p>
              <p class="text-xs text-slate-500 dark:text-slate-400">💡 <strong>Hook:</strong> ${z.analogy}</p>
            </div>
          </div>
        `;
      }

      // --- STEP 4: VISUAL TEACH — MYOTOMES & 5-6-7 REFLEX RULE ---
      if (step.type === 'teach_myotome') {
        const rows = [
          { r: 'C5', col: 'sky', m: 'Biceps, Deltoid', act: 'Elbow flex / shoulder abd', ref: 'Biceps (0–4)' },
          { r: 'C6', col: 'emerald', m: 'Wrist extensors, Biceps', act: 'Wrist ext / elbow flex', ref: 'Brachioradialis (0–4)' },
          { r: 'C7', col: 'violet', m: 'Triceps, Wrist flexors', act: 'Elbow ext / wrist flex', ref: 'Triceps (0–4)' },
          { r: 'C8', col: 'amber', m: 'Flexor digitorum profundus', act: 'DIP joint 3rd finger flex', ref: '(Finger flexors)' },
          { r: 'T1', col: 'rose', m: 'Interossei', act: '5th finger abduction', ref: 'No routine reflex' },
        ];

        return `
          <div class="step-enter space-y-4">
            <div>
              <span class="inline-block px-2.5 py-1 rounded-xl text-[11px] font-display font-extrabold uppercase bg-violet-100 dark:bg-violet-950/70 text-violet-700 dark:text-violet-300">${step.badge}</span>
              <h2 class="text-xl sm:text-2xl font-display font-extrabold mt-1.5">${step.title}</h2>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">${step.subtitle}</p>
            </div>

            <!-- Prominent Coral Assessor Trap Card -->
            <div class="rounded-2xl bg-rose-50 dark:bg-rose-950/40 border-2 border-rose-300 dark:border-rose-800 p-4 flex items-start gap-3">
              <span class="text-xl leading-none mt-0.5">⚠️</span>
              <div class="space-y-0.5">
                <p class="text-xs font-display font-extrabold uppercase tracking-wider text-rose-600 dark:text-rose-400">Assessor Trap</p>
                <p class="text-sm font-display font-extrabold text-rose-900 dark:text-rose-100">Name the MUSCLES, not just the actions!</p>
                <p class="text-xs text-rose-800/90 dark:text-rose-200/90">On your Year 2 practical sheet, the assessor specifically wrote: <em>"Myotomes – name muscles not just actions."</em></p>
              </div>
            </div>

            <!-- 5-6-7 Reflex Rule Highlight -->
            <div class="rounded-2xl bg-gradient-to-r from-sky-500/10 via-emerald-500/10 to-violet-500/10 border-2 border-slate-200 dark:border-slate-800 p-3.5">
              <p class="text-[11px] font-display font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">The 5-6-7 Reflex Rule (Grade 0–4)</p>
              <div class="grid grid-cols-3 gap-2 text-center">
                <div class="p-2 rounded-xl bg-white dark:bg-[#131c31] border border-sky-200 dark:border-sky-800">
                  <span class="block text-sm font-display font-extrabold text-sky-600 dark:text-sky-400">C5</span>
                  <span class="text-[11px] font-bold">Biceps</span>
                </div>
                <div class="p-2 rounded-xl bg-white dark:bg-[#131c31] border border-emerald-200 dark:border-emerald-800">
                  <span class="block text-sm font-display font-extrabold text-emerald-600 dark:text-emerald-400">C6</span>
                  <span class="text-[11px] font-bold">Brachioradialis</span>
                </div>
                <div class="p-2 rounded-xl bg-white dark:bg-[#131c31] border border-violet-200 dark:border-violet-800">
                  <span class="block text-sm font-display font-extrabold text-violet-600 dark:text-violet-400">C7</span>
                  <span class="text-[11px] font-bold">Triceps</span>
                </div>
              </div>
            </div>

            <!-- Clean Visual Ladder -->
            <div class="space-y-2">
              ${rows.map((row) => `
                <div class="rounded-2xl bg-white dark:bg-[#131c31] border-2 border-slate-200 dark:border-slate-800 p-3 flex items-center gap-3">
                  <span class="w-10 h-10 rounded-xl bg-${row.col}-500/15 text-${row.col}-600 dark:text-${row.col}-400 font-display font-extrabold text-sm flex items-center justify-center shrink-0">${row.r}</span>
                  <div class="min-w-0 flex-1">
                    <p class="text-sm font-display font-extrabold text-slate-900 dark:text-white leading-tight">${row.m}</p>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">${row.act} &bull; <strong class="text-slate-700 dark:text-slate-300">${row.ref}</strong></p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // --- STEP 7: VISUAL TEACH — PERIPHERAL NERVES ---
      if (step.type === 'teach_periph') {
        const tappedCount = Object.keys(state.teachTapped).length;
        const p = PERIPHERAL_DATA[state.teachSelectedPeriph] || PERIPHERAL_DATA.radial;
        const keys = ['axillary', 'radial', 'median', 'ulnar'];

        return `
          <div class="step-enter space-y-4">
            <div>
              <span class="inline-block px-2.5 py-1 rounded-xl text-[11px] font-display font-extrabold uppercase bg-rose-100 dark:bg-rose-950/70 text-rose-700 dark:text-rose-300">${step.badge}</span>
              <h2 class="text-xl sm:text-2xl font-display font-extrabold mt-1.5">${step.title}</h2>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">${step.subtitle}</p>
            </div>

            <!-- Quick Tap Checkmark Chips -->
            <div class="grid grid-cols-4 gap-1.5">
              ${keys.map((k) => {
                const done = !!state.teachTapped[k];
                const active = state.teachSelectedPeriph === k;
                const label = k.charAt(0).toUpperCase() + k.slice(1);
                return `
                  <button
                    type="button"
                    onclick="inspectPeriphZone('${k}')"
                    class="py-1.5 px-2 rounded-xl text-[11px] font-display font-extrabold border-2 transition flex items-center justify-center gap-1 ${
                      active
                        ? 'border-sky-500 bg-sky-50 dark:bg-sky-950/50 text-sky-700 dark:text-sky-300'
                        : done
                          ? 'border-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300'
                          : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-[#131c31] text-slate-500'
                    }"
                  >
                    <span>${label}</span>
                    ${done ? '<span class="text-emerald-500">✓</span>' : ''}
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Side-by-Side Labeled Anterior & Posterior Arm SVGs -->
            <div class="rounded-3xl bg-white dark:bg-[#131c31] border-2 border-slate-200 dark:border-slate-800 p-3 shadow-xs">
              ${buildPeripheralArmSVG('teach', state.teachSelectedPeriph, null)}
            </div>

            <!-- Visual Analogy & Motor/Sensory Card -->
            <div class="rounded-2xl bg-white dark:bg-[#131c31] border-2 border-slate-200 dark:border-slate-800 p-4 space-y-2 shadow-xs">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  <span class="px-2.5 py-0.5 rounded-lg text-xs font-display font-extrabold border ${p.badgeClass}">${p.name}</span>
                </div>
                <span class="text-[11px] font-bold text-slate-400">${Math.min(tappedCount, 4)}/4 tapped</span>
              </div>
              <p class="text-xs sm:text-sm font-bold text-slate-900 dark:text-white">💡 ${p.hook}: <span class="font-normal text-slate-600 dark:text-slate-300">${p.analogy}</span></p>
              <p class="text-xs text-slate-700 dark:text-slate-200"><strong>Motor:</strong> ${p.muscles} (${p.actions})</p>
              <p class="text-xs text-slate-600 dark:text-slate-300"><strong>Sensation:</strong> ${p.sensation}</p>
            </div>
          </div>
        `;
      }

      // --- TAP THE ARM QUIZ (DERMATOME OR PERIPHERAL) ---
      if (step.type === 'quiz_derm' || step.type === 'quiz_periph') {
        const fb = {
          selected: state.selectedAnswer,
          correctTarget: step.target,
          checked: state.checked,
          isCorrect: state.isCorrect,
        };
        const selectedLabel = state.selectedAnswer
          ? (step.type === 'quiz_derm' ? state.selectedAnswer : PERIPHERAL_DATA[state.selectedAnswer].name)
          : null;

        return `
          <div class="step-enter space-y-4">
            ${replayBanner}
            <div>
              <span class="inline-block px-2.5 py-1 rounded-xl text-[11px] font-display font-extrabold uppercase bg-emerald-100 dark:bg-emerald-950/70 text-emerald-700 dark:text-emerald-300">${step.badge}</span>
              <h2 class="text-lg sm:text-xl font-display font-extrabold mt-2 leading-snug">${step.prompt}</h2>
            </div>

            <div class="rounded-3xl bg-white dark:bg-[#131c31] border-2 border-slate-200 dark:border-slate-800 p-3 shadow-xs">
              ${step.type === 'quiz_derm'
                ? buildDermatomeArmSVG('quiz', null, fb)
                : buildPeripheralArmSVG('quiz', null, fb)}
            </div>

            <div class="text-center text-xs font-bold text-slate-500 dark:text-slate-400">
              ${selectedLabel && !state.checked
                ? `Zone selected — tap <strong>CHECK</strong> below to confirm!`
                : !state.checked
                  ? `Tap directly on the anatomical zone above.`
                  : ''}
            </div>
          </div>
        `;
      }

      // --- CHUNKY MULTIPLE CHOICE QUIZ ---
      if (step.type === 'choice') {
        return `
          <div class="step-enter space-y-5">
            ${replayBanner}
            <div>
              <span class="inline-block px-2.5 py-1 rounded-xl text-[11px] font-display font-extrabold uppercase ${
                step.isTrap
                  ? 'bg-rose-100 dark:bg-rose-950/70 text-rose-700 dark:text-rose-300 border border-rose-300 dark:border-rose-800'
                  : 'bg-sky-100 dark:bg-sky-950/70 text-sky-700 dark:text-sky-300'
              }">${step.badge}</span>
              <h2 class="text-lg sm:text-xl font-display font-extrabold mt-2.5 leading-snug">${step.prompt}</h2>
            </div>

            <div class="space-y-3">
              ${step.options.map((opt, idx) => {
                const letter = ['A', 'B', 'C', 'D'][idx];
                let extraCls = '';
                if (state.checked) {
                  if (opt.id === step.correct) extraCls = 'choice-correct';
                  else if (opt.id === state.selectedAnswer && !state.isCorrect) extraCls = 'choice-wrong';
                } else if (state.selectedAnswer === opt.id) {
                  extraCls = 'choice-selected';
                }

                return `
                  <button
                    type="button"
                    ${state.checked ? 'disabled' : ''}
                    onclick="selectChoice('${opt.id}')"
                    class="choice-card w-full p-4 text-left flex items-center gap-3.5 ${extraCls}"
                  >
                    <span class="w-8 h-8 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-display font-extrabold flex items-center justify-center shrink-0">${letter}</span>
                    <span class="text-sm sm:text-[15px] font-semibold leading-snug">${opt.text}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      return '';
    }

    // =========================================================================
    // 9. FIXED BOTTOM ACTION / SLIDE-UP FEEDBACK DRAWER
    // =========================================================================
    function renderBottomDrawer(step) {
      // Visual Teach steps -> Continue button
      if (step.type.startsWith('teach_')) {
        const minTaps = step.minTaps || 0;
        const tapped = Object.keys(state.teachTapped).length;
        const ready = tapped >= minTaps;

        return `
          <div class="pointer-events-auto bg-white/95 dark:bg-[#0b1120]/95 backdrop-blur border-t border-slate-200 dark:border-slate-800">
            <div class="max-w-[560px] mx-auto px-3.5 py-3.5">
              <button
                type="button"
                ${ready ? '' : 'disabled'}
                onclick="continueLesson()"
                class="btn-3d btn-emerald w-full py-3.5 text-sm sm:text-base tracking-wide"
              >
                ${ready ? 'CONTINUE' : `TAP ${minTaps - tapped} MORE ZONE${minTaps - tapped > 1 ? 'S' : ''} TO CONTINUE`}
              </button>
            </div>
          </div>
        `;
      }

      // Quiz step NOT YET CHECKED -> Check button
      if (!state.checked) {
        return `
          <div class="pointer-events-auto bg-white/95 dark:bg-[#0b1120]/95 backdrop-blur border-t border-slate-200 dark:border-slate-800">
            <div class="max-w-[560px] mx-auto px-3.5 py-3.5">
              <button
                type="button"
                ${state.selectedAnswer ? '' : 'disabled'}
                onclick="checkAnswer()"
                class="btn-3d btn-sky w-full py-3.5 text-sm sm:text-base tracking-wide"
              >
                CHECK ANSWER
              </button>
            </div>
          </div>
        `;
      }

      // Quiz step CHECKED -> Slide-Up Feedback Drawer
      if (state.isCorrect) {
        return `
          <div class="pointer-events-auto drawer-enter bg-emerald-50 dark:bg-[#092920] border-t-2 border-emerald-400 dark:border-emerald-700 shadow-2xl">
            <div class="max-w-[560px] mx-auto px-4 py-4 space-y-3">
              <div class="flex items-start gap-3">
                <span class="w-8 h-8 rounded-full bg-emerald-500 text-white font-extrabold flex items-center justify-center shrink-0 text-base">✓</span>
                <div class="min-w-0">
                  <p class="text-base font-display font-extrabold text-emerald-800 dark:text-emerald-300">Spot on! +15 XP</p>
                  <p class="text-xs sm:text-sm text-emerald-900 dark:text-emerald-100 mt-0.5 leading-snug">${step.correctMsg}</p>
                </div>
              </div>
              <button
                type="button"
                onclick="continueLesson()"
                class="btn-3d btn-emerald w-full py-3.5 text-sm sm:text-base tracking-wide"
              >
                CONTINUE
              </button>
            </div>
          </div>
        `;
      }

      // Wrong Answer Drawer
      return `
        <div class="pointer-events-auto drawer-enter bg-rose-50 dark:bg-[#2b0f18] border-t-2 border-rose-400 dark:border-rose-700 shadow-2xl">
          <div class="max-w-[560px] mx-auto px-4 py-4 space-y-3">
            <div class="flex items-start gap-3">
              <span class="w-8 h-8 rounded-full bg-rose-500 text-white font-extrabold flex items-center justify-center shrink-0 text-base">!</span>
              <div class="min-w-0">
                <p class="text-base font-display font-extrabold text-rose-800 dark:text-rose-300">Watch the trap! <span class="text-xs font-bold opacity-80">(Queued for replay)</span></p>
                <p class="text-xs sm:text-sm text-rose-900 dark:text-rose-100 mt-0.5 leading-snug">${step.wrongMsg}</p>
              </div>
            </div>
            <button
              type="button"
              onclick="continueLesson()"
              class="btn-3d btn-rose w-full py-3.5 text-sm sm:text-base tracking-wide"
            >
              GOT IT — CONTINUE
            </button>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 10. FREE EXPLORE ANATOMY LAB MODE
    // =========================================================================
    function renderExploreLab() {
      const isDerm = state.exploreTab === 'derm';
      const item = isDerm
        ? (DERMATOME_DATA[state.exploreDerm] || DERMATOME_DATA.C6)
        : (PERIPHERAL_DATA[state.explorePeriph] || PERIPHERAL_DATA.radial);

      return `
        <div class="step-enter space-y-4 pb-8">
          <div class="flex items-center justify-between gap-2">
            <div>
              <span class="text-[11px] font-display font-extrabold uppercase tracking-wider text-sky-600 dark:text-sky-400">Free Explore Anatomy Lab</span>
              <h2 class="text-xl font-display font-extrabold">Tap Any Zone to Inspect</h2>
            </div>
          </div>

          <!-- Sub-Tabs: Dermatomes vs Peripheral Nerves -->
          <div class="grid grid-cols-2 gap-2 p-1.5 rounded-2xl bg-slate-200/70 dark:bg-slate-800/80">
            <button
              type="button"
              onclick="state.exploreTab='derm'; renderAll();"
              class="py-2 rounded-xl text-xs sm:text-sm font-display font-extrabold transition ${
                isDerm ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-xs' : 'text-slate-600 dark:text-slate-400'
              }"
            >Dermatomes (C5–T1)</button>
            <button
              type="button"
              onclick="state.exploreTab='periph'; renderAll();"
              class="py-2 rounded-xl text-xs sm:text-sm font-display font-extrabold transition ${
                !isDerm ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-xs' : 'text-slate-600 dark:text-slate-400'
              }"
            >Peripheral Nerves</button>
          </div>

          <!-- Interactive Labeled SVG -->
          <div class="rounded-3xl bg-white dark:bg-[#131c31] border-2 border-slate-200 dark:border-slate-800 p-3 shadow-xs">
            ${isDerm
              ? buildDermatomeArmSVG('teach', state.exploreDerm, null)
              : buildPeripheralArmSVG('teach', state.explorePeriph, null)}
          </div>

          <!-- Quick Selector Strip -->
          <div class="flex flex-wrap gap-1.5 justify-center">
            ${isDerm
              ? Object.keys(DERMATOME_DATA).map((k) => `
                  <button
                    type="button"
                    onclick="inspectDermZone('${k}')"
                    class="px-3.5 py-1.5 rounded-xl text-xs font-display font-extrabold border-2 transition ${
                      state.exploreDerm === k
                        ? 'bg-sky-500 text-white border-sky-500'
                        : 'bg-white dark:bg-[#131c31] border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300'
                    }"
                  >${k}</button>
                `).join('')
              : Object.entries(PERIPHERAL_DATA).map(([k, v]) => `
                  <button
                    type="button"
                    onclick="inspectPeriphZone('${k}')"
                    class="px-3 py-1.5 rounded-xl text-xs font-display font-extrabold border-2 transition ${
                      state.explorePeriph === k
                        ? 'bg-sky-500 text-white border-sky-500'
                        : 'bg-white dark:bg-[#131c31] border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300'
                    }"
                  >${v.name.replace(' Nerve', '').replace(' Nerves', '')}</button>
                `).join('')
            }
          </div>

          <!-- Crisp Bottom Anatomy Card -->
          <article class="rounded-3xl bg-white dark:bg-[#131c31] border-2 border-slate-200 dark:border-slate-800 p-5 space-y-3 shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 rounded-xl text-xs font-display font-extrabold border ${item.badgeClass}">${item.name}</span>
                ${item.roots ? `<span class="text-xs font-bold text-slate-400">${item.roots}</span>` : ''}
              </div>
              <span class="text-xs font-display font-extrabold text-slate-500 dark:text-slate-400">${item.hook}</span>
            </div>

            <div class="grid grid-cols-1 gap-2.5 text-xs sm:text-sm">
              <div class="p-3 rounded-2xl bg-sky-50/70 dark:bg-sky-950/30 border border-sky-200/80 dark:border-sky-900">
                <span class="block text-[10px] font-display font-extrabold uppercase text-sky-700 dark:text-sky-400">Sensation</span>
                <p class="font-medium text-slate-800 dark:text-slate-100 mt-0.5">${item.sensation}</p>
              </div>

              <div class="p-3 rounded-2xl bg-emerald-50/70 dark:bg-emerald-950/30 border border-emerald-200/80 dark:border-emerald-900">
                <span class="block text-[10px] font-display font-extrabold uppercase text-emerald-700 dark:text-emerald-400">${isDerm ? 'Myotome (Specific Muscles)' : 'Muscles & Actions'}</span>
                <p class="font-display font-extrabold text-emerald-800 dark:text-emerald-300 mt-0.5">${isDerm ? item.myotome : item.muscles}</p>
                <p class="text-xs text-slate-600 dark:text-slate-300 mt-0.5">${isDerm ? item.action : item.actions}</p>
              </div>

              ${isDerm ? `
                <div class="p-3 rounded-2xl bg-violet-50/70 dark:bg-violet-950/30 border border-violet-200/80 dark:border-violet-900">
                  <span class="block text-[10px] font-display font-extrabold uppercase text-violet-700 dark:text-violet-400">Reflex</span>
                  <p class="font-bold text-slate-800 dark:text-slate-100 mt-0.5">${item.reflex}</p>
                </div>
              ` : ''}

              <div class="p-3 rounded-2xl bg-amber-50/70 dark:bg-amber-950/30 border border-amber-200/80 dark:border-amber-900">
                <span class="block text-[10px] font-display font-extrabold uppercase text-amber-700 dark:text-amber-400">💡 Visual Analogy</span>
                <p class="text-slate-800 dark:text-slate-100 mt-0.5">${item.analogy}</p>
              </div>

              <div class="p-3 rounded-2xl bg-rose-50/80 dark:bg-rose-950/35 border border-rose-300 dark:border-rose-800">
                <span class="block text-[10px] font-display font-extrabold uppercase text-rose-600 dark:text-rose-400">⚠️ Assessor Trap</span>
                <p class="font-bold text-rose-900 dark:text-rose-100 mt-0.5">${item.trap}</p>
              </div>
            </div>
          </article>
        </div>
      `;
    }

    // =========================================================================
    // 11. COMPLETION CELEBRATION SCREEN + CONFETTI
    // =========================================================================
    function renderCelebrationScreen() {
      const acc = state.firstTryTotal > 0
        ? Math.round((state.firstTryCorrect / state.firstTryTotal) * 100)
        : 100;

      return `
        <div class="step-enter relative overflow-hidden rounded-3xl bg-white dark:bg-[#131c31] border-2 border-emerald-300 dark:border-emerald-800 p-6 sm:p-8 text-center space-y-6 shadow-lg">
          <div id="confetti-layer" class="absolute inset-0 overflow-hidden pointer-events-none"></div>

          <div class="relative z-10 space-y-2">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-emerald-500 text-white text-3xl flex items-center justify-center shadow-md">🏆</div>
            <span class="inline-block px-3 py-1 rounded-xl text-xs font-display font-extrabold uppercase bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300">
              Lesson Complete!
            </span>
            <h2 class="text-2xl sm:text-3xl font-display font-extrabold">Upper Limb Mastered</h2>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
              You cleared every C5–T1 dermatome, myotome, reflex, and peripheral nerve — including your Mistake Replay Loop.
            </p>
          </div>

          <!-- Stats Row -->
          <div class="relative z-10 grid grid-cols-2 gap-3">
            <div class="p-4 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border-2 border-amber-200 dark:border-amber-800">
              <span class="block text-[11px] font-display font-extrabold uppercase text-amber-700 dark:text-amber-400">Total XP</span>
              <span class="text-2xl font-display font-extrabold text-amber-600 dark:text-amber-300">⚡ ${state.xp}</span>
            </div>
            <div class="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border-2 border-emerald-200 dark:border-emerald-800">
              <span class="block text-[11px] font-display font-extrabold uppercase text-emerald-700 dark:text-emerald-400">First-Try Accuracy</span>
              <span class="text-2xl font-display font-extrabold text-emerald-600 dark:text-emerald-300">${acc}%</span>
            </div>
          </div>

          <!-- Traps Defeated Badges -->
          <div class="relative z-10 space-y-2 text-left">
            <p class="text-[11px] font-display font-extrabold uppercase tracking-wider text-slate-400 text-center">Traps Defeated</p>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <div class="p-2.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 text-center">
                <span class="block text-base">💪</span>
                <span class="text-[11px] font-display font-extrabold">Specific Muscles Named</span>
              </div>
              <div class="p-2.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 text-center">
                <span class="block text-base">🏍️</span>
                <span class="text-[11px] font-display font-extrabold">Extensor vs Flexor Cleared</span>
              </div>
              <div class="p-2.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 text-center">
                <span class="block text-base">🗺️</span>
                <span class="text-[11px] font-display font-extrabold">C6 / T1 Mapped</span>
              </div>
            </div>
          </div>

          <!-- Chunky Action Buttons -->
          <div class="relative z-10 space-y-2.5 pt-2">
            <button type="button" onclick="replayLesson()" class="btn-3d btn-emerald w-full py-3.5 text-sm">
              ↺ REPLAY LESSON
            </button>
            <button type="button" onclick="setAppMode('explore')" class="btn-3d btn-sky w-full py-3.5 text-sm">
              🔬 OPEN FREE EXPLORE LAB
            </button>
            <a href="neuro.html" class="btn-3d btn-neutral block w-full py-3.5 text-sm text-center">
              &larr; BACK TO NEURO HUB
            </a>
          </div>
        </div>
      `;
    }

    function spawnConfetti() {
      const layer = document.getElementById('confetti-layer');
      if (!layer) return;
      const colors = ['#10b981', '#0ea5e9', '#8b5cf6', '#f59e0b', '#f43f5e'];
      for (let i = 0; i < 34; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.backgroundColor = colors[i % colors.length];
        piece.style.animationDuration = `${1.6 + Math.random() * 1.4}s`;
        piece.style.animationDelay = `${Math.random() * 0.4}s`;
        layer.appendChild(piece);
      }
    }

    // =========================================================================
    // 12. INITIALISE
    // =========================================================================
    initTheme();
    renderAll();
  </script>
</body>
</html>
