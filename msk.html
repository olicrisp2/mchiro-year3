<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Musculoskeletal Medicine – MChiro Year 3 Hub</title>

  <style>
    /* =========================================================================
       1. DESIGN TOKENS: APPLE HEALTH MINIMALIST × DUOLINGO TACTILE 3D
       Zero external CDNs — pure system font stack & inline SVG anatomy.
       ========================================================================= */
    :root {
      --bg-page: #F2F2F7;
      --bg-card: #FFFFFF;
      --bg-subtle: #EAEAF0;
      --bg-input: #F8FAFC;
      --bg-glass: rgba(242, 242, 247, 0.90);
      --border-card: #E2E8F0;
      --border-strong: #CBD5E1;
      --text-main: #0F172A;
      --text-muted: #475569;
      --shadow-card: 0 2px 12px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);

      /* Semantic Cognitive Colour-Coding */
      --coral: #E11D48;
      --coral-dark: #9F1239;
      --coral-soft: rgba(225, 29, 72, 0.10);
      --coral-border: rgba(225, 29, 72, 0.32);

      --blue: #2563EB;
      --blue-dark: #1D4ED8;
      --blue-soft: rgba(37, 99, 235, 0.10);
      --blue-border: rgba(37, 99, 235, 0.30);

      --purple: #7C3AED;
      --purple-dark: #5B21B6;
      --purple-soft: rgba(124, 58, 237, 0.10);
      --purple-border: rgba(124, 58, 237, 0.30);

      --emerald: #059669;
      --emerald-dark: #047857;
      --emerald-soft: rgba(5, 150, 105, 0.11);
      --emerald-border: rgba(5, 150, 105, 0.32);

      --amber: #D97706;
      --amber-dark: #92400E;
      --amber-soft: rgba(217, 119, 6, 0.12);
      --amber-border: rgba(217, 119, 6, 0.36);

      /* SVG Tokens */
      --svg-bg: #F8FAFC;
      --svg-bone: #F1F5F9;
      --svg-bone-stroke: #475569;
      --svg-cartilage: #38BDF8;
      --svg-capsule: #94A3B8;
    }

    .dark {
      --bg-page: #090D16;
      --bg-card: #131B2E;
      --bg-subtle: #1E293B;
      --bg-input: #0F172A;
      --bg-glass: rgba(9, 13, 22, 0.90);
      --border-card: #26344F;
      --border-strong: #3D5073;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --shadow-card: 0 4px 18px rgba(0, 0, 0, 0.46);

      --coral-soft: rgba(225, 29, 72, 0.22);
      --coral-border: rgba(251, 113, 133, 0.44);

      --blue-soft: rgba(37, 99, 235, 0.22);
      --blue-border: rgba(96, 165, 250, 0.44);

      --purple-soft: rgba(124, 58, 237, 0.22);
      --purple-border: rgba(167, 139, 250, 0.44);

      --emerald-soft: rgba(5, 150, 105, 0.22);
      --emerald-border: rgba(52, 211, 153, 0.42);

      --amber-soft: rgba(217, 119, 6, 0.22);
      --amber-border: rgba(251, 191, 36, 0.44);

      --svg-bg: #0F172A;
      --svg-bone: #1E293B;
      --svg-bone-stroke: #CBD5E1;
      --svg-cartilage: #38BDF8;
      --svg-capsule: #64748B;
    }

    /* =========================================================================
       2. BASE RESET & TYPOGRAPHY
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.48;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    h1, h2, h3, h4, p { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font-family: inherit; }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: -0.02em;
    }

    /* CRITICAL ZERO-STROKE SVG TEXT GUARDRAIL */
    svg text {
      stroke: none !important;
      paint-order: fill;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 0 12px;
    }
    @media (min-width: 640px) {
      .container { padding: 0 22px; }
    }

    .main-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-top: 16px;
      padding-bottom: 108px;
    }
    @media (min-width: 769px) {
      .main-stack { padding-bottom: 54px; }
    }

    /* =========================================================================
       3. STICKY FROSTED-GLASS HEADER & 4-TAB SEGMENTED BAR
       ========================================================================= */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-card);
    }

    .header-inner {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 36px;
      padding: 6px 11px;
      border-radius: 12px;
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 12.5px;
      font-weight: 800;
      transition: background-color 0.14s ease;
    }
    .back-btn:hover { background: var(--border-strong); }

    .header-center {
      text-align: center;
      min-width: 0;
    }
    .page-title {
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .theme-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--border-card);
      background: var(--bg-card);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.14s ease;
    }
    .theme-btn:hover { border-color: var(--blue); }

    .tabs-scroll {
      padding-bottom: 10px;
      overflow-x: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }

    .seg-track {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 14px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      min-width: max-content;
    }
    @media (min-width: 680px) {
      .seg-track {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        min-width: 0;
      }
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      min-height: 38px;
      padding: 7px 12px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      text-align: center;
    }
    .seg-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.09);
    }

    /* =========================================================================
       4. SHARED SURFACES, SEMANTIC BOXES, INPUTS & TACTILE 3D BUTTONS
       ========================================================================= */
    .ah-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      box-shadow: var(--shadow-card);
    }
    .ah-card-alt {
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      border-radius: 14px;
    }
    .pad-card { padding: 15px; }
    @media (min-width: 640px) {
      .pad-card { padding: 20px; }
    }

    .stack { display: flex; flex-direction: column; gap: 14px; }
    .stack-sm { display: flex; flex-direction: column; gap: 10px; }

    .flex-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 640px) {
      .grid-2 { grid-template-columns: 1fr 1fr; }
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 580px) {
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
    }

    .grid-3-compact {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.015em;
      white-space: nowrap;
    }
    .badge-coral { background: var(--coral-soft); color: var(--coral-dark); border: 1px solid var(--coral-border); }
    .dark .badge-coral { color: #FDA4AF; }
    .badge-blue { background: var(--blue-soft); color: var(--blue-dark); border: 1px solid var(--blue-border); }
    .dark .badge-blue { color: #93C5FD; }
    .badge-purple { background: var(--purple-soft); color: var(--purple-dark); border: 1px solid var(--purple-border); }
    .dark .badge-purple { color: #DDD6FE; }
    .badge-emerald { background: var(--emerald-soft); color: var(--emerald-dark); border: 1px solid var(--emerald-border); }
    .dark .badge-emerald { color: #6EE7B7; }
    .badge-amber { background: var(--amber-soft); color: var(--amber-dark); border: 1px solid var(--amber-border); }
    .dark .badge-amber { color: #FDE68A; }
    .badge-muted { background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border-card); }

    /* Semantic Info Boxes */
    .sem-box {
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      border: 1.5px solid transparent;
    }
    .sem-label {
      display: block;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .sem-coral { background: var(--coral-soft); border-color: var(--coral-border); }
    .sem-coral .sem-label { color: var(--coral-dark); }
    .dark .sem-coral .sem-label { color: #FDA4AF; }

    .sem-blue { background: var(--blue-soft); border-color: var(--blue-border); }
    .sem-blue .sem-label { color: var(--blue-dark); }
    .dark .sem-blue .sem-label { color: #93C5FD; }

    .sem-purple { background: var(--purple-soft); border-color: var(--purple-border); }
    .sem-purple .sem-label { color: var(--purple-dark); }
    .dark .sem-purple .sem-label { color: #DDD6FE; }

    .sem-emerald { background: var(--emerald-soft); border-color: var(--emerald-border); }
    .sem-emerald .sem-label { color: var(--emerald-dark); }
    .dark .sem-emerald .sem-label { color: #6EE7B7; }

    .sem-amber { background: var(--amber-soft); border-color: var(--amber-border); }
    .sem-amber .sem-label { color: var(--amber-dark); }
    .dark .sem-amber .sem-label { color: #FDE68A; }

    /* Tactile Duolingo 3D Buttons */
    .btn-3d {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
      padding: 10px 15px;
      border-radius: 15px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      text-align: center;
      transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.14s ease, opacity 0.14s ease;
    }
    .btn-3d:hover:not(:disabled) { filter: brightness(1.06); }
    .btn-3d:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px !important;
    }
    .btn-3d:disabled { opacity: 0.42; cursor: not-allowed; }
    .btn-3d.sm {
      min-height: 36px;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 12px;
    }
    .btn-full { width: 100%; }

    .btn-coral { background: var(--coral); color: #FFFFFF; border: 2px solid var(--coral); border-bottom: 4px solid var(--coral-dark); }
    .btn-blue { background: var(--blue); color: #FFFFFF; border: 2px solid var(--blue); border-bottom: 4px solid var(--blue-dark); }
    .btn-purple { background: var(--purple); color: #FFFFFF; border: 2px solid var(--purple); border-bottom: 4px solid var(--purple-dark); }
    .btn-emerald { background: var(--emerald); color: #FFFFFF; border: 2px solid var(--emerald); border-bottom: 4px solid var(--emerald-dark); }
    .btn-amber { background: var(--amber); color: #FFFFFF; border: 2px solid var(--amber); border-bottom: 4px solid var(--amber-dark); }
    .btn-neutral {
      background: var(--bg-card);
      color: var(--text-main);
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-strong);
    }

    /* Selectable Tactile Choice / Pill Buttons */
    .pill-btn {
      min-height: 40px;
      padding: 8px 11px;
      border-radius: 13px;
      border: 2px solid var(--border-card);
      border-bottom: 3.5px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.07s ease, border-color 0.14s ease, background-color 0.14s ease;
      text-align: center;
    }
    .pill-btn:hover:not(:disabled) { border-color: var(--blue); }
    .pill-btn:active:not(:disabled) { transform: translateY(1.5px); border-bottom-width: 2px; }
    .pill-btn:disabled { cursor: default; }

    .pill-btn.active-coral { background: var(--coral); border-color: var(--coral); border-bottom-color: var(--coral-dark); color: #FFFFFF; }
    .pill-btn.active-blue { background: var(--blue); border-color: var(--blue); border-bottom-color: var(--blue-dark); color: #FFFFFF; }
    .pill-btn.active-purple { background: var(--purple); border-color: var(--purple); border-bottom-color: var(--purple-dark); color: #FFFFFF; }
    .pill-btn.active-emerald { background: var(--emerald); border-color: var(--emerald); border-bottom-color: var(--emerald-dark); color: #FFFFFF; }
    .pill-btn.active-amber { background: var(--amber); border-color: var(--amber); border-bottom-color: var(--amber-dark); color: #FFFFFF; }

    .choice-card {
      width: 100%;
      min-height: 48px;
      padding: 11px 13px;
      border-radius: 14px;
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-main);
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .choice-card:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-soft); }
    .choice-card:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
    .choice-card:disabled { cursor: default; }

    .choice-key {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      font-size: 11px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .choice-card.is-selected { border-color: var(--blue); border-bottom-color: var(--blue-dark); background: var(--blue-soft); }
    .choice-card.is-selected .choice-key { background: var(--blue); border-color: var(--blue); color: #FFFFFF; }
    .choice-card.is-correct { border-color: var(--emerald); border-bottom-color: var(--emerald-dark); background: var(--emerald-soft); }
    .choice-card.is-correct .choice-key { background: var(--emerald); border-color: var(--emerald); color: #FFFFFF; }
    .choice-card.is-wrong { border-color: var(--coral); border-bottom-color: var(--coral-dark); background: var(--coral-soft); }
    .choice-card.is-wrong .choice-key { background: var(--coral); border-color: var(--coral); color: #FFFFFF; }

    /* Form Controls */
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .input, .select, .textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 13px;
      border: 1.5px solid var(--border-card);
      background: var(--bg-input);
      color: var(--text-main);
      font-size: 13.5px;
      transition: border-color 0.14s ease, box-shadow 0.14s ease;
    }
    .input, .select { min-height: 42px; }
    .textarea { resize: vertical; line-height: 1.45; }
    .input:focus, .select:focus, .textarea:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }

    /* =========================================================================
       5. TAB-SPECIFIC COMPONENTS (DIAGNOSTICS, SCT, JOINT SVG, DOMINO, VAULT)
       ========================================================================= */
    .stat-tile {
      padding: 12px 10px;
      border-radius: 16px;
      border: 1.5px solid var(--border-card);
      background: var(--bg-card);
      box-shadow: var(--shadow-card);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-tile.ok { background: var(--emerald-soft); border-color: var(--emerald-border); }
    .stat-tile.warn { background: var(--amber-soft); border-color: var(--amber-border); }
    .stat-tile.risk { background: var(--coral-soft); border-color: var(--coral-border); }
    .stat-num {
      font-size: 19px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .stat-lbl {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* SCT 5-Button Scale */
    .sct-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .sct-btn {
      min-height: 54px;
      padding: 6px 4px;
      border-radius: 13px;
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: all 0.12s ease;
    }
    .sct-btn:hover:not(:disabled) { border-color: var(--purple); background: var(--purple-soft); }
    .sct-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
    .sct-btn .sct-v { font-size: 15px; font-weight: 800; }
    .sct-btn .sct-t { font-size: 9px; font-weight: 700; color: var(--text-muted); line-height: 1.1; text-align: center; }
    .sct-btn.is-correct { background: var(--emerald); border-color: var(--emerald); border-bottom-color: var(--emerald-dark); color: #FFFFFF; }
    .sct-btn.is-correct .sct-t { color: #ECFDF5; }
    .sct-btn.is-wrong { background: var(--coral); border-color: var(--coral); border-bottom-color: var(--coral-dark); color: #FFFFFF; }
    .sct-btn.is-wrong .sct-t { color: #FFE4E6; }

    /* Joint SVG Spotlight / Fade-Others */
    .joint-svg {
      display: block;
      width: 100%;
      max-width: 560px;
      height: auto;
      margin: 0 auto;
      user-select: none;
    }
    .joint-col {
      cursor: pointer;
      transition: opacity 0.22s ease, filter 0.22s ease;
    }
    .joint-svg.has-sel .joint-col:not(.is-active) {
      opacity: 0.20;
      filter: saturate(0.30);
    }
    .joint-col.is-active {
      opacity: 1 !important;
    }

    /* Domino Chain Slots & Tiles */
    .domino-slot {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1.5px dashed var(--border-strong);
      background: var(--bg-subtle);
      min-height: 46px;
      transition: all 0.18s ease;
    }
    .domino-slot.filled {
      border-style: solid;
      border-color: var(--emerald);
      background: var(--emerald-soft);
    }
    .domino-num {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-strong);
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .domino-slot.filled .domino-num {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #FFFFFF;
    }

    .domino-tile {
      width: 100%;
      padding: 11px 13px;
      border-radius: 14px;
      border: 2px solid var(--purple-border);
      border-bottom: 4px solid var(--purple);
      background: var(--bg-card);
      color: var(--text-main);
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease, background-color 0.14s ease;
    }
    .domino-tile:hover { background: var(--purple-soft); }
    .domino-tile:active { transform: translateY(2px); border-bottom-width: 2px; }
    .domino-tile.shake {
      border-color: var(--coral);
      border-bottom-color: var(--coral-dark);
      background: var(--coral-soft);
      animation: shakeX 0.32s ease;
    }

    @keyframes shakeX {

        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return parsed !== null && parsed !== undefined ? parsed : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveJSON(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}

      let saved = null;
      try { saved = localStorage.getItem('mchiro_theme'); } catch (e) {}
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? (saved === 'dark' || saved === '"dark"') : prefersDark;
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      try { localStorage.setItem('mchiro_theme', isDark ? 'dark' : 'light'); } catch (e) {}
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) btn.innerHTML = isDark ? SUN_SVG : MOON_SVG;

      applyTheme(!document.documentElement.classList.contains('dark'));

    function getMskVignetteMetrics() {
      const raw = loadJSON('mchiro_diag_v1', []);
      const arr = Array.isArray(raw) ? raw : [];
      const mskVigs = arr.filter((e) => e && e.source === 'msk' && typeof e.id === 'string' && e.id.indexOf('msk_vig_') === 0);

      const total = mskVigs.length;
      const correctCount = mskVigs.filter((e) => e.correct).length;
      const blindPct = total > 0 ? Math.round((correctCount / total) * 100) : 0;

      const redFlags = mskVigs.filter((e) => e.isRedFlag);
      const rfCorrect = redFlags.filter((e) => e.triageCorrect !== undefined ? e.triageCorrect : e.correct).length;
      const rfPct = redFlags.length > 0 ? `${Math.round((rfCorrect / redFlags.length) * 100)}%` : '—';
      const rfOk = redFlags.length === 0 || rfCorrect === redFlags.length;

      const allMsk = arr.filter((e) => e && e.source === 'msk');
      const highConfErrors = allMsk.filter((e) => e.confidence === 'certain' && !e.correct).length;

      return { total, correctCount, blindPct, rfPct, rfOk, rfTotal: redFlags.length, highConfErrors };
    }

      const unseen = VIGNETTES.map((v, i) => ({ v, i })).filter((x) => !state.seenVigIds[x.v.id] && x.i !== state.vigIdx);
      let pickIdx;
      if (unseen.length > 0) {
        pickIdx = unseen[Math.floor(Math.random() * unseen.length)].i;
      } else {
        state.seenVigIds = {};
        const pool = VIGNETTES.map((_, i) => i).filter((i) => i !== state.vigIdx);
        pickIdx = pool[Math.floor(Math.random() * pool.length)];
        showToast('All 12 cases cycled — reshuffling unseen deck!', 'emerald');

      window.scrollTo({ top: 0, behavior: 'smooth' });

    function lockInVignette() {
      if (!state.selTriage || !state.selDiff || !state.selConf || state.vigLocked) return;
      const v = VIGNETTES[state.vigIdx];
      const triageOk = state.selTriage === v.triageCorrect;
      const diffOk = state.selDiff === v.diffCorrect;
      const bothOk = triageOk && diffOk;

      state.vigLocked = true;
      state.seenVigIds[v.id] = true;
      state.vigResult = { triageOk, diffOk, bothOk };

      appendDiagTelemetry({
        id: v.id,
        source: 'msk',
        rootCauseTag: v.rootCauseTag,
        confidence: state.selConf,
        correct: bothOk,
        triageCorrect: triageOk,
        isRedFlag: v.isRedFlag,
        timestamp: Date.now(),
      });

      if (!bothOk && state.selConf === 'certain') {
        showToast('High-Confidence Error logged! Review rationale below.', 'coral');

        showToast('✓ Triage & Differential locked — now complete the SCT twist!', 'emerald');

    function tapDominoTile(chainId, tileIdx) {
      const chain = DOMINO_CHAINS.find((c) => c.id === chainId);
      const ds = state.domino[chainId];
      if (!chain || !ds) return;

      const expectedIdx = ds.placed.length;
      if (tileIdx === expectedIdx) {
        ds.placed.push(chain.steps[tileIdx]);
        ds.pool = ds.pool.filter((t) => t.idx !== tileIdx);
        ds.wrongTileIdx = null;
        if (ds.placed.length === chain.steps.length) {
          showToast('✓ Causal Domino Chain Complete!', 'emerald');
        }
        renderApp();
      } else {
        ds.wrongTileIdx = tileIdx;
        showToast(`Not step ${expectedIdx + 1} — think what happens next physiologically!`, 'coral');
        renderApp();
        setTimeout(() => {
          if (state.domino[chainId]) {
            state.domino[chainId].wrongTileIdx = null;
            renderApp();
          }
        }, 420);
      }
    }

    function gradeBmsSrs(cardId, gotIt) {
      const card = BMS_SRS_CARDS.find((c) => c.id === cardId);
      if (!card) return;

      // Reload latest mchiro_srs_v4 so we NEVER overwrite neuro/written keys
      const latestSrs = loadJSON('mchiro_srs_v4', {});
      const cur = latestSrs[cardId] || { box: 1 };
      let nextBox = typeof cur.box === 'number' ? cur.box : 1;
      let days = 0;

      if (!gotIt) {
        nextBox = 1;
        days = 0;
      } else {
        nextBox = Math.min(5, nextBox + 1);
        days = [0, 1, 3, 7, 14, 30][nextBox];
      }

      latestSrs[cardId] = { box: nextBox, dueAt: Date.now() + days * DAY_MS };
      saveJSON('mchiro_srs_v4', latestSrs);
      state.srs = latestSrs;

      appendDiagTelemetry({
        id: cardId,
        source: 'msk',
        rootCauseTag: card.rootCause,
        confidence: state.srsConf || 'unsure',
        correct: gotIt,
        isRedFlag: card.cat === 'Red Flag',
        timestamp: Date.now(),
      });

      if (!gotIt && state.srsConf === 'certain') {
        showToast('High-Confidence Error logged (Box 1)', 'coral');
      } else if (!gotIt) {
        showToast('Reset to Box 1 — Due Today', 'amber');
      } else {
        showToast(`Promoted to Box ${nextBox} (${days}d)`, 'emerald');
      }

      state.srsConf = null;
      state.srsRevealed = false;
      state.srsIdx = (state.srsIdx + 1) % getSrsDeck().length;
      renderApp();
    }

    function addOrthoVaultItem(e) {
      e.preventDefault();
      const region = document.getElementById('ov_region').value;
      const name = (document.getElementById('ov_name').value || '').trim();
      const positive = (document.getElementById('ov_pos').value || '').trim();
      const note = (document.getElementById('ov_note').value || '').trim();

      if (!name || !positive) {
        showToast('Enter a Test Name and Positive Sign first.', 'amber');
        return;

      state.orthoVault.unshift({
        id: 'ov_' + Date.now().toString(36),

        positive,
        note,
        isTemplate: false,

      saveJSON('mchiro_msk_vault_v1', state.orthoVault);
      state.orthoRegion = region;

                const done = state.domino[c.id].placed.length === c.steps.length;
                return `
                  <button
                    type="button"
                    class="pill-btn ${state.activeChainId === c.id ? 'active-purple' : ''}"
                    style="min-height:36px;padding:6px 11px;font-size:11.5px;"
                    onclick="state.activeChainId='${c.id}'; renderApp();"
                  >${done ? '✓ ' : ''}${c.title}</button>
                `;
              }).join('')}
            </div>

            <!-- Numbered Target Slots -->
            <div class="stack-sm">
              <div class="flex-between">
                <span class="field-label" style="margin:0;">${chain.title}</span>
                <span class="badge ${isComplete ? 'badge-emerald' : 'badge-purple'} mono">${ds.placed.length} / ${chain.steps.length} Steps</span>
              </div>

              ${chain.steps.map((_, i) => {
                const filledText = ds.placed[i];
                return `
                  <div class="domino-slot ${filledText ? 'filled' : ''}">
                    <span class="domino-num mono">${i + 1}</span>
                    <span style="font-size:13.5px;font-weight:${filledText ? '700' : '600'};color:${filledText ? 'var(--text-main)' : 'var(--text-muted)'};">
                      ${filledText ? esc(filledText) : `Tap step ${i + 1} from the tiles below...`}
                    </span>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Shuffled Step Pool or Completion Pearl -->
            ${isComplete ? `
              <div class="sem-box sem-emerald stack-sm">
                <span class="sem-label">✓ Pathway Mastered!</span>
                <p style="font-weight:700;">${esc(chain.takeaway)}</p>
                <button type="button" class="btn-3d btn-emerald sm" style="align-self:flex-start;" onclick="resetDominoChain('${chain.id}')">Practice Again ↺</button>
              </div>
            ` : `
              <div class="stack-sm">
                <span class="field-label" style="margin:0;">Tap the Next Physiological Step (Step ${ds.placed.length + 1}):</span>
                ${ds.pool.map((tile) => `
                  <button
                    type="button"
                    class="domino-tile ${ds.wrongTileIdx === tile.idx ? 'shake' : ''}"
                    onclick="tapDominoTile('${chain.id}', ${tile.idx})"
                  >${esc(tile.text)}</button>
                `).join('')}
              </div>
            `}
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 15. RENDER TAB 3 — BMS BOTTLENECK ACTIVE RECALL (LEITNER SRS)
    // =========================================================================
    function renderTabSrs() {
      const now = Date.now();
      let dueCount = 0;
      let masteredCount = 0;
      BMS_SRS_CARDS.forEach((c) => {
        const rec = state.srs[c.id];
        if (!rec || (typeof rec.box === 'number' && rec.box <= 1) || !rec.dueAt || now >= rec.dueAt) dueCount++;
        if (rec && typeof rec.box === 'number' && rec.box >= 4) masteredCount++;
      });

      const deck = getSrsDeck();
      const safeIdx = state.srsIdx % deck.length;
      const card = deck[safeIdx];
      const rec = state.srs[card.id] || { box: 1 };
      const boxNum = typeof rec.box === 'number' ? rec.box : 1;

      return `
        <div class="stack">
          <!-- Due / Mastered Summary Bar -->
          <section class="grid-3-compact">
            <div class="stat-tile ${dueCount > 0 ? 'warn' : 'ok'}">
              <span class="stat-lbl">Due Now</span>
              <span class="stat-num mono">${dueCount}</span>
            </div>
            <div class="stat-tile ok">
              <span class="stat-lbl">Mastered (4–5)</span>
              <span class="stat-num mono">${masteredCount}</span>
            </div>
            <div class="stat-tile">
              <span class="stat-lbl">BMS Deck</span>
              <span class="stat-num mono">${BMS_SRS_CARDS.length}</span>
            </div>
          </section>

          <!-- Confidence-Weighted Active-Recall Card -->
          <section class="ah-card pad-card stack">
            <div class="flex-between">
              <div>
                <span class="badge badge-purple mono">mchiro_srs_v4 &bull; mchiro_diag_v1</span>
                <h2 style="font-size:17.5px;font-weight:800;margin-top:4px;">BMS Bottleneck Active Recall</h2>
              </div>
              <button
                type="button"
                class="pill-btn ${state.srsDueOnly ? 'active-purple' : ''}"
                style="min-height:34px;padding:4px 11px;font-size:11.5px;"
                onclick="state.srsDueOnly=!state.srsDueOnly; state.srsIdx=0; state.srsConf=null; state.srsRevealed=false; renderApp();"
              >${state.srsDueOnly ? 'Due Only' : 'All 14 Cards'}</button>
            </div>

            <article class="ah-card-alt pad-card stack">
              <div class="flex-between">
                <span class="badge ${card.cat === 'Red Flag' ? 'badge-coral' : 'badge-purple'}">${card.cat}</span>
                <span class="badge badge-amber mono">Card ${safeIdx + 1}/${deck.length} &bull; Box ${boxNum}/5</span>
              </div>

              <h3 style="font-size:18.5px;font-weight:800;line-height:1.32;">${esc(card.q)}</h3>

              ${!state.srsRevealed ? `
                <div class="stack-sm">
                  <span class="field-label" style="margin:0;">1. Speak the mechanism / clinical values aloud, then rate confidence:</span>
                  <div class="grid-3-compact">
                    <button type="button" class="pill-btn ${state.srsConf === 'guess' ? 'active-coral' : ''}" onclick="state.srsConf='guess'; renderApp();">🎲 Guess</button>
                    <button type="button" class="pill-btn ${state.srsConf === 'unsure' ? 'active-amber' : ''}" onclick="state.srsConf='unsure'; renderApp();">🤔 Unsure</button>
                    <button type="button" class="pill-btn ${state.srsConf === 'certain' ? 'active-emerald' : ''}" onclick="state.srsConf='certain'; renderApp();">🎯 Certain</button>
                  </div>
                  <button type="button" class="btn-3d btn-blue btn-full" ${state.srsConf ? '' : 'disabled'} onclick="state.srsRevealed=true; renderApp();">
                    ${state.srsConf ? 'Reveal Model Answer &rarr;' : 'Select Confidence Pill First'}
                  </button>
                </div>
              ` : `
                <div class="sem-box sem-emerald">
                  <span class="sem-label">Model Answer</span>
                  <p style="font-weight:600;line-height:1.5;">${esc(card.a)}</p>
                </div>

                <div class="stack-sm">
                  <span class="field-label" style="margin:0;">2. Self-Grade Honestly (Confidence was: <strong style="color:var(--text-main);">${state.srsConf}</strong>):</span>
                  <div class="grid-2">
                    <button type="button" class="btn-3d btn-coral btn-full" onclick="gradeBmsSrs('${card.id}', false)">✕ Missed (Reset to Box 1)</button>
                    <button type="button" class="btn-3d btn-emerald btn-full" onclick="gradeBmsSrs('${card.id}', true)">✓ Got It (Promote Box)</button>
                  </div>
                </div>
              `}
            </article>
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 16. RENDER TAB 4 — YEAR 3 ORTHO SPECIAL TESTS & IMAGING SCAFFOLDING
    // =========================================================================
    function renderTabOrtho() {
      const regionTests = state.orthoVault.filter((t) => t.region === state.orthoRegion);

      return `
        <div class="stack">
          <!-- Part A: Systematic ABCS X-Ray, Cervical Views & IR(ME)R -->
          <section class="ah-card pad-card stack-sm">
            <div class="flex-between">
              <div>
                <span class="badge badge-blue">Radiology Fundamentals</span>
                <h2 style="font-size:17.5px;font-weight:800;margin-top:4px;">Systematic ABCS X-Ray, Cervical Views &amp; IR(ME)R</h2>
              </div>
              <button type="button" class="pill-btn" style="min-height:32px;padding:4px 10px;font-size:11px;" onclick="state.checkedAbcs={}; saveJSON('mchiro_msk_abcs_v1',{}); showToast('ABCS checklist reset'); renderApp();">Reset</button>
            </div>

            <div class="stack-sm">
              ${ABCS_SECTIONS.map((sec) => {
                const open = !!state.openAbcs[sec.id];
                const done = sec.items.filter((_, i) => state.checkedAbcs[`${sec.id}_${i}`]).length;
                return `
                  <article class="ah-card-alt" style="overflow:hidden;">
                    <button type="button" class="acc-btn" onclick="state.openAbcs['${sec.id}']=!state.openAbcs['${sec.id}']; renderApp();">
                      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                        <strong style="font-size:14px;">${sec.title}</strong>
                        <span class="badge badge-blue">${sec.badge}</span>
                      </div>
                      <span class="mono" style="font-size:12px;font-weight:800;color:var(--text-muted);">${done}/${sec.items.length} ${open ? '▲' : '▼'}</span>
                    </button>
                    ${open ? `
                      <div style="border-top:1px solid var(--border-card);padding:6px;">
                        ${sec.items.map((txt, i) => {
                          const k = `${sec.id}_${i}`;
                          const chk = !!state.checkedAbcs[k];
                          return `
                            <label class="chk-row">
                              <input type="checkbox" ${chk ? 'checked' : ''} onchange="state.checkedAbcs['${k}']=!state.checkedAbcs['${k}']; saveJSON('mchiro_msk_abcs_v1', state.checkedAbcs); renderApp();" />
                              <span style="font-size:13px;${chk ? 'text-decoration:line-through;color:var(--text-muted);' : ''}">${esc(txt)}</span>
                            </label>
                          `;
                        }).join('')}
                      </div>
                    ` : ''}
                  </article>
                `;
              }).join('')}
            </div>
          </section>

          <!-- Part B: Editable Year 3 Orthopaedic Special Tests Vault -->
          <section class="ah-card pad-card stack">
            <div class="flex-between">
              <div>
                <span class="badge badge-emerald mono">mchiro_msk_vault_v1 &bull; Jan 2027 Ready</span>
                <h2 style="font-size:17.5px;font-weight:800;margin-top:4px;">Year 3 Orthopaedic Special Tests Vault</h2>
              </div>
              <button type="button" class="btn-3d btn-blue sm" onclick="state.showAddOrtho=!state.showAddOrtho; renderApp();">
                ${state.showAddOrtho ? 'Close Form' : '+ Add Test / Imaging Pearl'}
              </button>
            </div>

            <!-- Add Form -->
            ${state.showAddOrtho ? `
              <form onsubmit="addOrthoVaultItem(event)" class="ah-card-alt pad-card stack-sm">
                <div class="grid-2">
                  <div>
                    <label class="field-label" for="ov_region">Body Region</label>
                    <select id="ov_region" class="select">
                      ${REGIONS.map((r) => `<option value="${r}" ${state.orthoRegion === r ? 'selected' : ''}>${r}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="field-label" for="ov_name">Test / Imaging Pearl Name</label>
                    <input id="ov_name" type="text" class="input" required placeholder="e.g. Thessaly Test (20° flexion)" />
                  </div>
                </div>
                <div>
                  <label class="field-label" for="ov_pos">Positive Sign / Target Structure</label>
                  <input id="ov_pos" type="text" class="input" required placeholder="e.g. Joint-line pain or catching (meniscal tear)" />
                </div>
                <div>
                  <label class="field-label" for="ov_note">Clinical Note / Sensitivity &amp; Specificity</label>
                  <textarea id="ov_note" rows="2" class="textarea" placeholder="Handbook notes, examiner cues, or red-flag precautions..."></textarea>
                </div>
                <div class="grid-2">
                  <button type="button" class="btn-3d btn-neutral" onclick="state.showAddOrtho=false; renderApp();">Cancel</button>
                  <button type="submit" class="btn-3d btn-emerald">Save to Vault</button>
                </div>
              </form>
            ` : ''}

            <!-- 5 Region Filter Pills -->
            <div style="display:flex;flex-wrap:wrap;gap:7px;">
              ${REGIONS.map((r) => {
                const cnt = state.orthoVault.filter((x) => x.region === r).length;
                return `
                  <button
                    type="button"
                    class="pill-btn ${state.orthoRegion === r ? 'active-blue' : ''}"
                    style="min-height:36px;padding:6px 12px;font-size:12px;"
                    onclick="state.orthoRegion='${r}'; renderApp();"
                  >${r} (${cnt})</button>
                `;
              }).join('')}
            </div>

            <!-- Region Cards List -->
            <div class="stack-sm">
              ${regionTests.length ? regionTests.map((t) => `
                <article class="ah-card-alt pad-card stack-sm" style="border-left:4px solid var(--blue);">
                  <div class="flex-between">
                    <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;">
                      <h3 style="font-size:15px;font-weight:800;">${esc(t.name)}</h3>
                      ${t.isTemplate ? `<span class="badge badge-amber">Template</span>` : `<span class="badge badge-emerald">Custom</span>`}
                    </div>
                    <button type="button" class="icon-del" aria-label="Delete test" onclick="deleteOrthoVaultItem('${t.id}')">&times;</button>
                  </div>
                  <div class="sem-box sem-blue">
                    <span class="sem-label">Positive Sign / Structure</span>
                    <p><strong>${esc(t.positive)}</strong></p>
                  </div>
                  ${t.note ? `<p style="font-size:12.5px;color:var(--text-muted);">${esc(t.note)}</p>` : ''}
                </article>
              `).join('') : `
                <div class="ah-card-alt pad-card" style="text-align:center;">
                  <p style="font-size:13px;font-weight:700;color:var(--text-muted);">No tests logged for ${state.orthoRegion} yet. Tap "+ Add Test / Imaging Pearl" above.</p>
                </div>
              `}
            </div>
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 17. INITIALISE
    // =========================================================================
    initTheme();
    renderTabs();
    renderApp();
  </script>
</body>
</html>
