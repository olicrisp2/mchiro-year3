  <script>
    // =========================================================================
    // 1. SAFE STORAGE, THEME SYNC ('mchiro_theme') & LEITNER SRS ('mchiro_srs_v1')
    // =========================================================================
    const DAY_MS = 86400000;

    function loadStore(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveStore(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {
        // Ignore storage quota or private-mode restrictions safely
      }
    }

    function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem('mchiro_theme'); } catch (e) {}
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? (saved === 'dark' || saved === '"dark"') : prefersDark;
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      try { localStorage.setItem('mchiro_theme', isDark ? 'dark' : 'light'); } catch (e) {}
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) {
        btn.innerHTML = isDark
          ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>`
          : `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>`;
      }
    }

    function toggleTheme() {
      applyTheme(!document.documentElement.classList.contains('dark'));
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const palette = {
        info: 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900',
        success: 'bg-emerald-600 text-white',
        warn: 'bg-amber-600 text-white',
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-semibold transition-all duration-300 ${palette[type] || palette.info}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 2200);
    }

    // =========================================================================

            <div class="space-y-4">
              ${list.map((c) => {
                if (c.isAcs) return renderAcsCard(c);
                if (c.isIbd) return renderIbdCard(c);
                return `
                  <article class="rounded-3xl bg-white dark:bg-slate-900 border-2 border-${c.color}-200 dark:border-${c.color}-900/60 p-4 sm:p-5 space-y-3">
                    <div class="flex flex-wrap items-start justify-between gap-2">

    function renderAcsCard(c) {

        { name: 'STEMI (999!)', bg: 'bg-rose-600 text-white border-rose-700', text: 'Complete occlusion → transmural infarction. ↑↑ Troponin; ST elevation → 999 immediate PCI.' },

      return `
        <article class="rounded-3xl bg-white dark:bg-slate-900 border-2 border-rose-200 dark:border-rose-900/60 p-4 sm:p-5 space-y-3.5">

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">

          <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm text-slate-700 dark:text-slate-200">

          <div class="flex flex-wrap items-start justify-between gap-2">

    // =========================================================================

    function toggleSaqCheck(qId, idx) {
      if (!state.saqChecks[qId]) state.saqChecks[qId] = {};

      renderApp();
    }

    function renderSaqTab() {
      const list = SAQ_LIST.filter((q) => !state.dueOnly || isCardDue(q.id));

      if (!list.length) {
        return `
          <div class="p-8 text-center rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm text-slate-500">
            All 6 SAQ/LAQ questions are scheduled — none due today!
          </div>
        `;
      }

      return `
        <div class="max-w-3xl mx-auto space-y-5">
          <div class="px-1">
            <h2 class="text-lg font-extrabold text-slate-900 dark:text-white">SAQ / LAQ Active-Recall Self-Marking</h2>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">Draft bullet points or speak your answer aloud first, then reveal the point-by-point mark scheme to score yourself.</p>
          </div>

          ${list.map((q, qNum) => {
            const revealed = !!state.saqRevealed[q.id];
            const checks = state.saqChecks[q.id] || {};
            const scored = q.criteria.filter((_, i) => checks[i]).length;
            const pct = Math.round((scored / q.marks) * 100);
            const scoreCls = pct >= 70
              ? 'bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300'
              : pct >= 50
                ? 'bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300'
                : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300';

            return `
              <article class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 sm:p-5 space-y-3.5">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div class="flex items-center gap-2">
                    <span class="px-2.5 py-0.5 rounded-lg text-[11px] font-extrabold bg-indigo-100 dark:bg-indigo-950 text-indigo-800 dark:text-indigo-300">Q${qNum + 1} &bull; ${q.marks} Marks</span>
                    <h3 class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white">${q.title}</h3>
                  </div>
                  ${revealed ? `<span class="px-3 py-1 rounded-xl text-xs font-extrabold ${scoreCls}">${scored} / ${q.marks} marks — ${pct}%</span>` : ''}
                </div>

                <p class="text-xs sm:text-sm font-semibold text-slate-800 dark:text-slate-200 leading-relaxed">${q.prompt}</p>

                <textarea
                  rows="3"
                  placeholder="Jot key points or say aloud before revealing..."
                  oninput="state.saqDrafts['${q.id}']=this.value"
                  class="w-full p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500"
                >${state.saqDrafts[q.id] || ''}</textarea>

                ${!revealed ? `
                  <button
                    type="button"
                    onclick="state.saqRevealed['${q.id}']=true; renderApp();"
                    class="w-full py-3 rounded-2xl bg-teal-600 hover:bg-teal-700 text-white text-xs sm:text-sm font-extrabold transition shadow-xs"
                  >Reveal Mark Scheme (${q.marks} Criteria)</button>
                ` : `
                  <div class="space-y-2.5 pt-1">
                    <div class="flex items-center justify-between">
                      <span class="text-[11px] font-extrabold uppercase tracking-wider text-teal-600 dark:text-teal-400">Tick Each 1-Mark Point You Covered:</span>
                      <button type="button" onclick="state.saqRevealed['${q.id}']=false; renderApp();" class="text-xs font-bold text-slate-400 underline">Hide</button>
                    </div>
                    <div class="rounded-2xl border border-slate-200 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800">
                      ${q.criteria.map((pt, i) => `
                        <label class="flex items-start gap-3 p-3 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/40">
                          <input
                            type="checkbox"
                            ${checks[i] ? 'checked' : ''}
                            onchange="toggleSaqCheck('${q.id}', ${i})"
                            class="mt-0.5 w-4 h-4 accent-emerald-600 rounded shrink-0"
                          />
                          <span class="text-xs sm:text-sm ${checks[i] ? 'text-emerald-800 dark:text-emerald-300 font-semibold' : 'text-slate-700 dark:text-slate-200'}">
                            <strong class="text-slate-400 mr-1">[1m]</strong>${pt}
                          </span>
                        </label>
                      `).join('')}
                    </div>

                    <div class="pt-2 border-t border-slate-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2">
                      <span class="text-xs font-bold text-slate-500">Schedule next review:</span>
                      ${renderSrsBar(q.id)}
                    </div>
                  </div>
                `}
              </article>
            `;
          }).join('')}
        </div>
      `;
    }

    // =========================================================================
    // 9. INITIALISE APP
    // =========================================================================
    initTheme();
    updateDueHeaderUI();
    renderTabs();
    renderApp();
  </script>
</body>
</html>
