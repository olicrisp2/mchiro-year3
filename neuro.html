    // 1. STORAGE, THEME SYNC ('mchiro_theme') & SHARED SRS ('mchiro_srs')

    function loadStore(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveStore(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem('mchiro_theme'); } catch (e) {}
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? (saved === 'dark' || saved === '"dark"') : prefersDark;
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      try { localStorage.setItem('mchiro_theme', isDark ? 'dark' : 'light'); } catch (e) {}
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) {
        btn.innerHTML = isDark
          ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>`
          : `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>`;
      }
    }

    function toggleTheme() {
      applyTheme(!document.documentElement.classList.contains('dark'));
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const styles = {
        info: 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900',
        success: 'bg-emerald-600 text-white',
        warn: 'bg-amber-600 text-white',
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-semibold transition-all duration-300 ${styles[type] || styles.info}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 2200);
    }

                  ${state.cnLayer === 'h_test' ? `
                    <path d="M 118,86 L 118,140 M 222,86 L 222,140 M 118,113 L 222,113" stroke="#0d9488" stroke-width="3" stroke-dasharray="4 3" />
                    <g onclick="state.selectedCN='VI'; renderApp();" class="svg-hit"><rect x="226" y="102" width="34" height="20" rx="6" fill="#f59e0b" /><text x="243" y="115" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">LR VI</text></g>
                    <g onclick="state.selectedCN='IV'; renderApp();" class="svg-hit"><rect x="174" y="132" width="34" height="20" rx="6" fill="#e11d48" /><text x="191" y="145" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">SO IV</text></g>
                    <g onclick="state.selectedCN='III'; renderApp();" class="svg-hit"><rect x="100" y="72" width="36" height="18" rx="6" fill="#0ea5e9" /><text x="118" y="84" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">SR III</text></g>
                  ` : ''}

                  <!-- LAYER: Clean Face Pins -->
                  ${state.cnLayer === 'off' ? `
                    <g onclick="state.selectedCN='I'; renderApp();" class="svg-hit"><circle cx="170" cy="144" r="10.5" fill="${state.selectedCN==='I'?'#0d9488':'#ec4899'}" /><text x="170" y="147" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">I</text></g>
                    <g onclick="state.selectedCN='II'; renderApp();" class="svg-hit"><circle cx="140" cy="88" r="10.5" fill="${state.selectedCN==='II'?'#0d9488':'#0284c7'}" /><text x="140" y="91" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">II</text></g>
                    <g onclick="state.selectedCN='III'; renderApp();" class="svg-hit"><circle cx="200" cy="88" r="10.5" fill="${state.selectedCN==='III'?'#0d9488':'#0ea5e9'}" /><text x="200" y="91" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="800">III</text></g>
                    <g onclick="state.selectedCN='V'; renderApp();" class="svg-hit"><circle cx="122" cy="166" r="10.5" fill="${state.selectedCN==='V'?'#0d9488':'#6366f1'}" /><text x="122" y="169" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">V</text></g>
                    <g onclick="state.selectedCN='VII'; renderApp();" class="svg-hit"><circle cx="218" cy="166" r="10.5" fill="${state.selectedCN==='VII'?'#0d9488':'#3b82f6'}" /><text x="218" y="169" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="800">VII</text></g>
                  ` : ''}

                  <!-- Open Mouth Inset (CN IX/X & XII) -->
                  <rect x="304" y="54" width="142" height="176" rx="20" fill="var(--svg-skin)" stroke="var(--svg-line)" stroke-width="1.6" />
                  <text x="375" y="74" text-anchor="middle" fill="var(--svg-muted)" font-size="9.5" font-weight="800">OPEN MOUTH</text>
                  <ellipse cx="375" cy="148" rx="50" ry="54" fill="#9f1239" fill-opacity="0.2" stroke="var(--svg-stroke)" stroke-width="1.4" />
                  <path onclick="state.selectedCN='IX_X'; renderApp();" class="svg-hit" d="M 329,132 Q 350,108 367,126 L 371,144 Q 375,152 379,144 L 383,126 Q 400,108 421,132 C 413,100 337,100 329,132 Z" fill="#f43f5e" fill-opacity="0.82" />
                  <text x="375" y="118" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="800" pointer-events="none">Uvula (IX/X)</text>
                  <path onclick="state.selectedCN='XII'; renderApp();" class="svg-hit" d="M 335,168 Q 375,150 415,168 C 411,194 394,202 375,202 C 356,202 339,194 335,168 Z" fill="#fb7185" fill-opacity="0.9" />
                  <text x="375" y="187" text-anchor="middle" fill="#fff" font-size="9.5" font-weight="800" pointer-events="none">Tongue (XII)</text>
                </svg>
              `}
            </div>

            <!-- CN I–XII Quick Pills -->
            <div class="flex flex-wrap justify-center gap-1.5">
              ${cnPills.map((pid) => `
                <button type="button" onclick="state.selectedCN='${pid}'; renderApp();" class="px-2.5 py-1.5 rounded-xl text-xs font-bold border transition ${
                  state.selectedCN === pid ? 'bg-teal-600 text-white border-teal-600' : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                }">CN ${pid === 'IX_X' ? 'IX & X' : pid}</button>
              `).join('')}
            </div>

            <!-- Pinned CN Info Card Directly Underneath -->
            <div class="rounded-2xl bg-slate-50 dark:bg-slate-800/60 border-2 border-teal-200 dark:border-teal-900/70 p-4 space-y-2">
              <div class="flex items-center justify-between gap-2">
                <h3 class="text-base font-extrabold text-slate-900 dark:text-white">CN ${cn.id === 'IX_X' ? 'IX & X' : cn.id}: ${cn.name}</h3>
                <span class="px-2.5 py-0.5 rounded-lg text-[11px] font-bold bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700">${cn.type}</span>
              </div>
              <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-200 leading-relaxed"><strong>Year 3 Tests:</strong> ${cn.tests}</p>
              <p class="text-xs sm:text-sm text-teal-800 dark:text-teal-300 bg-teal-50/80 dark:bg-teal-950/40 px-3 py-2 rounded-xl font-semibold"><strong>Clinical Pearl:</strong> ${cn.pearl}</p>
            </div>
          </section>

          <!-- 2. UPPER & LOWER LIMB QUICK-TAP SMR & PERIPHERAL MATRIX -->
          <section class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 sm:p-6 space-y-4">
            <div>
              <span class="px-2.5 py-0.5 rounded-lg text-[10px] font-extrabold uppercase bg-indigo-100 dark:bg-indigo-950 text-indigo-800 dark:text-indigo-300">SMR &amp; Peripheral Matrix</span>
              <h2 class="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white mt-1">Upper &amp; Lower Limb Quick-Tap Reference</h2>
            </div>

            <!-- 4 Matrix Mode Toggles -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5">
              ${[
                { id: 'cervical', label: 'Cervical SMR (C5–T1)' },
                { id: 'lumbar', label: 'Lumbar SMR (L2–S1)' },
                { id: 'upper_periph', label: 'Upper Peripheral' },
                { id: 'lower_periph', label: 'Lower Peripheral' },
              ].map((t) => `
                <button type="button" onclick="state.limbTab='${t.id}'; renderApp();" class="px-3 py-2 rounded-xl text-xs font-bold border transition ${
                  state.limbTab === t.id ? 'bg-indigo-600 text-white border-indigo-600 shadow-xs' : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                }">${t.label}</button>
              `).join('')}
            </div>

            <!-- Bold Assessor Trap Guardrail -->
            <div class="p-3 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border-2 border-amber-300 dark:border-amber-800 text-xs sm:text-sm font-extrabold text-amber-900 dark:text-amber-200">
              ⚠ ${mat.trap}
            </div>

            <!-- Responsive Matrix Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${mat.items.map((row) => `
                <article class="p-3.5 rounded-2xl border ${row.warn ? 'bg-rose-50/50 dark:bg-rose-950/20 border-rose-300 dark:border-rose-800' : 'bg-slate-50/70 dark:bg-slate-800/50 border-slate-200 dark:border-slate-800'} space-y-1.5">
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-sm font-extrabold ${row.warn ? 'text-rose-700 dark:text-rose-300' : 'text-indigo-700 dark:text-indigo-300'}">${row.code}</span>
                    <span class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300">R: ${row.reflex}</span>
                  </div>
                  <p class="text-xs text-slate-700 dark:text-slate-300"><strong>S:</strong> ${row.sensory}</p>
                  <p class="text-xs text-slate-900 dark:text-white font-semibold"><strong>M (Name Muscles):</strong> ${row.motor}</p>
                </article>
              `).join('')}
            </div>
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 8. TAB 4: 15-MIN OSCE & 8-SECTION TESTING CHECKLIST
    // =========================================================================
    function formatClock(secs) {
      return `${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`;
    }

    function setOscePreset(secs) {
      clearInterval(osceTimerId);
      state.osceRunning = false;
      state.osceDuration = secs;
      state.osceRemaining = secs;
      renderApp();
    }

    function toggleOsceTimer() {
      if (state.osceRunning) {
        clearInterval(osceTimerId);
        state.osceRunning = false;
      } else {
        state.osceRunning = true;
        osceTimerId = setInterval(() => {
          if (state.osceRemaining > 0) {
            state.osceRemaining--;
            const el = document.getElementById('osce-clock');
            if (el) el.textContent = formatClock(state.osceRemaining);
          } else {
            clearInterval(osceTimerId);
            state.osceRunning = false;
            showToast('Time up! OSCE station finished.', 'warn');
            renderApp();
          }
        }, 1000);
      }
      renderApp();
    }

    function drawNextOsce() {
      state.oscePromptIdx = Math.floor(Math.random() * OSCE_PROMPTS.length);
      state.osceTicked = {};
      renderApp();
    }

    function renderOsceTab() {
      const p = OSCE_PROMPTS[state.oscePromptIdx] || OSCE_PROMPTS[0];
      const tickedCount = p.points.filter((_, i) => state.osceTicked[i]).length;

      const totalOverview = CHECKLIST_SECTIONS.reduce((sum, s) => sum + s.items.length, 0);
      const doneOverview = Object.values(state.checkedOverview).filter(Boolean).length;
      const pctOverview = totalOverview ? Math.round((doneOverview / totalOverview) * 100) : 0;

      return `
        <div class="max-w-3xl mx-auto space-y-6">
          <!-- 1. SAY IT ALOUD OSCE SIMULATOR -->
          <section class="space-y-4">
            <!-- Timer Bar -->
            <div class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 sm:p-5 flex flex-wrap items-center justify-between gap-4">
              <div>
                <span class="text-[10px] font-extrabold uppercase tracking-wider text-teal-600 dark:text-teal-400">OSCE Practical Countdown</span>
                <div id="osce-clock" class="text-4xl font-extrabold tabular-nums text-slate-900 dark:text-white">${formatClock(state.osceRemaining)}</div>
                <div class="mt-2 flex gap-1.5">
                  <button type="button" onclick="setOscePreset(900)" class="px-3 py-1 rounded-xl text-xs font-bold ${state.osceDuration===900?'bg-teal-600 text-white':'bg-slate-100 dark:bg-slate-800'}">15:00 Full Exam</button>
                  <button type="button" onclick="setOscePreset(60)" class="px-3 py-1 rounded-xl text-xs font-bold ${state.osceDuration===60?'bg-indigo-600 text-white':'bg-slate-100 dark:bg-slate-800'}">01:00 Rapid</button>
                </div>
              </div>
              <div class="flex flex-col items-start sm:items-end gap-2">
                <div class="flex gap-2">
                  <button type="button" onclick="toggleOsceTimer()" class="px-4 py-2 rounded-xl text-xs font-extrabold text-white ${state.osceRunning ? 'bg-amber-600' : 'bg-teal-600'}">${state.osceRunning ? 'Pause' : 'Start'}</button>
                  <button type="button" onclick="setOscePreset(state.osceDuration)" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800">Reset</button>
                </div>
                <span class="text-xs font-bold text-slate-500">Session: <span class="text-emerald-600">${state.oscePass} Pass</span> &bull; <span class="text-rose-600">${state.osceDrill} Drill</span></span>
              </div>
            </div>

            <!-- Prompt Card -->
            <div class="rounded-3xl bg-white dark:bg-slate-900 border-2 border-teal-200 dark:border-teal-900/70 p-5 space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <span class="px-2.5 py-0.5 rounded-lg text-[11px] font-extrabold bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300">${p.sec}</span>
                <div class="flex items-center gap-2">
                  <span class="text-xs font-extrabold text-teal-600 dark:text-teal-400">Self-Score: ${tickedCount}/${p.points.length}</span>
                  <button type="button" onclick="drawNextOsce()" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold">🎲 Random</button>
                </div>
              </div>

              <h3 class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white">Examiner: “${p.prompt}”</h3>

              <div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/70 text-xs font-bold text-amber-900 dark:text-amber-200">
                ⚠ Assessor Trap: ${p.trap}
              </div>

              <div class="rounded-2xl border border-slate-200 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800">
                ${p.points.map((pt, i) => `
                  <label class="flex items-start gap-3 p-3 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/40">
                    <input type="checkbox" ${state.osceTicked[i] ? 'checked' : ''} onchange="state.osceTicked[${i}]=!state.osceTicked[${i}]; renderApp();" class="mt-0.5 w-4 h-4 accent-teal-600 rounded shrink-0" />
                    <span class="text-xs sm:text-sm ${state.osceTicked[i] ? 'line-through text-slate-400' : 'text-slate-800 dark:text-slate-200'}">${pt}</span>
                  </label>
                `).join('')}
              </div>

              <div class="grid grid-cols-2 gap-3">
                <button type="button" onclick="state.oscePass++; drawNextOsce(); showToast('Marked Pass ✓','success');" class="py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">✓ Pass &amp; Next</button>
                <button type="button" onclick="state.osceDrill++; drawNextOsce(); showToast('Flagged to Drill ↺','warn');" class="py-2.5 rounded-xl bg-rose-600 text-white text-xs font-extrabold">↺ Drill &amp; Next</button>
              </div>
            </div>

            <!-- Expandable Grading Scales Reference -->
            <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden">
              <button type="button" onclick="state.osceShowScales=!state.osceShowScales; renderApp();" class="w-full px-4 py-3 flex items-center justify-between text-left text-xs sm:text-sm font-extrabold text-slate-900 dark:text-white">
                <span>📊 Exam Grading Scales Reference (MRC 1–5, Reflex 0–4 / 1+–4+, Sensation 0–2)</span>
                <span>${state.osceShowScales ? '▲' : '▼'}</span>
              </button>
              ${state.osceShowScales ? `
                <div class="p-4 pt-1 border-t border-slate-100 dark:border-slate-800 grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                  <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 space-y-1">
                    <strong class="block text-indigo-600 dark:text-indigo-400">Myotomes (MRC 0–5)</strong>
                    <p><strong>5:</strong> Normal full power</p>
                    <p><strong>4:</strong> Active against resistance (reduced)</p>
                    <p><strong>3:</strong> Active against gravity only</p>
                    <p><strong>2:</strong> Active with gravity eliminated</p>
                    <p><strong>1:</strong> Flicker / trace contraction</p>
                    <p><strong>0:</strong> No contraction</p>
                  </div>
                  <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 space-y-1">
                    <strong class="block text-teal-600 dark:text-teal-400">Reflexes (0–4 / 1+–4+)</strong>
                    <p><strong>0:</strong> Absent (areflexia)</p>
                    <p><strong>1 / 1+:</strong> Diminished / hyporeflexia</p>
                    <p><strong>2 / 2+:</strong> Normal / brisk</p>
                    <p><strong>3 / 3+:</strong> Brisker than average</p>
                    <p><strong>4 / 4+:</strong> Hyperreflexia with clonus (UMN)</p>
                  </div>
                  <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 space-y-1">
                    <strong class="block text-amber-600 dark:text-amber-400">Sensation (0–2)</strong>
                    <p><strong>2:</strong> Normal intact sensation</p>
                    <p><strong>1:</strong> Impaired / altered (hypo/hyper)</p>
                    <p><strong>0:</strong> Absent sensation (anaesthesia)</p>
                  </div>
                </div>
              ` : ''}
            </div>
          </section>

          <!-- 2. COMPACT 8-SECTION YEAR 3 TESTING OVERVIEW ACCORDION -->
          <section class="space-y-2.5">
            <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-2">
              <div class="flex items-center justify-between">
                <h2 class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white">Year 3 Testing Overview (${doneOverview}/${totalOverview} — ${pctOverview}%)</h2>
                <button type="button" onclick="state.checkedOverview={}; saveStore('mchiro_neuro_checklist',{}); renderApp();" class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-bold">Reset</button>
              </div>
              <div class="w-full h-2 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
                <div class="h-full bg-teal-500 transition-all duration-300" style="width:${pctOverview}%"></div>
              </div>
            </div>

            ${CHECKLIST_SECTIONS.map((sec) => {
              const isOpen = !!state.openAcc[sec.num];
              const doneSec = sec.items.filter((_, idx) => state.checkedOverview[`n${sec.num}_${idx}`]).length;
              return `
                <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden">
                  <button type="button" onclick="state.openAcc[${sec.num}]=!state.openAcc[${sec.num}]; renderApp();" class="w-full px-4 py-3 flex items-center justify-between text-left">
                    <span class="text-xs sm:text-sm font-extrabold text-slate-900 dark:text-white">${sec.title}</span>
                    <span class="text-xs font-bold text-slate-500">${doneSec}/${sec.items.length} ${isOpen ? '▲' : '▼'}</span>
                  </button>
                  ${isOpen ? `
                    <div class="border-t border-slate-100 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800/70">
                      ${sec.items.map((txt, idx) => {
                        const k = `n${sec.num}_${idx}`;
                        const chk = !!state.checkedOverview[k];
                        return `
                          <label class="flex items-start gap-3 px-4 py-2.5 cursor-pointer">
                            <input type="checkbox" ${chk ? 'checked' : ''} onchange="state.checkedOverview['${k}']=!state.checkedOverview['${k}']; saveStore('mchiro_neuro_checklist',state.checkedOverview); renderApp();" class="mt-0.5 w-4 h-4 accent-teal-600 rounded shrink-0" />
                            <span class="text-xs sm:text-sm ${chk ? 'line-through text-slate-400' : 'text-slate-700 dark:text-slate-200'}">${txt}</span>
                          </label>
                        `;
                      }).join('')}
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 9. INITIALISE APP
    // =========================================================================
    initTheme();
    updateDueBadge();
    renderTabs();
    renderApp();
  </script>
</body>
</html>
