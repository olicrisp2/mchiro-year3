<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Clinical Neurology – MChiro Year 3 Hub</title>

  <style>
    /* =========================================================================
       1. DESIGN TOKENS: APPLE HEALTH MINIMALIST × DUOLINGO TACTILE 3D
       Zero external CDNs — pure system font stack & inline SVG anatomy.
       ========================================================================= */
    :root {
      --bg-page: #F2F2F7;
      --bg-card: #FFFFFF;
      --bg-subtle: #EAEAF0;
      --bg-glass: rgba(242, 242, 247, 0.90);
      --border-card: #E2E8F0;
      --border-strong: #CBD5E1;
      --text-main: #0F172A;
      --text-muted: #475569;
      --shadow-card: 0 2px 12px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);

      /* Semantic Cognitive Colour-Coding */
      --blue: #2563EB;
      --blue-dark: #1D4ED8;
      --blue-soft: rgba(37, 99, 235, 0.10);
      --blue-border: rgba(37, 99, 235, 0.30);

      --emerald: #059669;
      --emerald-dark: #047857;
      --emerald-soft: rgba(5, 150, 105, 0.11);
      --emerald-border: rgba(5, 150, 105, 0.32);

      --amber: #D97706;
      --amber-dark: #92400E;
      --amber-soft: rgba(217, 119, 6, 0.12);
      --amber-border: rgba(217, 119, 6, 0.36);

      --coral: #E11D48;
      --coral-dark: #9F1239;
      --coral-soft: rgba(225, 29, 72, 0.10);
      --coral-border: rgba(225, 29, 72, 0.32);

      --purple: #7C3AED;
      --purple-dark: #5B21B6;
      --purple-soft: rgba(124, 58, 237, 0.10);
      --purple-border: rgba(124, 58, 237, 0.32);

      /* SVG Anatomical Tokens */
      --svg-bg: #F8FAFC;
      --svg-limb-base: #E6ECF4;
      --svg-quiz-fill: #DCE4F0;
      --svg-quiz-hover: #C8D4E6;
      --svg-outline: #1E293B;
      --svg-focus-stroke: #0F172A;
      --svg-landmark: rgba(30, 41, 59, 0.46);
      --svg-divider: #475569;
      --svg-cord-white: #E2E8F0;
      --svg-cord-grey: #94A3B8;
      --svg-iris: #0284C7;
    }

    .dark {
      --bg-page: #090D16;
      --bg-card: #131B2E;
      --bg-subtle: #1E293B;
      --bg-glass: rgba(9, 13, 22, 0.90);
      --border-card: #26344F;
      --border-strong: #3D5073;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --shadow-card: 0 4px 18px rgba(0, 0, 0, 0.46);

      --blue-soft: rgba(37, 99, 235, 0.22);
      --blue-border: rgba(96, 165, 250, 0.44);
      --emerald-soft: rgba(5, 150, 105, 0.22);
      --emerald-border: rgba(52, 211, 153, 0.42);
      --amber-soft: rgba(217, 119, 6, 0.22);
      --amber-border: rgba(251, 191, 36, 0.44);
      --coral-soft: rgba(225, 29, 72, 0.22);
      --coral-border: rgba(251, 113, 133, 0.44);
      --purple-soft: rgba(124, 58, 237, 0.22);
      --purple-border: rgba(167, 139, 250, 0.44);

      --svg-bg: #0F172A;
      --svg-limb-base: #1E293B;
      --svg-quiz-fill: #24334D;
      --svg-quiz-hover: #33486B;
      --svg-outline: #E2E8F0;
      --svg-focus-stroke: #FFFFFF;
      --svg-landmark: rgba(226, 232, 240, 0.48);
      --svg-divider: #94A3B8;
      --svg-cord-white: #1E293B;
      --svg-cord-grey: #475569;
      --svg-iris: #38BDF8;
    }

    /* =========================================================================
       2. BASE RESET & SYSTEM TYPOGRAPHY
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      line-height: 1.48;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    h1, h2, h3, h4, p { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    /* CRITICAL ZERO-STROKE SVG TEXT GUARDRAIL */
    svg text {
      stroke: none !important;
      paint-order: fill;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 1020px;
      margin: 0 auto;
      padding: 0 12px;
    }
    @media (min-width: 640px) {
      .container { padding: 0 22px; }
    }

    .main-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-top: 14px;
      padding-bottom: 108px;
    }
    @media (min-width: 769px) {
      .main-stack { padding-bottom: 54px; }
    }

    /* =========================================================================
       3. STICKY FROSTED-GLASS HEADER
       ========================================================================= */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-card);
    }

    .header-inner {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 36px;
      padding: 6px 10px;
      border-radius: 12px;
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 12.5px;
      font-weight: 800;
      transition: background-color 0.14s ease;
    }
    .back-btn:hover { background: var(--border-strong); }

    .header-center {
      text-align: center;
      min-width: 0;
    }
    .page-title {
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .theme-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--border-card);
      background: var(--bg-card);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.14s ease;
    }
    .theme-btn:hover { border-color: var(--blue); }

    /* =========================================================================
       4. SHARED SURFACES, BADGES, SEMANTIC BOXES & TACTILE 3D BUTTONS
       ========================================================================= */
    .ah-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      box-shadow: var(--shadow-card);
    }
    .ah-card-alt {
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      border-radius: 14px;
    }
    .pad-card { padding: 15px; }
    @media (min-width: 640px) {
      .pad-card { padding: 20px; }
    }

    .stack { display: flex; flex-direction: column; gap: 14px; }
    .stack-sm { display: flex; flex-direction: column; gap: 10px; }

    .flex-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 720px) {
      .grid-2 { grid-template-columns: 1fr 1fr; }
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 680px) {
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
    }

    .grid-3-compact {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    @media (min-width: 700px) {
      .grid-4 { grid-template-columns: repeat(4, 1fr); }
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.015em;
      white-space: nowrap;
    }
    .badge-blue { background: var(--blue-soft); color: var(--blue-dark); border: 1px solid var(--blue-border); }
    .dark .badge-blue { color: #93C5FD; }
    .badge-emerald { background: var(--emerald-soft); color: var(--emerald-dark); border: 1px solid var(--emerald-border); }
    .dark .badge-emerald { color: #6EE7B7; }
    .badge-amber { background: var(--amber-soft); color: var(--amber-dark); border: 1px solid var(--amber-border); }
    .dark .badge-amber { color: #FDE68A; }
    .badge-coral { background: var(--coral-soft); color: var(--coral-dark); border: 1px solid var(--coral-border); }
    .dark .badge-coral { color: #FDA4AF; }
    .badge-purple { background: var(--purple-soft); color: var(--purple-dark); border: 1px solid var(--purple-border); }
    .dark .badge-purple { color: #DDD6FE; }
    .badge-muted { background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border-card); }

    /* Semantic Info Boxes */
    .sem-box {
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      border: 1.5px solid transparent;
    }
    .sem-label {
      display: block;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .sem-blue { background: var(--blue-soft); border-color: var(--blue-border); }
    .sem-blue .sem-label { color: var(--blue-dark); }
    .dark .sem-blue .sem-label { color: #93C5FD; }

    .sem-emerald { background: var(--emerald-soft); border-color: var(--emerald-border); }
    .sem-emerald .sem-label { color: var(--emerald-dark); }
    .dark .sem-emerald .sem-label { color: #6EE7B7; }

    .sem-amber { background: var(--amber-soft); border-color: var(--amber-border); }
    .sem-amber .sem-label { color: var(--amber-dark); }
    .dark .sem-amber .sem-label { color: #FDE68A; }

    .sem-coral { background: var(--coral-soft); border-color: var(--coral-border); }
    .sem-coral .sem-label { color: var(--coral-dark); }
    .dark .sem-coral .sem-label { color: #FDA4AF; }

    .sem-purple { background: var(--purple-soft); border-color: var(--purple-border); }
    .sem-purple .sem-label { color: var(--purple-dark); }
    .dark .sem-purple .sem-label { color: #DDD6FE; }

    /* Tactile Duolingo 3D Buttons */
    .btn-3d {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      text-align: center;
      transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.14s ease, opacity 0.14s ease;
    }
    .btn-3d:hover:not(:disabled) { filter: brightness(1.06); }
    .btn-3d:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px !important;
    }
    .btn-3d:disabled { opacity: 0.42; cursor: not-allowed; }
    .btn-3d.sm {
      min-height: 36px;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 12px;
    }
    .btn-3d.between { justify-content: space-between; text-align: left; }
    .btn-full { width: 100%; }

    .btn-blue { background: var(--blue); color: #FFFFFF; border: 2px solid var(--blue); border-bottom: 4px solid var(--blue-dark); }
    .btn-emerald { background: var(--emerald); color: #FFFFFF; border: 2px solid var(--emerald); border-bottom: 4px solid var(--emerald-dark); }
    .btn-amber { background: var(--amber); color: #FFFFFF; border: 2px solid var(--amber); border-bottom: 4px solid var(--amber-dark); }
    .btn-coral { background: var(--coral); color: #FFFFFF; border: 2px solid var(--coral); border-bottom: 4px solid var(--coral-dark); }
    .btn-purple { background: var(--purple); color: #FFFFFF; border: 2px solid var(--purple); border-bottom: 4px solid var(--purple-dark); }
    .btn-neutral {
      background: var(--bg-card);
      color: var(--text-main);
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-strong);
    }

    /* Tactile Filter / Confidence Pills */
    .pill-btn {
      min-height: 38px;
      padding: 7px 11px;
      border-radius: 12px;
      border: 2px solid var(--border-card);
      border-bottom: 3.5px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.07s ease, border-color 0.14s ease, background-color 0.14s ease;
      text-align: center;
    }
    .pill-btn:hover:not(:disabled) { border-color: var(--blue); }
    .pill-btn:active:not(:disabled) { transform: translateY(1.5px); border-bottom-width: 2px; }
    .pill-btn.active-blue { background: var(--blue); border-color: var(--blue); border-bottom-color: var(--blue-dark); color: #FFFFFF; }
    .pill-btn.active-emerald { background: var(--emerald); border-color: var(--emerald); border-bottom-color: var(--emerald-dark); color: #FFFFFF; }
    .pill-btn.active-amber { background: var(--amber); border-color: var(--amber); border-bottom-color: var(--amber-dark); color: #FFFFFF; }
    .pill-btn.active-coral { background: var(--coral); border-color: var(--coral); border-bottom-color: var(--coral-dark); color: #FFFFFF; }
    .pill-btn.active-purple { background: var(--purple); border-color: var(--purple); border-bottom-color: var(--purple-dark); color: #FFFFFF; }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    /* =========================================================================
       5. VISUAL LESSONS LAUNCH BANNER & 5-TAB SEGMENTED BAR
       ========================================================================= */
    .lessons-banner {
      padding: 13px 15px;
      border-radius: 20px;
      border: 1.5px solid var(--blue-border);
      background: linear-gradient(135deg, var(--blue-soft), var(--bg-card) 52%, var(--purple-soft));
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .lessons-strip {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    @media (min-width: 680px) {
      .lessons-strip { grid-template-columns: repeat(3, 1fr); }
    }
    .lpill {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .lpill-done { background: #10B981; color: #FFFFFF; }
    .lpill-start { background: #FBBF24; color: #0F172A; }

    .tabs-scroll {
      overflow-x: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }

    .seg-track {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 15px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      min-width: max-content;
    }
    @media (min-width: 760px) {
      .seg-track {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        min-width: 0;
      }
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      min-height: 38px;
      padding: 8px 11px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      text-align: center;
    }
    .seg-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.09);
    }

    /* =========================================================================
       6. INTERACTIVE SVG SPOTLIGHT / FADE-OTHERS ISOLATION ENGINE
       ========================================================================= */
    .atlas-switcher {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    @media (min-width: 720px) {
      .atlas-switcher { grid-template-columns: repeat(5, 1fr); }
    }
    .atlas-pill {
      min-height: 48px;
      padding: 8px 9px;
      border-radius: 15px;
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.25;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: transform 0.08s ease, border-color 0.14s ease, background-color 0.14s ease;
    }
    .atlas-pill:active { transform: translateY(2px); border-bottom-width: 2px; }
    .atlas-pill .ap-sub { font-size: 10px; font-weight: 700; opacity: 0.78; }
    .atlas-pill.active {
      background: var(--blue);
      border-color: var(--blue);
      border-bottom-color: var(--blue-dark);
      color: #FFFFFF;
    }
    .atlas-pill.span-full { grid-column: span 2; }
    @media (min-width: 720px) {
      .atlas-pill.span-full { grid-column: span 1; }
    }

    .atlas-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
    }
    @media (min-width: 820px) {
      .atlas-layout { grid-template-columns: 1.02fr 0.98fr; }
    }

    .svg-stage {
      padding: 10px;
      border-radius: 18px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
    }

    .anatomy-svg {
      display: block;
      width: 100%;
      max-width: 400px;
      height: auto;
      margin: 0 auto;
      user-select: none;
    }

    .anat-zone {
      cursor: pointer;
      transition: opacity 0.22s ease, filter 0.22s ease, fill 0.18s ease, stroke-width 0.18s ease;
    }
    .anat-zone:hover { filter: brightness(1.07); }
    .anat-label { transition: opacity 0.22s ease; }

    .anat-zone-quiz { fill: var(--svg-quiz-fill); }
    .anat-zone-quiz:hover { fill: var(--svg-quiz-hover); }

    /* SPOTLIGHT / FADE-OTHERS ISOLATION */
    .anatomy-svg.has-selection .anat-zone:not(.is-selected):not(.is-correct):not(.is-wrong) {
      opacity: 0.16;
      filter: saturate(0.25);
    }
    .anatomy-svg.has-selection .anat-label:not(.is-selected) {
      opacity: 0.25;
    }
    .anat-zone.is-selected {
      opacity: 1 !important;
      stroke: var(--svg-focus-stroke);
      stroke-width: 2.2px;
      filter: drop-shadow(0 0 8px rgba(37, 99, 235, 0.36));
    }
    .anat-zone.is-correct {
      opacity: 1 !important;
      fill: #059669 !important;
      fill-opacity: 0.94 !important;
      stroke: var(--svg-focus-stroke);
      stroke-width: 2.3px;
    }
    .anat-zone.is-wrong {
      opacity: 1 !important;
      fill: #E11D48 !important;
      fill-opacity: 0.90 !important;
      stroke: var(--svg-focus-stroke);
      stroke-width: 2px;
    }

    .quiz-banner {
      padding: 13px 14px;
      border-radius: 16px;
      border: 2px solid var(--blue-border);
      background: var(--blue-soft);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .quiz-banner.correct { background: var(--emerald-soft); border-color: var(--emerald); }
    .quiz-banner.wrong { background: var(--coral-soft); border-color: var(--coral); }

    /* =========================================================================
       7. TAB-SPECIFIC COMPONENTS (DIAGNOSTICS, PUPILS, CHECKLISTS)
       ========================================================================= */
    .stat-tile {
      padding: 12px 10px;
      border-radius: 16px;
      border: 1.5px solid var(--border-card);
      background: var(--bg-card);
      box-shadow: var(--shadow-card);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-tile.ok { background: var(--emerald-soft); border-color: var(--emerald-border); }
    .stat-tile.warn { background: var(--amber-soft); border-color: var(--amber-border); }
    .stat-tile.risk { background: var(--coral-soft); border-color: var(--coral-border); }
    .stat-num { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
    .stat-lbl { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }

    .pupil-circle { transition: r 0.26s cubic-bezier(0.22, 1, 0.36, 1); }

    .acc-btn {
      width: 100%;
      padding: 14px 16px;
      border: none;
      background: transparent;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: left;
    }

    .chk-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.12s ease;
    }

  <script>

    const SUN_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
    const MOON_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;

    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return parsed !== null && parsed !== undefined ? parsed : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveJSON(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    }

    function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem('mchiro_theme'); } catch (e) {}
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? (saved === 'dark' || saved === '"dark"') : prefersDark;
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      try { localStorage.setItem('mchiro_theme', isDark ? 'dark' : 'light'); } catch (e) {}
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) btn.innerHTML = isDark ? SUN_SVG : MOON_SVG;
    }

    function toggleTheme() {
      applyTheme(!document.documentElement.classList.contains('dark'));
    }

    function showToast(msg, tone) {
      const wrap = document.getElementById('toast-wrap');
      if (!wrap) return;
      const el = document.createElement('div');
      el.className = 'toast' + (tone ? ' ' + tone : '');
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
        setTimeout(() => el.remove(), 250);
      }, 2200);
    }

    // Safely read & append to mchiro_diag_v1 preserving msk/chiro/written entries
    function readDiagEvents() {
      const raw = loadJSON('mchiro_diag_v1', []);
      if (Array.isArray(raw)) return raw;
      if (raw && Array.isArray(raw.events)) return raw.events;
      return [];
    }

    function appendDiagEvent(evt) {
      try {
        const raw = loadJSON('mchiro_diag_v1', null);
        if (raw && !Array.isArray(raw) && Array.isArray(raw.events)) {
          raw.events.push(evt);
          if (raw.events.length > 600) raw.events.splice(0, raw.events.length - 600);
          saveJSON('mchiro_diag_v1', raw);
        } else {
          const arr = Array.isArray(raw) ? raw : [];
          arr.push(evt);
          if (arr.length > 600) arr.splice(0, arr.length - 600);
          saveJSON('mchiro_diag_v1', arr);
        }
      } catch (e) {}
    }

    // =========================================================================
    // 9. EVENT HANDLERS (ATLAS, SPOKEN OSCE, CORD SRS & 15-MIN OSCE)
    // =========================================================================
    function switchAtlas(key) {
      state.atlasKey = key;
      state.atlasSelected = ATLAS_CONFIGS[key].defaultSel;
      if (state.quizActive) pickNewQuizTarget();
      renderApp();
    }

    function toggleSpotQuiz() {
      state.quizActive = !state.quizActive;
      state.quizScore = 0;
      state.quizTotal = 0;
      if (state.quizActive) pickNewQuizTarget();
      else { state.quizTarget = null; state.quizPicked = null; }
      renderApp();
    }

    function pickNewQuizTarget() {
      const keys = Object.keys(ATLAS_CONFIGS[state.atlasKey].data);
      const pool = keys.length > 1 ? keys.filter((k) => k !== state.quizTarget) : keys;
      state.quizTarget = pool[Math.floor(Math.random() * pool.length)];
      state.quizPicked = null;
      state.quizCorrect = false;
    }

    function handleAtlasTap(id) {
      if (state.quizActive) {
        if (state.quizPicked) return;
        state.quizPicked = id;
        state.quizCorrect = id === state.quizTarget;
        state.quizTotal++;
        if (state.quizCorrect) state.quizScore++;
        renderApp();
        return;
      }
      state.atlasSelected = state.atlasSelected === id ? null : id;
      renderApp();
    }

    // --- Tab 2: Spoken OSCE Handlers ---
    function getFilteredSpokenDrills() {
      if (state.spokenFilter === 'y2') return SPOKEN_DRILLS.filter((d) => d.group === 'y2');
      if (state.spokenFilter === 'y3') return SPOKEN_DRILLS.filter((d) => d.group === 'y3');
      if (state.spokenFilter === 'slips') {
        const list = SPOKEN_DRILLS.filter((d) => state.spokenSlips[d.id]);
        return list.length ? list : SPOKEN_DRILLS;
      }
      return SPOKEN_DRILLS;
    }

    function stopSpokenTimer() {
      if (spokenTimerId) clearInterval(spokenTimerId);
      spokenTimerId = null;
      state.spokenRunning = false;
    }

    function toggleSpokenTimer() {
      if (state.spokenRunning) {
        stopSpokenTimer();
        renderApp();
        return;
      }
      if (state.spokenSecs <= 0) state.spokenSecs = 15;
      state.spokenRunning = true;
      spokenTimerId = setInterval(() => {
        if (state.spokenSecs > 0) {
          state.spokenSecs--;
          const el = document.getElementById('spoken-clock');
          if (el) {
            el.textContent = `${state.spokenSecs}s`;
            el.style.color = state.spokenSecs === 0 ? 'var(--coral)' : state.spokenSecs < 5 ? 'var(--amber)' : 'var(--text-main)';
          }
        } else {
          stopSpokenTimer();
          showToast('15s up — rate confidence & reveal!', 'coral');
          renderApp();
        }
      }, 1000);
      renderApp();
    }

    function resetSpokenTimer() {
      stopSpokenTimer();
      state.spokenSecs = 15;
      renderApp();
    }

    function setSpokenFilter(f) {
      if (f === 'slips' && Object.keys(state.spokenSlips).length === 0) {
        showToast('No slips queued yet!', 'emerald');
        return;
      }
      stopSpokenTimer();
      state.spokenFilter = f;
      state.spokenIdx = 0;
      state.spokenConf = null;
      state.spokenRevealed = false;
      state.spokenSecs = 15;
      renderApp();
    }

    function stepSpoken(delta) {
      stopSpokenTimer();
      const list = getFilteredSpokenDrills();
      state.spokenIdx = (state.spokenIdx + delta + list.length) % list.length;
      state.spokenConf = null;
      state.spokenRevealed = false;
      state.spokenSecs = 15;
      renderApp();
    }

    function gradeSpokenDrill(drillId, clean) {
      const drill = SPOKEN_DRILLS.find((d) => d.id === drillId);
      if (!drill) return;
      stopSpokenTimer();

      const now = Date.now();
      appendDiagEvent({
        id: drill.id,
        module: 'neuro',
        source: 'neuro',
        rootCauseTag: drill.rootCause,
        confidence: state.spokenConf || 'unsure',
        correct: clean,
        ts: now,
        timestamp: now,
      });

      if (clean) {
        delete state.spokenSlips[drill.id];
        showToast('✓ Clean spoken recall logged!', 'emerald');
      } else {
        state.spokenSlips[drill.id] = true;
        if (state.spokenConf === 'certain') {
          showToast('High-Confidence Slip logged to mchiro_diag_v1!', 'coral');
        } else {
          showToast('Queued in Slips Only for replay.', 'amber');
        }
      }

      const list = getFilteredSpokenDrills();
      state.spokenIdx = (state.spokenIdx + 1) % list.length;
      state.spokenConf = null;
      state.spokenRevealed = false;
      state.spokenSecs = 15;
      renderApp();
    }

    function getNeuroDiagMetrics() {
      const evts = readDiagEvents().filter((e) => e && (e.module === 'neuro' || e.source === 'neuro'));
      const total = evts.length;
      const clean = evts.filter((e) => e.correct).length;
      const pct = total > 0 ? Math.round((clean / total) * 100) : 0;
      const hcSlips = evts.filter((e) => e.confidence === 'certain' && !e.correct).length;
      return { total, pct, hcSlips };
    }

    // --- Tab 4: Confidence-Weighted Cord/Cortical SRS ---
    function getNeuroSrsDeck() {
      if (!state.srsDueOnly) return NEURO_SRS_DECK;
      const now = Date.now();
      const due = NEURO_SRS_DECK.filter((c) => {
        const rec = state.srs[c.id];
        if (!rec) return true;
        return (typeof rec.box === 'number' && rec.box <= 1) || !rec.dueAt || now >= rec.dueAt;
      });
      return due.length ? due : NEURO_SRS_DECK;
    }

    function gradeNeuroSrs(cardId, gotIt) {
      const card = NEURO_SRS_DECK.find((c) => c.id === cardId);
      if (!card) return;

      // Merge safely into mchiro_srs_v4 without overwriting msk/chiro/written keys
      const latest = loadJSON('mchiro_srs_v4', {});
      const cur = latest[cardId] || { box: 1 };
      let nextBox = typeof cur.box === 'number' ? cur.box : 1;
      let days = 0;

      if (!gotIt) { nextBox = 1; days = 0; }
      else { nextBox = Math.min(5, nextBox + 1); days = [0, 1, 3, 7, 14, 30][nextBox]; }

      const now = Date.now();
      latest[cardId] = { box: nextBox, dueAt: now + days * DAY_MS };
      saveJSON('mchiro_srs_v4', latest);
      state.srs = latest;

      appendDiagEvent({
        id: cardId,
        module: 'neuro',
        source: 'neuro',
        rootCauseTag: card.rootCause,
        confidence: state.srsConf || 'unsure',
        correct: gotIt,
        ts: now,
        timestamp: now,
      });

      if (!gotIt && state.srsConf === 'certain') showToast('High-Confidence Slip logged (Box 1)', 'coral');
      else if (!gotIt) showToast('Reset to Box 1 — Due Today', 'amber');
      else showToast(`Promoted to Box ${nextBox} (${days}d)`, 'emerald');

      state.srsConf = null;
      state.srsRevealed = false;
      state.srsIdx = (state.srsIdx + 1) % getNeuroSrsDeck().length;
      renderApp();
    }

    // =========================================================================
    // 15. RENDER TAB 5 — 15-MIN OSCE TIMER & 8-SECTION YEAR 3 TESTING OVERVIEW
    // =========================================================================
    function renderTabOsce() {
      const sectionsComplete = OSCE_8_SECTIONS.filter((sec) =>
        sec.items.every((_, i) => state.checkedOsce[`s${sec.id}_${i}`])
      ).length;
      const totalItems = OSCE_8_SECTIONS.reduce((acc, s) => acc + s.items.length, 0);
      const checkedItems = OSCE_8_SECTIONS.reduce((acc, s) =>
        acc + s.items.filter((_, i) => state.checkedOsce[`s${s.id}_${i}`]).length, 0);
      const pct = Math.round((sectionsComplete / 8) * 100);
      const clockColor = state.osceSecs < 180 ? 'var(--coral)' : state.osceSecs < 300 ? 'var(--amber)' : 'var(--text-main)';

      return `
        <div class="stack">
          <section class="ah-card pad-card flex-between">
            <div>
              <span class="badge ${state.osceSecs < 180 ? 'badge-coral' : state.osceSecs < 300 ? 'badge-amber' : 'badge-blue'}">
                ${state.osceSecs < 180 ? '⚠️ Under 3 Minutes!' : state.osceSecs < 300 ? '⏱️ Under 5 Minutes' : '15-Minute Neuro OSCE Timer'}
              </span>
              <div id="osce-clock" class="mono" style="font-size:40px;font-weight:800;margin-top:4px;color:${clockColor};">${fmtMMSS(state.osceSecs)}</div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button type="button" class="btn-3d ${state.osceRunning ? 'btn-amber' : 'btn-emerald'}" onclick="toggleOsceTimer()">${state.osceRunning ? 'Pause' : 'Start 15:00'}</button>
              <button type="button" class="btn-3d btn-neutral" onclick="resetOsceTimer()">Reset</button>
            </div>
          </section>

          <section class="ah-card pad-card stack-sm">
            <div class="flex-between">
              <div>
                <h2 style="font-size:17px;font-weight:800;">8-Section Year 3 Testing Overview</h2>
                <p style="font-size:12.5px;color:var(--text-muted);font-weight:700;">
                  <strong>${sectionsComplete} / 8 Sections Checked</strong> (${checkedItems}/${totalItems} items)
                </p>
              </div>
              <button type="button" class="btn-3d btn-coral sm" onclick="coldPeerMockReset()">↺ Cold Peer-Mock Reset</button>
            </div>

            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

            <div class="stack-sm" style="margin-top:4px;">
              ${OSCE_8_SECTIONS.map((sec) => {
                const open = !!state.openOsce[sec.id];
                const sDone = sec.items.filter((_, i) => state.checkedOsce[`s${sec.id}_${i}`]).length;
                const allDone = sDone === sec.items.length;
                return `
                  <article class="ah-card-alt" style="overflow:hidden;${allDone ? 'border-color:var(--emerald);' : ''}">
                    <button type="button" class="acc-btn" onclick="state.openOsce[${sec.id}]=!state.openOsce[${sec.id}]; renderApp();">
                      <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;">
                        <strong style="font-size:14px;">${allDone ? '✓ ' : ''}${esc(sec.title)}</strong>
                        <span class="badge ${sec.tag.includes('NEW') ? 'badge-purple' : sec.tag.includes('Trap') || sec.tag.includes('Slip') ? 'badge-coral' : 'badge-blue'}">${esc(sec.tag)}</span>
                      </div>
                      <span class="mono" style="font-size:12px;font-weight:800;color:var(--text-muted);">${sDone}/${sec.items.length} ${open ? '▲' : '▼'}</span>
                    </button>

                    ${open ? `
                      <div style="border-top:1px solid var(--border-card);padding:6px;">
                        ${sec.items.map((txt, i) => {
                          const k = `s${sec.id}_${i}`;
                          const chk = !!state.checkedOsce[k];
                          return `
                            <label class="chk-row">
                              <input type="checkbox" ${chk ? 'checked' : ''} onchange="state.checkedOsce['${k}']=!state.checkedOsce['${k}']; saveJSON('mchiro_neuro_osce_v6', state.checkedOsce); renderApp();" />
                              <span style="font-size:13px;${chk ? 'text-decoration:line-through;color:var(--text-muted);' : ''}">${esc(txt)}</span>
                            </label>
                          `;
                        }).join('')}
                      </div>
                    ` : ''}
                  </article>
                `;
              }).join('')}
            </div>
          </section>
        </div>
      `;
    }
