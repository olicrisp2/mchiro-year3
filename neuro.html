      color: var(--ah-text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    }

    .mono-badge {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      letter-spacing: -0.02em;
    }

    /* Hide scrollbars on horizontal pill bars */

    /* Active Recall Blur Mode (Retrieval Practice) */
    .recall-blur {
      filter: blur(7px);
      opacity: 0.55;
      user-select: none;
      cursor: pointer;
      transition: filter 0.18s ease, opacity 0.18s ease;
    }
    .recall-blur:hover {
      opacity: 0.8;

      cursor: pointer;

  <script>
    // =========================================================================
    // 1. PERSISTENCE: THEME ('mchiro_theme'), SRS ('mchiro_srs_v4') & CHECKLIST
    // =========================================================================
    const DAY_MS = 86400000;

    function loadStore(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveStore(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {
        // Safely ignore quota or private browsing errors
      }
    }

    function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem('mchiro_theme'); } catch (e) {}
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? (saved === 'dark' || saved === '"dark"') : prefersDark;
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      try { localStorage.setItem('mchiro_theme', isDark ? 'dark' : 'light'); } catch (e) {}
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) btn.textContent = isDark ? '☀️' : '🌙';
    }

    function toggleTheme() {
      applyTheme(!document.documentElement.classList.contains('dark'));
    }

    function showToast(msg, tone = 'default') {
      const container = document.getElementById('toast-container');
      const tones = {
        default: 'bg-[#1C1C1E] dark:bg-[#F2F2F7] text-[#F2F2F7] dark:text-[#1C1C1E]',
        green: 'bg-[#34C759] text-white',
        amber: 'bg-[#FF9500] text-white',
        red: 'bg-[#FF3B30] text-white',
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-2.5 rounded-2xl shadow-lg text-xs sm:text-sm font-bold transition-all duration-300 ${tones[tone] || tones.default}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 2200);
    }

                        <div class="flex items-start justify-between gap-2">
                          <h3 class="text-sm sm:text-base font-extrabold ah-text">${item.term}</h3>
                          <span class="px-2 py-0.5 rounded-lg text-[10px] font-extrabold bg-[#AF52DE]/15 text-[#AF52DE] shrink-0">${item.region}</span>
                        </div>

                        <div onclick="this.classList.remove('recall-blur')" class="space-y-1.5 text-xs sm:text-sm ${bCls}">
                          <p class="ah-text leading-relaxed">${item.def}</p>
                          <p class="text-xs"><strong class="ah-secondary">Site:</strong> <span class="font-bold ah-text">${item.site}</span></p>
                          <p class="text-xs"><strong class="ah-secondary">Bedside Test:</strong> <span class="ah-text">${item.test}</span></p>
                        </div>

                        ${item.trap ? `
                          <div class="px-3 py-1.5 rounded-xl bg-[#FF3B30]/10 border border-[#FF3B30]/30 text-xs font-extrabold text-[#FF3B30]">
                            ⚠ ${item.trap}
                          </div>
                        ` : ''}
                      </div>

                      <!-- Leitner Buttons: Again / Shaky 2d / Solid 7d -->
                      <div class="grid grid-cols-3 gap-1.5 pt-2 border-t border-black/5 dark:border-white/10">
                        <button type="button" onclick="rateSrs('${item.id}','again')" class="py-2 rounded-xl text-[11px] font-bold border transition ${box==='again' ? 'bg-[#FF3B30] text-white border-[#FF3B30]' : 'bg-[#FF3B30]/10 text-[#FF3B30] border-[#FF3B30]/25'}">Again</button>
                        <button type="button" onclick="rateSrs('${item.id}','shaky')" class="py-2 rounded-xl text-[11px] font-bold border transition ${box==='shaky' ? 'bg-[#FF9500] text-white border-[#FF9500]' : 'bg-[#FF9500]/10 text-[#FF9500] border-[#FF9500]/25'}">Shaky (2d)</button>
                        <button type="button" onclick="rateSrs('${item.id}','solid')" class="py-2 rounded-xl text-[11px] font-bold border transition ${box==='solid' ? 'bg-[#34C759] text-white border-[#34C759]' : 'bg-[#34C759]/12 text-[#248A3D] dark:text-[#34C759] border-[#34C759]/25'}">Solid (7d)</button>
                      </div>
                    </article>
                  `;
                }).join('')}
              </div>
            ` : `
              <div class="ah-card p-8 text-center space-y-1">
                <p class="text-base font-extrabold text-[#34C759]">All Caught Up!</p>
                <p class="text-xs ah-secondary">No brain lesion cards are due today. Tap the filter button above to view all 7 cards.</p>
              </div>
            `}
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 9. TAB 5: 15-MIN OSCE & 8-SECTION YEAR 3 TESTING OVERVIEW
    // =========================================================================
    function formatClock(secs) {
      return `${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`;
    }

    function setOscePreset(secs) {
      clearInterval(osceInterval);
      state.osceRunning = false;
      state.osceDuration = secs;
      state.osceRemaining = secs;
      renderApp();
    }

    function toggleOsceTimer() {
      if (state.osceRunning) {
        clearInterval(osceInterval);
        state.osceRunning = false;
      } else {
        state.osceRunning = true;
        osceInterval = setInterval(() => {
          if (state.osceRemaining > 0) {
            state.osceRemaining--;
            const el = document.getElementById('osce-clock');
            if (el) el.textContent = formatClock(state.osceRemaining);
          } else {
            clearInterval(osceInterval);
            state.osceRunning = false;
            showToast('Time up! OSCE station finished.', 'amber');
            renderApp();
          }
        }, 1000);
      }
      renderApp();
    }

    function nextRandomPrompt() {
      let next = Math.floor(Math.random() * OSCE_PROMPTS.length);
      if (OSCE_PROMPTS.length > 1 && next === state.osceIdx) {
        next = (next + 1) % OSCE_PROMPTS.length;
      }
      state.osceIdx = next;
      state.osceTicked = {};
      renderApp();
    }

    function renderOsceTab() {
      const p = OSCE_PROMPTS[state.osceIdx] || OSCE_PROMPTS[0];
      const ticked = p.points.filter((_, i) => state.osceTicked[i]).length;

      const totalItems = TESTING_OVERVIEW.reduce((s, sec) => s + sec.items.length, 0);
      const checkedItems = Object.values(state.checkedOverview).filter(Boolean).length;
      const pct = totalItems ? Math.round((checkedItems / totalItems) * 100) : 0;

      return `
        <div class="max-w-3xl mx-auto space-y-6">
          <!-- 1. COUNTDOWN TIMER CARD -->
          <section class="ah-card p-5 flex flex-wrap items-center justify-between gap-4">
            <div>
              <span class="mono-badge text-[10px] font-bold uppercase text-[#007AFF]">OSCE Practical Timer</span>
              <div id="osce-clock" class="mono-badge text-4xl font-extrabold ah-text mt-0.5">${formatClock(state.osceRemaining)}</div>
              <div class="mt-2.5 flex gap-2">
                <button type="button" onclick="setOscePreset(900)" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${state.osceDuration === 900 ? 'bg-[#007AFF] text-white' : 'ah-card-alt ah-text'}">15:00 Full Exam</button>
                <button type="button" onclick="setOscePreset(60)" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${state.osceDuration === 60 ? 'bg-[#AF52DE] text-white' : 'ah-card-alt ah-text'}">01:00 Rapid</button>
              </div>
            </div>

            <div class="flex flex-col items-start sm:items-end gap-2">
              <div class="flex gap-2">
                <button type="button" onclick="toggleOsceTimer()" class="px-5 py-2.5 rounded-xl text-xs font-extrabold text-white transition ${state.osceRunning ? 'bg-[#FF9500]' : 'bg-[#34C759]'}">
                  ${state.osceRunning ? 'Pause' : 'Start'}
                </button>
                <button type="button" onclick="setOscePreset(state.osceDuration)" class="px-4 py-2.5 rounded-xl text-xs font-bold ah-card-alt ah-text">
                  Reset
                </button>
              </div>
              <span class="text-xs font-bold ah-secondary">
                Session: <span class="text-[#34C759]">${state.oscePass} Pass</span> &bull; <span class="text-[#FF3B30]">${state.osceDrill} Drill</span>
              </span>
            </div>
          </section>

          <!-- 2. RANDOM EXAMINER PROMPT ("SAY IT ALOUD") -->
          <section class="ah-card p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <span class="px-2.5 py-1 rounded-xl text-[11px] font-extrabold bg-[#007AFF]/12 text-[#007AFF]">${p.sec}</span>
              <div class="flex items-center gap-2">
                <span class="mono-badge text-xs font-extrabold text-[#34C759]">Score: ${ticked}/${p.points.length}</span>
                <button type="button" onclick="nextRandomPrompt()" class="px-3.5 py-1.5 rounded-xl bg-[#1C1C1E] dark:bg-[#F2F2F7] text-[#F2F2F7] dark:text-[#1C1C1E] text-xs font-extrabold">🎲 Random Prompt</button>
              </div>
            </div>

            <h3 class="text-base sm:text-lg font-extrabold ah-text leading-snug">
              Examiner: “${p.prompt}”
            </h3>

            <div class="px-3.5 py-2.5 rounded-2xl bg-[#FF3B30]/10 border border-[#FF3B30]/30 text-xs font-extrabold text-[#FF3B30]">
              ⚠ Assessor Trap: ${p.trap}
            </div>

            <div class="ah-card-alt divide-y divide-black/5 dark:divide-white/10 overflow-hidden">
              ${p.points.map((pt, idx) => `
                <label class="flex items-start gap-3 p-3.5 cursor-pointer">
                  <input type="checkbox" ${state.osceTicked[idx] ? 'checked' : ''} onchange="state.osceTicked[${idx}]=!state.osceTicked[${idx}]; renderApp();" class="mt-0.5 w-4 h-4 accent-[#34C759] rounded shrink-0" />
                  <span class="text-xs sm:text-sm ${state.osceTicked[idx] ? 'line-through ah-secondary' : 'ah-text font-medium'}">${pt}</span>
                </label>
              `).join('')}
            </div>

            <div class="grid grid-cols-2 gap-3">
              <button type="button" onclick="state.oscePass++; nextRandomPrompt(); showToast('Marked Pass ✓','green');" class="py-3 rounded-2xl bg-[#34C759] text-white text-xs font-extrabold">✓ Pass &amp; Next</button>
              <button type="button" onclick="state.osceDrill++; nextRandomPrompt(); showToast('Flagged to Drill ↺','red');" class="py-3 rounded-2xl bg-[#FF3B30] text-white text-xs font-extrabold">↺ Drill &amp; Next</button>
            </div>
          </section>

          <!-- 3. COLLAPSIBLE 8-SECTION YEAR 3 TESTING OVERVIEW -->
          <section class="space-y-2.5">
            <div class="ah-card p-4 space-y-2">
              <div class="flex items-center justify-between">
                <h2 class="text-sm sm:text-base font-extrabold ah-text">Year 3 Testing Overview (${checkedItems}/${totalItems} — ${pct}%)</h2>
                <button type="button" onclick="state.checkedOverview={}; saveStore('mchiro_neuro_overview_v4',{}); showToast('Checklist reset'); renderApp();" class="text-xs font-bold ah-secondary underline">Reset</button>
              </div>
              <div class="w-full h-2 rounded-full bg-black/10 dark:bg-white/10 overflow-hidden">
                <div class="h-full bg-[#007AFF] transition-all duration-300" style="width:${pct}%"></div>
              </div>
            </div>

            ${TESTING_OVERVIEW.map((sec) => {
              const isOpen = !!state.openOverview[sec.id];
              const done = sec.items.filter((_, idx) => state.checkedOverview[`s${sec.id}_${idx}`]).length;
              return `
                <div class="ah-card overflow-hidden">
                  <button type="button" onclick="state.openOverview[${sec.id}]=!state.openOverview[${sec.id}]; renderApp();" class="w-full px-4 py-3.5 flex items-center justify-between gap-2 text-left">
                    <span class="text-xs sm:text-sm font-extrabold ah-text">${sec.title}</span>
                    <span class="mono-badge text-xs font-bold ah-secondary shrink-0">${done}/${sec.items.length} ${isOpen ? '▲' : '▼'}</span>
                  </button>
                  ${isOpen ? `
                    <div class="border-t border-black/5 dark:border-white/10 divide-y divide-black/5 dark:divide-white/10">
                      ${sec.items.map((txt, idx) => {
                        const key = `s${sec.id}_${idx}`;
                        const chk = !!state.checkedOverview[key];
                        return `
                          <label class="flex items-start gap-3 px-4 py-3 cursor-pointer">
                            <input type="checkbox" ${chk ? 'checked' : ''} onchange="state.checkedOverview['${key}']=!state.checkedOverview['${key}']; saveStore('mchiro_neuro_overview_v4', state.checkedOverview); renderApp();" class="mt-0.5 w-4 h-4 accent-[#007AFF] rounded shrink-0" />
                            <span class="text-xs sm:text-sm ${chk ? 'line-through ah-secondary' : 'ah-text'}">${txt}</span>
                          </label>
                        `;
                      }).join('')}
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 10. INITIALISE APP
    // =========================================================================
    initTheme();
    updateBlurUI();
    renderNavigation();
    renderApp();
  </script>
</body>
</html>
