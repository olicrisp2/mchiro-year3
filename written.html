<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Written &amp; Foundation – MChiro Year 3 Hub</title>

  <style>
    /* =========================================================================
       1. DESIGN TOKENS: APPLE HEALTH MINIMALIST × DUOLINGO TACTILE 3D
       Zero external CDNs — pure system font stack & inline SVG graphics.
       ========================================================================= */
    :root {
      --bg-page: #F2F2F7;
      --bg-card: #FFFFFF;
      --bg-subtle: #EAEAF0;
      --bg-input: #F8FAFC;
      --bg-glass: rgba(242, 242, 247, 0.90);
      --border-card: #E5E7EB;
      --border-strong: #CBD5E1;
      --text-main: #0F172A;
      --text-muted: #475569;
      --shadow-card: 0 2px 12px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);

      /* Semantic Cognitive Colour-Coding */
      --blue: #2563EB;
      --blue-dark: #1D4ED8;
      --blue-soft: rgba(37, 99, 235, 0.10);
      --blue-border: rgba(37, 99, 235, 0.30);

      --emerald: #10B981;
      --emerald-dark: #047857;
      --emerald-soft: rgba(16, 185, 129, 0.11);
      --emerald-border: rgba(16, 185, 129, 0.32);

      --purple: #7C3AED;
      --purple-dark: #5B21B6;
      --purple-soft: rgba(124, 58, 237, 0.10);
      --purple-border: rgba(124, 58, 237, 0.30);

      --coral: #EF4444;
      --coral-dark: #B91C1C;
      --coral-soft: rgba(239, 68, 68, 0.10);
      --coral-border: rgba(239, 68, 68, 0.32);

      --amber: #F59E0B;
      --amber-dark: #B45309;
      --amber-soft: rgba(245, 158, 11, 0.12);
      --amber-border: rgba(245, 158, 11, 0.36);

      /* SVG Tokens */
      --svg-bg: #F8FAFC;
      --svg-line: #CBD5E1;
      --svg-surface: #FFFFFF;
      --svg-stroke: #334155;
    }

    .dark {
      --bg-page: #090D16;
      --bg-card: #131B2E;
      --bg-subtle: #1E293B;
      --bg-input: #0F172A;
      --bg-glass: rgba(9, 13, 22, 0.90);
      --border-card: #26344F;
      --border-strong: #3D5073;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --shadow-card: 0 4px 18px rgba(0, 0, 0, 0.45);

      --blue-soft: rgba(37, 99, 235, 0.22);
      --blue-border: rgba(96, 165, 250, 0.42);
      --emerald-soft: rgba(16, 185, 129, 0.20);
      --emerald-border: rgba(52, 211, 153, 0.42);
      --purple-soft: rgba(124, 58, 237, 0.22);
      --purple-border: rgba(167, 139, 250, 0.42);
      --coral-soft: rgba(239, 68, 68, 0.22);
      --coral-border: rgba(248, 113, 113, 0.44);
      --amber-soft: rgba(245, 158, 11, 0.22);
      --amber-border: rgba(251, 191, 36, 0.44);

      --svg-bg: #0F172A;
      --svg-line: #334155;
      --svg-surface: #1E293B;
      --svg-stroke: #94A3B8;
    }

    /* =========================================================================
       2. BASE RESET & SYSTEM TYPOGRAPHY
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.48;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    h1, h2, h3, h4, p { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font-family: inherit; }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: -0.02em;
    }

    /* CRITICAL SVG LEGIBILITY GUARDRAIL */
    svg text {
      stroke: none !important;
      paint-order: fill;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 0 12px;
    }
    @media (min-width: 640px) {
      .container { padding: 0 22px; }
    }

    .main-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-top: 16px;
      padding-bottom: 108px;
    }
    @media (min-width: 769px) {
      .main-stack { padding-bottom: 54px; }
    }

    /* =========================================================================
       3. STICKY FROSTED-GLASS HEADER & 4-TAB SEGMENTED BAR
       ========================================================================= */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-card);
    }

    .header-inner {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 36px;
      padding: 6px 11px;
      border-radius: 12px;
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 12.5px;
      font-weight: 800;
      transition: background-color 0.14s ease;
    }
    .back-btn:hover { background: var(--border-strong); }

    .header-center {
      text-align: center;
      min-width: 0;
    }
    .page-title {
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .theme-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--border-card);
      background: var(--bg-card);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.14s ease;
    }
    .theme-btn:hover { border-color: var(--blue); }

    .tabs-scroll {
      padding-bottom: 10px;
      overflow-x: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }

    .seg-track {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 14px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      min-width: max-content;
    }
    @media (min-width: 680px) {
      .seg-track {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        min-width: 0;
      }
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      min-height: 38px;
      padding: 7px 12px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      text-align: center;
    }
    .seg-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.09);
    }

    /* =========================================================================
       4. SHARED SURFACES, SEMANTIC BOXES, FORM INPUTS & TACTILE 3D BUTTONS
       ========================================================================= */
    .ah-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      box-shadow: var(--shadow-card);
    }
    .ah-card-alt {
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      border-radius: 14px;
    }
    .pad-card { padding: 15px; }
    @media (min-width: 640px) {
      .pad-card { padding: 20px; }
    }

    .stack { display: flex; flex-direction: column; gap: 14px; }
    .stack-sm { display: flex; flex-direction: column; gap: 10px; }

    .flex-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 680px) {
      .grid-2 { grid-template-columns: 1fr 1fr; }
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 640px) {
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (min-width: 720px) {
      .grid-4 { grid-template-columns: repeat(4, 1fr); }
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.015em;
      white-space: nowrap;
    }
    .badge-blue { background: var(--blue-soft); color: var(--blue-dark); border: 1px solid var(--blue-border); }
    .dark .badge-blue { color: #93C5FD; }
    .badge-emerald { background: var(--emerald-soft); color: var(--emerald-dark); border: 1px solid var(--emerald-border); }
    .dark .badge-emerald { color: #6EE7B7; }
    .badge-purple { background: var(--purple-soft); color: var(--purple-dark); border: 1px solid var(--purple-border); }
    .dark .badge-purple { color: #DDD6FE; }
    .badge-coral { background: var(--coral-soft); color: var(--coral-dark); border: 1px solid var(--coral-border); }
    .dark .badge-coral { color: #FCA5A5; }
    .badge-amber { background: var(--amber-soft); color: var(--amber-dark); border: 1px solid var(--amber-border); }
    .dark .badge-amber { color: #FDE68A; }
    .badge-muted { background: var(--bg-subtle); color: var(--text-muted); border: 1px solid var(--border-card); }

    /* Semantic Info Boxes */
    .sem-box {
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      border: 1.5px solid transparent;
    }
    .sem-label {
      display: block;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .sem-blue { background: var(--blue-soft); border-color: var(--blue-border); }
    .sem-blue .sem-label { color: var(--blue-dark); }
    .dark .sem-blue .sem-label { color: #93C5FD; }

    .sem-emerald { background: var(--emerald-soft); border-color: var(--emerald-border); }
    .sem-emerald .sem-label { color: var(--emerald-dark); }
    .dark .sem-emerald .sem-label { color: #6EE7B7; }

    .sem-purple { background: var(--purple-soft); border-color: var(--purple-border); }
    .sem-purple .sem-label { color: var(--purple-dark); }
    .dark .sem-purple .sem-label { color: #DDD6FE; }

    .sem-coral { background: var(--coral-soft); border-color: var(--coral-border); }
    .sem-coral .sem-label { color: var(--coral-dark); }
    .dark .sem-coral .sem-label { color: #FCA5A5; }

    .sem-amber { background: var(--amber-soft); border-color: var(--amber-border); }
    .sem-amber .sem-label { color: var(--amber-dark); }
    .dark .sem-amber .sem-label { color: #FDE68A; }

    /* Tactile Duolingo 3D Buttons */
    .btn-3d {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 44px;
      padding: 10px 15px;
      border-radius: 15px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      text-align: center;
      transition: transform 0.08s ease, border-bottom-width 0.08s ease, filter 0.14s ease, opacity 0.14s ease;
    }
    .btn-3d:hover:not(:disabled) { filter: brightness(1.06); }
    .btn-3d:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px !important;
    }
    .btn-3d:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-3d.sm {
      min-height: 36px;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 12px;
    }
    .btn-full { width: 100%; }

    .btn-blue { background: var(--blue); color: #FFFFFF; border: 2px solid var(--blue); border-bottom: 4px solid var(--blue-dark); }
    .btn-emerald { background: var(--emerald); color: #FFFFFF; border: 2px solid var(--emerald); border-bottom: 4px solid var(--emerald-dark); }
    .btn-purple { background: var(--purple); color: #FFFFFF; border: 2px solid var(--purple); border-bottom: 4px solid var(--purple-dark); }
    .btn-coral { background: var(--coral); color: #FFFFFF; border: 2px solid var(--coral); border-bottom: 4px solid var(--coral-dark); }
    .btn-amber { background: var(--amber); color: #FFFFFF; border: 2px solid var(--amber); border-bottom: 4px solid var(--amber-dark); }
    .btn-neutral {
      background: var(--bg-card);
      color: var(--text-main);
      border: 2px solid var(--border-card);
      border-bottom: 4px solid var(--border-strong);
    }

    /* Selectable Pills */
    .pill-btn {
      min-height: 38px;
      padding: 7px 11px;
      border-radius: 12px;
      border: 1.5px solid var(--border-card);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.14s ease;
      text-align: center;
    }
    .pill-btn:hover { border-color: var(--blue); }
    .pill-btn.active-blue { background: var(--blue); border-color: var(--blue); color: #FFFFFF; }
    .pill-btn.active-emerald { background: var(--emerald); border-color: var(--emerald); color: #FFFFFF; }
    .pill-btn.active-purple { background: var(--purple); border-color: var(--purple); color: #FFFFFF; }
    .pill-btn.active-amber { background: var(--amber); border-color: var(--amber); color: #FFFFFF; }
    .pill-btn.active-coral { background: var(--coral); border-color: var(--coral); color: #FFFFFF; }
    .pill-btn.active-dark { background: #1E293B; border-color: #1E293B; color: #FFFFFF; }

    /* Form Controls */
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .input, .textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1.5px solid var(--border-card);
      background: var(--bg-input);
      color: var(--text-main);
      font-size: 13.5px;
      line-height: 1.48;
      transition: border-color 0.14s ease, box-shadow 0.14s ease;
    }
    .input { min-height: 42px; }
    .textarea { resize: vertical; }
    .input:focus, .textarea:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-soft);
    }

    /* =========================================================================
       5. TAB-SPECIFIC COMPONENTS (SCANNER, RUBRIC, X-RAY, SRS, BPS SVG)
       ========================================================================= */
    .stat-tile {
      padding: 13px;
      border-radius: 16px;
      border: 1.5px solid var(--border-card);
      background: var(--bg-card);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .stat-tile.ok { background: var(--emerald-soft); border-color: var(--emerald-border); }
    .stat-tile.warn { background: var(--amber-soft); border-color: var(--amber-border); }
    .stat-tile.risk { background: var(--coral-soft); border-color: var(--coral-border); }
    .stat-num {
      font-size: 21px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .stat-sub {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .xray-card {
      padding: 14px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-card);
      border-left-width: 5px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .xray-card.pass { border-left-color: var(--emerald); }
    .xray-card.warn { border-left-color: var(--amber); }
    .xray-card.risk { border-left-color: var(--coral); }
    .xray-card.neutral { border-left-color: var(--blue); }

    .fp-mark {
      padding: 1px 4px;
      border-radius: 5px;
      background: var(--coral-soft);
      color: var(--coral-dark);
      font-weight: 800;
      border: 1px solid var(--coral-border);
    }
    .dark .fp-mark { color: #FCA5A5; }

    .rubric-row {
      padding: 13px;
      border-radius: 15px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-card);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .band-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .acc-btn {
      width: 100%;
      padding: 14px 16px;
      border: none;
      background: transparent;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: left;
    }

    /* BPS SVG Spotlight / Fade-Others */
    .bps-svg {
      display: block;
      width: 100%;
      max-width: 360px;
      height: auto;
      margin: 0 auto;
      user-select: none;
    }
    .bps-node {
      cursor: pointer;
      transition: opacity 0.22s ease, filter 0.22s ease;
    }
    .bps-svg.has-sel .bps-node:not(.is-active) {
      opacity: 0.20;
      filter: saturate(0.35);
    }
    .bps-node.is-active {
      opacity: 1 !important;
      filter: drop-shadow(0 0 10px rgba(37, 99, 235, 0.35));
    }

    /* Confidence-Weighted SRS Card */
    .srs-card {
      padding: 18px;
      border-radius: 18px;
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* =========================================================================
       6. FIXED MOBILE BOTTOM NAVIGATION (6 ITEMS) & TOASTS
       ========================================================================= */
    .mobile-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 45;
      background: var(--bg-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--border-card);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
    }
    @media (min-width: 769px) {
      .mobile-nav { display: none; }
    }

    .mobile-nav-grid {
      max-width: 540px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 2px;
    }

    .mnav-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px 2px;
      border-radius: 11px;
      color: var(--text-muted);
      font-size: 9.5px;
      font-weight: 700;
      text-align: center;
    }
    .mnav-link.active {
      color: var(--blue);
      background: var(--blue-soft);
      font-weight: 800;
    }

    .toast-wrap {
      position: fixed;
      bottom: 88px;
      right: 14px;
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    @media (min-width: 769px) {
      .toast-wrap { bottom: 20px; right: 20px; }
    }
    .toast {
      pointer-events: auto;
      padding: 10px 15px;
      border-radius: 14px;
      font-size: 12.5px;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
      background: var(--text-main);
      color: var(--bg-card);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .toast.emerald { background: var(--emerald); color: #FFFFFF; }
    .toast.amber { background: var(--amber); color: #FFFFFF; }
    .toast.coral { background: var(--coral); color: #FFFFFF; }
  </style>
</head>
<body>

  <!-- Toast Container (No alert() or confirm()) -->
  <div id="toast-wrap" class="toast-wrap" aria-live="polite"></div>

  <!-- =========================================================================
       STICKY FROSTED-GLASS HEADER & 4-TAB SEGMENTED BAR
       ========================================================================= -->
  <header class="top-header">
    <div class="container">
      <div class="header-inner">
        <a href="index.html" class="back-btn" aria-label="Back to MChiro Year 3 Hub">&larr; Hub</a>

        <div class="header-center">
          <h1 class="page-title">Written &amp; Foundation</h1>
          <p class="page-sub">Calibrated Essay Auditor &bull; Year 3</p>
        </div>

        <button
          type="button"
          id="theme-toggle-btn"
          class="theme-btn"
          onclick="toggleTheme()"
          aria-label="Toggle Light or Dark Mode"
        ></button>
      </div>

      <!-- 4-Tab Segmented Pill Bar -->
      <nav class="tabs-scroll" aria-label="Written and Foundation Sections">
        <div id="segmented-tabs" class="seg-track" role="tablist"></div>
      </nav>
    </div>
  </header>

  <!-- =========================================================================
       MAIN APP ROOT
       ========================================================================= -->
  <main class="container main-stack">
    <div id="app-root"></div>
  </main>

  <!-- =========================================================================
       FIXED MOBILE BOTTOM NAVIGATION BAR (6 ITEMS)
       ========================================================================= -->
  <nav class="mobile-nav" aria-label="Mobile Hub Navigation">
    <div class="mobile-nav-grid">
      <a href="index.html" class="mnav-link">
        <span style="font-size:15px;">🏠</span>
        <span>Hub</span>
      </a>
      <a href="planner.html" class="mnav-link">
        <span style="font-size:15px;">📅</span>

      el.textContent = msg;

        setTimeout(() => el.remove(), 250);
      }, 2200);

    function logDiagnosticTelemetry(itemId, rootCauseTag, confidence, correct) {
      try {
        const log = loadJSON('mchiro_diag_v1', []);
        const arr = Array.isArray(log) ? log : [];
        arr.push({
          itemId,
          rootCauseTag,
          confidence,
          correct: Boolean(correct),
          timestamp: Date.now(),
        });
        // Keep last 500 events to remain lightweight
        if (arr.length > 500) arr.splice(0, arr.length - 500);
        saveJSON('mchiro_diag_v1', arr);
      } catch (e) {}

    function gradeConfidenceCard(deckType, card, passed) {
      const conf = deckType === 'res' ? state.resConfidence : state.philConfidence;
      const cur = state.srs[card.id] || { box: 1 };
      let nextBox = typeof cur.box === 'number' ? cur.box : 1;
      let days = 0;

      if (!passed) {
        nextBox = 1;
        days = 0;
      } else {
        nextBox = Math.min(5, nextBox + 1);
        days = [0, 1, 3, 7, 14, 30][nextBox];
      }

      state.srs[card.id] = { box: nextBox, dueAt: Date.now() + days * DAY_MS };
      saveJSON('mchiro_srs_v4', state.srs);
      logDiagnosticTelemetry(card.id, card.rootCause, conf || 'unsure', passed);

      if (deckType === 'res') {
        state.resIdx = (state.resIdx + 1) % RESEARCH_SRS.length;
        state.resConfidence = null;
        state.resRevealed = false;
      } else {
        state.philIdx = (state.philIdx + 1) % PHIL_SRS.length;
        state.philConfidence = null;
        state.philRevealed = false;
      }

      if (!passed && conf === 'certain') {
        showToast('High-Confidence Error logged to mchiro_diag_v1 (Box 1)', 'coral');
      } else if (!passed) {
        showToast('Moved to Box 1 — Review Today', 'amber');
      } else {
        showToast(`Nailed It! Box ${nextBox} (${days}d)`, 'emerald');
      }
      renderApp();
    }

    // =========================================================================
    // 4. CORE ENGINE: PARAGRAPH-LEVEL EVIDENCE & GENRE SCANNER (100% LOCAL JS)
    // =========================================================================
    const HARVARD_REGEX = /\([A-Z][A-Za-z\-&.,'\s]+?\d{4}[a-z]?(?:,\s*p{1,2}\.?\s*\d+(?:[-–]\d+)?|:\s*\d+)?(?:\s*;\s*[A-Z][A-Za-z\-&.,'\s]+?\d{4}[a-z]?)*\)|\b[A-Z][A-Za-z\-]+(?:\s+et\s+al\.?|\s+(?:&|and)\s+[A-Z][A-Za-z\-]+)?\s*\(\d{4}[a-z]?(?:,\s*p{1,2}\.?\s*\d+(?:[-–]\d+)?)?\)/g;

    function countWords(text) {
      const t = (text || '').trim();
      return t ? t.split(/\s+/).filter(Boolean).length : 0;
    }

    function extractCitationKeys(text) {
      const matches = text.match(HARVARD_REGEX) || [];
      const keys = new Set();
      matches.forEach((m) => {
        const yearMatch = m.match(/\d{4}[a-z]?/);
        const authorMatch = m.match(/[A-Z][a-zA-Z\-]{2,}/);
        if (yearMatch) {
          keys.add(((authorMatch ? authorMatch[0].toLowerCase() : '') + '_' + yearMatch[0]));
        }
      });
      return { count: matches.length, matches, keys };
    }

    // Strip quoted text before scanning for first-person voice
    function stripQuotes(text) {
      return text.replace(/["“][^"”]*["”]/g, ' ');
    }

    function runDeepAudit(rawText) {
      const text = (rawText || '').trim();
      if (!text) return null;

      const target = Math.max(100, parseInt(state.targetWords, 10) || 2000);
      const minW = Math.round(target * 0.9);
      const maxW = Math.round(target * 1.1);
      const totalWords = countWords(text);
      const wcState = totalWords < minW ? 'under' : totalWords > maxW ? 'over' : 'ok';

      // Global Harvard citation count & density per 250 words
      const globalCites = extractCitationKeys(text);
      const density = totalWords > 0 ? (globalCites.count / totalWords) * 250 : 0;
      const densityState = density >= 2.5 ? 'ok' : density >= 1.5 ? 'warn' : 'risk';

      // 1. Global First-Person Detector (outside quotation marks)
      const unquoted = stripQuotes(text);
      const fpRegex = /\b(I|me|my|mine|myself|we|our|us)\b/g;
      let fpCount = 0;
      const fpSnippets = [];
      let m;
      while ((m = fpRegex.exec(unquoted)) !== null) {
        fpCount++;
        if (fpSnippets.length < 5) {
          const s = Math.max(0, m.index - 26);
          const e = Math.min(unquoted.length, m.index + m[0].length + 26);
          const before = esc(unquoted.slice(s, m.index));
          const hit = esc(m[0]);
          const after = esc(unquoted.slice(m.index + m[0].length, e));
          fpSnippets.push(`${s > 0 ? '…' : ''}${before}<span class="fp-mark">${hit}</span>${after}${e < unquoted.length ? '…' : ''}`);
        }
      }

      // 2. Direct Quote Page-Number Check (quotes of 4+ words)
      const quoteRegex = /["“]([^"”]+)["”]([^\n]{0,45})/g;
      let totalQuotes = 0;
      const missingPageQuotes = [];
      while ((m = quoteRegex.exec(text)) !== null) {
        const qWords = countWords(m[1]);
        if (qWords >= 4) {
          totalQuotes++;
          const after = m[2] || '';
          const hasPage = /(\bp\.?\s*\d+|\bpp\.?\s*\d+|:\s*\d+)/i.test(after);
          if (!hasPage) {
            const snippet = m[1].trim();
            missingPageQuotes.push(snippet.length > 62 ? snippet.slice(0, 62) + '…' : snippet);
          }
        }
      }

      // 3. Bibliography vs Reference List
      const hasBibliography = /\bbibliography\b/i.test(text);

      // 4. Informal Web Source Detector
      const informalRegex = /\b(wikipedia|blog|wordpress|blogspot|webmd|healthline|youtube|reddit|chiropractic blog|practice website|clinic website)\b/gi;
      const informalHits = [...new Set((text.match(informalRegex) || []).map((x) => x.toLowerCase()))];

      // 5. Harvard Software Glitch Check
      const glitches = [];
      if (/\bet\s+al(?=[,\s)])(?!\.)/i.test(text)) {
        glitches.push('"et al" missing period (must be "et al.")');
      }
      if (/\([A-Z][A-Za-z\-]+\s*,\s*\)/.test(text) || /\(\s*[A-Z][a-z]+\s+et\s+al\.?\s*\)/.test(text)) {
        glitches.push('Citation parentheses missing publication year');
      }
      if (/\([A-Z][A-Za-z\-]+\s+\d{4}\)/.test(text)) {
        glitches.push('Missing comma between author and year in (Author, Year)');
      }

      // 6. Paragraph-by-Paragraph X-Ray Breakdown (ignore short headings <12 words)
      const rawParas = text.split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);
      const validParas = rawParas.filter((p) => countWords(p) >= 12);
      const paraCount = validParas.length;

      // Collect body citation keys to verify Conclusion New-Content Detector
      const bodyCiteKeys = new Set();
      validParas.forEach((p, idx) => {
        const isLast = paraCount >= 3 && idx === paraCount - 1;
        if (!isLast) {
          extractCitationKeys(p).keys.forEach((k) => bodyCiteKeys.add(k));
        }
      });

      let bodyTotal = 0;
      let bodyEvalCount = 0;
      let uncitedBodyCount = 0;
      let descriptiveOnlyCount = 0;
      let conclusionNewContentFlag = false;

      const paragraphs = validParas.map((p, idx) => {
        const role = (paraCount >= 3 && idx === 0)
          ? 'Intro'
          : (paraCount >= 3 && idx === paraCount - 1)
            ? 'Conclusion'
            : 'Body';

        const wc = countWords(p);
        const cites = extractCitationKeys(p);
        const lower = p.toLowerCase();

        const evalHits = EVALUATIVE_MARKERS.filter((mk) => lower.includes(mk));
        const fpMatches = (stripQuotes(p).match(/\b(I|me|my|mine|myself|we|our|us)\b/g) || []);

        const isUncitedRisk = role !== 'Conclusion' && wc > 80 && cites.count === 0;
        const isDescriptiveOnly = role === 'Body' && wc > 60 && evalHits.length === 0;
        const hasFp = fpMatches.length > 0;

        let newInConclusion = [];
        if (role === 'Conclusion') {
          cites.keys.forEach((k) => {
            if (!bodyCiteKeys.has(k)) newInConclusion.push(k.replace('_', ' '));
          });
          const newPhraseMatch = p.match(/\b(another point|furthermore|in addition,\s*new|new evidence)\b/gi);
          if (newPhraseMatch) {
            newPhraseMatch.forEach((ph) => newInConclusion.push(`"${ph}"`));
          }
          if (newInConclusion.length > 0) conclusionNewContentFlag = true;
        }

        if (role === 'Body') {
          bodyTotal++;
          if (evalHits.length > 0) bodyEvalCount++;
          if (isUncitedRisk) uncitedBodyCount++;
          if (isDescriptiveOnly) descriptiveOnlyCount++;
        }

        const is70Ready = role === 'Body' && cites.count >= 1 && evalHits.length >= 1 && !hasFp;

        let severity = 'neutral';
        if (isUncitedRisk || hasFp || newInConclusion.length > 0) severity = 'risk';
        else if (isDescriptiveOnly) severity = 'warn';
        else if (is70Ready) severity = 'pass';

        const preview = p.length > 175 ? p.slice(0, 175) + '…' : p;

        return {
          num: idx + 1,
          role,
          wc,
          citeCount: cites.count,
          evalCount: evalHits.length,
          fpCount: fpMatches.length,
          fpWords: [...new Set(fpMatches)].slice(0, 5),
          isUncitedRisk,
          isDescriptiveOnly,
          hasFp,
          newInConclusion,
          is70Ready,
          severity,
          preview,
        };
      });

      const evalDepthPct = bodyTotal > 0 ? Math.round((bodyEvalCount / bodyTotal) * 100) : (paraCount > 0 ? 100 : 0);
      const evalState = evalDepthPct >= 75 ? 'ok' : evalDepthPct >= 40 ? 'warn' : 'risk';

      // Total Genre Risk Flags count
      let totalRiskFlags = 0;
      if (wcState !== 'ok') totalRiskFlags++;
      if (fpCount > 0) totalRiskFlags++;
      if (missingPageQuotes.length > 0) totalRiskFlags++;
      if (hasBibliography) totalRiskFlags++;
      if (informalHits.length > 0) totalRiskFlags++;
      if (glitches.length > 0) totalRiskFlags++;
      if (conclusionNewContentFlag) totalRiskFlags++;
      totalRiskFlags += uncitedBodyCount + descriptiveOnlyCount;

      return {
        totalWords, minW, maxW, wcState,
        citeCount: globalCites.count,
        density: density.toFixed(1),
        densityState,
        evalDepthPct, evalState,
        totalRiskFlags,
        fpCount, fpSnippets,
        totalQuotes, missingPageQuotes,
        hasBibliography,
        informalHits,
        glitches,
        uncitedBodyCount,
        descriptiveOnlyCount,
        conclusionNewContentFlag,
        paragraphs,
      };
    }

    function computeWeightedRubricMark() {
      const mod = MODULES[state.mod];
      const bands = state.rubricBands[state.mod];
      let sum = 0;
      mod.criteria.forEach((c) => {
        const val = bands[c.id] || 65;
        sum += (val * c.weight) / 100;
      });
      return Math.round(sum * 10) / 10;
    }

    function buildCalibratedPrompt() {
      const mod = MODULES[state.mod];
      const target = Math.max(100, parseInt(state.targetWords, 10) || 2000);
      const a = state.audit;
      const rubricLines = mod.criteria.map((c) =>
        `- ${c.area} (${c.weight}%): [50-59% Good: ${c.g55}] | [60-69% Very Good: ${c.g65}] | [70%+ Excellent: ${c.g74}]`
      ).join('\n');

      const telemetryBlock = a
        ? [
            `AUTOMATED PARAGRAPH-LEVEL SCANNER TELEMETRY:`,
            `- Word Count: ${a.totalWords} words (Target: ${target} ±10% [${a.minW}–${a.maxW}])`,
            `- Citation Density: ${a.density} Harvard citations per 250 words (${a.citeCount} total)`,
            `- Evaluative Depth: ${a.evalDepthPct}% of body paragraphs contain critical/evaluative markers`,
            `- Uncited Body Paragraphs (>80 words, 0 citations): ${a.uncitedBodyCount}`,
            `- Descriptive-Only Body Paragraphs (>60 words, 0 evaluative markers): ${a.descriptiveOnlyCount}`,
            `- First-Person Pronouns Outside Quotes: ${a.fpCount}`,
            `- Direct Quotes Missing Page Numbers: ${a.missingPageQuotes.length} / ${a.totalQuotes}`,
            `- Conclusion New-Content / New-Citation Flag: ${a.conclusionNewContentFlag ? 'YES (FLAGGED)' : 'No'}`,
            `- Hygiene Alerts: ${[a.hasBibliography ? 'Bibliography used instead of Reference List' : null, a.informalHits.length ? 'Informal web sources (' + a.informalHits.join(', ') + ')' : null, a.glitches.length ? 'Harvard glitches (' + a.glitches.join('; ') + ')' : null].filter(Boolean).join(' | ') || 'None'}`,
          ].join('\n')
        : `AUTOMATED SCANNER TELEMETRY: No draft scanned yet — audit the pasted draft below strictly against all criteria.`;

      return [
        `ROLE: Act as a strict UK MChiro Level 5/6 (Year 3) Assessor at McTimoney College of Chiropractic.`,
        `MODULE: ${mod.name} (${mod.assessor})${state.assignmentTitle.trim() ? ` — Brief: "${state.assignmentTitle.trim()}"` : ''}`,
        ``,
        `EXPLICIT ANTI-INFLATION CALIBRATION DIRECTIVE (CRITICAL):`,
        `Historical calibration warning: Generic AI marking previously over-scored this student's Year 2 Clinic Studies II essay by 16–19% (predicting 80–83% against the official 64% mark awarded by Simon Dann). DO NOT inflate grades. Apply a strict UK HE grading ceiling.`,
        ``,
        `MANDATORY CEILING CAPS & DEDUCTIONS:`,
        `1. Cap descriptive reflection lacking novel self-perspective or ideological & ethical evaluation at 64%.`,
        `2. Cap sparse in-text citation density (<1.5 per 250w) or single-source reliance at 62–66%.`,
        `3. Deduct marks for ANY first-person voice ("I/me/my/we") unless explicitly permitted, direct quotes without page numbers (p./pp.), informal web sources (blogs/practice websites/Wikipedia), using "Bibliography" instead of "Reference List", or introducing new content/citations in the conclusion.`,
        ``,
        `OFFICIAL WEIGHTED RUBRIC (${mod.name}):`,
        rubricLines,
        ``,
        telemetryBlock,
        ``,
        `REQUIRED OUTPUT FORMAT:`,
        `1. Criterion-by-criterion band & conservative percentage estimate, plus the exact Weighted Total (%).`,
        `2. Top 3 mark-losing flaws with exact sentence quotes from the draft.`,
        `3. 3 concrete, rewritten sentences/paragraphs demonstrating exactly how to cross into the 70%+ First band.`,
        ``,
        `=== STUDENT DRAFT ===`,
        state.draft.trim() || '[PASTE DRAFT HERE]',
      ].join('\n');
    }

              ${mod.criteria.map((c) => {

                return `

    function renderConfidenceSrsWidget(deckType, card) {
      const conf = deckType === 'res' ? state.resConfidence : state.philConfidence;

      const setConfExpr = (c) => deckType === 'res'
        ? `state.resConfidence='${c}'; renderApp();`
        : `state.philConfidence='${c}'; renderApp();`;
      const revealExpr = deckType === 'res'
        ? `state.resRevealed=true; renderApp();`
        : `state.philRevealed=true; renderApp();`;

      return `
        <div class="srs-card">
          <div class="flex-between">
            <span class="badge badge-blue">${card.tag}</span>
            <span class="badge badge-muted mono">Tag: ${card.rootCause}</span>
          </div>

          <h3 style="font-size:18px;font-weight:800;line-height:1.32;">${card.q}</h3>

          ${!rev ? `
            <div class="stack-sm">
              <span class="field-label" style="margin:0;">1. Speak your answer aloud, then rate your confidence:</span>
              <div class="grid-3">
                <button type="button" class="pill-btn ${conf === 'guess' ? 'active-coral' : ''}" onclick="${setConfExpr('guess')}">🎲 Guess</button>
                <button type="button" class="pill-btn ${conf === 'unsure' ? 'active-amber' : ''}" onclick="${setConfExpr('unsure')}">🤔 Unsure</button>
                <button type="button" class="pill-btn ${conf === 'certain' ? 'active-emerald' : ''}" onclick="${setConfExpr('certain')}">🎯 Certain</button>
              </div>
              <button type="button" class="btn-3d btn-blue btn-full" ${conf ? '' : 'disabled'} onclick="${revealExpr}">
                ${conf ? 'Reveal Answer &rarr;' : 'Select Confidence First'}
              </button>
            </div>
          ` : `
            <div class="sem-box sem-emerald">
              <span class="sem-label">Model Answer</span>
              <p style="font-weight:600;">${card.a}</p>
            </div>
            <div class="stack-sm">
              <span class="field-label" style="margin:0;">2. Grade honestly (Confidence was: <strong style="color:var(--text-main);">${conf}</strong>):</span>
              <div class="grid-2">
                <button type="button" class="btn-3d btn-coral btn-full" onclick="gradeConfidenceCard('${deckType}', ${deckType === 'res' ? 'RESEARCH_SRS[state.resIdx]' : 'PHIL_SRS[state.philIdx]'}, false)">✕ Missed (Box 1)</button>
                <button type="button" class="btn-3d btn-emerald btn-full" onclick="gradeConfidenceCard('${deckType}', ${deckType === 'res' ? 'RESEARCH_SRS[state.resIdx]' : 'PHIL_SRS[state.philIdx]'}, true)">✓ Nailed It (Box +1)</button>
              </div>
            </div>
          `}
        </div>
      `;
    }

    // =========================================================================
    // 10. TAB 4 — PHILOSOPHY 3 & BEHAVIOURAL SCIENCES
    // =========================================================================
    function renderTabPhilBehav() {
      return `
        <div class="stack">
          <!-- 2-Pill Sub-Toggle -->
          <div class="seg-track" style="max-width:440px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;width:100%;">
            <button type="button" class="seg-btn ${state.tab4Sub === 'behav' ? 'active' : ''}" onclick="state.tab4Sub='behav'; renderApp();">Behavioural Sciences</button>
            <button type="button" class="seg-btn ${state.tab4Sub === 'phil' ? 'active' : ''}" onclick="state.tab4Sub='phil'; renderApp();">Philosophy 3</button>
          </div>

          ${state.tab4Sub === 'behav' ? renderBehaviouralView() : renderPhilosophyView()}
        </div>
      `;
    }

    function renderBehaviouralView() {
      const sel = state.bpsSelected;
      const bps = sel ? BPS_DATA[sel] : null;
      const flag = CLINICAL_FLAGS[state.selectedFlag];
      const nCls = (id) => `bps-node ${sel === id ? 'is-active' : ''}`;
      const tapBps = (id) => `state.bpsSelected=state.bpsSelected==='${id}'?null:'${id}'; renderApp();`;

      return `
        <div class="stack">
          <!-- 1. Interactive Biopsychosocial (BPS) SVG Triangle with Spotlight Isolation -->
          <section class="ah-card pad-card stack-sm">
            <div class="flex-between">
              <div>
                <span class="badge badge-blue">Spotlight / Fade-Others SVG</span>
                <h2 style="font-size:17.5px;font-weight:800;margin-top:4px;">Interactive Biopsychosocial (BPS) Triangle</h2>
              </div>
              <button type="button" class="pill-btn" onclick="state.bpsSelected=null; renderApp();" ${sel ? '' : 'style="opacity:0.45;"'}>👁️ Show All</button>
            </div>

            <div class="grid-2" style="align-items:center;">
              <div class="ah-card-alt" style="padding:10px;">
                <svg viewBox="0 0 360 286" class="bps-svg ${sel ? 'has-sel' : ''}" role="img" aria-label="Interactive Biopsychosocial Model Triangle">
                  <rect x="0" y="0" width="360" height="286" rx="18" fill="var(--svg-bg)" />

                  <!-- Triangle Edges -->
                  <polygon points="180,62 80,220 280,220" fill="none" stroke="var(--svg-line)" stroke-width="3" stroke-dasharray="6 4" />
                  <line x1="180" y1="62" x2="180" y2="162" stroke="var(--svg-line)" stroke-width="2" />
                  <line x1="80" y1="220" x2="180" y2="162" stroke="var(--svg-line)" stroke-width="2" />
                  <line x1="280" y1="220" x2="180" y2="162" stroke="var(--svg-line)" stroke-width="2" />

                  <!-- Center: Patient-Centred Care -->
                  <g onclick="${tapBps('center')}" class="${nCls('center')}">
                    <circle cx="180" cy="162" r="42" fill="#10B981" stroke="#047857" stroke-width="2.2" />
                    <rect x="134" y="148" width="92" height="28" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" />
                    <text x="180" y="160" text-anchor="middle" fill="#0F172A" font-size="8.6" font-weight="800">PATIENT-CENTRED</text>
                    <text x="180" y="171" text-anchor="middle" fill="#047857" font-size="8.2" font-weight="800">CARE</text>
                  </g>

                  <!-- Top Vertex: Biological -->
                  <g onclick="${tapBps('bio')}" class="${nCls('bio')}">
                    <circle cx="180" cy="58" r="38" fill="#2563EB" stroke="#1D4ED8" stroke-width="2.2" />
                    <rect x="133" y="45" width="94" height="26" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" />
                    <text x="180" y="61.5" text-anchor="middle" fill="#0F172A" font-size="10.2" font-weight="800">BIOLOGICAL</text>
                  </g>

                  <!-- Bottom-Left Vertex: Psychological -->
                  <g onclick="${tapBps('psycho')}" class="${nCls('psycho')}">
                    <circle cx="80" cy="220" r="42" fill="#7C3AED" stroke="#5B21B6" stroke-width="2.2" />
                    <rect x="24" y="207" width="112" height="26" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" />
                    <text x="80" y="223.5" text-anchor="middle" fill="#0F172A" font-size="9.8" font-weight="800">PSYCHOLOGICAL</text>
                  </g>

                  <!-- Bottom-Right Vertex: Social -->
                  <g onclick="${tapBps('social')}" class="${nCls('social')}">
                    <circle cx="280" cy="220" r="42" fill="#F59E0B" stroke="#B45309" stroke-width="2.2" />
                    <rect x="236" y="207" width="88" height="26" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" />
                    <text x="280" y="223.5" text-anchor="middle" fill="#0F172A" font-size="10.2" font-weight="800">SOCIAL</text>
                  </g>
                </svg>
              </div>

              <div>
                ${bps ? `
                  <article class="ah-card-alt pad-card stack-sm">
                    <div class="flex-between">
                      <h3 style="font-size:16px;font-weight:800;">${bps.title}</h3>
                      <span class="badge ${bps.badgeCls}">${bps.badge}</span>
                    </div>
                    <ul style="margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:5px;">
                      ${bps.factors.map((f) => `<li>${f}</li>`).join('')}
                    </ul>
                    <div class="sem-box sem-emerald">
                      <span class="sem-label">Chiropractic Communication &amp; Management</span>
                      <p>${bps.chiro}</p>
                    </div>
                  </article>
                ` : `
                  <div class="ah-card-alt pad-card" style="text-align:center;">
                    <p style="font-size:13.5px;font-weight:700;color:var(--text-muted);">Tap Biological, Psychological, Social, or Patient-Centred Care on the triangle to spotlight its clinical breakdown.</p>
                  </div>
                `}
              </div>
            </div>
          </section>

          <!-- 2. Clinical Flags Colour Matrix -->
          <section class="ah-card pad-card stack-sm">
            <div>
              <span class="badge badge-amber">Clinical Triage &amp; Psychosocial Screening</span>
              <h2 style="font-size:17px;font-weight:800;margin-top:4px;">Clinical Flags Colour Matrix</h2>
            </div>

            <div style="display:flex;flex-wrap:wrap;gap:7px;">
              ${Object.entries(CLINICAL_FLAGS).map(([k, f]) => `
                <button type="button" class="pill-btn ${state.selectedFlag === k ? f.activeCls : ''}" onclick="state.selectedFlag='${k}'; renderApp();">${f.label}</button>
              `).join('')}
            </div>

            <div class="ah-card-alt pad-card stack-sm">
              <div class="flex-between">
                <h3 style="font-size:15px;font-weight:800;">${flag.title}</h3>
                <span class="badge ${flag.badge}">${flag.label}</span>
              </div>
              ${flag.items ? `
                <div class="grid-2" style="gap:8px;">
                  ${flag.items.map(([ltr, name, desc]) => `
                    <div class="sem-box sem-amber" style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;">
                      <span class="mono" style="width:26px;height:26px;border-radius:8px;background:var(--amber);color:#FFFFFF;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;">${ltr}</span>
                      <div><strong style="font-size:12.5px;display:block;">${name}</strong><span style="font-size:12px;color:var(--text-muted);">${desc}</span></div>
                    </div>
                  `).join('')}
                </div>
              ` : `<p style="font-size:13.5px;">${flag.body}</p>`}
            </div>
          </section>

          <!-- 3. Pain Psychology & Adherence Accordions -->
          <section class="stack-sm">
            <span class="field-label" style="margin:0 2px;">Pain Psychology &amp; Adherence</span>
            ${PAIN_ACCORDIONS.map((acc) => {
              const open = !!state.openPainAcc[acc.id];
              return `
                <article class="ah-card" style="overflow:hidden;">
                  <button type="button" class="acc-btn" onclick="state.openPainAcc['${acc.id}']=!state.openPainAcc['${acc.id}']; renderApp();">
                    <div>
                      <strong style="font-size:14.5px;display:block;">${acc.title}</strong>
                      <span style="font-size:12px;color:var(--text-muted);">${acc.sub}</span>
                    </div>
                    <span style="font-size:12px;font-weight:800;color:var(--text-muted);">${open ? '▲' : '▼'}</span>
                  </button>
                  ${open ? `
                    <div style="padding:0 16px 16px;border-top:1px solid var(--border-card);padding-top:12px;">
                      <ul style="margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:6px;">
                        ${acc.points.map((pt) => `<li>${pt}</li>`).join('')}
                      </ul>
                    </div>
                  ` : ''}
                </article>
              `;
            }).join('')}
          </section>
        </div>
      `;
    }

    function renderPhilosophyView() {
      const card = PHIL_SRS[state.philIdx % PHIL_SRS.length];
      const rec = state.srs[card.id] || { box: 1 };
      const boxNum = typeof rec.box === 'number' ? rec.box : 1;

      return `
        <div class="stack">
          <section class="ah-card pad-card stack-sm">
            <div class="flex-between">
              <div>
                <span class="badge badge-purple mono">Philosophy 3 &bull; mchiro_srs_v4 &amp; mchiro_diag_v1</span>
                <h2 style="font-size:17.5px;font-weight:800;margin-top:4px;">Philosophy 3 Active-Recall Deck (6 Cards)</h2>
              </div>
              <span class="badge badge-amber mono">Card ${state.philIdx + 1}/${PHIL_SRS.length} &bull; Box ${boxNum}/5</span>
            </div>

            ${renderConfidenceSrsWidget('phil', card)}
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 11. INITIALISE
    // =========================================================================
    initTheme();
    renderTabs();
    renderApp();
  </script>
</body>
</html>
