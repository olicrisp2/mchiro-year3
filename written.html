    // 1. SAFE STORAGE, THEME SYNC ('mchiro_theme') & SHARED SRS ('mchiro_srs')

    const DAY_MS = 86400000;

    function loadStore(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveStore(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem('mchiro_theme'); } catch (e) {}
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? (saved === 'dark' || saved === '"dark"') : prefersDark;
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      try { localStorage.setItem('mchiro_theme', isDark ? 'dark' : 'light'); } catch (e) {}
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) {
        btn.innerHTML = isDark
          ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>`
          : `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>`;
      }
    }

    function toggleTheme() {
      applyTheme(!document.documentElement.classList.contains('dark'));

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const styles = {
        info: 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900',
        success: 'bg-emerald-600 text-white',
        warn: 'bg-amber-600 text-white',
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-semibold transition-all duration-300 ${styles[type] || styles.info}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 2200);
    }

    function copyTextSafe(text, successMsg = 'Copied!') {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(successMsg, 'success');
      } catch (e) {
        showToast('Could not copy automatically — please copy manually.', 'warn');
      }
    }

    // =========================================================================
    function countWords(text) {
      const trimmed = (text || '').trim();
      return trimmed ? trimmed.split(/\s+/).filter(Boolean).length : 0;
    }

    function handleDraftInput(val) {
      state.drafts[state.auditMod] = val;

    function analyseDraft() {
      const mod = state.auditMod;
      const text = (state.drafts[mod] || '').trim();
      if (!text) {
        showToast('Paste your essay draft first to run the scan.', 'warn');
        return;
      }

      const target = state.wordTargets[mod] || 2000;
      const minW = Math.round(target * 0.9);
      const maxW = Math.round(target * 1.1);
      const wordCount = countWords(text);
      const wcStatus = wordCount < minW ? 'Under' : wordCount > maxW ? 'Over' : 'Within Limit';

      // 1. First-person voice detector with snippet previews
      const fpRegex = /\b(I|me|my|mine|myself|we|us|our|ours)\b/gi;
      const fpSnippets = [];
      let fpCount = 0;
      let match;
      while ((match = fpRegex.exec(text)) !== null) {
        fpCount++;
        if (fpSnippets.length < 5) {
          const start = Math.max(0, match.index - 28);
          const end = Math.min(text.length, match.index + match[0].length + 28);
          const before = escapeHtml(text.slice(start, match.index));
          const hit = escapeHtml(match[0]);
          const after = escapeHtml(text.slice(match.index + match[0].length, end));
          fpSnippets.push(`${start > 0 ? '…' : ''}${before}<mark class="px-1 rounded bg-amber-300 dark:bg-amber-600 text-slate-950 dark:text-white font-extrabold">${hit}</mark>${after}${end < text.length ? '…' : ''}`);
        }
      }

      // 2. Direct quote page-number check ("..." or “...”)
      const quoteRegex = /["“]([^"”]{10,})["”]([^.?!\n]{0,55})/g;
      let totalQuotes = 0;
      const missingPageQuotes = [];
      while ((match = quoteRegex.exec(text)) !== null) {
        totalQuotes++;
        const afterQuote = match[2] || '';
        const insideQuoteContext = text.slice(Math.max(0, match.index - 35), match.index);
        const hasPage = /\bp\.?\s*\d+|\bpp\.?\s*\d+/i.test(afterQuote) || /\bp\.?\s*\d+|\bpp\.?\s*\d+/i.test(insideQuoteContext);
        if (!hasPage) {
          const excerpt = match[1].trim();
          missingPageQuotes.push(excerpt.length > 65 ? excerpt.slice(0, 65) + '…' : excerpt);
        }
      }

      // 3. Harvard in-text citation density: (Name, Year) or (Name et al., Year) or Name (Year)
      const harvardRegex = /\([A-Z][A-Za-z\-&.,\s']+?\d{4}[a-z]?(?:,\s*p{1,2}\.?\s*\d+(?:[-–]\d+)?)?\)|\b[A-Z][A-Za-z\-]+(?:\s+et\s+al\.?|\s+(?:&|and)\s+[A-Z][A-Za-z\-]+)?\s*\(\d{4}[a-z]?(?:,\s*p{1,2}\.?\s*\d+(?:[-–]\d+)?)?\)/g;
      const citeMatches = text.match(harvardRegex) || [];
      const citeCount = citeMatches.length;
      const densityNum = wordCount > 0 ? (citeCount / wordCount) * 250 : 0;
      const densityStr = densityNum.toFixed(1);
      const lowDensity = densityNum < 1.5;

      // 4. Quick Hygiene Alerts
      const hasBibliography = /\bbibliography\b/i.test(text);
      const informalWebMatches = text.match(/(https?:\/\/\S+|\bwww\.\S+|\bblog\b|\bwordpress\b|\bmedium\.com\b|\bchiropractic\s+clinic\b|\bpractice\s+website\b)/gi) || [];

      state.scanResults[mod] = {
        wordCount,
        minW,
        maxW,
        wcStatus,
        fpCount,
        fpSnippets,
        totalQuotes,
        missingPageQuotes,
        citeCount,
        densityStr,
        lowDensity,
        hasBibliography,
        informalWebCount: informalWebMatches.length,
        informalWebSamples: [...new Set(informalWebMatches.map((x) => x.slice(0, 40)))].slice(0, 4),
      };

      showToast('Pre-flight draft analysis complete!', 'success');
      renderApp();
    }

        `3. Flag ANY first-person voice (I, me, my, we, our) unless explicitly permitted.`,
        `4. Audit Harvard referencing strictly: check citation density, peer-reviewed source quality (no blogs/clinic sites), page numbers (p./pp.) on every direct quote, and ensure "Reference List" is used rather than "Bibliography".`,
        `5. Confirm the conclusion synthesises core arguments without introducing new ideas or references.`,
        ``,
        `OFFICIAL WEIGHTED RUBRIC (${rub.name}):`,
        weightsBlock,
        ``,
        `OUTPUT REQUIRED:`,
        `- Band-by-band realistic percentage estimate for each criterion and an overall weighted mark.`,
        `- Exact, prioritised bullet-point fixes required to move every section into the 70%+ First band.`,
        ``,
        `[PASTE ESSAY DRAFT BELOW]`,
      ].join('\n');

                />

                <span id="live-window-label" class="px-2.5 py-1 rounded-lg bg-teal-50 dark:bg-teal-950/60 text-teal-800 dark:text-teal-300">±10% Window: ${minW.toLocaleString()}–${maxW.toLocaleString()} words</span>
                <span id="live-wc-badge" class="px-2.5 py-1 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-100">${liveWc.toLocaleString()} words</span>
              </div>
            </div>

            <!-- Draft Textarea -->
            <textarea
              rows="6"

                class="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700"
              >Clear Draft</button>
              <button
                type="button"

            </div>

            <!-- Scanner Output Dashboard -->
            ${res ? `
              <div class="pt-3 border-t border-slate-200 dark:border-slate-800 space-y-3.5">
                <!-- 4 Core Metric Tiles -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5">
                  <div class="p-3 rounded-2xl border ${res.wcStatus === 'Within Limit' ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-300 dark:border-emerald-800' : 'bg-rose-50 dark:bg-rose-950/30 border-rose-300 dark:border-rose-800'}">
                    <span class="block text-[10px] font-extrabold uppercase text-slate-500">Word Count</span>

                ${resCards.map((c) => renderFlipSrsCard(c, 'flippedResCard')).join('')}
              </div>
            ` : `
              <div class="p-8 text-center rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm text-slate-500">
                All Research 2 flashcards are scheduled — none due today!
              </div>
            `}
          </section>
        </div>
      `;
    }

    function renderFlipSrsCard(c, flipStateKey) {
      const flipped = !!state[flipStateKey][c.id];
      return `
        <article
          onclick="state.${flipStateKey}['${c.id}']=!state.${flipStateKey}['${c.id}']; renderApp();"
          role="button"
          tabindex="0"
          class="cursor-pointer select-none rounded-2xl border-2 p-4 flex flex-col justify-between gap-3 transition ${
            flipped
              ? 'bg-teal-50/60 dark:bg-teal-950/25 border-teal-400 dark:border-teal-700'
              : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-teal-400'
          }"
        >
          <div class="space-y-2">
            <div class="flex items-center justify-between gap-2">
              <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold uppercase bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">${c.tag}</span>
              <span class="text-[11px] font-bold text-teal-600 dark:text-teal-400">${flipped ? 'Answer Shown' : 'Tap to Flip'}</span>
            </div>
            <h3 class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white">${c.front}</h3>
            ${flipped ? `
              <ul class="list-disc pl-5 space-y-1.5 text-xs sm:text-sm text-slate-700 dark:text-slate-200 pt-1">
                ${c.back.map((pt) => `<li>${pt}</li>`).join('')}
              </ul>
            ` : `<p class="text-xs text-slate-400 italic">Recall the key distinction aloud, then tap to check...</p>`}
          </div>
          ${renderSrsControls(c.id)}
        </article>
      `;
    }

    // =========================================================================
    // 8. TAB 4: PHILOSOPHY 3 & BEHAVIOURAL SCIENCES
    // =========================================================================
    function renderPhilBehavTab() {
      return `
        <div class="space-y-5">
          <!-- Sub-Toggle: Behavioural Sciences vs Philosophy 3 -->
          <div class="max-w-md mx-auto grid grid-cols-2 gap-1.5 p-1.5 rounded-2xl bg-slate-200/70 dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
            <button
              type="button"
              onclick="state.tab4Sub='behav'; renderApp();"
              class="py-2 px-3 rounded-xl text-xs sm:text-sm font-extrabold transition ${
                state.tab4Sub === 'behav'
                  ? 'bg-white dark:bg-slate-800 text-teal-700 dark:text-teal-300 shadow-xs'
                  : 'text-slate-600 dark:text-slate-400'
              }"
            >Behavioural Sciences</button>
            <button
              type="button"
              onclick="state.tab4Sub='phil'; renderApp();"
              class="py-2 px-3 rounded-xl text-xs sm:text-sm font-extrabold transition ${
                state.tab4Sub === 'phil'
                  ? 'bg-white dark:bg-slate-800 text-indigo-700 dark:text-indigo-300 shadow-xs'
                  : 'text-slate-600 dark:text-slate-400'
              }"
            >Philosophy 3</button>
          </div>

          ${state.tab4Sub === 'behav' ? renderBehaviouralView() : renderPhilosophyView()}
        </div>
      `;
    }

    function renderBehaviouralView() {
      const bps = BPS_NODES[state.selectedBps] || BPS_NODES.psycho;
      const nCls = (id) => `svg-node ${state.selectedBps === id ? 'svg-node-active' : ''}`;

      const otherFlags = {
        red: { label: 'Red Flags', bg: 'bg-rose-600 text-white', desc: 'Serious biomedical pathology (fracture, malignancy, infection, Cauda Equina, vascular/CAD) requiring urgent medical referral.' },
        orange: { label: 'Orange Flags', bg: 'bg-orange-500 text-white', desc: 'Psychiatric / clinical mental health red flags (major depression, severe PTSD, psychosis, suicidal ideation) requiring specialist mental health referral.' },
        blue: { label: 'Blue Flags', bg: 'bg-sky-600 text-white', desc: 'Perceived occupational/workplace barriers (high job stress, unsupportive management, belief that work causes re-injury).' },
        black: { label: 'Black Flags', bg: 'bg-slate-800 dark:bg-slate-700 text-white', desc: 'Systemic, contextual, or organisational obstacles outside the patient’s direct control (insurance/benefit policies, rigid HR return-to-work rules).' },
      };
      const selFlag = otherFlags[state.selectedFlagPill];

      return `
        <div class="space-y-6">
          <!-- 1. Interactive Biopsychosocial (BPS) SVG Triangle -->
          <section class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 sm:p-6 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <span class="px-2.5 py-0.5 rounded-lg text-[10px] font-extrabold uppercase bg-teal-100 dark:bg-teal-950 text-teal-800 dark:text-teal-300">Tap Any Domain Node</span>
                <h2 class="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white mt-1">Interactive Biopsychosocial (BPS) Model</h2>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
              <!-- BPS Triangle SVG -->
              <div class="md:col-span-5">
                <svg viewBox="0 0 340 270" class="w-full max-w-[320px] mx-auto h-auto" role="img" aria-label="Interactive Biopsychosocial Model Triangle">
                  <rect x="0" y="0" width="340" height="270" rx="20" fill="var(--svg-bg)" />

                  <!-- Connecting Triangle Lines -->
                  <polygon points="170,64 78,204 262,204" fill="none" stroke="var(--svg-line)" stroke-width="3" stroke-dasharray="6 4" />

                  <!-- Centre Patient Hub -->
                  <circle cx="170" cy="154" r="34" fill="var(--svg-surface)" stroke="var(--svg-stroke)" stroke-width="2" />
                  <text x="170" y="151" text-anchor="middle" fill="var(--svg-text)" font-size="9.5" font-weight="800">PATIENT</text>
                  <text x="170" y="164" text-anchor="middle" fill="var(--svg-muted)" font-size="8.5" font-weight="700">PAIN &amp; HEALTH</text>

                  <!-- Top Node: Biological -->
                  <g onclick="state.selectedBps='bio'; renderApp();" class="${nCls('bio')}">
                    <circle cx="170" cy="64" r="40" fill="#14b8a6" fill-opacity="0.9" stroke="#0f766e" stroke-width="2" />
                    <text x="170" y="62" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800">BIOLOGICAL</text>
                    <text x="170" y="75" text-anchor="middle" fill="#ccfbf1" font-size="8.5" font-weight="700">Tissue &amp; Neuro</text>
                  </g>

                  <!-- Bottom-Left Node: Psychological -->
                  <g onclick="state.selectedBps='psycho'; renderApp();" class="${nCls('psycho')}">
                    <circle cx="78" cy="204" r="44" fill="#6366f1" fill-opacity="0.92" stroke="#4338ca" stroke-width="2" />
                    <text x="78" y="201" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="800">PSYCHOLOGICAL</text>
                    <text x="78" y="214" text-anchor="middle" fill="#e0e7ff" font-size="8.5" font-weight="700">Beliefs &amp; Mood</text>
                  </g>

                  <!-- Bottom-Right Node: Social -->
                  <g onclick="state.selectedBps='social'; renderApp();" class="${nCls('social')}">
                    <circle cx="262" cy="204" r="44" fill="#f59e0b" fill-opacity="0.92" stroke="#b45309" stroke-width="2" />
                    <text x="262" y="201" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800">SOCIAL</text>
                    <text x="262" y="214" text-anchor="middle" fill="#fef3c7" font-size="8.5" font-weight="700">Work &amp; Support</text>
                  </g>
                </svg>
              </div>

              <!-- Pinned BPS Detail Panel -->
              <div class="md:col-span-7 rounded-2xl p-4 border-2 bg-${bps.color}-50/50 dark:bg-${bps.color}-950/25 border-${bps.color}-200 dark:border-${bps.color}-800/70 space-y-3">
                <div class="flex items-center justify-between gap-2">
                  <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${bps.title}</h3>
                  <span class="px-2.5 py-0.5 rounded-lg text-[10px] font-extrabold uppercase bg-${bps.color}-600 text-white">${bps.badge}</span>
                </div>
                <div>
                  <span class="block text-[10px] font-extrabold uppercase text-slate-500 mb-1">Key Clinical Factors</span>
                  <ul class="list-disc pl-5 space-y-1 text-xs sm:text-sm text-slate-700 dark:text-slate-200">
                    ${bps.factors.map((f) => `<li>${f}</li>`).join('')}
                  </ul>
                </div>
                <div class="p-3 rounded-xl bg-white/80 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 text-xs sm:text-sm">
                  <strong class="text-${bps.color}-700 dark:text-${bps.color}-300">Chiropractic Management:</strong> ${bps.chiro}
                </div>
              </div>
            </div>
          </section>

          <!-- 2. Colour-Coded Psychosocial Flags Board (Yellow ABCDEFW + Red/Orange/Blue/Black) -->
          <section class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 sm:p-6 space-y-4">
            <div>
              <span class="px-2.5 py-0.5 rounded-lg text-[10px] font-extrabold uppercase bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300">Yellow Flags &bull; ABCDEFW</span>
              <h2 class="text-lg font-extrabold text-slate-900 dark:text-white mt-1">Psychosocial Flags Board</h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
              ${YELLOW_FLAGS_ABCDEFW.map((yf) => `
                <div class="p-3 rounded-2xl bg-amber-50/70 dark:bg-amber-950/25 border border-amber-200 dark:border-amber-800/60 flex items-start gap-2.5">
                  <span class="w-7 h-7 rounded-xl bg-amber-400 text-slate-950 font-extrabold text-sm flex items-center justify-center shrink-0">${yf.letter}</span>
                  <div class="min-w-0">
                    <h4 class="text-xs font-extrabold text-slate-900 dark:text-white">${yf.name}</h4>
                    <p class="text-[11px] text-slate-600 dark:text-slate-300 leading-snug mt-0.5">${yf.detail}</p>
                  </div>
                </div>
              `).join('')}
            </div>

            <!-- Concise Red / Orange / Blue / Black Flag Pills -->
            <div class="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2.5">
              <span class="block text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Other Clinical Flag Colours (Tap to View)</span>
              <div class="flex flex-wrap gap-2">
                ${Object.entries(otherFlags).map(([id, f]) => `
                  <button
                    type="button"
                    onclick="state.selectedFlagPill='${id}'; renderApp();"
                    class="px-3.5 py-2 rounded-xl text-xs font-extrabold transition ${
                      state.selectedFlagPill === id ? `${f.bg} ring-2 ring-offset-2 ring-teal-500 dark:ring-offset-slate-900` : `${f.bg} opacity-75 hover:opacity-100`
                    }"
                  >${f.label}</button>
                `).join('')}
              </div>
              <p class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm text-slate-700 dark:text-slate-200">
                <strong>${selFlag.label}:</strong> ${selFlag.desc}
              </p>
            </div>
          </section>

          <!-- 3. Pain Psychology & Adherence Accordions -->
          <section class="space-y-2.5">
            <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-400 px-1">Pain Psychology &amp; Adherence Quick-Reference</h2>
            ${PAIN_PSYCH_ACCORDIONS.map((acc) => {
              const isOpen = !!state.openPainAcc[acc.id];
              return `
                <article class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden">
                  <button
                    type="button"
                    onclick="state.openPainAcc['${acc.id}']=!state.openPainAcc['${acc.id}']; renderApp();"
                    class="w-full px-4 py-3.5 flex items-center justify-between gap-2 text-left"
                  >
                    <div class="min-w-0">
                      <h3 class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white">${acc.title}</h3>
                      <p class="text-xs text-slate-500 dark:text-slate-400 truncate">${acc.summary}</p>
                    </div>
                    <span class="text-xs font-bold text-slate-400 shrink-0">${isOpen ? '▲' : '▼'}</span>
                  </button>
                  ${isOpen ? `
                    <div class="px-4 pb-4 pt-2 border-t border-slate-100 dark:border-slate-800">
                      <ul class="list-disc pl-5 space-y-1.5 text-xs sm:text-sm text-slate-700 dark:text-slate-200">
                        ${acc.points.map((pt) => `<li>${pt}</li>`).join('')}
                      </ul>
                    </div>
                  ` : ''}
                </article>
              `;
            }).join('')}
          </section>
        </div>
      `;
    }

    function renderPhilosophyView() {
      const philList = PHIL_CARDS.filter((c) => !state.dueOnly || isDue(c.id));

      return `
        <div class="space-y-5">
          <div class="flex items-center justify-between px-1">
            <div>
              <h2 class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white">Philosophy 3 Active-Recall Concept Cards</h2>
              <p class="text-xs text-slate-500 dark:text-slate-400">Tap any card to flip &amp; rate with Leitner Spaced Repetition.</p>
            </div>
          </div>

          ${philList.length ? `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
              ${philList.map((c) => renderFlipSrsCard(c, 'flippedPhilCard')).join('')}
            </div>
          ` : `
            <div class="p-8 text-center rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm text-slate-500">
              All Philosophy 3 cards are scheduled — none due today!
            </div>
          `}

          <!-- Ready-to-Populate Year 3 Philosophy 3 Handbook Slot -->
          <section class="rounded-3xl bg-white dark:bg-slate-900 border-2 border-dashed border-slate-300 dark:border-slate-700 p-5 space-y-2">
            <span class="px-2.5 py-0.5 rounded-lg text-[10px] font-extrabold uppercase bg-slate-100 dark:bg-slate-800 text-slate-500">Year 3 Handbook Slot &bull; Late Jan 2027</span>
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white">Philosophy 3 Reading List &amp; Essay Briefs</h3>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
              Once your Year 3 Philosophy 3 handbook and essay titles are released, drop them into chat and we will populate tailored argument maps, key thinkers, and counter-perspective prompts right here.
            </p>
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 9. INITIALISE APP
    // =========================================================================
    initTheme();
    updateDueUI();
    renderTabBar();
    renderApp();
  </script>
</body>
</html>
